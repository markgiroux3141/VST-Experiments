[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "varimu"
dynamic = ["version"]
description = "Physically modeled variable-mu (Fairchild-style) compressor with human-in-the-loop optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Later-phase stacks, installed when their phase starts (`uv sync --extra listen`, ...).
listen = [
    "fastapi",
    "uvicorn",
    "pyloudnorm",
    "websockets>=17.3",
]     # Phase 5
ml = ["torch"]                                    # Phases 6, 7, 10; spike/neural_core
optimize = ["botorch", "cma", "ribs"]             # Phase 8
fast = ["circuitsim"]                             # Rust simulator (docs/CIRCUIT_SIM_PLAN.md); needs cargo

[tool.uv.sources]
circuitsim = { path = "crates/circuitsim" }
# CUDA wheels on Windows / Linux (PyPI's Windows torch is CPU-only); macOS keeps PyPI's.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
varimu = "varimu.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "varimu/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["varimu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ui-mockup"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
