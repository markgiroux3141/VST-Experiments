[package]
name = "roomsim"
version = "0.1.0"
description = "Room acoustics on the GPU (wgpu) with CPU references: ray tracing, image-source spectra, FDTD (docs/ROOM_LOOP_PLAN.md R9-R11)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "roomsim"
# cdylib: the Python extension module (feature "python"); rlib: cargo tests and Rust users.
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
wgpu = "29.0.4"
pollster = "0.4.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
pyo3 = { version = "0.29", optional = true, features = ["abi3-py311"] }
numpy = { version = "0.29", optional = true }
