[package]
name = "circuitsim"
version = "0.1.0"
description = "Fast nonlinear audio circuit simulator for the Vari-Mu project (ngspice stays the reference)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "circuitsim"
# cdylib: the Python extension module (feature "python"); rlib: cargo tests and Rust users.
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats with correct rounding, so IR values survive JSON bit for bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
pyo3 = { version = "0.29", optional = true, features = ["abi3-py311"] }
numpy = { version = "0.29", optional = true }
