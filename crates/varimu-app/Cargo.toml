[package]
name = "varimu-app"
version = "0.1.0"
description = "The native Vari-Mu app: schematic editor, real-time play and production render (docs/NATIVE_APP_PLAN.md)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
circuitsim = { version = "0.1.0", path = "../circuitsim" }
cpal = "0.18.2"
eframe = "0.35.0"
hound = "3.5.1"
rfd = "0.17.2"
rtrb = "0.4.1"
symphonia = { version = "0.6.1", features = ["mp3"] }
varimu-circuit = { path = "../varimu-circuit" }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
