# Oxide cathodes and their heaters (device builder B6, the heater): varimu/devices/cathode.py
# reads this. A circuit with a `heaters` block heats its tubes' cathodes (varimu.circuit.spec).
#
# The emission's constants are fitted to Phywe's EC92 by scripts/fit_cathode.py
# (reports/devices/cathode_ec92.json; tests/test_cathode.py checks this file against it).

oxide:
  t0_k: {value: 1050.0, source: "provisional: model knowledge (oxide-coated cathodes run ~1000-1100 K; Herrmann & Wagener, The Oxide-Coated Cathode, 1951; Spangenberg, Vacuum Tubes, 1948)"}
  t_amb_k: {value: 300.0, source: "provisional: model knowledge (the chassis' air; the cathode sees it radiating)"}
  alpha: {value: 1.2, source: "provisional: model knowledge (tungsten's resistance ~ T^1.2 over 1000-2000 K; the heater's temperature taken to track the cathode's)"}
  tau_s: {value: 7.0, source: "provisional: model knowledge (anchored to a patent's ~5.5 s to 10% current from cold for a 1.5 W oxide cathode: this model gives 5.5 s at ~7 s, 7.8 s at 10 s; RCA prints 'heater warm-up time 11 s' for series-string types, a different test)"}
  phi_ev: {value: 1.217, source: "fit: scripts/fit_cathode.py to Phywe LEP 4.1.10 Fig. 4 (EC92 forward curves at heater 100-120 mA; rms 0.28 mA; T0 1050 K); oxide cathodes' work function is ~1.0-1.3 eV (Herrmann & Wagener)"}
  n: {value: 1.29, source: "fit: scripts/fit_cathode.py (the ceiling's sharpness; soft, as the sheet's knees, which also rise ~20% from 3 to 8 V with field-enhanced emission)"}
  reserve: {value: 50.0, source: "fit: scripts/fit_cathode.py (the EC92's emission at T0, 0.54 A, over its ~10 mA working current: 54); provisional: model knowledge (oxide cathodes' emission reserve; the space-charge shift is taken at a tube current of 1 / reserve of its emission)"}
  emission_a_per_w: {value: 0.569, source: "fit: scripts/fit_cathode.py, the EC92's emission at T0 (0.538 A) over its heater's 0.945 W; provisional: model knowledge (an oxide cathode's area, so its emission at one temperature, goes with its heater power)"}

# Heater ratings: volts, amps for the whole tube, and the cathodes sharing that heater (the
# sections of a twin triode, a rectifier's two diodes on one cathode): each device instance
# gets emission_a_per_w x V x A / cathodes.
tubes:
  "12AX7": {heater_v: 6.3, heater_a: 0.3, cathodes: 2, source: "provisional: model knowledge (RCA 12AX7: 6.3 V 0.3 A, or 12.6 V 0.15 A in series)"}
  "12AU7": {heater_v: 6.3, heater_a: 0.3, cathodes: 2, source: "provisional: model knowledge (RCA 12AU7: 6.3 V 0.3 A, or 12.6 V 0.15 A in series)"}
  "6386": {heater_v: 6.3, heater_a: 0.35, cathodes: 2, source: "GE ET-T1113 p.1 (data/datasheets/published_points.yaml '6386' heater)"}
  "6V6GT": {heater_v: 6.3, heater_a: 0.45, cathodes: 1, source: "GE ET-T914 (data/datasheets/published_points.yaml '6V6GT' heater)"}
  "6X4": {heater_v: 6.3, heater_a: 0.6, cathodes: 2, source: "GE ET-T865A (data/datasheets/published_points.yaml '6X4' heater; one cathode for both plates: each diode instance half)"}
