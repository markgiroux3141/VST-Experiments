# Wire for the transformer designer (crates/varimu-components, tables.rs). Dimensions as
# the sources print them; the compiler takes a wire's overall diameter as the table's
# nominal (the middle of [min, max] where none is printed).

copper:
  resistivity_ohm_m: 1.7241e-8
  temperature_c: 20.0
  source: "web: https://nvlpubs.nist.gov/nistpubs/Legacy/hb/nbshandbook100.pdf (NBS Handbook 100, Copper Wire Tables, 1966: the International Annealed Copper Standard, conductivity 58 m/(ohm mm^2) at 20 C, 'volume resistivity of annealed copper at 20 C = 100/58 = 1.7241 microhm-cm', PDF p.16-17; temperature coefficient 0.00393 at 20 C, PDF p.10; IEC Publication 28, now IEC 60028)"

