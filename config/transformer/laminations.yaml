# Lamination sizes for the transformer designer (crates/varimu-components, tables.rs).
# Dimensions as the sources print them: leg = the wound (centre) leg's width; window_width
# from it to the next leg; window_height between the yokes; path = the magnetic path length
# where the source gives one, else derived from the overall width and height (the mean
# path through the legs' and yokes' middles; it reproduces every sourced path below).

