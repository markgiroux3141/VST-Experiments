  - insulation: {thickness_m: {value: 0.03e-3, source: "BV 191 Blatt 3, item 11 (Oelpapier 0.03)"}, dielectric: {value: kraft_oil, source: "BV 191 Blatt 3 (Oelpapier)"}}
  - shield: {name: S, thickness_m: {value: 0.03e-3, source: "BV 191 Blatt 2, item 9 (Folie 0.03 mm)"}}
  - insulation: {thickness_m: {value: 0.03e-3, source: "BV 191 Blatt 3, item 11 (Oelpapier 0.03)"}, dielectric: {value: kraft_oil, source: "BV 191 Blatt 3 (Oelpapier)"}}
  - insulation: {thickness_m: {value: 0.5e-3, source: "provisional: BV 191 Blatt 1 (Trolitul masks, 0.5 or 0.1 mm)"}, dielectric: {value: polystyrene, source: "BV 191 Blatt 1 (Trolitul)"}}
  - winding: s
    turns: {value: 2000, source: "BV 191 Blatt 2, item 10"}
    layers: {value: 80, source: "derived: as the first secondary disc"}
    wire: {value: 0.06 mm grade 1, source: "BV 191 Blatt 2, item 10"}
    enamel: {value: enamel, source: "BV 191 Blatt 2, item 10 (CuL)"}
    width_m: {value: 2.3e-3, source: "BV 191 Blatt 2, item 10"}
    build_m: {value: 5.5e-3, source: "BV 191 Blatt 2, item 10"}
  - insulation: {thickness_m: {value: 0.5e-3, source: "provisional: BV 191 Blatt 1 (Trolitul masks, 0.5 or 0.1 mm)"}, dielectric: {value: polystyrene, source: "BV 191 Blatt 1 (Trolitul)"}}
  - winding: s
