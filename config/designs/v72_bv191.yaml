# The V72's input transformer CTV 72/1 by its construction (NWDR Bauvorschrift Nr. 191,
# Ausgabe 2, 1952: data/schematics/telefunken_v76/README.md, rendered as
# v72_bv191_input_transformer_p1.png ... p5.png). A component editor check case
# (docs/COMPONENT_EDITOR_PLAN.md C2): its published electrical data (Blatt 4) are a
# primary inductance of 25 H +-10% (50 Hz, 10 mV) and, with the secondary shorted, an
# impedance <= 140 ohm at 1 kHz and ~500 ohm at 15 kHz.
#
# A design (the component editor's source), compiled and saved by
# `cargo run -p varimu-components -- save config/designs/v72_bv191.yaml`.
name: BV191
kind: transformer
source: "NWDR Bauvorschrift Nr. 191 (CTV 72/1, the V72's Eingangsuebertrager), web: https://web.archive.org/web/20120424210901/http://www.irt.de:80/IRT/publikationen/braunbuch/V72_EUE.pdf; Blatt 1-5"
core:
  lamination: {value: EI 48, source: "BV 191 Blatt 1, item 2 (Blechschnitt EI 48)"}
  material: {value: mumetall, source: "provisional: Hyperm 702 (Krupp; BV 191 Blatt 1, item 1, initial permeability ~12,000) taken as a high-nickel (mumetall-class) alloy: no Hyperm datasheet was found (2026-11-04); the printed ~12,000 matches SEKELS / VAC's 1x1-stacked EI 48 of Mumetall 0.35 mm (mu4 min 12,000, Tabelle 3, web: https://sekels.de/fileadmin/PDF/Deutsch/24_Info_Kernbleche.pdf), so it is read as the stacked core's (the joint gap below), and the stack then gives the published 25 H +-10% (Blatt 4); a 50% NiFe of ~12,000 with any joint gap would fall well short"}
  stack_m: {value: 0.016, source: "BV 191 Blatt 1, item 5 (Blechpaketstaerke 16 mm)"}
  stacking_factor: {value: 0.92, source: "web: https://sekels.de/fileadmin/PDF/Deutsch/24_Info_Kernbleche.pdf (SEKELS / VAC Kernbleche, Tabelle 6: Mumetall-type laminations 0.35 mm, 92%; BV 191 Blatt 1 item 4: 0.35 mm sheets)"}
  stacking: {value: interleaved, source: "BV 191 Blatt 1, item 3 (Luftspalt 0 mm, ueberlappt geschichtet)"}
  joint_gap_m: {value: 2.4e-6, source: "derived: SEKELS / VAC Tabelle 3 (same sheet): EI 48 stacked 1x1, Mumetall 0.35 mm, mu4 min 12,000 against the material's ca. 30,000 (Tabelle 1): l_e (1/12,000 - 1/30,000) = 4.8 um over the path's two joints; approximate (a minimum against a ca. value). BV 191's printed initial permeability ~12,000 may be the stacked core's, like this one"}
bobbin:
  wall_m: {value: 0.5e-3, source: "BV 191 Blatt 2, item 8 (Pressspan ca. 0.5 mm tube)"}
  cheek_m: {value: 1.0e-3, source: "BV 191 Blatt 2, item 8 (Pressspan ca. 1 mm cheeks; the bobbin 23.5 mm long in the 24 mm window)"}
  margin_m: {value: 0.25e-3, source: "derived: (24 mm window - 23.5 mm bobbin) / 2 (Blatt 2, item 8)"}
  pitch_factor: {value: 1.0, source: "unused: the discs' dimensions are drawn (Blatt 2, item 10a: the discs' geometry is binding, not the wire)"}
arrangement: {value: disc, source: "BV 191 Blatt 1, item 7 (Scheibenwicklung) and the mechanical drawing"}
windings: [p1, p2, s]
sections:
  # Along the leg as drawn (Blatt 1, mechanisch): secondary disc, shielded primary disc,
  # two secondary discs, shielded primary disc, secondary disc. Trolitul masks between the
  # discs (0.5 and 0.1 mm are drawn; which goes where isn't legible: all 0.5 here).
  - winding: s
    turns: {value: 2000, source: "BV 191 Blatt 2, item 10 (4 Spulenscheiben je 2000 Wdg.)"}
    layers: {value: 80, source: "derived: a wild-wound disc's equivalent layers, 5.5 mm build / ~0.069 mm overall diameter"}
    wire: {value: 0.06 mm grade 1, source: "BV 191 Blatt 2, item 10 (0.06 CuL; the enamel grade isn't given: provisional grade 1)"}
    enamel: {value: enamel, source: "BV 191 Blatt 2, item 10 (CuL: enamelled; drawn through hot wax, Blatt 3 item 11)"}
    width_m: {value: 2.3e-3, source: "BV 191 Blatt 2, item 10 (2.3 mm breit)"}
    build_m: {value: 5.5e-3, source: "BV 191 Blatt 2, item 10 (5.5 mm hoch)"}
  - insulation: {thickness_m: {value: 0.5e-3, source: "provisional: BV 191 Blatt 1 (Trolitul masks, 0.5 or 0.1 mm)"}, dielectric: {value: polystyrene, source: "BV 191 Blatt 1 (Trolitul: polystyrene)"}}
  - insulation: {thickness_m: {value: 0.03e-3, source: "BV 191 Blatt 3, item 11 (Oelpapier 0.03)"}, dielectric: {value: kraft_oil, source: "BV 191 Blatt 3 (Oelpapier)"}}
  - shield: {name: S, thickness_m: {value: 0.03e-3, source: "BV 191 Blatt 2, item 9 (Folie 0.03 mm) and Blatt 3, item 11"}}
  - insulation: {thickness_m: {value: 0.03e-3, source: "BV 191 Blatt 3, item 11 (Oelpapier 0.03)"}, dielectric: {value: kraft_oil, source: "BV 191 Blatt 3 (Oelpapier)"}}
  - winding: p1
    turns: {value: 400, source: "BV 191 Blatt 2, item 10 (2 Spulenscheiben je 400 Wdg.)"}
    layers: {value: 38, source: "derived: a wild-wound disc's equivalent layers, 5.5 mm build / ~0.145 mm overall diameter"}
    wire: {value: 0.13 mm grade 1, source: "BV 191 Blatt 2, item 10 (0.13 CuL; grade not given: provisional grade 1)"}
    enamel: {value: enamel, source: "BV 191 Blatt 2, item 10 (CuL)"}
    width_m: {value: 2.0e-3, source: "BV 191 Blatt 2, item 10 (2 mm breit)"}
