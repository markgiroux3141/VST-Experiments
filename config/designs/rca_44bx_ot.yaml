# The RCA 44-BX's step-up transformer (part #58871, MI-4027-H and -J; IB-24267-5 Figs. 5, 6
# and 8: data/schematics/rca_44bx/README.md) by its construction. The drawing gives its
# windings: the ribbon (yellow, black) across the primary; one secondary tapped once, its
# ends A (black) and C (green), the tap B (yellow): 250 ohm across A-C (as shipped), 150
# across B-C, 30 across A-B. The reactor (the V1 / V2 low cut) is a separate choke: not
# here (WP6). Nothing of the construction is published: the ratio is derived from the
# ribbon's resistance (RIBBON_44BX@1, 0.216 ohm) reflected to the 250 ohm strapping, the
# tap where the 30 and 150 ohm labels are best met together (26 and 114 ohm: the labels are
# nominal classes), the core and wire provisional (docs/CHAINS_PLAN.md WP5; WP6 fits them to
# the 44-BX's response and sensitivity).
#
# A design (the component editor's source), compiled and saved by
# `cargo run -p varimu-components -- save config/designs/rca_44bx_ot.yaml`.
name: RCA44BX_OT
kind: transformer
source: "RCA 44-BX velocity microphone, transformer #58871 (IB-24267-5 Figs. 5, 6 and 8; data/schematics/rca_44bx/README.md): the windings and the tap from the drawing, the construction unpublished: the ratio derived from the ribbon motor's resistance and the 250 ohm strapping, the rest provisional"
core:
  lamination: {value: EI-75, source: "provisional: model knowledge (the bottom case holds a transformer about 2 x 2 in behind its mu-metal shields (IB-24267-5 Fig. 8, the case 4-5/8 x 3-1/8 in): a 3/4 in tongue)"}
  material: {value: mumetall, source: "provisional: model knowledge (a microphone transformer at a few millivolts: a high-nickel core; IB-24267-5: 'shielded by multiple mu-metal shields', the core's alloy not given)"}
  stack_m: {value: 0.01905, source: "provisional: model knowledge (a square stack, 3/4 in)"}
  stacking_factor: {value: 0.92, source: "web: https://sekels.de/fileadmin/PDF/Deutsch/24_Info_Kernbleche.pdf (SEKELS / VAC Kernbleche, Tabelle 6: Mumetall-type laminations 0.35 mm, 92%)"}
  stacking: {value: interleaved, source: "provisional: model knowledge (an ungapped microphone transformer: E and I interleaved)"}
  joint_gap_m: {value: 0.235e-6, source: "provisional: as SM57_OT's (config/designs/sm57_ot.yaml: an interleaved mumetall joint fitted to a measured primary inductance)"}
bobbin:
  wall_m: {value: 0.5e-3, source: "provisional: model knowledge (a paper or fibre bobbin)"}
  cheek_m: {value: 0.8e-3, source: "provisional: model knowledge (fibre flanges)"}
  margin_m: {value: 0.3e-3, source: "provisional: model knowledge (a small creepage margin each end)"}
  pitch_factor: {value: 1.1765, source: "web: https://lantern.mediahist.org/catalog/radiobroadcast16gardrich_0045 (Radio Broadcast Nov 1929 p.48: turns per layer = winding length / wire diameter x a space factor of 85% for small wires)"}
arrangement: {value: layer, source: "provisional: model knowledge (layer-wound: the ribbon's primary on the tongue, then the secondary's A-B part, then B-C)"}
windings: [p, s1, s2]
sections:
  - winding: p
    turns: {value: 10, source: "provisional: model knowledge (a ribbon transformer's primary: a few turns of heavy wire, here 9.6 mH in the core's linear limit, 1.8 ohm at 30 Hz against the ribbon's 0.216)"}
    layers: {value: 1, source: "derived: turns / turns per layer (one layer of AWG 18 heavy on the 1.07 in traverse)"}
    wire: {value: AWG 18 heavy, source: "provisional: model knowledge (the heaviest the table has: the primary's resistance in series with a 0.2 ohm ribbon, ~0.02 ohm)"}
    enamel: {value: enamel, source: "provisional: model knowledge (enamelled magnet wire)"}
    interlayer: {thickness_m: {value: 0.05e-3, source: "provisional: model knowledge (0.002 in paper)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge (kraft paper)"}}
  - insulation: {thickness_m: {value: 0.25e-3, source: "provisional: model knowledge (a few wraps of paper between the windings)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge"}}
  - winding: s1
    turns: {value: 101, source: "derived: the tap B where 250 x (N_AB / N_AC)^2 and 250 x (N_BC / N_AC)^2 best meet IB-24267-5's 30 and 150 ohm together (least squares in log: 26.5 and 113.6 ohm)"}
    layers: {value: 3, source: "derived: turns / turns per layer (40: the traverse over AWG 24 heavy's 0.0223 in at the pitch factor)"}
    wire: {value: AWG 24 heavy, source: "provisional: model knowledge (fills the window with the primary)"}
    enamel: {value: enamel, source: "provisional: model knowledge"}
    interlayer: {thickness_m: {value: 0.025e-3, source: "provisional: model knowledge (0.001 in interlayer paper)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge"}}
  - winding: s2
    turns: {value: 209, source: "derived: N_AC - N_AB, N_AC = 310 = 31 x the primary's: 250 ohm across A-C reflects to 0.26 ohm, the ribbon motor's 0.216 plus the primary's and the secondary's resistances (RIBBON_44BX@1)"}
    layers: {value: 6, source: "derived: turns / turns per layer (40, as s1)"}
    wire: {value: AWG 24 heavy, source: "provisional: as s1"}
    enamel: {value: enamel, source: "provisional: model knowledge"}
    interlayer: {thickness_m: {value: 0.025e-3, source: "provisional: model knowledge (0.001 in interlayer paper)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge"}}
leakage_method: formula
rating:
  windings: [p]
  v_rms: {value: 0.015, source: "provisional: model knowledge (the ribbon's EMF at ~140 dB SPL: 200 Pa x ~0.07 mV/Pa)"}
  f_hz: {value: 50.0, source: "provisional: model knowledge (the bottom of the band)"}
