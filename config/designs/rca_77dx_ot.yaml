# The RCA 77-DX's step-up transformer (part 97503, IB-24884-2's parts list: "Transformer,
# microphone, tapped for 30, 150, 250 ohms, output impedances; turns ratio 1:23.5 +-2%, round
# can"; data/schematics/rca_77dx/README.md) by its construction. The ribbon (ENAMEL, FORMEX)
# across the primary; the secondary's taps to the terminal strip as ib Fig. 2's cable table
# reads: 250 ohm across the whole secondary (A-C), 150 across one part (B-C), 30 across the
# other (A-B), one tap. The reactor (the V1 / V2 low cut) is a separate choke: not here.
# The ratio is printed; the tap as RCA44BX_OT's (where the 30 and 150 ohm labels are best met
# together), the core and wire provisional (docs/CHAINS_PLAN.md WP7, step 5).
#
# A design (the component editor's source), compiled and saved by
# `cargo run -p varimu-components -- save config/designs/rca_77dx_ot.yaml`.
name: RCA77DX_OT
kind: transformer
source: "RCA 77-DX polydirectional microphone, transformer 97503 (IB-24884-2's parts list, ib Fig. 2: data/schematics/rca_77dx/README.md): the turns ratio 1:23.5 printed, the taps from the cable table, the construction unpublished and provisional"
core:
  lamination: {value: EI-625, source: "provisional: model knowledge (ib2: a 'round can' in the lower shell, the case 3-3/4 x 2-1/2 in (ib2's dimensions; ib Fig. 5): a 5/8 in tongue)"}
  material: {value: mumetall, source: "provisional: model knowledge (a microphone transformer at a few millivolts: a high-nickel core; as RCA44BX_OT's, the 77-DX's alloy not given)"}
  stack_m: {value: 0.015875, source: "provisional: model knowledge (a square stack, 5/8 in)"}
  stacking_factor: {value: 0.92, source: "web: https://sekels.de/fileadmin/PDF/Deutsch/24_Info_Kernbleche.pdf (SEKELS / VAC Kernbleche, Tabelle 6: Mumetall-type laminations 0.35 mm, 92%)"}
  stacking: {value: interleaved, source: "provisional: model knowledge (an ungapped microphone transformer: E and I interleaved)"}
  joint_gap_m: {value: 0.235e-6, source: "provisional: as SM57_OT's (config/designs/sm57_ot.yaml: an interleaved mumetall joint fitted to a measured primary inductance)"}
bobbin:
  wall_m: {value: 0.5e-3, source: "provisional: model knowledge (a paper or fibre bobbin)"}
  cheek_m: {value: 0.8e-3, source: "provisional: model knowledge (fibre flanges)"}
  margin_m: {value: 0.3e-3, source: "provisional: model knowledge (a small creepage margin each end)"}
  pitch_factor: {value: 1.1765, source: "web: https://lantern.mediahist.org/catalog/radiobroadcast16gardrich_0045 (Radio Broadcast Nov 1929 p.48: turns per layer = winding length / wire diameter x a space factor of 85% for small wires)"}
arrangement: {value: layer, source: "provisional: model knowledge (layer-wound: the ribbon's primary on the tongue, then the secondary's A-B part, then B-C)"}
windings: [p, s1, s2]
sections:
  - winding: p
    turns: {value: 14, source: "provisional: model knowledge (a ribbon transformer's primary: a few turns of heavy wire, ~16 mH in the core's linear limit, ~3 ohm at 30 Hz against the ribbon's ~0.6)"}
    layers: {value: 1, source: "derived: turns / turns per layer (one layer of AWG 18 heavy on the ~0.8 in traverse)"}
    wire: {value: AWG 18 heavy, source: "provisional: model knowledge (the heaviest the table has: the primary's resistance in series with a ~0.6 ohm ribbon, ~0.02 ohm)"}
    enamel: {value: enamel, source: "provisional: model knowledge (enamelled magnet wire)"}
    interlayer: {thickness_m: {value: 0.05e-3, source: "provisional: model knowledge (0.002 in paper)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge (kraft paper)"}}
  - insulation: {thickness_m: {value: 0.25e-3, source: "provisional: model knowledge (a few wraps of paper between the windings)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge"}}
  - winding: s1
    turns: {value: 107, source: "derived: the tap B where 250 x (N_AB / N_AC)^2 and 250 x (N_BC / N_AC)^2 best meet ib2's 30 and 150 ohm together (least squares in log, as RCA44BX_OT: 26.4 and 113.8 ohm)"}
    layers: {value: 3, source: "derived: turns / turns per layer (~39: the traverse over AWG 26 heavy's 0.0178 in at the pitch factor)"}
    wire: {value: AWG 26 heavy, source: "provisional: model knowledge (fills the EI-625's window with the primary)"}
    enamel: {value: enamel, source: "provisional: model knowledge"}
    interlayer: {thickness_m: {value: 0.025e-3, source: "provisional: model knowledge (0.001 in interlayer paper)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge"}}
  - winding: s2
    turns: {value: 222, source: "derived: N_AC - N_AB, N_AC = 329 = 23.5 x the primary's (ib2: 'turns ratio 1:23.5 +-2%')"}
    layers: {value: 6, source: "derived: turns / turns per layer (~39, as s1)"}
    wire: {value: AWG 26 heavy, source: "provisional: as s1"}
    enamel: {value: enamel, source: "provisional: model knowledge"}
    interlayer: {thickness_m: {value: 0.025e-3, source: "provisional: model knowledge (0.001 in interlayer paper)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge"}}
leakage_method: formula
rating:
  windings: [p]
  v_rms: {value: 0.015, source: "provisional: model knowledge (the ribbon's EMF at ~140 dB SPL: 200 Pa x ~0.13 mV/Pa at B)"}
  f_hz: {value: 50.0, source: "provisional: model knowledge (the bottom of the band)"}
