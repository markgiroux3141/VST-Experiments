# The beyerdynamic M 160's ribbon-to-line transformer (docs/CHAINS_PLAN.md WP17) by an inferred
# construction: beyer's sheet gives only the wiring (the ribbon motor into a transformer to pins 2
# / 3, data/schematics/beyer_m160/) and the 200 ohm nominal impedance; the ratio is derived from
# the ribbon motor's ~0.16 ohm (RIBBON_M160) reflected to 200 ohm (1:26), the rest provisional (a
# transformer small enough for the 23 mm shaft: EI-18).
#
# A design (the component editor's source), compiled and saved by
# `cargo run -p varimu-components -- save config/designs/beyer_m160_ot.yaml`.
name: M160_OT
kind: transformer
source: "beyerdynamic M 160 ribbon transformer (beyer: m160_data_en p.2's wiring diagram, 200 ohm nominal; data/schematics/beyer_m160/README.md): the construction unpublished, the ratio derived from the ribbon motor's resistance and 200 ohm, the rest provisional"
core:
  lamination: {value: EI-18, source: "provisional: model knowledge (a transformer inside the M 160's 23 mm shaft: the lamination table's smallest, 3/16 in tongue)"}
  material: {value: mumetall, source: "provisional: model knowledge (a ribbon transformer at fractions of a millivolt: a high-nickel core)"}
  stack_m: {value: 0.0095, source: "provisional: model knowledge (a 3/8 in stack on the 3/16 in tongue)"}
  stacking_factor: {value: 0.92, source: "web: https://sekels.de/fileadmin/PDF/Deutsch/24_Info_Kernbleche.pdf (SEKELS / VAC Kernbleche, Tabelle 6: Mumetall-type laminations 0.35 mm, 92%)"}
  stacking: {value: interleaved, source: "provisional: model knowledge (an ungapped microphone transformer: E and I interleaved)"}
  joint_gap_m: {value: 0.235e-6, source: "provisional: as SM57_OT's (config/designs/sm57_ot.yaml: an interleaved mumetall joint fitted to a measured primary inductance)"}
bobbin:
  wall_m: {value: 0.4e-3, source: "provisional: model knowledge (a small plastic bobbin)"}
  cheek_m: {value: 0.6e-3, source: "provisional: model knowledge"}
  margin_m: {value: 0.2e-3, source: "provisional: model knowledge (a small creepage margin each end)"}
  pitch_factor: {value: 1.1765, source: "web: https://lantern.mediahist.org/catalog/radiobroadcast16gardrich_0045 (Radio Broadcast Nov 1929 p.48: turns per layer = winding length / wire diameter x a space factor of 85% for small wires)"}
arrangement: {value: layer, source: "provisional: model knowledge (layer-wound: the ribbon's primary on the tongue, then the secondary)"}
windings: [p, s]
sections:
  - winding: p
    turns: {value: 24, source: "provisional: model knowledge (a ribbon transformer's primary: a few tens of turns of heavy wire, for a primary inductance of tens of mH and a resistance well under the ribbon's)"}
    layers: {value: 2, source: "derived: turns / turns per layer (AWG 24 heavy at the pitch factor on the ~10 mm traverse: two layers of 12)"}
    wire: {value: AWG 24 heavy, source: "provisional: model knowledge (the primary in series with a ~0.15 ohm ribbon)"}
    enamel: {value: enamel, source: "provisional: model knowledge (enamelled magnet wire)"}
    interlayer: {thickness_m: {value: 0.025e-3, source: "provisional: model knowledge (0.001 in paper)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge (kraft paper)"}}
  - insulation: {thickness_m: {value: 0.15e-3, source: "provisional: model knowledge (a few wraps of tape between the windings)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge"}}
  - winding: s
    turns: {value: 624, source: "derived: n = 26: the ribbon motor's ~0.16 ohm (RIBBON_M160's compiled foil and leads) and the primary's 0.07 ohm reflected (n^2 x 0.23 = 156 ohm) plus the secondary's ~37 ohm make beyer's 200 ohm nominal"}
    layers: {value: 12, source: "derived: turns / turns per layer (52 of AWG 36 heavy, under the ~55 that fit on the 9.5 mm traverse at the pitch factor)"}
    wire: {value: AWG 36 heavy, source: "provisional: model knowledge (the secondary's resistance a fifth of the 200 ohm)"}
    enamel: {value: enamel, source: "provisional: model knowledge"}
    interlayer: {thickness_m: {value: 0.012e-3, source: "provisional: model knowledge (thin interlayer film)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge"}}
leakage_method: formula
rating:
  windings: [p]
  v_rms: {value: 0.01, source: "provisional: model knowledge (the ribbon's EMF at ~140 dB SPL: 200 Pa x ~0.03 mV/Pa)"}
  f_hz: {value: 50.0, source: "provisional: model knowledge (the bottom of the band)"}
