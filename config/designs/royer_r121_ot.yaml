# The Royer R-121's ribbon-to-line transformer (docs/CHAINS_PLAN.md WP16) by an inferred
# construction: Royer publishes only the 300 ohm nominal balanced output and the 158 x 25 mm body
# (data/schematics/royer_r121/README.md); the ratio is derived from the ribbon's ~0.1 ohm
# (RIBBON_R121: 1.5 x 3/16 in x 2.5 um aluminium) reflected to 300 ohm, the rest provisional (a
# core small enough for the 25 mm body: EI-18).
#
# A design (the component editor's source), compiled and saved by
# `cargo run -p varimu-components -- save config/designs/royer_r121_ot.yaml`.
name: R121_OT
kind: transformer
source: "Royer R-121 ribbon transformer (royer: the R-121 manual's 300 ohm nominal balanced output, 158 x 25 mm body; data/schematics/royer_r121/README.md): the construction unpublished, the ratio derived from the ribbon's resistance and 300 ohm, the rest provisional"
core:
  lamination: {value: EI-18, source: "provisional: model knowledge (a transformer inside a 25 mm body: the lamination table's smallest, 3/16 in tongue)"}
  material: {value: mumetall, source: "provisional: model knowledge (a ribbon transformer at fractions of a millivolt: a high-nickel core)"}
  stack_m: {value: 0.0095, source: "provisional: model knowledge (a 3/8 in stack on the 3/16 in tongue)"}
  stacking_factor: {value: 0.92, source: "web: https://sekels.de/fileadmin/PDF/Deutsch/24_Info_Kernbleche.pdf (SEKELS / VAC Kernbleche, Tabelle 6: Mumetall-type laminations 0.35 mm, 92%)"}
  stacking: {value: interleaved, source: "provisional: model knowledge (an ungapped microphone transformer: E and I interleaved)"}
  joint_gap_m: {value: 0.235e-6, source: "provisional: as SM57_OT's (config/designs/sm57_ot.yaml: an interleaved mumetall joint fitted to a measured primary inductance)"}
bobbin:
  wall_m: {value: 0.4e-3, source: "provisional: model knowledge (a small plastic bobbin)"}
  cheek_m: {value: 0.6e-3, source: "provisional: model knowledge"}
  margin_m: {value: 0.2e-3, source: "provisional: model knowledge (a small creepage margin each end)"}
  pitch_factor: {value: 1.1765, source: "web: https://lantern.mediahist.org/catalog/radiobroadcast16gardrich_0045 (Radio Broadcast Nov 1929 p.48: turns per layer = winding length / wire diameter x a space factor of 85% for small wires)"}
arrangement: {value: layer, source: "provisional: model knowledge (layer-wound: the ribbon's primary on the tongue, then the secondary)"}
windings: [p, s]
sections:
  - winding: p
    turns: {value: 20, source: "provisional: model knowledge (a ribbon transformer's primary: a few tens of turns of heavy wire, its resistance well under the ribbon's)"}
    layers: {value: 2, source: "derived: turns / turns per layer (AWG 22 heavy at the pitch factor on the 9.5 mm traverse: two layers of 10)"}
    wire: {value: AWG 22 heavy, source: "provisional: model knowledge (the primary in series with a ~0.1 ohm ribbon)"}
    enamel: {value: enamel, source: "provisional: model knowledge (enamelled magnet wire)"}
    interlayer: {thickness_m: {value: 0.025e-3, source: "provisional: model knowledge (0.001 in paper)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge (kraft paper)"}}
  - insulation: {thickness_m: {value: 0.15e-3, source: "provisional: model knowledge (a few wraps of tape between the windings)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge"}}
  - winding: s
    turns: {value: 800, source: "derived: n = 40: the ribbon's ~0.10 ohm and the primary's 0.04 ohm reflected (n^2 x 0.14 = 226 ohm) plus the secondary's ~82 ohm make royer's 300 ohm nominal"}
    layers: {value: 13, source: "derived: turns / turns per layer (62 of AWG 38 heavy, under the ~70 that fit the 9.5 mm traverse at the pitch factor)"}
    wire: {value: AWG 38 heavy, source: "provisional: model knowledge (fills the small window with the primary)"}
    enamel: {value: enamel, source: "provisional: model knowledge"}
    interlayer: {thickness_m: {value: 0.012e-3, source: "provisional: model knowledge (thin interlayer film)"}, dielectric: {value: kraft_dry, source: "provisional: model knowledge"}}
leakage_method: formula
rating:
  windings: [p]
  v_rms: {value: 0.01, source: "provisional: model knowledge (the ribbon's EMF at 135 dB SPL: 112 Pa x ~0.08 mV/Pa)"}
  f_hz: {value: 30.0, source: "royer: the manual's maximum SPL 135 dB @ 30 Hz"}
