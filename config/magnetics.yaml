# Magnetic core materials for the Jiles-Atherton core (varimu/devices/core.py).
#
# JA parameters in the form of Jiles, Thoelke & Devine (1992), as
# varimu.devices.core uses them (c is the 1992 c: Mrev = c (Man - Mirr)).
# Every block carries a `source`; "provisional:" values are model knowledge.
# Which transformer uses which material, and its geometry, is in the circuit
# file (config/circuits/fairchild_670.yaml).

materials:
  grain_oriented_si_steel:
    ms_a_per_m: 1.51913e+6
    a_a_per_m: 13.0
    k_a_per_m: 24.0
    c: 0.8
    alpha: 1.0e-5
    source: "web: https://arxiv.org/abs/2405.11011 Table II, material A (H75-23 grain-oriented steel of medium-voltage transformers; brute-force JA fit to its B-H curve, 2.3% error; Ms fixed from its known saturation). Stands in for AISI M6, the grain-oriented grade of the replacement T102/T104 (web: https://don-audio.com/Sowter-8344e-Fairchild-Signal-amp-output-transformer-T102-202); not a fit to M6 itself"
    lamination_m: 0.35e-3
    lamination_source: "web: https://ocw.uniovi.es/mod/resource/view.php?id=4572 (AK Steel CARLITE bulletin: M-6 nominal 0.35 mm)"
    resistivity_ohm_m: 4.8e-7
    resistivity_source: "provisional: model knowledge (3% Si grain-oriented steel ~45-52 uOhm cm; web: https://image-ppubs.uspto.gov/dirsearch-public/print/downloadPdf/5779819 claims >= 50 for a high-resistivity variant)"
  permalloy_fluxgate:
    ms_a_per_m: 1.0359e+6
    a_a_per_m: 148.79
    k_a_per_m: 39.512
    c: 0.3876
    alpha: 30.551e-5
    source: "web: https://pmc.ncbi.nlm.nih.gov/articles/PMC4970030 Table 3, IBBO column (a permalloy fluxgate core, composition not given; fitted loop error 0.0544 T; identified in the 1986 form, dMirr/dH = (Man - Mirr) / (delta k - alpha (Man - Mirr)), so in varimu.devices.core's effective-field form it is an approximation). A harder nickel-iron than mumetal (coercivity ~40 A/m against ~1.5, saturation 1.30 T against 0.8): an alternative core material for the genome"
    lamination_m: 0.1e-3
    lamination_source: "provisional: model knowledge (nickel-alloy audio transformer laminations 0.1-0.35 mm)"
    resistivity_ohm_m: 5.5e-7
    resistivity_source: "provisional: model knowledge (77-80% Ni alloys ~55-60 uOhm cm)"
  mumetall:
    # JA parameters fitted to the datasheet figures below by
    # scripts/fit_core_material.py (tests/test_core.py checks they still meet them).
    ms_a_per_m: 6.366e+5
    a_a_per_m: 3.18548
    k_a_per_m: 1.66935
    c: 0.289433
    alpha: 1.76945e-5
    source: "fit (2026-10-24; mu4 +0.5%, mu_max -0.3%, Hc +2.3%, hysteresis loss at 0.5 T -2.2%, Rayleigh-region mu at 0.04 A/m -0.5%; origin permeability ~29,300): scripts/fit_core_material.py to the MUMETALL datasheet figures and its Rayleigh region (the datasheet block). Replaces the 2026-10-21 fit to the four scalars alone (c 0.00077: almost all irreversible, H ~ sqrt(B) at program levels, origin permeability 246; Phase 2's 'Low-level core physics', Option 1). Datasheet (web: https://www.matthey.ch/fileadmin/user_upload/downloads/fichetechnique/EN/MuMetall_v22E.pdf, Lamineries Matthey / Vacuumschmelze: ~76% Ni, 5% Mo, 5% Cu); Ms from its saturation polarization 0.8 T"
    datasheet:
      mu_initial: 60000.0       # mu4, relative permeability at 0.4 A/m (static, 1.00 mm)
      h_initial_a_per_m: 0.4
      mu_max: 250000.0          # static, 1.00 mm
      coercivity_a_per_m: 1.5   # printed "0.015" without unit; read as A/cm (Vacuumschmelze's unit)
      loss_w_per_kg: 0.025      # P0.5: 50 Hz, 0.5 T, 0.20 mm strip
      loss_hz: 50.0
      b_loss_t: 0.5
      strip_m: 0.20e-3
      density_kg_per_m3: 8700.0
      # Rayleigh region below h_initial: mu(H) = mu_i (1 + r H); the fit meets
      # mu4 (1 + r h_rayleigh) / (1 + r 0.4) at h_rayleigh.
      rayleigh_r_per_a_m: 2.8
      h_rayleigh_a_per_m: 0.04
      source: "web: https://www.matthey.ch/fileadmin/user_upload/downloads/fichetechnique/EN/MuMetall_v22E.pdf (magnetic and physical properties tables); the Rayleigh r from the same sheet's VAC graph of amplitude permeability, final-annealed (data/datasheets/matthey_mumetall_mu_a.csv, digitized: mu_a ~ 42,000 (1 + 2.8 H) over 0.1-0.6 A/m), cross-checked by a DC ring of 1J85 permalloy (web: https://pmc.ncbi.nlm.nih.gov/articles/PMC9608087: mu_i 72,100, r = 3.3 per A/m); h_rayleigh 0.04 A/m: a tenth of mu4's field, the law extrapolated below the graph's 0.1 A/m (the plan's Phase 2, Option 1)"
    lamination_m: 0.1e-3
    lamination_source: "provisional: model knowledge (nickel-alloy audio transformer laminations 0.1-0.35 mm)"
    resistivity_ohm_m: 5.5e-7
    resistivity_source: "web: https://www.matthey.ch/fileadmin/user_upload/downloads/fichetechnique/EN/MuMetall_v22E.pdf (electrical resistivity 55 uOhm cm)"
  soft_iron_ewing:
    # The Victorian synth's iron (docs/VICTORIAN_SYNTH_PLAN.md): annealed soft iron wire, as
    # induction-coil cores and electromagnets of the 1880s were made. JA parameters fitted to
    # the datasheet figures below by scripts/fit_core_material.py.
    ms_a_per_m: 1.70e+6
    a_a_per_m: 177.693
    k_a_per_m: 156.874
    c: 0.0582812
    alpha: 1.26613e-12
    source: "fit (2026-11-11; mu_initial +0.4%, mu_max +1.0%, Hc -7.9%, hysteresis loss at 0.879 T +10.1%; alpha went to ~0): scripts/fit_core_material.py to Ewing's figures for annealed soft iron (the datasheet block); Ms: web: https://archive.org/details/magneticinductio00ewinuoft (Ewing, Magnetic Induction in Iron and Other Metals, 3rd ed. 1900: saturation intensity I ~ 1,700 for soft iron, mu0 Ms = 2.14 T)"
    datasheet:
      mu_initial: 190.0         # at 0.4 A/m (0.005 Oe): Baur's soft-iron ring, mu = 183 + 1382 H(Oe)
      h_initial_a_per_m: 0.4
      mu_max: 1740.0            # Ewing's annealed wrought-iron ring, Table III (H 4.95 Oe, B 8,580 G)
      coercivity_a_per_m: 151.0 # 1.9 Oe: Ewing sec. 63, annealed soft iron wire (Phil. Trans. 1885 p. 539)
      # Hysteresis loss per cycle, ballistic (static: no eddy), Ewing's Table V (wire 0.078 cm):
      # 3,990 erg/cm^3 at B 8,790 G = 399 J/m^3 at 0.879 T, written as W/kg at 1 Hz.
      loss_w_per_kg: 0.0512
      loss_hz: 1.0
      b_loss_t: 0.879
      strip_m: 0.78e-3
      density_kg_per_m3: 7800.0
      # JA meets the four within ~10% at best (the fit: Hc -7.9%, loss +10.1%).
      fit_tolerance: 0.12
      source: "web: https://archive.org/details/magneticinductio00ewinuoft (Ewing, Magnetic Induction in Iron and Other Metals, 3rd ed. 1900: sec. 63 p. 77, Hc 1.9 Oe, 'thoroughly typical of soft wrought iron'; Table III, mu_max ~1,740; Table V p. 107, the hysteresis loss per cycle of soft iron wire 0.078 cm across; p. 125, Baur's ring, mu = 183 + 1382 H); density provisional: model knowledge (wrought iron 7.7-7.8 g/cm^3)"
    lamination_m: 0.51e-3
    lamination_source: "web: https://archive.org/details/americantelephone00mill (Miller, American Telephone Practice, 1905, p. 74: an induction coil's core of ~500 strands of No. 24 B&S Swedish iron wire, 0.51 mm; a wire's eddy loss treated as a strip's of its diameter: provisional)"
    resistivity_ohm_m: 1.3e-7
    resistivity_source: "provisional: model knowledge (wrought / soft iron ~12-14 uOhm cm; pure iron ~10)"
