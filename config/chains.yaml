    needs: [data]
  - id: c12_ua610
    mic: akg_c12
    pre: ua_610
    use: "Bright tube vocals, jazz vocals, horns"
    needs: [data]
  - id: m251_n1073
    mic: telefunken_ela_m251
    pre: neve_1073
    use: "Classic pop and rock vocals: the CK12's top into a Neve"
