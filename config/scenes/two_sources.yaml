# An example scene (docs/ROOM_LOOP_PLAN.md R3; the format: varimu/rooms/scene.py's docstring):
# the room experiment's "opposite" condition (scripts/room_separation.py): the target melody
# spot-miked through the U47 -> V76, the masker arpeggio through the clean omni chain, a
# spaced omni pair as room mics. The clips are the separation study's dry synth lines (run
# scripts/separation_study.py first).
#
#   uv run --extra fast python scripts/room_print.py config/scenes/two_sources.yaml [--solo]

name: two_sources
room:
  dims_m: [7.0, 5.5, 3.2]
  materials: {walls: furnished_wall, floor: wood_floor, ceiling: gypsum_on_studs}
  source: "provisional: model knowledge (a live tracking room, 7 x 5.5 x 3.2 m, furnished)"
sources:
  - {name: A, clip: cache/separation/conditions/dry/target.wav, spl_db: 90, position_m: [2.0, 2.55, 1.3]}
  - {name: B, clip: cache/separation/conditions/dry/masker.wav, spl_db: 90, position_m: [4.5, 2.55, 1.3]}
mics:
  - name: spot A
    chain: u47_v76
    set: {pattern_u47: 0, gain_db_v76: 34}
    position_m: [2.28, 2.45, 1.3]
    aim: {azimuth_deg: 160.35}
    pan: -0.5
  - name: spot B
    chain: omni_clean
    set: {gain_db_clean: 40}
    position_m: [4.22, 2.45, 1.3]
    aim: {azimuth_deg: 19.65}
    pan: 0.5
  - name: room L
    chain: omni_clean
    set: {gain_db_clean: 40}
    position_m: [2.75, 4.85, 2.0]
    aim: {azimuth_deg: -90, elevation_deg: -15}
    pan: -1.0
  - name: room R
    chain: omni_clean
    set: {gain_db_clean: 40}
    position_m: [3.75, 4.85, 2.0]
    aim: {azimuth_deg: -90, elevation_deg: -15}
    pan: 1.0
settings: {quality: production, seed: 0}
