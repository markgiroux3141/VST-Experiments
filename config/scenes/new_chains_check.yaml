# A check scene for the chains built 2026-11-10 (docs/CHAINS_PLAN.md WP11, WP12, WP22): one
# source, the new chains as spots, rendered once at draft.
#
#   uv run --extra fast python scripts/room_print.py config/scenes/new_chains_check.yaml --quality draft

name: new_chains_check
room:
  dims_m: [7.0, 5.5, 3.2]
  materials: {walls: furnished_wall, floor: wood_floor, ceiling: gypsum_on_studs}
  source: "provisional: model knowledge (a live tracking room, 7 x 5.5 x 3.2 m, furnished)"
sources:
  - {name: A, clip: cache/separation/conditions/dry/target.wav, spl_db: 90, position_m: [2.0, 2.55, 1.3]}
mics:
  - name: U87 into 1073
    chain: u87_n1073
    position_m: [2.3, 2.55, 1.3]
    aim: {azimuth_deg: 180}
    pan: -0.5
  - name: SM57 into API
    chain: sm57_api312
    position_m: [2.0, 2.25, 1.3]
    aim: {azimuth_deg: 90}
    pan: 0.0
  - name: 44-BX into 1073
    chain: r44_n1073
    position_m: [1.7, 2.55, 1.3]
    aim: {azimuth_deg: 0}
    pan: 0.5
