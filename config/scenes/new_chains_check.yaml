# A check scene for the chains built 2026-11-10 (docs/CHAINS_PLAN.md WP11, WP12, WP15, WP19, WP22, WP24, ...): one
# source, the new chains as spots, rendered once at draft.
#
#   uv run --extra fast python scripts/room_print.py config/scenes/new_chains_check.yaml --quality draft

name: new_chains_check
