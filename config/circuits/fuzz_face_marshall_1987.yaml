sections:
- title: ff guitar
  parts:
    RPK_FF:
      R:
      - in
      - ff_pkl
      r: ff_pickup_r_ohm
    LPK_FF:
      L:
      - ff_pkl
      - ff_pk
      l: ff_pickup_l_h
    CPK_FF:
      C:
      - ff_pk
      - '0'
      c: ff_pickup_c_f
    RGV_FF:
      pot:
      - '0'
      - ff_gv
      - ff_pk
      r: ff_guitar_pot_ohm
      at: ff_guitar_volume
      taper_mid: ff_audio_taper_mid
    CGC_FF:
      C:
      - ff_gv
      - '0'
      c: ff_guitar_cable_c_f
- title: ff fuzz face
  parts:
    VBAT_FF:
      V:
      - '0'
      - ff_vbat
      v: ff_battery_v
    RBAT_FF:
      R:
      - ff_vbat
      - ff_vm
      r: ff_battery_r_ohm
    C1_FF:
      C:
      - ff_gv
      - ff_b1
      c: ff_c1_f
    Q1_FF:
      bjt:
      - ff_c1
      - ff_b1
      - '0'
      model: FFQFF1
    R1_FF:
      R:
      - ff_c1
      - ff_vm
      r: ff_r1_ohm
    Q2_FF:
      bjt:
      - ff_c2
      - ff_c1
      - ff_e2
      model: FFQFF2
    R3_FF:
      R:
      - ff_c2
      - ff_tap
      r: ff_r3_ohm
    R2_FF:
      R:
      - ff_tap
      - ff_vm
      r: ff_r2_ohm
    R4_FF:
      R:
      - ff_e2
      - ff_b1
      r: ff_r4_ohm
    RFUZZ_FF:
      pot:
      - '0'
      - ff_fw
      - ff_e2
      r: ff_fuzz_pot_ohm
      at: ff_fuzz
    C2_FF:
      C:
      - ff_fw
      - '0'
      c: ff_c2_f
    C3_FF:
      C:
