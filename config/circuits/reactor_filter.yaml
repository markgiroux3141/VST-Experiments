# A passive low-pass on the two-core saturable reactor: the tube synth's first playable
# filter (docs/TUBE_SYNTH_PLAN.md, S2's core without its tube stages yet). The signal
# runs through the reactor's series signal windings into a capacitor and a load; the
# control voltage biases the two cores in opposite directions through their anti-series
# control windings, which lowers the incremental inductance and raises the cutoff. The
# reactor is config/circuits/saturable_reactor.yaml's (tests/test_reactor.py). Playing it
# from a keyboard is the native app's `reactor_filter` device (a test oscillator in front:
# no part of the instrument).
# Design: ~18.5 H unbiased (mumetall's ~29,900) with 47 nF is ~170 Hz; settled at 100 A/m
# of bias (~49) ~0.03 H, ~4 kHz. The load sets the resonance (Q ~ R_load / sqrt(L / C):
# ~1 at the bottom, rising toward the top). The signal's own current biases the cores
# too: 10 V peak through the reactor is ~2 A/m, so loud low notes move the cutoff.
# Invented circuit, not modelled hardware: round numbers.

title: "Saturable-reactor low-pass"
input: in
probes: [out, s, c1, ta_core, tb_core]

full_scale:
  input_volts_peak: {value: 10.0, source: "provisional: model knowledge (a tube stage's output swing, ~10 V peak, so a full-scale note drives the cores by ~2 A/m)"}
  output_volts_peak: {value: 10.0, source: "provisional: model knowledge (the passband's level, the input's)"}

controls:
  cutoff_v: {value: 20.0, min: 0.0, max: 150.0, unit: V, source: "provisional: model knowledge (the control supply, ~1 V per A/m of bias through 10 kOhm and the control windings; 0-150 V ~ 0-150 A/m)"}
  r_load_ohm: {value: 10.0e+3, min: 1.0e+3, max: 47.0e+3, unit: ohm, source: "provisional: model knowledge (the load across the capacitor: the filter's damping; low = soft, high = resonant)"}

values:
  r_source_ohm: {value: 1.0e+3, source: "provisional: model knowledge (the driving stage's output resistance, a cathode follower's ~1 kOhm)"}
  c_filter_f: {value: 47.0e-9, source: "provisional: model knowledge (design: ~170 Hz unbiased with the reactor's ~18.5 H)"}
  r_control_ohm: {value: 10.0e+3, source: "provisional: model knowledge (the control feed, high against the control windings' resistance)"}
  signal_turns: {value: 500.0, source: "provisional: model knowledge (as saturable_reactor.yaml: 500 turns, ~9 H per core unbiased on a 1 cm^2, 10 cm mumetall toroid)"}
  r_signal_winding_ohm: {value: 10.0, source: "provisional: model knowledge (500 turns of ~0.2 mm copper on a small toroid, ~10 Ohm)"}
  r_control_winding_ohm: {value: 30.0, source: "provisional: model knowledge (1000 turns of ~0.15 mm copper on the same toroid, ~30 Ohm)"}
  leakage_h: {value: 0.0, source: "provisional: model knowledge (windings on a toroid couple closely; leakage neglected)"}
  core_area_m2: {value: 1.0e-4, source: "provisional: model knowledge (a small tape-wound toroid, 1 cm^2)"}
  core_path_m: {value: 0.1, source: "provisional: model knowledge (10 cm mean path, ~32 mm mean diameter)"}
  core_gap_m: {value: 0.0, source: "provisional: model knowledge (a tape-wound toroid has no joint gap)"}

sections:
  - title: filter
    parts:
      RS: {R: [in, s], r: r_source_ohm}
      TA:
        transformer:
          sig: {nodes: [s, m], r: r_signal_winding_ohm}
          ctl: {nodes: [c1, c2], ratio: 2.0, r: r_control_winding_ohm}
        core: {material: mumetall, area_m2: core_area_m2, path_m: core_path_m, gap_m: core_gap_m}
        turns: signal_turns
        leakage_h: leakage_h
      TB:
        transformer:
          sig: {nodes: [m, out], r: r_signal_winding_ohm}
          ctl: {nodes: ["0", c2], ratio: 2.0, r: r_control_winding_ohm}
        core: {material: mumetall, area_m2: core_area_m2, path_m: core_path_m, gap_m: core_gap_m}
        turns: signal_turns
        leakage_h: leakage_h
      CF: {C: [out, "0"], c: c_filter_f}
      RL: {R: [out, "0"], r: r_load_ohm}
  - title: control
    parts:
      VC: {V: [cv, "0"], v: cutoff_v}
      RC: {R: [cv, c1], r: r_control_ohm}
