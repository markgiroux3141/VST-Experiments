# The Neumann U 67 (docs/CHAINS_PLAN.md WP28), from Neumann's circuit diagram 1020390101 ("gültig
# ab Gerät Nr. 10 000"), the BV 12's winding specification and the 1966 specification sheets
# (sources and the trace: data/schematics/neumann_u67/README.md). Values cite "sch: <part>" (the
# drawing), "ot:" (the winding specification), "spec:" (the 1966 sheets).
#
# The capsule (2 x 50 pF, a dual-diaphragm K 67) is driven at its front by `in` and at its rear by
# the control input `p_rear` (pascals as volts). Its front diaphragm is the grid (contact 2), the
# backplate (contact 1, +59 V through R2 68M) the feedback's entry: the feedback winding's signal
# through C3 and C2, shaped by the R3-R7 / C5 / C6 network from the anode (S2, the built-in cut
# below 30 Hz; S1, the 100 Hz bass cut through R4). PATTERN (S3): the rear diaphragm on the grid
# (omni), floating (cardioid), on +120 V and on the grid at AC through C1 (figure-8); the capsule's
# polarizations the drawing's voltages (front: +59 V less the grid's -1.7 V; rear the same in omni,
# 0 in cardioid, +120 - 59 V opposite in figure-8). PAD (S5): C10 270p from the grid to the
# backplate. The EF 86 as a triode (g2 on the anode), its cathode at 0 V, the grid at -1.7 V from
# the heater line's divider R10 / R11 through R9 68M and R8 500M. The anode on R14 150k into Ü1 (BV
# 12) through C9 1u; the output windings strapped for 200 ohm into RLOAD (the spec's 1000 ohm,
# dropped in a chain); the calibration input (St1 pin 6) a sine source at R20, off (0 V) unless a
# measurement sets cal_v (the sheets' preamplifier amplification).
# Supply ideal (the NU 67's +210 V and the A- line at the tube); not modelled: S4's 50 ohm strap,
# C11 / C12 / C14-C16 (RF and supply bypasses), the cable, the heater's hum.

title: "Neumann U 67"
input: in
cv_inputs:
  p_rear: p_rear
probes: [out, g, a, bp, f, e, na, nb, w, z, y]
full_scale:
  input_volts_peak: {value: 20.0, source: "derived: 20 Pa peak (117 dB SPL) at the capsule, as neumann_u47.yaml"}
  output_volts_peak: {value: 1.0960, source: "derived: 0 dBu peak, as neumann_u47.yaml"}

controls:
  pattern: {value: 1, choices: [0, 1, 2], unit: position, source: "sch / spec: S3, omni, cardioid, figure-8", notes: "0 omni, 1 cardioid, 2 figure-8"}
  pad: {value: 0, choices: [0, 1], unit: switch, source: "sch: S5 (C10 270p); spec: approx. 10 dB", notes: "0 off, 1 pre-attenuation"}
  bass_cut: {value: 0, choices: [0, 1], unit: switch, source: "sch: S1 (R4 to the anode); spec p. 2: the limit shifts to 100 cps", notes: "0 flat, 1 the 100 Hz cut"}
  subsonic: {value: 1, choices: [0, 1], unit: switch, source: "sch: S2 (spec p. 2: 'disconnecting a small wire bridge in the microphone'); the curves' flat setting has it", notes: "1 the built-in cut below 30 Hz (factory), 0 the bridge removed"}

values:
  capsule_model: {value: K67@1, source: "config/components/k67/1.yaml (the K 87's form, its network fitted to the U 67's curves through this circuit by scripts/fit_k67.py: reports/mics/k67_fit.json)"}
  pol_front_v: {value: 60.7, source: "derived: sch: the backplate's +59 V less the grid's -1.6..-1.8 V (ovals)"}
  pol_rear_omni_v: {value: 60.7, source: "derived: omni, the rear on the grid (S3), as the front"}
  pol_rear_card_v: {value: 0.0, source: "derived: cardioid, the rear floating (S3's open contact): unpolarized"}
  pol_rear_eight_v: {value: -61.0, source: "derived: sch: figure-8, the rear at +120 V against the backplate's +59 V (opposite the front's)"}
  rear_leak_ohm: {value: 1.0e+12, source: "numerical: the floating rear diaphragm's DC path in cardioid (not physical)"}
  numerical_leak_ohm: {value: 1.0e+12, source: "numerical: a DC path for the feedback network when S1 and S2 are both open (the real one held by its capacitors' leakage; not physical)"}
  contact_ohm: {value: 0.01, source: "provisional: model knowledge (a switch's contact, ~10 mOhm)"}
  bplus_v: {value: 210.0, source: "sch: +210 V at contact 5 (St1 5 +A, B+); NU 67 u's drawing: 210 V"}
  heater_line_v: {value: -6.0, source: "derived: sch: the A- line at the tube, -5.7..-6.3 V (its middle)"}
  r14_ohm: {value: 150.0e+3, source: "sch: R14 150k"}
  c9_f: {value: 1.0e-6, source: "sch: C9 1/450 (1 uF, 450 V)"}
  c17_f: {value: 120.0e-12, source: "sch: C17 80-160 pF (selected on test; the middle until fitted)"}
  r18_ohm: {value: 475.0, source: "sch: R18 475"}
  r19_ohm: {value: 10.0e+3, source: "sch: R19 10k"}
  r20_ohm: {value: 61.9, source: "sch: R20 61,9"}
  c3_f: {value: 0.01e-6, source: "sch: C3 0,01uF"}
  c2_f: {value: 0.01e-6, source: "sch: C2 0,01uF"}
  r3_ohm: {value: 825.0e+3, source: "sch: R3 825k"}
  c5_f: {value: 0.01e-6, source: "sch: C5 0,01uF"}
  r6_ohm: {value: 681.0e+3, source: "sch: R6 681k"}
  c6_f: {value: 0.01e-6, source: "sch: C6 0,01uF"}
  r7_ohm: {value: 681.0e+3, source: "sch: R7 681K"}
  r5_ohm: {value: 2.21e+6, source: "sch: R5 2,21M"}
  r4_ohm: {value: 825.0e+3, source: "sch: R4 825K"}
  r15_ohm: {value: 3.3e+6, source: "sch: R15 3,3M"}
  r13_ohm: {value: 2.21e+6, source: "sch: R13 2,21M"}
  r12_ohm: {value: 2.21e+6, source: "sch: R12 2,21M"}
  r10_ohm: {value: 15.0e+3, source: "sch: R10 15k"}
  r11_ohm: {value: 6.81e+3, source: "sch: R11 6,81K"}
  r2_ohm: {value: 68.0e+6, source: "sch: R2 68M"}
  c4_f: {value: 0.01e-6, source: "sch: C4 0,01uF"}
  r16_ohm: {value: 68.0e+6, source: "sch: R16 68M"}
  c8_f: {value: 0.01e-6, source: "sch: C8 0,01uF"}
  r1_ohm: {value: 500.0e+6, source: "sch: R1 500M"}
  c1_f: {value: 0.01e-6, source: "sch: C1 0,01uF"}
  r9_ohm: {value: 68.0e+6, source: "sch: R9 68M"}
  c7_f: {value: 0.01e-6, source: "sch: C7 0,01uF"}
  r8_ohm: {value: 500.0e+6, source: "sch: R8 500M"}
  c10_f: {value: 270.0e-12, source: "sch: C10 270pF"}
  c13_f: {value: 1600.0e-12, source: "sch: C13 1600p (the hot pin to the shield)"}
  c_ga_f: {value: 3.4e-12, source: "fit: the triode connection's grid-to-anode capacitance (g1 to g2 and the anode, with the head's wiring), for spec's preamplifier amplification at 1 kHz, -2.0 dB (cardioid) re the calibrating input"}
  # Ü1, BV 12 (ot): III + IIIa the primary, I + Ia (200 ohm strap) the output, II + IIa the feedback.
  t_turns: {value: 5400, source: "ot: III + IIIa, 2 x 2700 turns"}
  t_out_ratio: {value: 0.14444, source: "derived: ot: I + Ia 2 x 390 turns over 5400 (S4 at 200 ohm, in series)"}
  t_fb_ratio: {value: 0.046296, source: "derived: ot: II + IIa 2 x 125 turns over 5400"}
  t_r_p_ohm: {value: 2100.0, source: "ot: III / IIIa <= 1050 ohm each (the specification's maximum)"}
  t_r_out_ohm: {value: 40.0, source: "ot: I / Ia <= 20 ohm each (the maximum)"}
  t_r_fb_ohm: {value: 74.0, source: "ot: II / IIa <= 37 ohm each (the maximum)"}
  t_core_material: {value: mumetall, source: "ot: Werkstoff Mu-Metall"}
  t_core_area_m2: {value: 7.1e-5, source: "derived: ot: stack 7.1 mm x a UI 30's 10 mm leg (provisional: model knowledge of the UI 30 lamination)"}
  t_core_path_m: {value: 0.081, source: "derived: ot: the core's 0.05 kg over mu-metal's 8700 kg/m3 and the area above"}
  t_gap_m: {value: 2.0e-6, source: "provisional: model knowledge (ot: interleaved, 'wechselschichtig': a joint gap of a few um)"}
  t_leak_p_h: {value: 0.25, source: "provisional: model knowledge (the primary's share of a few-thousand-turn interleaved winding's leakage)"}
  t_leak_out_h: {value: 0.0052, source: "derived: t_leak_p_h x t_out_ratio^2 (the output winding's share alike)"}
  t_leak_fb_h: {value: 0.00054, source: "derived: t_leak_p_h x t_fb_ratio^2 (the feedback winding's share alike)"}
  t_c_p_f: {value: 1.0e-10, source: "provisional: model knowledge (a 5400-turn primary's self-capacitance)"}
  r_load_ohm: {value: 1000.0, source: "spec: output levels 'across 1000 ohm'; load >= 1000 ohm"}
  cal_v: {value: 0.0, source: "spec: the calibrating input (St1 pin 6) unused: 0 V (a measurement sets a peak volts at R20)"}
  cal_hz: {value: 1000.0, source: "spec: the preamplifier's amplification 'at 1 kcps'"}
  passive_seed: {value: 0, source: "numerical: which set of parts a unit is built from"}
  passive_spread: {value: 0.0, source: "provisional: fraction of each part's tolerance band its deviation spans (0 = every part at its value)"}
  tol_resistor_pct: {value: 1.0, source: "provisional: model knowledge (sch: E96 values, 1% metal film)"}
  tol_cap_pct: {value: 10.0, source: "provisional: model knowledge (film capacitors)"}

tolerance:
  source: "provisional: classes by part type (see the tol_* values)"
  seed: passive_seed
  spread: passive_spread
  bands:
    r1: tol_resistor_pct
    cap: tol_cap_pct
  classes:
    r1: [R14, R18, R19, R20, R3, R6, R7, R5, R4, R15, R13, R12, R10, R11, R2, R16, R1, R9, R8]
    cap: [C9, C3, C2, C5, C6, C4, C8, C1, C7, C10, C13]

devices:
  V1: {device: EF86@1, tolerance: tube}

sections:
  - title: supply
    parts:
      VB: {V: [bplus, "0"], v: bplus_v}
      VH: {V: [am, "0"], v: heater_line_v}
      R15: {R: [bplus, y], r: r15_ohm}
      R13: {R: [y, z], r: r13_ohm}
      R12: {R: [z, w], r: r12_ohm}
      R10: {R: [am, w], r: r10_ohm}
      R11: {R: [w, "0"], r: r11_ohm}
      C4: {C: [z, "0"], c: c4_f}
      R16: {R: [y, q], r: r16_ohm}
      C8: {C: [q, "0"], c: c8_f}
  - title: capsule
    parts:
      SCAP:
        switch: pattern
        parts:
          KC0: {capsule_dual: [in, p_rear, bp, g, g], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_omni_v, in: [0]}
          KC1: {capsule_dual: [in, p_rear, bp, g, rd], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_card_v, in: [1]}
          RRD: {R: [rd, bp], r: rear_leak_ohm, tolerance: none, in: [1]}
          KC2: {capsule_dual: [in, p_rear, bp, g, p5], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_eight_v, in: [2]}
      SPAD:
        switch: pad
        parts:
          C10: {C: [g, bp], c: c10_f, in: [1]}
      R2: {R: [z, bp], r: r2_ohm}
      C1: {C: [g, p5], c: c1_f}
      R1: {R: [q, p5], r: r1_ohm}
      R9: {R: [w, v], r: r9_ohm}
      C7: {C: [v, "0"], c: c7_f}
      R8: {R: [v, g], r: r8_ohm}
  - title: amplifier
    parts:
      XV1: {device: [a, a, g, "0"], model: V1}
      CGA: {C: [g, a], c: c_ga_f, tolerance: none}
      R14: {R: [bplus, a], r: r14_ohm}
      C9: {C: [a, tp], c: c9_f}
      TU:
        transformer:
          p: {nodes: [tp, "0"], r: t_r_p_ohm, c: t_c_p_f, leak: t_leak_p_h}
          s: {nodes: [out, "0"], ratio: t_out_ratio, r: t_r_out_ohm, leak: t_leak_out_h}
          fb: {nodes: [f, e], ratio: t_fb_ratio, r: t_r_fb_ohm, leak: t_leak_fb_h}
        core: {material: t_core_material, area_m2: t_core_area_m2, path_m: t_core_path_m, gap_m: t_gap_m}
        turns: t_turns
      C13: {C: [out, "0"], c: c13_f}
      RLOAD: {R: [out, "0"], r: r_load_ohm, tolerance: none}
      R18: {R: [f, e], r: r18_ohm}
      R19: {R: [e, cal], r: r19_ohm}
      R20: {R: [cal, "0"], r: r20_ohm}
      VCAL: {sine: [cal, "0"], amplitude_v: cal_v, freq_hz: cal_hz}
      C17: {C: [a, f], c: c17_f, tolerance: none}
  - title: feedback network
    parts:
      C3: {C: [f, na], c: c3_f}
      C2: {C: [na, bp], c: c2_f}
      R3: {R: [na, nd], r: r3_ohm}
      C5: {C: [nd, "0"], c: c5_f}
      R6: {R: [nd, nc], r: r6_ohm}
      C6: {C: [nc, "0"], c: c6_f}
      R7: {R: [nc, nb], r: r7_ohm}
      R5: {R: [nb, na], r: r5_ohm}
      RNA: {R: [na, "0"], r: numerical_leak_ohm, tolerance: none}
      SS2:
        switch: subsonic
        parts:
          RS2: {R: [nb, a], r: contact_ohm, tolerance: none, in: [1]}
      SS1:
        switch: bass_cut
        parts:
          R4: {R: [na, a], r: r4_ohm, in: [1]}
