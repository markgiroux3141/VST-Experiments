# Marshall 1987 Lead 50 W ("Plexi", 1968-70), as a circuit file: the 1959 Super Lead's
# preamp, tone stack and long-tailed inverter with two EL34s on a silicon supply, into a
# closed 4 x 12 of Celestion G12Ms. Built by varimu/circuit/builder.py.
#
# Sources (data/schematics/marshall_1987/README.md has their provenance and the choices
# between drawings):
#   "sch: GW87 ..."   GW Unicord's drawing "MARSHALL 1987" 70-19-11, July 1970 (the only
#                     period drawing of the 50 W; values only)
#   "trace: SD68 ..." Sonicdeli's trace of a stock c.1968 amp (part numbers)
#   "sch: RX93 ..."   Marshall's 1987X reissue drawing 87X-60-02 (tapers, part numbers)
#   "web: <url> ..."  a replacement part's or a datasheet's figure
#   "derived: ..."    arithmetic on sourced figures
#   "provisional: ..." model knowledge; a genome parameter or replaced later
#
# Channels: "normal" is V1's triode with the 820 / 320 uF cathode and .022 coupling (the
# upper jacks on GW87), "bright" (High Treble) the one with 2.7K / .68 uF, .0022 coupling,
# the .005 across its volume and 500 pF across its 470K mixer (the lower jacks). Not
# modeled: the heaters, the pilot lamp, the standby and fuses, the impedance selector (on
# 16 ohm, the cabinet's), the PT's unused 5 V winding.
#
# The output (`out`) is the sound pressure 1 m in front of the cabinet: the 4 x 12 as one
# equivalent driver (two series pairs in parallel present one driver's impedance; each
# driver moves the air of a quarter of the closed box), the readout one driver's at the
# pair's voltage (the four together give about twice it on axis at low frequencies).
# `spk` is the 16 ohm tap's voltage.

title: "Marshall 1987 Lead 50 W"
input: in
probes: [out, spk, j1n, j1b, g1n, g1b, k1n, k1b, p1n, p1b, vn, vb, g2a, k2a, p2a, k2b, ts, tw, g3a, g3b, kt, pa3, pb3, g4, g5, p4, p5, bias, fb, b1, b2, b3, b4, b5, hva, hvb]
full_scale:
  input_volts_peak: {value: 1.0, source: "web: https://www.sound-au.com/articles/guitar-voltage.htm (a hot pickup peaks just under 1 V; as the 5E3)"}
  output_pascals_peak: {value: 100.0, source: "derived: the pressure's peak, 59.6 / 67.0 Pa at VOLUME (bright) 0.5 / 1.0 (production render 2026-11-12: 4 s of the dry guitar take at Play's -11.5 dBFS into bright input I), rounded up for headroom"}

controls:
  # The front panel (GW87; knobs are rotations 0..1, the panel's 0..10).
  input_jack: {value: 1, choices: [1, 2, 3, 4, 5], unit: position, source: "sch: GW87 (two jacks per channel); 5: provisional: model knowledge (jumpering the channels, the classic Plexi practice)", notes: "1 bright (High Treble) input I, 2 bright input II, 3 normal input I, 4 normal input II, 5 jumpered (the guitar in bright input I, a patch cable from bright input II to normal input I)"}
  presence: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "sch: GW87 (PRESENCE, a 5K pot from the feedback node to ground, its wiper to .1 uF)"}
  bass: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "sch: GW87 (BASS, 1M as a rheostat)"}
  middle: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "sch: GW87 (MIDDLE, 25K as a rheostat)"}
  treble: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "sch: GW87 (TREBLE, 250K, its wiper to the inverter)"}
  volume_bright: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "sch: GW87 (the High Treble channel's 1M volume)"}
  volume_normal: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "sch: GW87 (the Normal channel's 1M volume)"}
  # Inside the chassis.
  bias_adjust: {value: 0.75, min: 0.0, max: 1.0, unit: rotation, source: "sch: GW87 (the 25K bias rheostat under the 47K); the default: provisional: model knowledge (set for ~2/3 of the EL34's 25 W rating, common biasing practice: settled, -40.2 V on the grids, 37 mA a tube at 447 V, 16.6 W; 0 gives 82 mA / 33 W, 1 27.5 mA / 12.5 W; 8 s idles, 2026-11-12)", notes: "0: the most current (least negative grids), 1: the coldest"}
  # Operating conditions.
  mains_v_rms: {value: 120.0, min: 105.0, max: 127.0, unit: V, source: "provisional: model knowledge (US line voltage on GW87's 120 V primary tap)"}
  mains_hz: {value: 60.0, min: 50.0, max: 60.0, unit: Hz, source: "provisional: model knowledge (US mains: GW87 is the US distributor's drawing)"}

values:
  # --- Inputs (sch: GW87) ----------------------------------------------------------------
  r_input_ohm: {value: 1.0e+6, source: "sch: GW87, SD68 (1M from each channel's input II tip to ground)"}
  r_grid_stop_ohm: {value: 68.0e+3, source: "sch: GW87, SD68 (68K from each jack's tip to the grid)"}
  jack_contact_ohm: {value: 0.01, source: "provisional: model knowledge (a phone jack's contact, ~10 mOhm)", notes: "as the 5E3's: an empty input I's contact grounds its tip; an empty input II's ties its tip to input I's"}
  jumper_cable_ohm: {value: 0.1, source: "provisional: model knowledge (a short patch cable's conductor and its plugs' contacts)"}
  jumper_cable_c_f: {value: 60.0e-12, source: "provisional: model knowledge (a ~0.5 m patch cable at ~100 pF/m)"}

  # --- V1, ECC83: separate cathodes (sch: GW87) ------------------------------------------
  r_plate1_ohm: {value: 100.0e+3, source: "sch: GW87, SD68, GW59 (100K plate loads)"}
  r_cathode1n_ohm: {value: 820, source: "sch: GW87, SD68 (the normal triode's 820)"}
  c_cathode1n_f: {value: 320.0e-6, source: "sch: GW87, SD68 (320 uF across it)"}
  r_cathode1b_ohm: {value: 2700, source: "sch: GW87, GW59, RX93 (the bright triode's 2.7K; SD68's 820 taken as a trace error, README)"}
  c_cathode1b_f: {value: 0.68e-6, source: "sch: GW87, SD68, GW59 (.68 uF across it)"}
  c_couple1n_f: {value: 0.022e-6, source: "sch: GW87, SD68 (.022 from the normal plate to its volume)"}
  c_couple1b_f: {value: 0.0022e-6, source: "sch: GW87, SD68 (.0022 / .002), GW59 (.0022 from the bright plate to its volume; RX93's 22n differs)"}

  # --- Volumes and the mixer (sch: GW87) --------------------------------------------------
  volume_pot_ohm: {value: 1.0e+6, source: "sch: GW87, SD68 (1M volumes)"}
  log_taper_mid: {value: 0.1, source: "sch: RX93 prints A1M (log) volumes and bass, B (linear: no taper_mid) treble, middle and presence, the only taper source; ~10% of the track at half rotation: provisional: model knowledge (as the 5E3's audio taper)"}
  c_bright_f: {value: 0.005e-6, source: "sch: GW87, GW59 (.005 from the bright volume's top to its wiper)"}
  r_mix_ohm: {value: 470.0e+3, source: "sch: GW87, SD68, GW59 (470K from each volume's wiper to V2a's grid)"}
  c_mix_bright_f: {value: 500.0e-12, source: "sch: GW87, GW59 (500 pF across the bright channel's 470K; SD68 560 pF)"}

  # --- V2, ECC83: gain stage and cathode follower (sch: GW87) ----------------------------
  r_plate2_ohm: {value: 100.0e+3, source: "sch: GW87 (100K plate load)"}
  r_cathode2_ohm: {value: 820, source: "sch: GW87 ('820 (1K)': the bracketed value is GW's alternative), SD68 820"}
  c_cathode2_f: {value: 0.68e-6, source: "sch: GW87, SD68 (.68 uF across it)"}
  r_follower_ohm: {value: 100.0e+3, source: "sch: GW87, RX93 (the cathode follower's 100K to ground; plate straight to the V2 node, grid DC-coupled to V2a's plate)"}

  # --- Tone stack (sch: GW87) --------------------------------------------------------------
  r_slope_ohm: {value: 33.0e+3, source: "sch: GW87, SD68, GW59, RX93 (33K)"}
  c_treble_f: {value: 500.0e-12, source: "sch: GW87, GW59 (500 pF; SD68 560 pF)"}
  c_bass_f: {value: 0.022e-6, source: "sch: GW87 (.022)"}
  c_middle_f: {value: 0.022e-6, source: "sch: GW87 (.022)"}
  treble_pot_ohm: {value: 250.0e+3, source: "sch: GW87 (250K, printed rotated; JP97 'Treble 250K', SD68 250k)"}
  bass_pot_ohm: {value: 1.0e+6, source: "sch: GW87 (1M)"}
  middle_pot_ohm: {value: 25.0e+3, source: "sch: GW87 (25K)"}

  # --- V3, ECC83: long-tailed pair inverter (sch: GW87) -----------------------------------
  c_pi_in_f: {value: 0.022e-6, source: "sch: GW87 (.022 from the treble wiper to the first grid)"}
  r_pi_grid_ohm: {value: 1.0e+6, source: "sch: GW87 (1M from each grid to the bias / tail junction)"}
  r_pi_bias_ohm: {value: 470, source: "sch: GW87 (470 from the cathodes to the junction)"}
  r_pi_tail_ohm: {value: 10.0e+3, source: "sch: GW87 (10K from the junction to the feedback node)"}
  c_pi_grid2_f: {value: 0.1e-6, source: "sch: GW87 (.1 from the second grid to the feedback node)"}
  r_pi_plate_a_ohm: {value: 82.0e+3, source: "sch: GW87 (82K on the driven triode's plate, JP97 pin 1)"}
  r_pi_plate_b_ohm: {value: 100.0e+3, source: "sch: GW87 (100K on the other)"}
  c_pi_plates_f: {value: 47.0e-12, source: "sch: GW87, SD68, GW59, RX93 (47 pF across the plates)"}
  c_pi_out_f: {value: 0.022e-6, source: "sch: GW87, SD68, GW59 (.022 to each EL34 grid)"}
  r_feedback_ohm: {value: 47.0e+3, source: "sch: GW87 ('47K (100K)'), SD68 47k: from the speaker jack (the selected tap: 16 ohm with a 16 ohm cabinet)"}
  presence_pot_ohm: {value: 5.0e+3, source: "sch: GW87 (5K)"}
  c_presence_f: {value: 0.1e-6, source: "sch: GW87 (.1 on the presence wiper)"}

  # --- EL34 pair, fixed bias (sch: GW87) ---------------------------------------------------
  power_tube: {value: EL34@1, source: "sch: GW87 (V4, V5 EL34); config/components/el34/1.yaml (Koren pentode fitted to Mullard's and Philips' EL34 sheets: data/datasheets/el34.provenance.yaml)"}
  r_grid_leak_ohm: {value: 220.0e+3, source: "sch: GW87, SD68, GW59, RX93 (220K per grid to the bias supply; no grid stoppers or screen resistors drawn on the 1987)"}

  # --- Bias supply (sch: GW87) -------------------------------------------------------------
  r_bias_feed_ohm: {value: 220.0e+3, source: "sch: GW87, SD68 (220K from an end of the HV winding)"}
  c_bias_f: {value: 8.0e-6, source: "sch: GW87 (8 uF at each node)"}
  r_bias_filter_ohm: {value: 15.0e+3, source: "sch: GW87 (15K)"}
  r_bias_load_ohm: {value: 47.0e+3, source: "sch: GW87 (47K to the rheostat)"}
  bias_pot_ohm: {value: 25.0e+3, source: "sch: GW87 (25K rheostat to ground)"}
  bias_start_v: {value: -40.19, source: "derived: the bias node settled at bias_adjust 0.75 (an 8 s idle, 2026-11-12); held for the DC operating point only, so a run starts settled (the supply charges through 220K into 2 x 8 uF, seconds)"}
  bias_feed_start_v: {value: -49.37, source: "derived: bias_start_v x (15K + 47K + 18.75K) / (47K + 18.75K), the first node at the same setting"}
  bias_rectifier: {value: SI_RECTIFIER@1, source: "trace: SD68 prints 10D8 (GW87 the diode, type not printed); config/components/si_rectifier/1.yaml stands in"}

  # --- Output transformer (Drake 784-139; no original data) ------------------------------
  # Hammond's 1750N (a drop-in for the JMP 50) as the winding data, the primary at 3.4 k
  # plate to plate (README "Output transformer").
  ot_r_half_ohm: {value: 42.4, source: "web: https://www.hammfg.com/files/parts/pdf/1750N.pdf (primary DCR 41.74 / 43.14 ohm per half; their mean)"}
  ot_r_sec_ohm: {value: 1.6, source: "provisional: model knowledge (the 16 ohm tap's whole secondary; Hammond prints only the 4 ohm section's 0.770 ohm, same sheet)"}
  ot_sec_per_half: {value: 0.13720, source: "derived: 3.4 k plate to plate : 16 ohm, secondary turns per primary half 2 / sqrt(3400 / 16); 3.4 k provisional between Mercury Magnetics' O50JM 3.3 k (web: https://www.mercurymagnetics.com/mmpn/o50jm/) and Tube Amp Doctor's M50A 3.6 k after a 1968 original (web: https://www.tubeampdoctor.com/en/output-transf.for-marshall-50w-2x-el34-4-8-16-ohm)"}
  ot_core_material: {value: grain_oriented_si_steel, source: "provisional: model knowledge (silicon-steel EI laminations; the only silicon steel in config/magnetics.yaml)"}
  ot_core_area_m2: {value: 1.18e-3, source: "derived: Tube Amp Doctor's M50A (same page): EI96 (32 mm tongue), stack 1 17/32 in (38.9 mm), 95% stacking: provisional"}
  ot_core_path_m: {value: 0.19, source: "provisional: model knowledge (an EI96's mean magnetic path)"}
  ot_turns_half: {value: 650, source: "provisional: model knowledge (a design rule: 1.2 T at 50 W into 3.4 k at 50 Hz in the core's area)"}
  ot_gap_m: {value: 133.0e-6, source: "derived: gives 4.58 H per primary half (Hammond's 18.3 H plate to plate at 1 kHz, 1 V, same sheet) in the core's linear limit with ot_turns_half; an effective joint gap"}
  ot_leakage_h: {value: 3.35e-3, source: "derived: Hammond's 13.41 mH plate to plate with the secondary shorted (same sheet), a quarter per half (half the turns)"}
  ot_c_half_f: {value: 300.0e-12, source: "provisional: model knowledge (self-capacitance of a push-pull primary half, 100-500 pF; as the 5E3's)"}

  # --- Speaker and cabinet -----------------------------------------------------------------
  speaker_model: {value: G12M@1, source: "config/components/g12m/1.yaml (the Celestion Heritage G12M, fitted to Celestion's response curve; data/schematics/marshall_1987/README.md 'Speaker')"}
  cab_box_m3: {value: 0.035, source: "derived: a quarter of the closed 4 x 12's ~140 L (provisional: 130-150 L from Marshall's 770 x 755 x 365 mm outside, web: https://www.marshall.com/us/en/product/1960b-4x12-base-cabinet, with 18 mm panels less the drivers; README 'Cabinet') per driver"}
  cab_width_m: {value: 0.770, source: "web: https://www.marshall.com/us/en/product/1960b-4x12-base-cabinet (770 mm wide)"}
  cab_height_m: {value: 0.755, source: "web: same page (755 mm tall)"}
  cab_depth_m: {value: 0.365, source: "web: same page (365 mm deep)"}
  cab_offset_x_m: {value: 0.0, source: "provisional: model knowledge (the equivalent driver at the baffle's centre)"}
  cab_offset_y_m: {value: 0.0, source: "provisional: model knowledge (the equivalent driver at the baffle's centre)"}
  listen_distance_m: {value: 1.0, source: "provisional: model knowledge (1 m on axis, as the 5E3's)"}

  # --- Power supply --------------------------------------------------------------------------
  # Hammond's 290GX (the JMP 50's replacement power transformer; the 1968 HV isn't printed
  # anywhere: README "Power supply").
  pt_hv_half_rms_v: {value: 352.5, source: "web: https://www.hammfg.com/files/parts/pdf/290GX.pdf (705.03 V CT no load at 120 V)"}
  pt_r_half_ohm: {value: 115.0, source: "derived: HV DCR 91.5 ohm end to end (half: 45.75) + the 120 V primary's 8.03 ohm referred to a half, 8.03 x (352.5 / 120)^2 = 69.3 (same sheet)"}
  pt_leakage_h: {value: 10.0e-3, source: "provisional: model knowledge (leakage per HV half of a ~150 VA mains transformer; as the 5E3's)"}
  pt_c_half_f: {value: 300.0e-12, source: "provisional: model knowledge (self-capacitance per HV half; a capacitance on every rectifier node, CLAUDE.md)"}
  c_hv_snubber_f: {value: 0.22e-6, source: "sch: GW87 ('22' / '.22' across each half of the HV winding; JP97 '.22uF')"}
  rectifier: {value: SI_RECTIFIER@1, source: "trace: SD68 (10D8 silicon diodes; GW87 two diodes, type not printed); config/components/si_rectifier/1.yaml stands in"}
  c_reservoir_f: {value: 50.0e-6, source: "sch: GW87 (50 uF + 50 uF in parallel at the output transformer's centre tap; SD68 40 + 40)"}
  choke_h: {value: 5.0, source: "web: https://www.hammfg.com/files/parts/pdf/194F.pdf (Hammond 194F, the JMP 50's replacement choke: 5 H at 120 mA; the original C1999, SD68, unmeasured)"}
  choke_r_ohm: {value: 115.0, source: "web: same sheet (DCR 115 ohm)"}
  c_filter_f: {value: 50.0e-6, source: "sch: GW87 (50 uF at the screen, inverter, V2 and V1 nodes; SD68 40 / 32 uF)"}
  r_drop_ohm: {value: 10.0e+3, source: "sch: GW87 (10K / 1W droppers: two from the screen node to the inverter's, one to V2's, one to V1's; SD68 8.2K for the first two)"}
  numerical_leak_ohm: {value: 1.0e+9, source: "numerical: a DC path for the B+ nodes (not physical)"}

mains:
  v_rms: mains_v_rms
  hz: mains_hz
  rated_v_rms: {value: 120.0, source: "web: https://www.hammfg.com/files/parts/pdf/290GX.pdf (the replacement's 120 V primary; its voltages are taken at it)"}

devices:
  V1N: {device: 12AX7@1}
  V1B: {device: 12AX7@1}
  V2A: {device: 12AX7@1}
  V2B: {device: 12AX7@1}
  V3A: {device: 12AX7@1}
  V3B: {device: 12AX7@1}
  V4: {device: power_tube}
  V5: {device: power_tube}
  DR: {device: rectifier}
  DB: {device: bias_rectifier}

sections:
  - title: power supply
    parts:
      # The HV halves from the mains at phase 90 / 270 (a run starts at the peak), .22 uF
      # across each half, silicon diodes into the 50 + 50 uF reservoir at the output
      # transformer's centre tap (b1), the choke to the screen node (b2), then 10K + 10K to
      # the inverter's node (b3), 10K to V2's (b4), 10K to V1's (b5) (sch: GW87).
      VHVA: {mains: [hv_a, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 90.0}
      VHVB: {mains: [hv_b, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 270.0}
      RPTA: {R: [hv_a, hv_ar], r: pt_r_half_ohm}
      LPTA: {L: [hv_ar, hva], l: pt_leakage_h}
      RPTB: {R: [hv_b, hv_br], r: pt_r_half_ohm}
      LPTB: {L: [hv_br, hvb], l: pt_leakage_h}
      CPTA: {C: [hva, "0"], c: pt_c_half_f}
      CPTB: {C: [hvb, "0"], c: pt_c_half_f}
      CSNA: {C: [hva, "0"], c: c_hv_snubber_f}
      CSNB: {C: [hvb, "0"], c: c_hv_snubber_f}
      DRA: {device: [hva, b1], model: DR}
      DRB: {device: [hvb, b1], model: DR}
      CR1A: {C: [b1, "0"], c: c_reservoir_f}
      CR1B: {C: [b1, "0"], c: c_reservoir_f}
      RLEAK: {R: [b1, "0"], r: numerical_leak_ohm}
      LCH: {L: [b1, chk], l: choke_h}
      RCH: {R: [chk, b2], r: choke_r_ohm}
      CB2: {C: [b2, "0"], c: c_filter_f}
      RD1: {R: [b2, b2m], r: r_drop_ohm}
      RD2: {R: [b2m, b3], r: r_drop_ohm}
      CB3: {C: [b3, "0"], c: c_filter_f}
      RD3: {R: [b3, b4], r: r_drop_ohm}
      CB4: {C: [b4, "0"], c: c_filter_f}
      RD4: {R: [b4, b5], r: r_drop_ohm}
      CB5: {C: [b5, "0"], c: c_filter_f}
      # The bias: 220K from an HV end, a diode (its anode on the supply: negative), 8 uF,
      # 15K, 8 uF (the grids' node `bias`), 47K and the 25K rheostat to ground (sch: GW87).
      RBF: {R: [hva, hbr], r: r_bias_feed_ohm}
      DBA: {device: [bn1, hbr], model: DB}
      CBN1: {C: [bn1, "0"], c: c_bias_f, v0: bias_feed_start_v}
      RBN: {R: [bn1, bias], r: r_bias_filter_ohm}
      CBN2: {C: [bias, "0"], c: c_bias_f, v0: bias_start_v}
      RBL: {R: [bias, bpot], r: r_bias_load_ohm}
      RBP: {rheostat: [bpot, "0"], r: bias_pot_ohm, at: bias_adjust}

  - title: inputs
    parts:
      # Per channel: 68K from input I's tip j1 to the grid, 68K from input II's tip j2, 1M
      # from j2 to ground (sch: GW87). An empty input I grounds its tip; an empty input II
      # ties its tip to input I's (as the 5E3's jacks).
      RIN2B: {R: [j2b, "0"], r: r_input_ohm}
      RGAB: {R: [j1b, g1b], r: r_grid_stop_ohm}
      RGBB: {R: [j2b, g1b], r: r_grid_stop_ohm}
      SINB:
        switch: input_jack
        parts:
          RJ1B_IN: {R: [in, j1b], r: jack_contact_ohm, in: [1, 5]}
          RJ1B_GND: {R: [j1b, "0"], r: jack_contact_ohm, in: [2, 3, 4]}
          RJ2B_IN: {R: [in, j2b], r: jack_contact_ohm, in: [2]}
          RJ2B_J1: {R: [j2b, j1b], r: jack_contact_ohm, in: [1, 3, 4]}
          # 5: the patch cable from bright input II to normal input I.
          RJUMP: {R: [j2b, j1n], r: jumper_cable_ohm, in: [5]}
          CJUMP: {C: [j2b, "0"], c: jumper_cable_c_f, in: [5]}
      RIN2N: {R: [j2n, "0"], r: r_input_ohm}
      RGAN: {R: [j1n, g1n], r: r_grid_stop_ohm}
      RGBN: {R: [j2n, g1n], r: r_grid_stop_ohm}
      SINN:
        switch: input_jack
        parts:
          RJ1N_IN: {R: [in, j1n], r: jack_contact_ohm, in: [3]}
          RJ1N_GND: {R: [j1n, "0"], r: jack_contact_ohm, in: [1, 2, 4]}
          RJ2N_IN: {R: [in, j2n], r: jack_contact_ohm, in: [4]}
          RJ2N_J1: {R: [j2n, j1n], r: jack_contact_ohm, in: [1, 2, 3, 5]}

  - title: v1 and volumes
    parts:
      XV1N: {device: [p1n, g1n, k1n], model: V1N}
      RPL1N: {R: [b5, p1n], r: r_plate1_ohm}
      RK1N: {R: [k1n, "0"], r: r_cathode1n_ohm}
      CK1N: {C: [k1n, "0"], c: c_cathode1n_f}
      CC1N: {C: [p1n, vtn], c: c_couple1n_f}
      XV1B: {device: [p1b, g1b, k1b], model: V1B}
      RPL1B: {R: [b5, p1b], r: r_plate1_ohm}
      RK1B: {R: [k1b, "0"], r: r_cathode1b_ohm}
      CK1B: {C: [k1b, "0"], c: c_cathode1b_f}
      CC1B: {C: [p1b, vtb], c: c_couple1b_f}
      # Each coupling capacitor feeds its volume's top; the wipers through 470K each to
      # V2a's grid; the bright channel's .005 from its volume's top to its wiper and 500 pF
      # across its 470K (sch: GW87).
      RVOLN: {pot: ["0", vn, vtn], r: volume_pot_ohm, at: volume_normal, taper_mid: log_taper_mid}
      RVOLB: {pot: ["0", vb, vtb], r: volume_pot_ohm, at: volume_bright, taper_mid: log_taper_mid}
      CBRT: {C: [vtb, vb], c: c_bright_f}
      RMXN: {R: [vn, g2a], r: r_mix_ohm}
      RMXB: {R: [vb, g2a], r: r_mix_ohm}
      CMXB: {C: [vb, g2a], c: c_mix_bright_f}

  - title: v2
    # The cathode follower drives k2b stiffly (~600 ohm): this section keeps it when a live
    # partition puts the tone stack on with the inverter and the output (the stack sees it
    # a sample late; the stack's capacitors leave it no DC path of its own there).
    owns: [k2b]
    parts:
      XV2A: {device: [p2a, g2a, k2a], model: V2A}
      RPL2: {R: [b4, p2a], r: r_plate2_ohm}
      RK2: {R: [k2a, "0"], r: r_cathode2_ohm}
      CK2: {C: [k2a, "0"], c: c_cathode2_f}
      # The cathode follower: its grid on V2a's plate, its plate on the V2 node, 100K to
      # ground (sch: GW87).
      XV2B: {device: [b4, p2a, k2b], model: V2B}
      RKF: {R: [k2b, "0"], r: r_follower_ohm}

  - title: tone stack
    parts:
      # The TMB stack: 500 pF to the treble pot's top tt, 33K to the slope node ts; ts
      # through .022 to the treble pot's bottom tb (the bass rheostat's top) and through
      # .022 to the middle rheostat's top tm; the treble wiper tw drives the inverter.
      CTR: {C: [k2b, tt], c: c_treble_f}
      RSL: {R: [k2b, ts], r: r_slope_ohm}
      CBS: {C: [ts, tb], c: c_bass_f}
      CMD: {C: [ts, tm], c: c_middle_f}
      RTR: {pot: [tb, tw, tt], r: treble_pot_ohm, at: treble}
      RBS: {rheostat: [tb, tm], r: bass_pot_ohm, at: bass, taper_mid: log_taper_mid}
      RMD: {rheostat: [tm, "0"], r: middle_pot_ohm, at: middle}

  - title: inverter
    parts:
      # Long-tailed pair: the treble wiper through .022 to the first grid; each grid's 1M
      # to the junction kj under the shared 470; the 10K tail and the second grid's .1 to
      # the feedback node fb; 82K / 100K plate loads on the inverter's node, 47 pF across
      # the plates; .022 to each EL34 grid (sch: GW87).
      CPI: {C: [tw, g3a], c: c_pi_in_f}
      XV3A: {device: [pa3, g3a, kt], model: V3A}
      XV3B: {device: [pb3, g3b, kt], model: V3B}
      RPB: {R: [kt, kj], r: r_pi_bias_ohm}
      RGA3: {R: [g3a, kj], r: r_pi_grid_ohm}
      RGB3: {R: [g3b, kj], r: r_pi_grid_ohm}
      RTAIL: {R: [kj, fb], r: r_pi_tail_ohm}
      CG3B: {C: [g3b, fb], c: c_pi_grid2_f}
      RPA3: {R: [b3, pa3], r: r_pi_plate_a_ohm}
      RPB3: {R: [b3, pb3], r: r_pi_plate_b_ohm}
      CPP: {C: [pa3, pb3], c: c_pi_plates_f}
      COA: {C: [pa3, g4], c: c_pi_out_f}
      COB: {C: [pb3, g5], c: c_pi_out_f}
      # Feedback: 47K from the 16 ohm tap; presence: 5K from fb to ground, its wiper on .1.
      RFB: {R: [spk, fb], r: r_feedback_ohm}
      RPRES: {pot: ["0", pw, fb], r: presence_pot_ohm, at: presence}
      CPRES: {C: [pw, "0"], c: c_presence_f}

  - title: output
    parts:
      # EL34s, fixed bias: 220K grid leaks to the bias node, screens on the choke's output
      # (no screen or grid stoppers on the 1987 drawings), cathodes and g3 grounded; plates
      # on the output transformer's ends, its centre tap on the reservoir (sch: GW87).
      RGL4: {R: [g4, bias], r: r_grid_leak_ohm}
      RGL5: {R: [g5, bias], r: r_grid_leak_ohm}
      XV4: {device: [p4, b2, g4, "0"], model: V4}
      XV5: {device: [p5, b2, g5, "0"], model: V5}
      T1:
        transformer:
          pa: {nodes: [p4, b1], r: ot_r_half_ohm, c: ot_c_half_f}
          pb: {nodes: [b1, p5], r: ot_r_half_ohm, c: ot_c_half_f}
          s: {nodes: [spk, "0"], ratio: ot_sec_per_half, r: ot_r_sec_ohm}
        core: {material: ot_core_material, area_m2: ot_core_area_m2, path_m: ot_core_path_m, gap_m: ot_gap_m}
        turns: ot_turns_half
        leakage_h: ot_leakage_h
      # The 4 x 12 on the 16 ohm tap as one equivalent driver in a quarter of the closed box.
      SPK:
        speaker: [spk, "0", out]
        component: speaker_model
        box_m3: cab_box_m3
        distance_m: listen_distance_m
        width_m: cab_width_m
        height_m: cab_height_m
        depth_m: cab_depth_m
        offset_x_m: cab_offset_x_m
        offset_y_m: cab_offset_y_m
