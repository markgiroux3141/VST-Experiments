# A Rhodes Mark I Suitcase 73 (1978): the harp into the 100 W Suitcase's preamp (Haigler /
# "Janus" electronics), docs/RHODES_PLAN.md "The Suitcase". Hand-written.
#
# Sources (data/schematics/rhodes_suitcase/README.md has their provenance):
#   "fig11-1: ..."     printed on the service manual's Fig. 11-1 (the preamp's schematic,
#                      transcribed node by node in the README)
#   "fig11-2: ..."     its PCB / parts list (a later revision in places: the README's
#                      "Discrepancies"; the schematic's values are used)
#   "fig11-3: ..."     the dual 50 W power amp's schematic (here only the preamp's load)
#   "web: <url> ..."   a published figure (the MC1458's sheet: data/datasheets/opamps/README.md)
#   "derived: ..."     arithmetic on sourced figures
#   "provisional: ..." model knowledge; replaced later
#
# The signal: the harp (MK1_HARP, played by note events, behind its coils) over a short
# cable to the preamp's P1 KEYBOARD INPUT and J1's normally closed contact (ACCESSORY IN
# empty) to node `inn`; C1 / R1 into A1A (inverting, -22, C2 120 pF: -3 dB at ~6 kHz); R27
# and C4 into the 5K audio VOLUME; C6 into A1B's Baxandall (BASS, TREBLE 50K lin); C16 into
# the vibrato: from `vs` through each LDR to its channel's node (`pa`, `pb`), the two shunted
# to `vm` through 10K each, `vm` fed from `vs` by R24 3.3K and taken to ground by the 25K
# reverse-audio INTENSITY rheostat; A3A / A3B (inverting, -220K / 100K) onto the two outputs.
# `out` is A3A's (P2-4, CH 2), `out_r` A3B's (P2-3, CH 1), each into the power amp's input
# (fig11-3: 680 ohm, then the board's 4.7K and 5 uF to its inverting input).
#
# The vibrato's oscillator: A2A a relaxation oscillator (the 100K reverse-audio SPEED
# rheostat + R3 1K charging C3 10 uF, thresholds at R6 / (R6 + R8) = 0.68 of its swing),
# A2B (C8 / R11 / R12 halve the timing capacitor's triangle, gain 11 with R17 || C11) driven
# into its rails: a clipped triangle on node `v` through the VIBRATO switch S1. The LEDs sit
# between the decoupled rails VB+ / VB- with `v` between them (CR1, LED1, R23 above; R25,
# LED2, CR2, CR3 below), so as `v` rises LED2 brightens and LED1 dims: antiphase. With S1
# off, `v` rests where the two strings balance (both LEDs steady).
#
# The LED / LDR pairs (Rhodes P/N 013556, maker and type unknown) are the optocoupler device
# (varimu/devices/opto.py) as the VTL5C2 Vactrol (VTL5C2@1, provisional stand-in, chosen by
# the reference recording's pan: `opto_model`), each with its state node on a 1 F capacitor
# (the device's own convention).
#
# The op-amps are MC1458s (fig11-1: MC1458P1; fenderrhodes.com calls the part a 4558) as the
# `opamp` macro: TI's typical figures, the swing by clamp diodes; no slew limit (0.5 V/us:
# a 4 V peak at 20 kHz needs 0.5, so only the hottest top end would slew), no crossover
# distortion, no noise. The op-amps draw no supply current in the macro, so VA+ / VA- (A1's
# R22 / R20 and C15 / C13; A3's rails aren't drawn) aren't modelled; VB+ / VB- are (R21 /
# R19, C14 / C12), since the LEDs draw on them. Left out: Q1 / LED3 (the vibrato indicator:
# ~1 mA off A2B's stiff output through R26 10K), LED4 and R36 (the pilot), J2 ACCESSORY OUT
# (an open jack). The board revision's differences (R23 / R25 1K, R39, no CR3, C8 25 uF and
# a C20) stay open: the schematic's values are used.
#
# The audio input `in` is J1 ACCESSORY IN: with `accessory_in` 1 a plug's signal reaches
# `inn` and the harp is cut off (J1's switching contact; the README notes the jack's drawing
# is ambiguous beyond "nothing plugged in: the harp reaches IN"). It is how test signals reach
# the preamp (scripts/suitcase_study.py).

title: "Rhodes Mark I Suitcase (100 W preamp)"
input: in
probes: [out, out_r, inn, a1o, e2, n9, vs, vm, pa, pb, v, x, a2ao, vbp, vbn, l1s, l2s]
full_scale:
  input_volts_peak: {value: 0.5, source: "derived: a harp's EMF at a hard chord, ~0.5 V peak (a key at ff 50-60 mV, docs/RHODES_PLAN.md MK1_HARP@2; rhodes_render.py's harp scale), for test signals into ACCESSORY IN"}
  output_volts_peak: {value: 14.0, source: "web: https://www.ti.com/lit/ds/symlink/mc1458.pdf (VOM +-14 V typ into 10 kOhm: the outputs' largest swing)"}

controls:
  volume: {value: 0.7, min: 0.0, max: 1.0, unit: rotation, source: "fig11-1: R7 5K audio VOLUME (a knob on the 100 W preamp, README)"}
  bass: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "fig11-1: R13 50K lin BASS (a slider)", notes: "1 = the wiper at R9's end (boost), 0.5 flat"}
  treble: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "fig11-1: R16 50K lin TREBLE (a slider)", notes: "1 = the wiper at C7's end (boost), 0.5 flat"}
  vibrato: {value: 1, choices: [0, 1], unit: switch, source: "fig11-1: S1 VIBRATO (SPDT toggle P/N 013575, drawn as one make contact)"}
  speed: {value: 0.563, min: 0.0, max: 1.0, unit: rotation, source: "fig11-1: R4 100K reverse audio VIBRATO SPEED", notes: "0.563 = the reference recording's 3.83 Hz (scripts/suitcase_study.py --calibrate)"}
  intensity: {value: 1.0, min: 0.0, max: 1.0, unit: rotation, source: "fig11-1: R31 25K reverse audio INTENSITY", notes: "full (R31 0 ohm): the least shape error against the reference recording, +-6.75 dB of balance against its +-7.8 (scripts/suitcase_study.py --calibrate)"}
  accessory_in: {value: 0, choices: [0, 1], unit: switch, source: "fig11-1: J1 ACCESSORY IN", notes: "0 empty (the harp plays), 1 a plug (the audio input `in` plays, the harp is cut off)"}

values:
  # --- The harp (as rhodes_stage_5e3's) ------------------------------------------------
  harp_model: {value: MK1_HARP@2, source: "config/components/mk1_harp/2.yaml (the Mark I's 73-key harp from physics; its coils' resistance and inductance with their sources there)"}
  harp_rate_hz: {value: 96000.0, source: "numerical: the voices at the step rate (docs/RHODES_PLAN.md, RH3)"}
  harp_contact_rate_hz: {value: 384000.0, source: "numerical: the hammer's contact stepped at 384 kHz (RH1's rate, RH3)"}
  harp_cable_c_f: {value: 150.0e-12, source: "provisional: model knowledge (the Suitcase's short shielded harp lead to the preamp in the name rail, ~1.5 m at ~100 pF/m)"}
  r_input_unused_ohm: {value: 1.0e+6, source: "numerical: the audio input (J1's tip) terminated while ACCESSORY IN is empty"}
  numerical_leak_ohm: {value: 1.0e+9, source: "numerical: a DC path for the LED strings' nodes, held otherwise only by junctions (the LEDs and CR1-CR3 conduct throughout; not physical)"}
  jack_contact_ohm: {value: 0.01, source: "provisional: model knowledge (a phone jack's contact, ~10 mOhm)"}

  # --- A1A, the gain stage (fig11-1) ---------------------------------------------------
  c1_f: {value: 0.1e-6, source: "fig11-1: C1 .1"}
  r1_ohm: {value: 10.0e+3, source: "fig11-1: R1 10K"}
  r2_ohm: {value: 220.0e+3, source: "fig11-1: R2 220K"}
  c2_f: {value: 120.0e-12, source: "fig11-1: C2 120PF"}
  c19_f: {value: 1.0e-9, source: "fig11-1: C19 .001"}
  r27_ohm: {value: 100.0, source: "fig11-1: R27 100"}

  # --- VOLUME and the tone stage A1B (fig11-1) ------------------------------------------
  c4_f: {value: 5.0e-6, source: "fig11-1: C4 5 (fig11-2.html: non-polar)"}
  volume_pot_ohm: {value: 5.0e+3, source: "fig11-1: R7 5K AUD (P/N 013577)"}
  audio_taper_mid: {value: 0.1, source: "provisional: model knowledge (an audio pot, ~10% of the track at half rotation; as fender_5e3.yaml)", notes: "VOLUME, SPEED and INTENSITY"}
  c6_f: {value: 5.0e-6, source: "fig11-1: C6 5 (fig11-2.html: non-polar)"}
  r9_ohm: {value: 4.7e+3, source: "fig11-1: R9 4.7K"}
  r18_ohm: {value: 4.7e+3, source: "fig11-1: R18 4.7K"}
  bass_pot_ohm: {value: 50.0e+3, source: "fig11-1: R13 50K LIN BASS (P/N 012528)"}
  c9_f: {value: 0.047e-6, source: "fig11-1: C9 .047"}
  r14_ohm: {value: 39.0e+3, source: "fig11-1: R14 39K"}
  c7_f: {value: 0.01e-6, source: "fig11-1: C7 .01"}
  c10_f: {value: 0.01e-6, source: "fig11-1: C10 .01"}
  treble_pot_ohm: {value: 50.0e+3, source: "fig11-1: R16 50K LIN TREBLE"}
  r15_ohm: {value: 5.6e+3, source: "fig11-1: R15 5.6K"}
  c16_f: {value: 1.0e-6, source: "fig11-1: C16 1 (fig11-2.html: 15 V non-polar)"}

  # --- The panning network and A3 (fig11-1) ----------------------------------------------
  opto_model: {value: VTL5C2@1, source: "config/components/vtl5c2/1.yaml (PerkinElmer's VTL5C2 Vactrol, fitted), provisional: standing in for Rhodes P/N 013556 (a 4-terminal LED / LDR, maker unknown; a VTL5C-type Vactrol is the usual replacement: README). Chosen by the reference recording's pan (scripts/suitcase_study.py -> reports/rhodes/suitcase/): a fast flip, then a creep over the whole half period as the darkened cell recovers; the VTL5C2 (off to 100 kOhm in ~190 ms) fits its shape within 1.21 dB rms, the VTL5C1 (~20 ms) flat-tops, 1.51"}
  opto_state_c_f: {value: 1.0, source: "numerical: the optocoupler's state node capacitor (varimu/devices/opto.py: 1 F, the device's convention)"}
  r24_ohm: {value: 3.3e+3, source: "fig11-1: R24 3.3K"}
  r29_ohm: {value: 10.0e+3, source: "fig11-1: R29 10K"}
  r30_ohm: {value: 10.0e+3, source: "fig11-1: R30 10K"}
  intensity_pot_ohm: {value: 25.0e+3, source: "fig11-1: R31 25K REV AUD INTENSITY (P/N 013578), its wiper tied to pin 3"}
  r32_ohm: {value: 100.0e+3, source: "fig11-1: R32 100K"}
  r33_ohm: {value: 100.0e+3, source: "fig11-1: R33 100K"}
  r34_ohm: {value: 220.0e+3, source: "fig11-1: R34 220K"}
  r35_ohm: {value: 220.0e+3, source: "fig11-1: R35 220K"}
  c17_f: {value: 1.0e-9, source: "fig11-1: C17 .001"}
  c18_f: {value: 1.0e-9, source: "fig11-1: C18 .001"}
  r37_ohm: {value: 100.0, source: "fig11-1: R37 100"}
  r38_ohm: {value: 100.0, source: "fig11-1: R38 100"}
  amp_in_r_ohm: {value: 5380.0, source: "derived: fig11-3's R1 / R2 680 (P4 to the PREAMP OUTPUT jacks) plus the power amp board's R22 4.7K into its inverting input, a virtual ground"}
  amp_in_c_f: {value: 5.0e-6, source: "fig11-3: the power amp board's C1 5 NP in series with R22"}

  # --- The oscillator A2A and the shaper A2B (fig11-1) ------------------------------------
  speed_pot_ohm: {value: 100.0e+3, source: "fig11-1: R4 100K REV AUD VIBRATO SPEED (P/N 013580), its wiper tied to pin 3"}
  r3_ohm: {value: 1.0e+3, source: "fig11-1: R3 1K"}
  c3_f: {value: 10.0e-6, source: "fig11-1: C3 10 (+ at the timing node, - at VB-)"}
  c3_start_v: {value: 17.0, source: "numerical: C3's voltage at the start (timing node +2 V over VB-'s -15 V), so the oscillator leaves its symmetric balance point (CLAUDE.md: a capacitor's v0)"}
  r5_ohm: {value: 100.0e+3, source: "fig11-1: R5 100K"}
  c5_f: {value: 0.01e-6, source: "fig11-1: C5 .01"}
  r6_ohm: {value: 1.0e+6, source: "fig11-1: R6 1 MEG"}
  r8_ohm: {value: 470.0e+3, source: "fig11-1: R8 470K"}
  c8_f: {value: 1.0e-6, source: "fig11-1: C8 1 (fig11-2.html: 25 uF, a later revision: README 'Discrepancies')"}
  r11_ohm: {value: 1.0e+6, source: "fig11-1: R11 1 MEG"}
  r12_ohm: {value: 1.0e+6, source: "fig11-1: R12 1 MEG"}
  r10_ohm: {value: 10.0e+3, source: "fig11-1: R10 10K"}
  r17_ohm: {value: 100.0e+3, source: "fig11-1: R17 100K"}
  c11_f: {value: 0.22e-6, source: "fig11-1: C11 .22"}
  switch_contact_ohm: {value: 0.01, source: "provisional: model knowledge (a toggle's contact)"}

  # --- The LED drive (fig11-1) ----------------------------------------------------------
  r23_ohm: {value: 2.2e+3, source: "fig11-1: R23 2.2K (fig11-2.html: 1K, a later revision)"}
  r25_ohm: {value: 2.2e+3, source: "fig11-1: R25 2.2K (fig11-2.html: 1K, a later revision)"}
  diode_model: {value: SI_RECTIFIER@1, source: "fig11-2.html: CR1, CR2 'DIODE, SILICON' (P/N 006260), a generic silicon diode; config/components/si_rectifier/1.yaml"}

  # --- Supply (fig11-1; fig11-3's regulator board) ----------------------------------------
  rail_v: {value: 15.0, source: "fig11-3: MC7815P / MC7915P, +-15 V to the preamp over P4 / P2 (ideal: the regulators' output impedance isn't modelled)"}
  r21_ohm: {value: 100.0, source: "fig11-1: R21 100 (+15 V to VB+)"}
  r19_ohm: {value: 100.0, source: "fig11-1: R19 100 (-15 V to VB-)"}
  c14_f: {value: 100.0e-6, source: "fig11-1: C14 100"}
  c12_f: {value: 100.0e-6, source: "fig11-1: C12 100"}

  # --- The MC1458 (each half) -------------------------------------------------------------
  u_a0: {value: 2.0e+5, source: "web: https://www.ti.com/lit/ds/symlink/mc1458.pdf (AVD 200 V/mV typ, RL >= 2 kOhm; data/datasheets/opamps/README.md)"}
  u_gbw_hz: {value: 1.0e+6, source: "web: https://www.ti.com/lit/ds/symlink/mc1458.pdf (B1, unity-gain bandwidth, 1 MHz typ)"}
  u_r_in_ohm: {value: 2.0e+6, source: "web: https://www.ti.com/lit/ds/symlink/mc1458.pdf (ri 2 MOhm typ)"}
  u_r_out_ohm: {value: 75.0, source: "web: https://www.ti.com/lit/ds/symlink/mc1458.pdf (ro 75 Ohm typ)"}
  u_swing_v: {value: 13.4, source: "derived: the sheet's VOM +-14 V typ (RL = 10 kOhm, +-15 V; +-13 V at 2 kOhm, the 75 Ohm output resistance's share) less the clamp diode's ~0.6 V"}

  # --- Per-instance tolerance (fig11-1's notes) -------------------------------------------
  passive_seed: {value: 0, source: "numerical: which set of parts a unit is built from"}
  passive_spread: {value: 0.0, source: "provisional: fraction of each part's tolerance band its deviation spans (0 = every part at its printed value)"}
  tol_resistor_pct: {value: 10.0, source: "fig11-1 note 1: all resistors 1/2 W +-10%"}
  tol_cap_pct: {value: 20.0, source: "fig11-1 note 2: capacitors +-20%"}
  tol_electrolytic_minus_pct: {value: 20.0, source: "fig11-1 note 2: electrolytic -20% +150%"}
  tol_electrolytic_plus_pct: {value: 150.0, source: "fig11-1 note 2: electrolytic -20% +150%"}
  tol_pot_pct: {value: 20.0, source: "provisional: model knowledge (carbon potentiometers, +-20%)"}

tolerance:
  source: "fig11-1's notes; pots provisional (see the tol_* values)"
  seed: passive_seed
  spread: passive_spread
  bands:
    r10: tol_resistor_pct
    cap: tol_cap_pct
    electrolytic: [tol_electrolytic_minus_pct, tol_electrolytic_plus_pct]
    pot: tol_pot_pct
  classes:
    r10: [R1, R2, R27, R9, R18, R14, R15, R24, R29, R30, R32, R33, R34, R35, R37, R38, R3, R5, R6, R8, R11, R12, R10, R17, R23, R25, R21, R19]
    cap: [C1, C2, C19, C9, C7, C10, C17, C18, C5, C11]
    electrolytic: [C4, C6, C16, C3, C8, C14, C12]
    pot: [R7, R13, R16, R4, R31]

devices:
  OPTO: {device: opto_model}
  DSI: {device: diode_model}

sections:
  - title: supply
    parts:
      VPOS: {V: [p15, "0"], v: rail_v}
      VNEG: {V: ["0", n15], v: rail_v}
      R21: {R: [p15, vbp], r: r21_ohm}
      C14: {C: [vbp, "0"], c: c14_f}
      R19: {R: [n15, vbn], r: r19_ohm}
      C12: {C: [vbn, "0"], c: c12_f}

  - title: input
    parts:
      # The harp over its lead to P1; J1's normally closed contact to `inn` when ACCESSORY
      # IN is empty, its tip (the audio input) when a plug is in.
      HARP: {harp: [hl], component: harp_model, rate_hz: harp_rate_hz, contact_rate_hz: harp_contact_rate_hz}
      CCABLE: {C: [hl, "0"], c: harp_cable_c_f, tolerance: none}
      RIN_UNUSED: {R: [in, "0"], r: r_input_unused_ohm, tolerance: none}
      SJ1:
        switch: accessory_in
        parts:
          RJ1N: {R: [hl, inn], r: jack_contact_ohm, tolerance: none, in: [0]}
          RJ1T: {R: [in, inn], r: jack_contact_ohm, tolerance: none, in: [1]}
      C1: {C: [inn, n1], c: c1_f}
      R1: {R: [n1, a1m], r: r1_ohm}
      U1A: {opamp: ["0", a1m, a1o], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      R2: {R: [a1o, a1m], r: r2_ohm}
      C2: {C: [a1o, a1m], c: c2_f}
      C19: {C: [a1o, "0"], c: c19_f}
      R27: {R: [a1o, e8], r: r27_ohm}

  - title: volume and tone
    parts:
      C4: {C: [e8, e10], c: c4_f}
      R7: {pot: ["0", e2, e10], r: volume_pot_ohm, at: volume, taper_mid: audio_taper_mid}
      C6: {C: [e2, n5], c: c6_f}
      # The Baxandall in A1B's feedback: BASS between R9 and R18 (C9 across it), its wiper
      # through R14 to the inverting input; TREBLE between C7 and C10, its wiper through R15.
      R9: {R: [n5, n6], r: r9_ohm}
      R13: {pot: [n7, bw, n6], r: bass_pot_ohm, at: bass}
      C9: {C: [n6, n7], c: c9_f}
      R18: {R: [n7, n9], r: r18_ohm}
      R14: {R: [bw, n8], r: r14_ohm}
      C7: {C: [n5, t1], c: c7_f}
      R16: {pot: [t3, tw, t1], r: treble_pot_ohm, at: treble}
      C10: {C: [t3, n9], c: c10_f}
      R15: {R: [tw, n8], r: r15_ohm}
      U1B: {opamp: ["0", n8, n9], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      C16: {C: [n9, vs], c: c16_f}

  - title: vibrato
    parts:
      # The panning network: each LDR from `vs` to its channel's node, R29 / R30 from there
      # to `vm`, R24 from `vs` to `vm`, INTENSITY from `vm` to ground.
      XOPTO1: {device: [l1a, l1k, l1s, pa, vs], model: OPTO}
      CS1: {C: [l1s, vs], c: opto_state_c_f, tolerance: none}
      XOPTO2: {device: [l2a, l2k, l2s, pb, vs], model: OPTO}
      CS2: {C: [l2s, vs], c: opto_state_c_f, tolerance: none}
      R24: {R: [vs, vm], r: r24_ohm}
      R29: {R: [pa, vm], r: r29_ohm}
      R30: {R: [pb, vm], r: r30_ohm}
      R31: {rheostat: [vm, "0"], r: intensity_pot_ohm, at: intensity, reverse: 1, taper_mid: audio_taper_mid}
      R32: {R: [pa, a3am], r: r32_ohm}
      U3A: {opamp: ["0", a3am, a3ao], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      R34: {R: [a3ao, a3am], r: r34_ohm}
      C17: {C: [a3ao, "0"], c: c17_f}
      R37: {R: [a3ao, out], r: r37_ohm}
      R33: {R: [pb, a3bm], r: r33_ohm}
      U3B: {opamp: ["0", a3bm, a3bo], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      R35: {R: [a3bo, a3bm], r: r35_ohm}
      C18: {C: [a3bo, "0"], c: c18_f}
      R38: {R: [a3bo, out_r], r: r38_ohm}
      # The power amp's inputs (fig11-3) as the outputs' loads.
      RLA: {R: [out, la_], r: amp_in_r_ohm, tolerance: none}
      CLA: {C: [la_, "0"], c: amp_in_c_f, tolerance: none}
      RLB: {R: [out_r, lb_], r: amp_in_r_ohm, tolerance: none}
      CLB: {C: [lb_, "0"], c: amp_in_c_f, tolerance: none}

  - title: oscillator
    parts:
      # A2A: SPEED + R3 charge C3 (to VB-) from the output; R5 to the inverting input (C5
      # to the output); R6 / R8 the hysteresis.
      R4: {rheostat: [a2ao, r4b], r: speed_pot_ohm, at: speed, reverse: 1, taper_mid: audio_taper_mid}
      R3: {R: [r4b, x], r: r3_ohm}
      C3: {C: [x, vbn], c: c3_f, v0: c3_start_v}
      R5: {R: [x, a2am], r: r5_ohm}
      C5: {C: [a2am, a2ao], c: c5_f}
      R6: {R: [a2ap, "0"], r: r6_ohm}
      R8: {R: [a2ap, a2ao], r: r8_ohm}
      U2A: {opamp: [a2ap, a2am, a2ao], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      # A2B: the timing node's triangle halved (C8, R11, R12), amplified 11x into the rails.
      C8: {C: [x, x8], c: c8_f}
      R11: {R: [x8, a2bp], r: r11_ohm}
      R12: {R: [a2bp, "0"], r: r12_ohm}
      R10: {R: [a2bm, "0"], r: r10_ohm}
      R17: {R: [a2bo, a2bm], r: r17_ohm}
      C11: {C: [a2bo, a2bm], c: c11_f}
      U2B: {opamp: [a2bp, a2bm, a2bo], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      SVIB:
        switch: vibrato
        parts:
          RS1: {R: [a2bo, v], r: switch_contact_ohm, tolerance: none, in: [1]}
      # The LED strings between VB+ and VB-, `v` between them.
      DCR1: {device: [vbp, l1a], model: DSI}
      R23: {R: [l1k, v], r: r23_ohm}
      R25: {R: [v, l2a], r: r25_ohm}
      DCR2: {device: [l2k, cr23], model: DSI}
      DCR3: {device: [cr23, vbn], model: DSI}
      RNL1: {R: [l1a, "0"], r: numerical_leak_ohm, tolerance: none}
      RNL2: {R: [v, "0"], r: numerical_leak_ohm, tolerance: none}
      RNL3: {R: [l2k, "0"], r: numerical_leak_ohm, tolerance: none}
      RNL4: {R: [cr23, "0"], r: numerical_leak_ohm, tolerance: none}
