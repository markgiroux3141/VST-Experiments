# GENERATED by scripts/make_api_312.py from api_2520_test.yaml: edit those and rerun.
#
# The API 312 mic preamp (docs/CHAINS_PLAN.md WP12; sources data/schematics/api_312/README.md).
# API's own 1972 circuit sheet's Fig. 1 is the 312's circuit (the microphone preamplifier, 58
# dB): the mic into the AP2622 input transformer (1:8), a Zobel (220 pF in series with 5.1k)
# across its secondary, the secondary straight into the 2520's +IN; feedback Rf 47k with 47 pF
# across it, Rs 470 to ground through a 60 uF bypass. The 312's cut sheet adds the controls:
# GAIN (here a 25k reverse-taper pot in series with Rs: provisional, the builders' clones'),
# the 20 dB PAD (a U-pad ahead of the transformer, values derived) and the output transformer's
# tap. The output is the sheet's Fig. 2 line amplifier's: the 2520 through 400 uF || 47 ohm
# into the AP2503 (1:3), into 600 ohm; TAP 1 takes a tap at a third of its secondary (1:1,
# provisional: the cut sheet's "3:1 output transformer tap selection").
#
# The 2520 is api_2520_test.yaml's (the GroupDIY "2520 R1" drawing with its two deviations,
# the bias string and C5 fitted to API's data sheet: that file's header). Both transformers'
# constructions are provisional (only the ratios are published). Rails: ideal +-15 V (the
# data sheet's), as the 500-series rack's regulated supply.
#
# in -> RSRC (a 150 ohm test generator, dropped in a chain) -> ia, the mic's hot pin; the
# cold pin is ground (a chain's mic drives one side).

