# GENERATED by scripts/derive_clavinet_live.py from config/circuits/clavinet_d6.yaml: don't
# edit; edit that file (or the script's patches) and rerun. The D6 played live
# (docs/CLAVINET_PLAN.md, CL3): the strings (the component D6_STRINGS, circuitsim's
# clavinet medium, played by note events) drive the pickups' EMF nodes where the offline
# render's control inputs do.
#
# The Hohner Clavinet D6's electronics (docs/CLAVINET_PLAN.md, CL2): the two pickups, the
# A/B and C/D pickup rockers, the four tone rockers and the two-stage BJT amp on its 9 V
# battery. The strings are the medium in varimu/clavinet/ (CL1): their EMFs drive this
# circuit as control inputs (scripts/clavinet_render.py), each pickup's EMF behind its
# coils' resistance and inductance. Sources: data/schematics/hohner_clavinet_d6/README.md.
#
# The amp is drawn from Hohner's E7 schematic (St.-Nr. 801 111,
# data/schematics/hohner_clavinet_d6/clavinete7.jpg): the E7 is the D6's stage version, and
# its tone cells are [G13] Table 3's D6 values exactly. What the drawing gives:
#   pickups   two of six coils, the two ganged rockers; [G13] Fig. 9: each pickup's impedance
#             ~10.2-10.9 kOhm over the band. [R12] Table 1: A+C the centre pickup, B+C the
#             bridge, A+D both anti-phase, B+D both in phase (one 4-position control here; the
#             anti-phase bridge its own control input, the bridge EMF negated).
#   input     a transformer, Beyer TR 145 (BV 35 569), 1:15, into 10 nF and Q1's base.
#   stage 1   BC550C, emitter grounded, collector to base 1 MOhm || 8.2 pF, 12 kOhm load: a
#             transimpedance stage. The pickups stepped up 15x are a ~2.3 MOhm source, so
#             Q1's output is the secondary's current times 1 MOhm, nearly flat.
#   tone      0.22 uF from Q1's collector into the chain (SOFT 30k || 0.1u, MEDIUM 10k || 15n,
#             TREBLE 2 H || 4.7n, BRILLIANT 0.6 H) to ground, each cell shorted by its rocker
#             when off (all off: the chain shorts the signal, silent).
#   stage 2   30 kOhm and 10 nF into a BC550C (620k / 100k divider, 10 kOhm load, 2.2 kOhm
#             unbypassed and 1 kOhm || 6.8 uF in the emitter), 0.22 uF to a 100 kOhm log
#             volume at the jack.
#   supply    the 9 V battery, a BC238 follower on a ZPD 8.2 zener (1.8 kOhm from the
#             battery), 100 uF on the rail.
# [G13]'s figures (the amp nearly flat: -3 dB at 130 Hz, +3 dB at 4 kHz; THD 1% at 1 kHz for
# 400 mV in) are checks now (scripts/clavinet_amp_study.py), not fitted.

title: "Hohner Clavinet D6 (strings, pickups, rockers, two-stage BJT amp)"
input: in
probes: [out, x, sel, b1, c1, e2]

full_scale:
  input_volts_peak: {value: 1.0, source: "numerical: the audio input is unused (the strings drive the pickups' control inputs)"}
  output_volts_peak: {value: 2.0, source: "provisional: model knowledge (the D6's line-ish output: a forte chord at full volume peaks ~1-2 V on 9 V)"}

controls:
  pickup_select: {value: 3, choices: [0, 1, 2, 3], unit: position, source: "[R12] Table 1", notes: "0 = A+C (centre), 1 = B+C (bridge), 2 = A+D (both, anti-phase), 3 = B+D (both, in phase)"}
  soft: {value: 0, choices: [0, 1], unit: switch, source: "[G13] 2.1: the SOFT rocker"}
  medium: {value: 1, choices: [0, 1], unit: switch, source: "[G13] 2.1: the MEDIUM rocker"}
  treble: {value: 1, choices: [0, 1], unit: switch, source: "[G13] 2.1: the TREBLE rocker"}
  brilliant: {value: 0, choices: [0, 1], unit: switch, source: "[G13] 2.1: the BRILLIANT rocker"}
  volume: {value: 0.8, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (the D6's volume knob; default a design choice)"}

values:
  # --- the strings (docs/CLAVINET_PLAN.md, CL3)
  strings_model: {value: D6_STRINGS@3, source: "config/components/d6_strings/3.yaml (the D6's 60 strings from physics, compiled by varimu/clavinet/compile.py: the live band, the contacts, the pickups' maps)"}
  strings_rate_hz: {value: 96000.0, source: "numerical: the voices at the step rate (96 kHz at draft-1x / draft-2x; the live band's modes reach 12 kHz, the pickups' map's products ~24 kHz)"}
  strings_contact_rate_hz: {value: 1536000.0, source: "numerical: the tangent's rubber and the anvil stepped at 16 x 96 kHz, as note.py's reference (varimu/clavinet/live.py)"}
  # --- the pickups (each one's six coils in series)
  r_pickup_ohm: {value: 10.2e+3, source: "[G13] Fig. 9 (read: |Z| ~10.2 kOhm at low frequency)"}
  l_pickup_h: {value: 0.03, source: "provisional: model knowledge (small: [G13] Fig. 9 stays within 10.2-10.9 kOhm to 18 kHz, so omega L << R)"}
  c_pickup_f: {value: 1.0e-9, source: "provisional: model knowledge (the coils' self-capacitance and wiring; resonance ~29 kHz, above the band)"}
  r_combine_ohm: {value: 100.0, source: "numerical: the selector's contacts and wiring (both pickups in parallel at A+D, B+D)"}
  contact_ohm: {value: 0.05, source: "numerical: a closed rocker's contact"}
  open_ohm: {value: 1.0e+9, source: "numerical: an open rocker's contact"}
  # --- the tone chain ([G13] Table 3)
  r_soft_ohm: {value: 30.0e+3, source: "[G13] Table 3: SOFT R = 30 kOhm"}
  c_soft_f: {value: 0.1e-6, source: "[G13] Table 3: SOFT C = 0.1 uF"}
  r_medium_ohm: {value: 10.0e+3, source: "[G13] Table 3: MEDIUM R = 10 kOhm"}
  c_medium_f: {value: 15.0e-9, source: "[G13] Table 3: MEDIUM C = 15 nF (clavinet.com: the .015 uF cap)"}
  l_treble_h: {value: 2.0, source: "[G13] Table 3: TREBLE L = 2 H"}
  c_treble_f: {value: 4.7e-9, source: "[G13] Table 3: TREBLE C = 4.7 nF (clavinet.com: the 4.7 nF disc between the two inductors)"}
  l_brilliant_h: {value: 0.6, source: "[G13] Table 3: BRILLIANT L = 0.6 H"}
  r_l_treble_ohm: {value: 54.9, source: "derived: the E7 schematic's table (2 H: 700 turns of 0.09 mm CuL on a Siemens pot core 14 x 8, N30, AL 4200, B65541-K0000-R030) at a ~29 mm mean turn (provisional: model knowledge, the P 14 x 8's single-section bobbin): 20.3 m of copper at 1.72e-8 Ohm m"}
  r_l_brilliant_ohm: {value: 25.4, source: "derived: the E7 schematic's table (0.6 H: 400 turns of 0.1 mm CuL on the same core; the drawing's symbol says 0.5 H, its table 0.6 H, AL 4200 x 400^2 = 0.67 H) at a ~29 mm mean turn: 11.6 m of copper"}
  # --- the input transformer (Beyer TR 145, BV 35 569, 1:15: the E7 schematic)
  t1_ratio: {value: 15.0, source: "the E7 schematic: 'Uebertrager 1:15, Beyer TR 145, BV 35 569' (the pickups on its primary, rot / schwarz; Q1 on its secondary, blau / gelb)"}
  t1_turns: {value: 2000.0, source: "provisional: model knowledge (a small mumetall input transformer's primary; with t1_core_* and the joint gap ~30 H at the origin, so the pickups' 10 kOhm see it as open down to ~50 Hz: the drawing gives the ratio only)"}
  t1_core_material: {value: mumetall, source: "provisional: model knowledge (a Beyer input transformer: a nickel-iron core)"}
  t1_core_area_m2: {value: 20.0e-6, source: "provisional: model knowledge (a ~20 mm can's core, 4 x 5 mm)"}
  t1_core_path_m: {value: 0.04, source: "provisional: model knowledge (its magnetic path)"}
  t1_gap_m: {value: 2.0e-6, source: "provisional: model knowledge (interleaved laminations' effective joint gap)"}
  t1_leakage_h: {value: 5.0e-3, source: "provisional: model knowledge (referred to the primary: ~1.1 H at the secondary, against the ~2.3 MOhm the stepped-up pickups present)"}
  t1_r_pri_ohm: {value: 150.0, source: "provisional: model knowledge (2000 turns of ~0.07 mm copper)"}
  t1_r_sec_ohm: {value: 20.0e+3, source: "provisional: model knowledge (30,000 turns of ~0.03 mm copper; small against the source)"}
  t1_c_sec_f: {value: 50.0e-12, source: "provisional: model knowledge (the many-layer secondary's self-capacitance; small against the 10 nF it drives)"}
  c_in_f: {value: 10.0e-9, source: "the E7 schematic: 10 n from the transformer's blau lead to Q1's base"}
  # --- stage 1: BC550C transimpedance (the E7 schematic)
  q1: {value: BC550C@1, source: "the E7 schematic: 'BC 550 C' (clavinet.com's D6 upgrade names a BC 413C front end: web: https://clavinet.com/d6upgrade.php; the same class, the same card)"}
  r_f1_ohm: {value: 1.0e+6, source: "the E7 schematic: 1M collector to base"}
  c_f1_f: {value: 8.2e-12, source: "the E7 schematic: 8,2 p across the 1M (GroupDIY's E7 thread: the 8.2 pF)"}
  r_c1_ohm: {value: 12.0e+3, source: "the E7 schematic: 12K collector load"}
  c_12_f: {value: 0.22e-6, source: "the E7 schematic: 0,22 u from Q1's collector to the tone chain (clavinet.com: a .22 uF film cap)"}
  # --- stage 2: BC550C common emitter (the E7 schematic)
  q2: {value: BC550C@1, source: "the E7 schematic: 'BC 550 C'"}
  r_s2_ohm: {value: 30.0e+3, source: "the E7 schematic: 30K from the tone chain toward Q2"}
  c_s2_f: {value: 10.0e-9, source: "the E7 schematic: 10 n into Q2's base (clavinet.com: .01 uF film caps)"}
  r_bias2_top_ohm: {value: 620.0e+3, source: "the E7 schematic: 620K rail to Q2's base"}
  r_bias2_bottom_ohm: {value: 100.0e+3, source: "the E7 schematic: 100K Q2's base to ground"}
  r_c2_ohm: {value: 10.0e+3, source: "the E7 schematic: 10K collector load"}
  r_e2_ohm: {value: 2.2e+3, source: "the E7 schematic: 2,2K emitter (unbypassed)"}
  r_e3_ohm: {value: 1.0e+3, source: "the E7 schematic: 1K emitter, bypassed"}
  c_e3_f: {value: 6.8e-6, source: "the E7 schematic: 6,8 u across the 1K (clavinet.com: a 6.8 uF / 20 V tantalum)"}
  c_out_f: {value: 0.22e-6, source: "the E7 schematic: 0,22 u from Q2's collector to the volume (clavinet.com: the .22 uF output film cap)"}
  r_volume_ohm: {value: 100.0e+3, source: "the E7 schematic: 'Lautstaerke 100 K + log'"}
  volume_taper_mid: {value: 0.15, source: "provisional: model knowledge (a log taper, 15% at mid rotation)"}
  r_load_ohm: {value: 1.0e+6, source: "provisional: model knowledge (an amp's or console's input)"}
  # --- the battery and the rail (the E7 schematic)
  battery_v: {value: 9.0, source: "the E7 schematic: '+ Batterie' (a 9 V block; GroupDIY's E7 thread: ~8.8 V under load, web: https://groupdiy.com/threads/clavinet-e7.38507)"}
  r_battery_ohm: {value: 2.0, source: "provisional: model knowledge (a fresh 9 V battery's internal resistance, ~1-3 Ohm; a tired one tens: a condition dial)"}
  q3: {value: BC238@1, source: "the E7 schematic: 'BC 238', the rail's follower"}
  r_zener_ohm: {value: 1.8e+3, source: "the E7 schematic: 1,8K battery to the BC238's base"}
  zener: {value: ZPD8V2@1, source: "the E7 schematic: 'ZPD 8,2'"}
  zener_v: {value: 8.2, source: "the E7 schematic: ZPD 8,2 (the ZPD series' nominal at 5 mA)"}
  zener_ref_a: {value: 5.0e-3, source: "provisional: model knowledge (the ZPD / BZX55 series' test current, 5 mA)"}
  c_rail_f: {value: 100.0e-6, source: "the E7 schematic: 100 u on the rail (clavinet.com: the 100 uF / 16 V electrolytic)"}
  r_in_ohm: {value: 1.0e+6, source: "numerical: a load on the unused audio input"}

devices:
  Q1: {device: q1}
  Q2: {device: q2}
  Q3: {device: q3}
  DZ: {device: zener}

sections:
  - title: pickups
    parts:
      RIN: {R: [in, "0"], r: r_in_ohm, tolerance: none}
      # the strings: the centre pickup's EMF on ec, the bridge's on eb and negated on
      # ebn (each to ground), the keys played by note events
      STRINGS: {clav_strings: [ec, eb, ebn], component: strings_model, rate_hz: strings_rate_hz, contact_rate_hz: strings_contact_rate_hz}
      # the centre pickup: EMF ec behind its coils
      RPC: {R: [ec, pc1], r: r_pickup_ohm, tolerance: none}
      LPC: {L: [pc1, pc], l: l_pickup_h}
      CPC: {C: [pc, "0"], c: c_pickup_f, tolerance: none}
      # the bridge pickup, and its reversed connection (the bridge EMF negated)
      RPB: {R: [eb, pb1], r: r_pickup_ohm, tolerance: none}
      LPB: {L: [pb1, pb], l: l_pickup_h}
      CPB: {C: [pb, "0"], c: c_pickup_f, tolerance: none}
      RPN: {R: [ebn, pn1], r: r_pickup_ohm, tolerance: none}
      LPN: {L: [pn1, pn], l: l_pickup_h}
      CPN: {C: [pn, "0"], c: c_pickup_f, tolerance: none}
      SEL:
        switch: pickup_select
        parts:
          RSC: {R: [pc, sel], r: r_combine_ohm, tolerance: none, in: [0, 2, 3]}
          RSB: {R: [pb, sel], r: r_combine_ohm, tolerance: none, in: [1, 3]}
          RSN: {R: [pn, sel], r: r_combine_ohm, tolerance: none, in: [2]}

  - title: tone
    parts:
      # the chain x -> t1 -> t2 -> t3 -> ground; each rocker shorts its cell when off
      RSOFT: {R: [x, t1], r: r_soft_ohm}
      CSOFT: {C: [x, t1], c: c_soft_f}
      SSOFT:
        switch: soft
        parts:
          RKSOFT: {R: [x, t1], r: contact_ohm, tolerance: none, in: [0]}
      RMED: {R: [t1, t2], r: r_medium_ohm}
      CMED: {C: [t1, t2], c: c_medium_f}
      SMED:
        switch: medium
        parts:
          RKMED: {R: [t1, t2], r: contact_ohm, tolerance: none, in: [0]}
      LTRE: {L: [t2, t2r], l: l_treble_h}
      RLTRE: {R: [t2r, t3], r: r_l_treble_ohm, tolerance: none}
      CTRE: {C: [t2, t3], c: c_treble_f}
      STRE:
        switch: treble
        parts:
          RKTRE: {R: [t2, t3], r: contact_ohm, tolerance: none, in: [0]}
      LBRI: {L: [t3, t3r], l: l_brilliant_h}
      RLBRI: {R: [t3r, "0"], r: r_l_brilliant_ohm, tolerance: none}
      SBRI:
        switch: brilliant
        parts:
          RKBRI: {R: [t3, "0"], r: contact_ohm, tolerance: none, in: [0]}

  - title: amp
    parts:
      # the input transformer: the pickups on the primary, Q1 on the secondary
      T1:
        transformer:
          p: {nodes: [sel, "0"], r: t1_r_pri_ohm}
          s: {nodes: [ts, "0"], ratio: t1_ratio, r: t1_r_sec_ohm, c: t1_c_sec_f}
        core: {material: t1_core_material, area_m2: t1_core_area_m2, path_m: t1_core_path_m, gap_m: t1_gap_m}
        turns: t1_turns
        leakage_h: t1_leakage_h
      CIN: {C: [ts, b1], c: c_in_f}
      Q1: {bjt: [c1, b1, "0"], model: Q1}
      RF1: {R: [c1, b1], r: r_f1_ohm}
      CF1: {C: [c1, b1], c: c_f1_f}
      RC1: {R: [vcc, c1], r: r_c1_ohm}
      C12: {C: [c1, x], c: c_12_f}
      # the tone chain hangs on x (section tone); 30k and 10 nF into stage 2
      RS2: {R: [x, x2], r: r_s2_ohm}
      CS2: {C: [x2, b2], c: c_s2_f}
      R3: {R: [vcc, b2], r: r_bias2_top_ohm}
      R4: {R: [b2, "0"], r: r_bias2_bottom_ohm}
      Q2: {bjt: [c2, b2, e2], model: Q2}
      RC2: {R: [vcc, c2], r: r_c2_ohm}
      RE2: {R: [e2, e2b], r: r_e2_ohm}
      RE3: {R: [e2b, "0"], r: r_e3_ohm}
      CE3: {C: [e2b, "0"], c: c_e3_f}
      COUT: {C: [c2, v1], c: c_out_f}
      RVOL: {pot: ["0", out, v1], r: r_volume_ohm, at: volume, taper_mid: volume_taper_mid}
      RLOAD: {R: [out, "0"], r: r_load_ohm, tolerance: none}

  - title: supply
    parts:
      VB: {V: [bat, "0"], v: battery_v}
      RBAT: {R: [bat, vbat], r: r_battery_ohm, tolerance: none}
      RZ: {R: [vbat, zb], r: r_zener_ohm}
      VZ: {vr_tube: [zb, zm, "0"], model: DZ, operating_v: zener_v, ref_current_a: zener_ref_a}
      Q3: {bjt: [vbat, zb, vcc], model: Q3}
      CRAIL: {C: [vcc, "0"], c: c_rail_f}
