  seed: passive_seed
  spread: passive_spread
  tube: {emission_pct: tube_emission_pct, mu_pct: tube_mu_pct}
  bands:
    r10: tol_resistor_pct
    r1: tol_precise_pct
    r2: tol_two_pct
    r5: tol_five_pct
    pot: tol_pot_pct
    paper: tol_paper_pct
    electrolytic: [tol_electrolytic_minus_pct, tol_electrolytic_plus_pct]
  classes:
    r10: [RIN_S, RP1A, RK1A, RMET, RG2B, RK2B, RP2B, RG2A, RP2A, RB275, RBIAS, RK3B_BL, RG3A, RP3A, RG4A, RK4A, RK4A_BL, RFB, RP4A, RP4B, RP4C, RG4B, RK4B, RG5A, RG5B, RK5, RB300, RB250, RB220, RB215, RB190, RBOSC]
    r1: [RLF, RG3B, RK3B, RP1B, RK1B]
    r2: [RP3B]
    r5: [RIN_SH, RK2B_F, RK2A, RK2A_F, REQ_LF]
    pot: [RLEV, RPLAY, REQ_HI]
    paper: [CMET1, CMET2, CC1A, CLF, CC2B, CHEAD, CC3B, CC3A, CG4B, CC4A, CC4B]
