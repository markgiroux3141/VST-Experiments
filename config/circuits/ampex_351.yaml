  c_b250_f: {value: 75.0e-6, source: "sch: 3C16d 75 450V"}
  r_b220_ohm: {value: 27.0e+3, source: "sch: 1R13 27K"}
  c_b220_f: {value: 10.0e-6, source: "sch: 1C2a 10 350V"}
  r_b215_ohm: {value: 27.0e+3, source: "sch: 3R35 27K"}
  c_b215_f: {value: 15.0e-6, source: "sch: 3C16b 15 350V"}
  r_b190_ohm: {value: 39.0e+3, source: "sch: 3R32 39K"}
  c_b190_f: {value: 15.0e-6, source: "sch: 3C16a 15 350V"}
  r_rec_line_ohm: {value: 200, source: "sch: 3R56 100 and 3R57 100 through 3K1c (record)"}
  r_bosc_ohm: {value: 1500, source: "sch: 1R59 1500 2W"}
  c_bosc_f: {value: 10.0e-6, source: "sch: 1C2c 10 450V"}

  # --- 1V6, 12AU7: the bias / erase oscillator, 1T5, the heads' bias (sch) --------------
  c_cross_f: {value: 350.0e-12, source: "sch: 1C32, 1C35 350 pF 1%, each plate to the other grid"}
  c_grids_f: {value: 1.0e-9, source: "sch: 1C36 .001 5%, grid to grid"}
  r_grid_ohm: {value: 4700, source: "sch: 1R61, 1R62 4700"}
  noise_balance_ohm: {value: 10.0e+3, source: "sch: 1R63 NOISE BALANCE 10K, its wiper to ground"}
  t5_l_half_h: {value: 5.5e-3, source: "provisional: model knowledge (with the erase circuit, oscillates at 99 kc, the manual's ~100 kc; 1T5 is a part number only)"}
  t5_l_sec_h: {value: 150.0e-6, source: "provisional: model knowledge (a step-down erase winding; ~80 mA of erase current)"}
  t5_k: {value: 0.99, source: "provisional: model knowledge (a small bias transformer's coupling)"}
  t5_r_half_ohm: {value: 20.0, source: "provisional: model knowledge (primary DCR plus loss per half at 100 kc)"}
  t5_r_sec_ohm: {value: 1.0, source: "provisional: model knowledge (secondary DCR plus loss)"}
  r_erase_meter_ohm: {value: 8.2, source: "sch: 1R64 8.2 5% 1W, the secondary's return (the ERASE meter reads across it)"}
  c_erase_fixed_f: {value: 0.91e-9, source: "sch: 5C34 .00091 500V 5%, across ERASE ADJUST"}
  erase_l_h: {value: 2.8e-3, source: "provisional: model knowledge (a full-track erase head; ERASE ADJUST's range, 1.01-1.46 nF, tunes 2.8 mH alone through 79-95 kc)"}
  erase_r_ohm: {value: 60.0, source: "provisional: model knowledge (its loss at 100 kc, Q ~ 20)"}
  r_bias_feed_ohm: {value: 330, source: "sch: 4R70 330 in the bias line"}
  osc_kick_v: {value: 0.1, source: "numerical: 1C36's voltage at the start, so the oscillator leaves its symmetric balance point (CLAUDE.md: a capacitor's v0)"}

  # --- Per-instance tolerance ------------------------------------------------------------
  passive_seed: {value: 0, source: "numerical: which set of parts a unit is built from"}
  passive_spread: {value: 0.0, source: "provisional: fraction of each part's tolerance band its deviation spans (0 = every part at its printed value)"}
  tol_resistor_pct: {value: 10.0, source: "sch: note 1, resistors +-10% unless specified"}
  tol_precise_pct: {value: 1.0, source: "sch: the parts printed 1% (2R25, 2R28, 1R18)"}
  tol_two_pct: {value: 2.0, source: "sch: 2R27 printed 2%"}
  tol_five_pct: {value: 5.0, source: "sch: the parts printed 5%"}
  tol_pot_pct: {value: 20.0, source: "provisional: model knowledge (carbon potentiometers, +-10..20%)"}
  tol_paper_pct: {value: 20.0, source: "provisional: model knowledge (paper capacitors, +-10..20%)"}
  tol_electrolytic_minus_pct: {value: 20.0, source: "provisional: model knowledge (electrolytics, -10..-20%)"}
  tol_electrolytic_plus_pct: {value: 50.0, source: "provisional: model knowledge (electrolytics, +50..+100%)"}
  tube_emission_pct: {value: 10.0, source: "provisional: model knowledge (plate current of new tubes of one type at fixed bias, +-10..20%)"}
  tube_mu_pct: {value: 3.0, source: "provisional: model knowledge (grid-pitch tolerance, a few %)"}

# Noise on (device builder B5): the resistors' Johnson noise, the tubes' shot and flicker
# noise (the oscillator's and the amplifiers'), the mains wander and the tape's grain (its
# component's noise block, keyed by the circuit's seed): the 351's S/N includes "bias,
# erase and amplifier noise" (man p10). Renders can turn it off (`build(..., noise=False)`).
noise:
  seed: 1

mains:
  v_rms: mains_v_rms
  hz: mains_hz
  rated_v_rms: {value: 117.0, source: "sch: note 6 (the drawing's voltages at a 117 V line; 6T4's ratings aren't printed)"}

tolerance:
  source: "sch: note 1 (resistors 10% unless specified, printed tolerances per part); capacitors and tubes provisional (see the tol_* values)"
  seed: passive_seed
  spread: passive_spread
  tube: {emission_pct: tube_emission_pct, mu_pct: tube_mu_pct}
  bands:
    r10: tol_resistor_pct
    r1: tol_precise_pct
    r2: tol_two_pct
    r5: tol_five_pct
    c1: tol_precise_pct
    c5: tol_five_pct
    pot: tol_pot_pct
    paper: tol_paper_pct
    electrolytic: [tol_electrolytic_minus_pct, tol_electrolytic_plus_pct]
  classes:
    r10: [RIN_S, RP1A, RK1A, RMET, RG2B, RK2B, RP2B, RG2A, RP2A, RB275, RBIAS, RK3B_BL, RG3A, RP3A, RG4A, RK4A, RK4A_BL, RFB, RP4A, RP4B, RP4C, RG4B, RK4B, RG5A, RG5B, RK5, RB300, RB250, RB220, RB215, RB190, RBOSC, R61, R62, R70]
    r1: [RLF, RG3B, RK3B, RP1B, RK1B]
    r2: [RP3B]
    r5: [RIN_SH, RK2B_F, RK2A, RK2A_F, REQ_LF, R64]
    c1: [C32, C35]
    c5: [C34, C36]
    pot: [RLEV, RPLAY, REQ_HI, R63]
    paper: [CMET1, CMET2, CC1A, CLF, CC2B, CHEAD, CC3B, CC3A, CG4B, CC4A, CC4B]
    electrolytic: [CB275, CB330, CB300, CB250, CB220, CB215, CB190, CBOSC]

devices:
  V1B: {device: 12AX7@1, tolerance: tube}
  V1A: {device: 12AX7@1, tolerance: tube}
  V2B: {device: 6201@1, tolerance: tube}
  V2A: {device: 6201@1, tolerance: tube}
  V3B: {device: 12AX7@1, tolerance: tube}
  V3A: {device: 12AX7@1, tolerance: tube}
  V4A: {device: 12AX7@1, tolerance: tube}
  V4B: {device: 12AX7@1, tolerance: tube}
  V5A: {device: 12AU7@1, tolerance: tube}
  V5B: {device: 12AU7@1, tolerance: tube}
  V6A: {device: 12AU7@1, tolerance: tube}
  V6B: {device: 12AU7@1, tolerance: tube}
  V7: {device: rectifier_tube, tolerance: tube}

sections:
  - title: power supply
    parts:
      # 6T4's HV halves from the mains (phase 90 / 270: a run starts at the peak), the 6X4
      # full-wave, then the RC chain (sch). Record mode: 3K1b shorts 3R54; 3K1c feeds the
      # record line (3R56, 3R57, 1R59) to the oscillator's and the head driver's B+.
      VHVA: {mains: [hv_a, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 90.0}
      VHVB: {mains: [hv_b, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 270.0}
      RPTA: {R: [hv_a, hv_ar], r: pt_r_half_ohm, tolerance: none}
      LPTA: {L: [hv_ar, hva], l: pt_leakage_h}
      RPTB: {R: [hv_b, hv_br], r: pt_r_half_ohm, tolerance: none}
      LPTB: {L: [hv_br, hvb], l: pt_leakage_h}
      CPTA: {C: [hva, "0"], c: pt_c_half_f, tolerance: none}
      CPTB: {C: [hvb, "0"], c: pt_c_half_f, tolerance: none}
      XV7A: {device: [hva, b330], model: V7}
      XV7B: {device: [hvb, b330], model: V7}
      CB330: {C: [b330, "0"], c: c_b330_f}
      RB300: {R: [b330, b300], r: r_b300_ohm}
      CB300: {C: [b300, "0"], c: c_b300_f}
      RB250: {R: [b300, b250], r: r_b250_ohm}
      CB250: {C: [b250, "0"], c: c_b250_f}
      RB220: {R: [b250, b220], r: r_b220_ohm}
      CB220: {C: [b220, "0"], c: c_b220_f}
      RB215: {R: [b250, b215], r: r_b215_ohm}
      CB215: {C: [b215, "0"], c: c_b215_f}
      RB190: {R: [b215, b190], r: r_b190_ohm}
      CB190: {C: [b190, "0"], c: c_b190_f}

  - title: microphone stage (idle)
    parts:
      # 1V1b, the microphone stage, is out of the signal path but draws its current from
      # the 220 V node: its grid on 6T1's secondary (to ground at DC), its plate load and
      # cathode resistor (sch).
      XV1B: {device: [p1b, g1b, k1b], model: V1B}
      RG1B: {R: [g1b, "0"], r: r_t1_sec_ohm, tolerance: none}
      RP1B: {R: [b220, p1b], r: r_p1b_ohm}
      RK1B: {R: [k1b, "0"], r: r_k1b_ohm}

  - title: record amplifier
    # The record side, from the input on: 20 steps per sample (3.84 MHz in production), with
    # the bias section below. 10 leaves a line near 96 kHz - f_osc in the noise (-86 dBFS with
    # the quartic peak finder; 20: -96): TAPE_PLAN.md "Gaps" 4.
    substeps: 20
    # trbdf2 with tube tables (TAPE_SPEED_PLAN.md P4): the floor holds (-113.7 dBFS line,
    # bound -89.4), closer to 40 substeps than esdirk4 (0.043 vs 0.061 dB in bands), the
    # record side ~1.9x cheaper.
    method: trbdf2
    tube_tables: true
    parts:
      # The unbalanced bridge (sch): 4R5 82K from the input into 4R4 20K + 4R3 100, their
      # junction to RECORD LEVEL's top, its wiper to 1V1a's grid.
      RIN_S: {R: [in, ib], r: r_in_series_ohm}
      RIN_SH: {R: [ib, ibf], r: r_in_shunt_ohm}
      RIN_F: {R: [ibf, "0"], r: r_in_foot_ohm, tolerance: none}
      RLEV: {pot: ["0", g1a, ib], r: record_level_pot_ohm, at: record_level}
      XV1A: {device: [p1a, g1a, k1a], model: V1A}
      RP1A: {R: [b220, p1a], r: r_p1a_ohm}
      RK1A: {R: [k1a, "0"], r: r_k1a_ohm}
      CMET1: {C: [p1a, met], c: c_meter_f}
      CMET2: {C: [p1a, met], c: c_meter_f}
      RMET: {R: [met, "0"], r: r_meter_ohm}
      CC1A: {C: [p1a, g2b], c: c_c1a_f}
      # 1V2b: the grid leak to the 1R16 / 1R17 junction; 1C7 (HI) or 1C46 (LOW) across
      # 1R17 through EQUAL SWITCH 4S2a, and 1R18 + 1C8 from the plate to ground: the record
      # pre-emphasis (sch).
      XV2B: {device: [p2b, g2b, k2b], model: V2B}
      RG2B: {R: [g2b, k2bj], r: r_g2b_ohm}
      RK2B: {R: [k2b, k2bj], r: r_k2b_ohm}
      RK2B_F: {R: [k2bj, "0"], r: r_k2b_foot_ohm}
      # 4S2a's contacts ground one trimmer's foot and leave the other's floating. Always in
      # the circuit, so a flip is a value change (a live stream updates in place).
      CEQ_HI: {C: [k2bj, eqh], c: rec_eq_hi_f, tolerance: none}
      RSEQ_HI: {rheostat: [eqh, "0"], r: r_contact_open_ohm, at: equalization, reverse: 1, tolerance: none}
      CEQ_LO: {C: [k2bj, eql], c: rec_eq_lo_f, tolerance: none}
      RSEQ_LO: {rheostat: [eql, "0"], r: r_contact_open_ohm, at: equalization, tolerance: none}
      RP2B: {R: [b250, p2b], r: r_p2b_ohm}
      RLF: {R: [p2b, lf], r: r_lf_ohm}
      CLF: {C: [lf, "0"], c: c_lf_f}

  - title: bias and head driver
    # Above the audio rate's Nyquist frequency: 20 steps per sample on a thread of its own,
    # trbdf2 with tube tables as the record amplifier (one part: they agree).
    substeps: 20
    method: trbdf2
    tube_tables: true
    parts:
      # The record line from the 330 V reservoir through 3K1c (3R56, 3R57) and 1R59 to
      # 1C2c, feeding the oscillator's centre tap and the head driver's 1R23 (sch).
      RREC: {R: [b330, brec], r: r_rec_line_ohm, tolerance: none}
      RBOSC: {R: [brec, bosc], r: r_bosc_ohm}
      CBOSC: {C: [bosc, "0"], c: c_bosc_f}
      # 1V2a, the head driver: 1C9 from 1V2b's plate, unbypassed cathode, grid leak to the
      # 1R21 / 1R22 junction, 1R19 from the 275 V node (1R23 from the record line), 1C10
      # into the head (sch).
      CC2B: {C: [p2b, g2a], c: c_c2b_f}
      XV2A: {device: [p2a, g2a, k2a], model: V2A}
      RG2A: {R: [g2a, k2aj], r: r_g2a_ohm}
      RK2A: {R: [k2a, k2aj], r: r_k2a_ohm}
      RK2A_F: {R: [k2aj, "0"], r: r_k2a_foot_ohm}
      RP2A: {R: [b275, p2a], r: r_p2a_ohm}
      RB275: {R: [bosc, b275], r: r_b275_ohm}
      CB275: {C: [b275, "0"], c: c_b275_f}
      CHEAD: {C: [p2a, rec], c: c_head_f}
      # 1V6: cathodes grounded, each plate on an end of 1T5's primary (centre tap on 1C2c),
      # cross-coupled to the other grid through 350 pF, .001 grid to grid, the grid leaks
      # to NOISE BALANCE's ends, its wiper grounded (sch). Removed (`oscillator` 0): no
      # tubes in the socket.
      SOSC:
        switch: oscillator
        parts:
          XV6A: {device: [p6a, g6a, "0"], model: V6A, in: [1]}
          XV6B: {device: [p6b, g6b, "0"], model: V6B, in: [1]}
      C35: {C: [p6b, g6a], c: c_cross_f}
      C32: {C: [p6a, g6b], c: c_cross_f}
      # A start state off the symmetric balance point, where a noiseless run would stay
      # (a real oscillator starts from its tubes' noise).
      C36: {C: [g6a, g6b], c: c_grids_f, v0: osc_kick_v}
      R61: {R: [g6a, nba], r: r_grid_ohm}
      R62: {R: [g6b, nbb], r: r_grid_ohm}
      R63: {pot: [nba, "0", nbb], r: noise_balance_ohm, at: noise_balance}
      # 1T5 as coupled inductors (provisional): the primary's halves, the erase winding
      # returned through 1R64 (sch).
      RT5A: {R: [p6a, t5a], r: t5_r_half_ohm, tolerance: none}
      LT5A: {L: [t5a, bosc], l: t5_l_half_h}
      RT5B: {R: [p6b, t5b], r: t5_r_half_ohm, tolerance: none}
      LT5B: {L: [bosc, t5b], l: t5_l_half_h}
      LT5S: {L: [sec, sr], l: t5_l_sec_h}
      RT5S: {R: [sr, ret], r: t5_r_sec_ohm, tolerance: none}
      KAB: {K: [LT5A, LT5B], k: t5_k}
      KAS: {K: [LT5A, LT5S], k: t5_k}
      KBS: {K: [LT5B, LT5S], k: t5_k}
      R64: {R: [ret, "0"], r: r_erase_meter_ohm}
      # Erase: ERASE ADJUST || 5C34 in series with the erase head; the bias line from the
      # erase head's hot end through 4R70 and BIAS ADJUST to the record head's B terminal.
      # 5C39 (33 pF across BIAS ADJUST) is left out, as the drawing's note allows ("C39
      # may be eliminated if necessary"): with it the provisional head is overbiased at
      # BIAS ADJUST's minimum.
      C33: {C: [sec, ers], c: erase_adjust_f, tolerance: none}
      C34: {C: [sec, ers], c: c_erase_fixed_f}
      LER: {L: [ers, erl], l: erase_l_h}
      RER: {R: [erl, "0"], r: erase_r_ohm, tolerance: none}
      R70: {R: [ers, bf], r: r_bias_feed_ohm}
      C13: {C: [bf, rec], c: bias_adjust_f, tolerance: none}
      # The record head (provisional coil) from B to A, then 5R24 BIAS CALIBRATION to
      # ground; the tape senses its current across the coil's resistance.
      LHEAD: {L: [rec, hra], l: rec_l_h}
      RHEAD: {R: [hra, rbc], r: rec_r_ohm, tolerance: none}
      RBIAS: {R: [rbc, "0"], r: r_bias_cal_ohm}

  - title: heads and tape
    parts:
      # The tape senses the record head (in the section above: its whole current, the
      # bias included, 20 samples per sample) and plays into 2R25 through the repro head
      # (sch); the repro coil is the part's.
      # The speed switch: the capstan motor's two windings. Each speed is its own tape
      # (the medium's cells are per bias wavelength): switching restarts it erased.
      STP:
        switch: speed
        parts:
          TP:
            tape: [hra, rbc, rh]
            component: tape_model
            bias_substeps: 20
            speed_m_s: speed_m_s
            f_bias_hz: f_bias_hz
            rec_gap_m: rec_gap_m
            rep_gap_m: rep_gap_m
            pole_m: pole_m
            relax_m: relax_m
            spacing_m: spacing_m
            track_m: track_m
            head_distance_m: head_distance_m
            rec_r_ohm: rec_r_ohm
            rec_h_per_a: rec_h_per_a
            rep_l_h: rep_l_h
            rep_r_ohm: rep_r_ohm
            rep_h_per_a: rep_h_per_a
            capstan_d_m: capstan_d_m
            capstan_rms: capstan_rms
            roller_d_m: roller_d_m
            roller_rms: roller_rms
            reel_r_m: reel_r_m
            reel_rms: reel_rms
            hunting_hz: hunting_hz
            hunting_q: hunting_q
            hunting_rms: hunting_rms
            scrape_span_m: scrape_span_m
            scrape_c_m_s: scrape_c_m_s
            scrape_q: scrape_q
            scrape_rms: scrape_rms
            cell_m: tape_cell_m
            in: [1]
          TP_LO:
            tape: [hra, rbc, rh]
            component: tape_model
            bias_substeps: 20
            speed_m_s: speed_lo_m_s
            f_bias_hz: f_bias_hz
            rec_gap_m: rec_gap_m
            rep_gap_m: rep_gap_m
            pole_m: pole_m
            relax_m: relax_m
            spacing_m: spacing_m
            track_m: track_m
            head_distance_m: head_distance_m
            rec_r_ohm: rec_r_ohm
            rec_h_per_a: rec_h_per_a
            rep_l_h: rep_l_h
            rep_r_ohm: rep_r_ohm
            rep_h_per_a: rep_h_per_a
            capstan_d_m: capstan_d_m
            capstan_rms: capstan_rms
            roller_d_m: roller_d_m
            roller_rms: roller_rms
            reel_r_m: reel_r_m
            reel_rms: reel_rms
            hunting_hz: hunting_hz
            hunting_q: hunting_q
            hunting_rms: hunting_rms
            scrape_span_m: scrape_span_m
            scrape_c_m_s: scrape_c_m_s
            scrape_q: scrape_q
            scrape_rms: scrape_rms
            cell_m: tape_cell_lo_m
            in: [0]

  - title: reproduce amplifier
    parts:
      # 2V3b: the head on its grid; the cathode lifted by 2R26 from the 190 V node; the
      # NAB feedback from 2V3a's plate to this cathode: 2R31 (HI) to a node joined to the
      # cathode by 2R29 in parallel with 2C15 (sch).
      RG3B: {R: [rh, "0"], r: r_g3b_ohm}
      XV3B: {device: [p3b, rh, k3b], model: V3B}
      RP3B: {R: [b190, p3b], r: r_p3b_ohm}
      RK3B: {R: [k3b, "0"], r: r_k3b_ohm}
      RK3B_BL: {R: [b190, k3b], r: r_k3b_bleed_ohm}
      REQ_LF: {R: [k3b, eqn], r: r_eq_lf_ohm}
      CEQ: {C: [k3b, eqn], c: c_eq_f, tolerance: none}
      REQ_HI: {rheostat: [eqn, p3a], r: r_eq_hi_ohm, at: rep_eq_hi}
      CC3B: {C: [p3b, g3a], c: c_c3b_f}
      # 2V3a: grid-leak bias, cathode grounded (sch).
      RG3A: {R: [g3a, "0"], r: r_g3a_ohm}
      XV3A: {device: [p3a, g3a, "0"], model: V3A}
      RP3A: {R: [b215, p3a], r: r_p3a_ohm}
      CC3A: {C: [p3a, pl], c: c_c3a_f}
      RPLAY: {pot: ["0", g4a, pl], r: playback_level_pot_ohm, at: playback_level}
      RG4A: {R: [g4a, "0"], r: r_g4a_ohm}

  - title: output
    parts:
      # 2V4a: its cathode lifted by 2R75 from the 250 V node and fed back from 6T3 through
      # 2R49. 2V4b: the self-balancing inverter, its grid driven from the plate loads'
      # common node through 2C18 (sch).
      XV4A: {device: [p4a, g4a, k4a], model: V4A}
      RK4A: {R: [k4a, "0"], r: r_k4a_ohm}
      RK4A_BL: {R: [b250, k4a], r: r_k4a_bleed_ohm}
      RFB: {R: [fbw, k4a], r: r_fb_ohm}
      RP4C: {R: [b250, n180], r: r_p4_common_ohm}
      RP4A: {R: [n180, p4a], r: r_p4_ohm}
      CP4A: {C: [p4a, "0"], c: c_p4a_f, tolerance: none}
      CG4B: {C: [n180, g4b], c: c_g4b_f}
      RG4B: {R: [g4b, "0"], r: r_g4b_ohm}
      XV4B: {device: [p4b, g4b, k4b], model: V4B}
      RK4B: {R: [k4b, "0"], r: r_k4b_ohm}
      RP4B: {R: [n180, p4b], r: r_p4_ohm}
      CC4A: {C: [p4a, g5a], c: c_c4_f}
      CC4B: {C: [p4b, g5b], c: c_c4_f}
