  # --- Heads and tape --------------------------------------------------------------------
  tape_model: {value: SCOTCH111@3, source: "config/components/scotch111/3.yaml (Scotch 111's particles, oriented, and its grain)"}
  speed_m_s: {value: 0.381, source: "man p10: 15 ips"}
  f_bias_hz: {value: 100.0e+3, source: "man p78: approximately 100 kc"}
  bias_a_m: {value: 59894.50528647803, source: "the first print's alignment at 15 ips on SCOTCH111@3 (varimu.devices.tape_machine.aligned: bias at the 500 Hz peak at 7.5 ips, man p82)", notes: "the medium's own bias until the oscillator's coupling is decided (TM5)"}
  rec_gap_m: {value: 12.7e-6, source: "provisional: web: ATR Master Tape sheet's test record gap 0.5 mil (the 351's isn't printed)"}
  rep_gap_m: {value: 6.35e-6, source: "man p70: typical playback gap .00025 inch"}
  pole_m: {value: 3.0e-3, source: "provisional: model knowledge (a 1950s ring head's pole faces, ~3 mm)"}
  relax_m: {value: 3.0e-3, source: "provisional: model knowledge (the head contour receding from the tape over a few mm)"}
  spacing_m: {value: 0.5e-6, source: "provisional: model knowledge (contact recording, 0.1-1 um)"}
  track_m: {value: 5.94e-3, source: "man p41: full track 234 mils"}
  head_distance_m: {value: 50.8e-3, source: "provisional: secondary sources (the 350 / 351 headblock's record-to-repro gap spacing ~2 in; data/schematics/ampex_351/README.md)"}
  rec_l_h: {value: 5.0e-3, source: "provisional: model knowledge (~300 turns, as rec_h_per_a implies, on a ring head of A_L ~ 50 nH; not printed)"}
  rec_r_ohm: {value: 100.0, source: "provisional: model knowledge (its winding, ~100 ohm)"}
  rec_h_per_a: {value: 2.0e+7, source: "provisional: model knowledge (~300 turns at 85% efficiency over the 12.7 um gap: a few mA of bias)"}
  rep_l_h: {value: 0.5, source: "provisional: model knowledge (a high-impedance repro head into a grid, ~0.5 H; not printed)"}
  rep_r_ohm: {value: 500.0, source: "provisional: model knowledge (its winding, ~500 ohm)"}
  rep_h_per_a: {value: 2.5e+8, source: "provisional: model knowledge (~2000 turns at 80% efficiency over the 6.35 um gap)"}

  # --- 2V3b, 12AX7: playback EQ (sch) ------------------------------------------------------
  r_g3b_ohm: {value: 330.0e+3, source: "sch: 2R25 330K 1%, the head's load"}
  r_p3b_ohm: {value: 330.0e+3, source: "sch: 2R27 330K 2% WW"}
  r_k3b_ohm: {value: 1500, source: "sch: 2R28 1500 1% WW"}
  r_k3b_bleed_ohm: {value: 470.0e+3, source: "sch: 2R26 470K 1W, from the 190 V node to the cathode"}
  r_eq_lf_ohm: {value: 8.2e+6, source: "sch: Table 1 NAB, 2R29 8.2 MEG (board 30960-01-03)"}
  c_eq_f: {value: 750.0e-12, source: "sch: Table 1 NAB, 2C15 750 pF"}
  r_eq_hi_ohm: {value: 100.0e+3, source: "sch: 2R31 100K (HI)"}
  c_c3b_f: {value: 0.02e-6, source: "sch: 2C14 .02 500V"}

  # --- 2V3a, 12AX7 (sch) -----------------------------------------------------------------
  r_g3a_ohm: {value: 10.0e+6, source: "sch: 2R33 10MEG (grid-leak bias: the cathode is grounded)"}
  r_p3a_ohm: {value: 220.0e+3, source: "sch: 2R34 220K"}
