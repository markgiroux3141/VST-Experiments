# Ampex 351 tape recorder electronics (catalog 02-30960, the 7-1/2 / 15 ips board
# 30960-01-03) with its tape, as a circuit file (docs/TAPE_PLAN.md, TM5).
# Built by varimu/circuit/builder.py (the format: varimu/circuit/spec.py, builder.py).
#
# Sources (data/schematics/ampex_351/README.md has their provenance):
#   "sch: ..."         printed on the 1962 manual's schematic, p95 (8-23/8-24), designators
#                      as printed (the first digit is the location: 1 record board, 2
#                      reproduce board, 3 power supply board, 4-6 chassis)
#   "man: ..."         the 1962 manual's text, specs and alignment (pages as in the README)
#   "web: <url> ..."   a published figure
#   "derived: ..."     arithmetic on sourced figures
#   "provisional: ..." model knowledge; a genome parameter or replaced later
#
# The machine as wired for recording and playing back at once (record relay 3K1
# energized: 3K1b shorts 3R54, 3K1c feeds the record B+ line), 15 or 7-1/2 ips (`speed`: the
# transport's two-speed capstan motor; EQUAL SWITCH 4S2, `equalization`, picks the record HF
# trimmer: 1C7 at HI, 1C46 at LOW; on this board the playback EQ is 2R31 at both, its LOW
# rheostat 2R30 a jumper, sch Table 1), NAB, the UNBALANCED BRIDGE input (4S1: 4R5 / 4R4 / 4R3 into RECORD LEVEL, the
# input transformer 6T1 and the first stage 1V1b out of the path), the line output into
# 600 ohm. Not modeled: the microphone input (6T1, 1V1b), the meter and its switch (4S3,
# 4M1, the VU network 6R51-6R53, 1C3 / 4R12's wiper), the monitor and phones jacks,
# the record light, the heaters (1V1, 1V2, 2V3 on 12.6 V DC from a selenium bridge; 2V4,
# 2V5, 1V6 on 12.6 V AC), the slave / master bias-coupling relay 4K3, the CCIR network
# (1L1, 1C11, 4S2b: on CCIR boards only).
#
# **The bias is literal** (TM5's decision, the user's, 2026-11-01: option A). The record
# side runs at 20 steps per sample (3.84 MHz at production's 192 kHz, circuitsim's
# multi-rate partition, on a thread of its own): the record amplifier from the input on,
# the 12AU7 push-pull bias / erase oscillator 1V6 and 1T5, the erase head tuned by ERASE
# ADJUST, the bias through BIAS ADJUST into the record head, the 6201 head driver on the
# same head through 1C10, and the record line that feeds both. It meets the rest (the
# supply, the reproduce side, the tape) only at the supply's reservoirs (330, 250, 220 V):
# a signal path cut through a coupling capacitor isn't stable with a sample's lag. The tape senses the record head's whole current there, bias
# included, and records at its extrema (`TapeStream`'s literal mode). 1T5 and the heads
# aren't printed: provisional (TAPE_PLAN.md, TM5's status; the bias section was measured
# on its own in config/circuits/ampex_351_bias.yaml).

title: "Ampex 351"
input: in
probes: [out, rec, rh, rbc, ers, p6a, p6b, g6a, g6b, sec, brec, g1a, g2b, g2a, g3a, g5a, g5b, b330, b300, b275, b250, b220, b215, b190, n180, bosc, p1b, k1b, p1a, k1a, p2b, k2b, p2a, k2a, p3b, k3b, p3a, g4a, p4a, k4a, p4b, k4b, p5a, p5b, k5, fbw]
# 0 VU in is the bridging input's operating level, -10 dBm (man p11: "bridge 200 k / 100
# k, -10 dBm"); 0 VU out is +8 dBm into 600 ohm (man p11, p79). Both at -18 dBFS rms (the
# prints' convention, TAPE_PLAN.md).
full_scale:
  input_volts_peak: {value: 1.9461, source: "derived: -10 dBm (0.2449 V rms, man p11) at -18 dBFS rms: 0.2449 x 10^(18/20)"}
  output_volts_peak: {value: 15.488, source: "derived: +8 dBm into 600 ohm (1.949 V rms, man p11 / p79: 0 VU = +8 dBm) at -18 dBFS rms"}

controls:
  # The front panel and the alignment's adjustments (rotations 0..1 unless stated). The
  # alignment (man p79-85) sets the trimmers; the panel's knobs are the operator's.
  record_level: {value: 1.0, min: 0.0, max: 1.0, unit: rotation, source: "sch: 4R9 RECORD LEVEL 100K", notes: "the alignment sets it for 0 VU in at the operating level (1% THD at 400 Hz)"}
  playback_level: {value: 1.0, min: 0.0, max: 1.0, unit: rotation, source: "sch: 4R36 PLAYBACK LEVEL 250K", notes: "the alignment sets it for 0 VU (+8 dBm) out at the operating level"}
  rec_eq_hi_f: {value: 330.0e-12, min: 100.0e-12, max: 550.0e-12, unit: F, source: "sch: 1C7, the 15 ips record HF trimmer, 100-550 pF on board 30960-01-03 (Table 1 NAB)", notes: "across 1R17 (via 4S2a HI): less cathode feedback above ~1 / (2 pi 47K C); the alignment sets it"}
  rec_eq_lo_f: {value: 1000.0e-12, min: 550.0e-12, max: 1600.0e-12, unit: F, source: "sch: 1C46, the 7-1/2 ips record HF trimmer, 550-1600 pF on board 30960-01-03 (Table 1 NAB)", notes: "across 1R17 (via 4S2a LOW); the alignment sets it for the flattest response at 7-1/2 ips, 20 dB under operating level (man p83-84)"}
  speed: {value: 1, choices: [0, 1], unit: position, source: "man p10, p51-52: the 7-1/2 / 15 ips pair; the hysteresis synchronous capstan motor B501's two windings (its poles switched), the capstan its shaft", notes: "0 LOW 7-1/2 ips, 1 HI 15 ips; a switch changes the tape (the medium restarts erased)"}
  equalization: {value: 1, choices: [0, 1], unit: position, source: "sch: EQUAL SWITCH 4S2 (4S2a: 1C46 LOW / 1C7 HI across 1R17)", notes: "0 LOW (7-1/2 ips), 1 HI (15 ips); set with the speed (the manual's), or against it"}
  rep_eq_hi: {value: 0.67, min: 0.0, max: 1.0, unit: rotation, source: "sch: 2R31, the 15 ips playback HF rheostat, 100K", notes: "0.67 is 50 us with 2C15 (derived: 50 us / 750 pF = 66.7K); the alignment sets it from a test tape (man p80)"}
  oscillator: {value: 1, choices: [0, 1], unit: position, source: "sch: note 6 (the drawing's DC voltages were measured with the oscillator tube 1V6 removed)", notes: "0 removed (the drawing's measuring condition: no bias, no erase), 1 in its socket"}
  bias_adjust_f: {value: 24.0e-12, min: 15.0e-12, max: 130.0e-12, unit: F, source: "sch: 5C13 BIAS ADJUST 15-130 pF", notes: "24 pF gives 2.86 mA peak in the provisional head, about what the tape's alignment needs (scripts/tape_bias_study.py); the alignment sets it"}
  erase_adjust_f: {value: 300.0e-12, min: 100.0e-12, max: 550.0e-12, unit: F, source: "sch: 5C33 ERASE ADJUST 100-550 pF"}
  noise_balance: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "sch: 1R63 NOISE BALANCE 10K", notes: "the bias's +/- symmetry: +-1.05 dB at the ends (scripts/tape_bias_study.py)"}
  mains_v_rms: {value: 117.0, min: 105.0, max: 125.0, unit: V, source: "sch: note 6, voltages measured at a 117 V line"}
  mains_hz: {value: 60.0, min: 50.0, max: 60.0, unit: Hz, source: "man p11 (60 cycle machines; 50 cycle versions exist)"}

