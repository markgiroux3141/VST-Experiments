  # --- Heads and tape --------------------------------------------------------------------
  tape_model: {value: SCOTCH111@3, source: "config/components/scotch111/3.yaml (Scotch 111's particles, oriented, and its grain)"}
  speed_m_s: {value: 0.381, source: "man p10: 15 ips"}
  speed_lo_m_s: {value: 0.1905, source: "man p10: 7-1/2 ips (the motor's other winding: half the synchronous speed, the same capstan)"}
  f_bias_hz: {value: 100.0e+3, source: "man p78: approximately 100 kc", notes: "the oscillator's nominal frequency: sets the tape's cells (7.62 per bias wavelength); the bias itself is the circuit's"}
  rec_gap_m: {value: 51.0e-6, source: "provisional: data/datasheets/tape/3m_Sound_Talk_21_195302.pdf (Sound Talk No. 21, 1953: the Ampex 300's record gap .002 inch); data/schematics/ampex_351/350heads.pdf (Minneapolis Magnetics fits one replacement head to the 300 / 350 / 400); the 351's isn't printed. 12.7 um gave a harder knee (TAPE_PLAN.md Gaps 4, scripts/tape_heads_study.py)"}
  rep_gap_m: {value: 6.35e-6, source: "man p70: typical playback gap .00025 inch"}
  pole_m: {value: 1.5e-3, source: "calibrated: the repro contour (with relax_m) that puts the aligned machine within +-1.5 dB 30 Hz-1 kHz with its electronics, the 351's +-2 dB at 15 ips (man p10; scripts/tape_heads_study.py, TAPE_PLAN.md Gaps 4); near a measured long-pole head, web: https://www.discolathe.com/.pdfs/Nortronics_Silvr_pp1-9.pdf (Nortronics WP series, Fig. 3: 1.25 mm / 4.0 mm fitted). Both heads' (the record head's contour is far below the zone's floor)"}
  relax_m: {value: 5.5e-3, source: "calibrated: with pole_m (see there); 3 mm / 3 mm dipped -4.3 dB at 70 Hz"}
  spacing_m: {value: 0.5e-6, source: "provisional: model knowledge (contact recording, 0.1-1 um)"}
  tape_cell_m: {value: 0.25e-6, source: "numerical: the tape's cells at 15 ips, 0.25 um (15.24 per nominal bias wavelength), not 7.62 (0.5 um): with the literal bias the cells point-sample the pattern of the field's peaks (two per bias cycle, ~2 um apart on tape) and alias it to |8 f_b - v / ds|; the oscillator runs at ~93 kHz, which put that at ~18 kHz, -68 dB re a hot tone, on 0.5 um cells (docs/TAPE_PLAN.md Gaps 8; scripts/chirp_alias_map.py, chirp_medium.py); 0.25 um was within 0.3 dB of 0.5 um on No. 21 (docs/TAPE_PLAN.md TM2 step 7); the deck's value (scripts/make_ampex_300_4.py)"}
  tape_cell_lo_m: {value: 0.125e-6, source: "numerical: tape_cell_m's cells per bias wavelength at 7-1/2 ips (the alias depends on v / ds: 0.25 um there aliased as 0.5 um does at 15 ips; scripts/chirp_medium.py --machines 351lo)"}
  track_m: {value: 5.94e-3, source: "man p41: full track 234 mils"}
  head_distance_m: {value: 50.8e-3, source: "provisional: secondary sources (the 350 / 351 headblock's record-to-repro gap spacing ~2 in; data/schematics/ampex_351/README.md)"}
  rec_l_h: {value: 3.0e-3, source: "provisional: model knowledge (~480 turns, as rec_h_per_a implies at 85% over the 51 um gap, on a ring head of A_L ~ 12.5 nH (50 nH at 12.7 um: L ~ N^2 / g); not printed; web: Nortronics' notes give record heads 2-50 mH, see pole_m)"}
  rec_r_ohm: {value: 160.0, source: "provisional: model knowledge (its winding: ~480 turns, the length of a ~100 ohm 300-turn coil scaled)"}
  rec_h_per_a: {value: 8.0e+6, source: "calibrated: operating level at ~0.39 mA rms of audio in the head (the drawing's ~0.5 within 2 dB, sch p95; RECORD LEVEL near its top, as aligned with the 12.7 um gap: a 51 um gap records at 0.40x the deep-gap field, scripts/tape_heads_study.py); consistent with No. 21's fitted 6.7e6 A/m per A for the Ampex 300's 51 um head (TAPE_PLAN.md TM2 step 7, scripts/tape_switching_study.py; whether its mA are rms or peak is unprinted)"}
  rep_l_h: {value: 0.5, source: "provisional: model knowledge (a high-impedance repro head into a grid, ~0.5 H; not printed)"}
  rep_r_ohm: {value: 500.0, source: "provisional: model knowledge (its winding, ~500 ohm)"}
  # Calibrated, not printed: the drawing's signal voltages were taken 8.2 dB under the
  # operating level (its mic input -80 dB re 0.78 V against the 200 uV, -71.8 dB, the
  # manual's operating-level sensitivity at full RECORD LEVEL, man p11), and print -68 dB
  # at the playback head. Model knowledge's ~2000 turns (2.5e8) read the operating level
  # (~230 nWb/m) 19 dB hotter, overdriving 2V3 (+0.3% h2 at 0 VU; TAPE_PLAN.md TM5).
  rep_h_per_a: {value: 2.46e+7, source: "derived: the drawing's -68 dB (re 0.78 V) at the playback head, 500 Hz, 8.2 dB under the operating level (sch p95, man p11), on the aligned machine (varimu.measure.tape_align: 2.9e7 read -58.4 dB at operating level, 1.4 dB over)"}

  # --- The transport: wow and flutter (TAPE_PLAN.md TM3) ----------------------------------
