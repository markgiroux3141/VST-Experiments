  r_in_shunt_ohm: {value: 20.0e+3, source: "sch: 4R4 20K 5%"}
  r_in_foot_ohm: {value: 100, source: "sch: 4R3 100"}
  record_level_pot_ohm: {value: 100.0e+3, source: "sch: 4R9 100K"}

  # --- 1V1b, 12AX7: the microphone stage, for its idle current (sch) ---------------------
  r_t1_sec_ohm: {value: 1000, source: "provisional: model knowledge (6T1's secondary DCR, ~1 k; only its DC path matters here)"}
  r_p1b_ohm: {value: 100.0e+3, source: "sch: 1R6 100K 1%"}
  r_k1b_ohm: {value: 2700, source: "sch: 1R7 2700 1%"}

  # --- 1V1a, 12AX7 (sch) ---------------------------------------------------------------
  r_p1a_ohm: {value: 100.0e+3, source: "sch: 1R10 100K"}
  r_k1a_ohm: {value: 3300, source: "sch: 1R11 3300, unbypassed"}
  c_meter_f: {value: 0.02e-6, source: "sch: 1C3 .02 500V and 1C4 .02 500V, each from 1V1a's plate to RECORD CALIBRATE 4R12"}
  r_meter_ohm: {value: 250.0e+3, source: "sch: 4R12 RECORD CALIBRATE 250K (its wiper to the meter, not modeled)"}
  c_c1a_f: {value: 0.02e-6, source: "sch: 1C5 .02 500V"}

  # --- 1V2b, 6201: record pre-emphasis (sch) ----------------------------------------------
  r_g2b_ohm: {value: 1.0e+6, source: "sch: 1R15 1MEG, to the 1R16 / 1R17 junction"}
  r_k2b_ohm: {value: 1500, source: "sch: 1R16 1500"}
  r_k2b_foot_ohm: {value: 47.0e+3, source: "sch: 1R17 47K 5%"}
  r_p2b_ohm: {value: 330.0e+3, source: "sch: 1R14 330K"}
  r_lf_ohm: {value: 150.0e+3, source: "sch: Table 1 NAB, 1R18 150K 1% (both boards)"}
  c_lf_f: {value: 0.02e-6, source: "sch: Table 1 NAB, 1C8 .02 5% (both boards)"}
  c_c2b_f: {value: 0.02e-6, source: "sch: 1C9 .02"}
  r_contact_open_ohm: {value: 1.0e+10, source: "provisional: model knowledge (an open switch contact's insulation, 1e10-1e12 ohm; closed it is a pot's end, MIN_R_OHM)"}

  # --- 1V2a, 6201: the head driver (sch) ---------------------------------------------------
  r_g2a_ohm: {value: 1.0e+6, source: "sch: 1R20 1MEG, to the 1R21 / 1R22 junction"}
  r_k2a_ohm: {value: 220, source: "sch: 1R21 220 5%"}
  r_k2a_foot_ohm: {value: 2200, source: "sch: 1R22 2200 5%"}
  r_p2a_ohm: {value: 22.0e+3, source: "sch: 1R19 22K 1W"}
  r_b275_ohm: {value: 8200, source: "sch: 1R23 8200, from the record B+ line"}
  c_b275_f: {value: 20.0e-6, source: "sch: 1C2b 20 450V"}
  c_head_f: {value: 0.47e-6, source: "sch: 1C10 .47"}
