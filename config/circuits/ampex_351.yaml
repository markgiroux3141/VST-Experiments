  c_c4_f: {value: 0.02e-6, source: "sch: 2C19, 2C21 .02 500V"}
  r_g5_ohm: {value: 1.0e+6, source: "sch: 2R44, 2R45 1MEG"}

  # --- 1V5 (sch: 2V5), 12AU7 push-pull output and 6T3 -------------------------------------
  r_k5_ohm: {value: 1000, source: "sch: 2R46 1000, the common cathode, unbypassed"}
  r_load_ohm: {value: 600, source: "sch: note 6 / circuit conditions: the line output terminated in 600 ohm (man p11: 600 ohm line)"}
