  ot_fb_per_half: {value: 0.216, source: "derived: calibrated to the drawing's signal voltages, 29 dB from 2V4a's grid (-21) to the line output (+8) at 500 Hz (11.7 dB of feedback; TAPE_PLAN.md TM5)"}
  ot_core_material: {value: grain_oriented_si_steel, source: "provisional: model knowledge (silicon-steel laminations; the only silicon steel in config/magnetics.yaml)"}
  ot_core_area_m2: {value: 2.0e-4, source: "provisional: model knowledge (a ~1-2 W line output transformer, ~1/2 in tongue, 5/8 in stack)"}
