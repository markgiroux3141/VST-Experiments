  ot_c_half_f: {value: 100.0e-12, source: "provisional: model knowledge (self-capacitance of a primary half)"}

  # --- Power supply (sch; 6T4 a part number only) ----------------------------------------
  pt_hv_half_rms_v: {value: 262.0, source: "derived: calibrated to the drawing's 330 V at the 6X4's cathode with the oscillator removed (scripts/calibrate_351_psu.py)"}
  pt_r_half_ohm: {value: 150.0, source: "provisional: model knowledge (a small mains transformer's HV half plus its share of the primary)"}
  pt_leakage_h: {value: 10.0e-3, source: "provisional: model knowledge (leakage per HV half)"}
  pt_c_half_f: {value: 300.0e-12, source: "provisional: model knowledge (self-capacitance per HV half; a capacitance on every rectifier node, CLAUDE.md)"}
