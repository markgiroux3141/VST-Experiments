  playback_level_pot_ohm: {value: 250.0e+3, source: "sch: 4R36 PLAYBACK LEVEL 250K"}
  r_g4a_ohm: {value: 1.0e+6, source: "sch: 2R37 1MEG"}

  # --- 2V4, 12AX7: amplifier and self-balancing paraphase inverter (sch) -------------------
  r_k4a_ohm: {value: 1500, source: "sch: 2R38 1500"}
