sections:
- title: line
  parts:
    Rsrc:
      R:
      - in
      - in_s
      r: source_impedance_ohm
      tolerance: none
    Rload:
      R:
      - out
      - '0'
      r: load_ohm
      tolerance: none
    SKEY:
      switch: filter_in
      parts:
        RKEY_I:
          R:
          - in_s
          - f_in
          r: contact_ohm
          tolerance: none
          in:
          - 1
        RKEY_O:
          R:
          - f_out
          - out
          r: contact_ohm
          tolerance: none
          in:
          - 1
        RKEY_BY:
          R:
          - in_s
          - out
          r: contact_ohm
          tolerance: none
          in:
          - 0
    RLK_I:
      R:
      - f_in
      - '0'
      r: numerical_leak_ohm
      tolerance: none
    RLK_O:
      R:
      - f_out
      - '0'
      r: numerical_leak_ohm
      tolerance: none
