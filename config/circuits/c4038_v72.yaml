sections:
- title: 'STC / Coles 4038: ribbon'
  parts:
    RB_c4038:
      ribbon_motor:
      - in
      - p_rear
      - rp_c4038
      - rm_c4038
      component: ribbon_model_c4038
    RRL_c4038:
      R:
      - rm_c4038
      - '0'
      r: ribbon_leak_ohm_c4038
      tolerance: none
- title: 'STC / Coles 4038: transformer'
  parts:
    T1_c4038:
      transformer:
        p:
          nodes:
          - rm_c4038
          - rp_c4038
        s:
          nodes:
          - '0'
          - ia_v72
      component: transformer_model_c4038
- title: cable
  parts:
    CCABLE:
      C:
      - ia_v72
      - '0'
      c: cable_c_f
      tolerance: none
- title: 'Telefunken V72: power supply'
  parts:
    VT4_v72:
      mains:
      - hv1_v72
      - hvb_v72
      v_rms: t4_hv_rms_v_v72
      phase_deg: 90.0
    RT4_v72:
