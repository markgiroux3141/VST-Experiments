# Shure SM57 dynamic microphone, old era (docs/SM57_PLAN.md: the dual-impedance transformer,
# as shipped until the 1986-88 change). Built by varimu/circuit/builder.py (the format:
# varimu/circuit/spec.py, builder.py).
#
# Sources (data/schematics/shure_sm57/README.md has their provenance):
#   "s68: ..."   Shure data sheet 27A308 (2-68), Figure A (internal connections)
#   "cj06: ..."  CJ's bench measurements of a 1990 SM57's transformer (GroupDIY, forum)
#   "psw17: ..." an old dual-impedance SM58's winding resistances (ProSoundWeb, forum)
#   "derived: ..." arithmetic on sourced figures
#   "provisional: ..." model knowledge; replaced when SM5 designs the transformer
#
# The cartridge R57 (config/components/r57/): the pressure at its front entry on `in`, at
# its rear entries on the control input `p_rear` (pascals as volts; varimu/mics/). Its coil
# (s68 Figure A: GREEN, the coded terminal, and YELLOW) drives the transformer's primary;
# the secondary's BLUE end is pin 2 (`out`), its RED end (the whole winding, 'H', 150-250
# ohm) or ORANGE tap ('L', 30-50 ohm) is pin 3, here the measuring ground; "positive
# pressure produces positive voltage at pin 2 with respect to pin 3" (s68). The coil and
# primary float (BLACK is the cartridge's ground to the case): a numerical leak holds them.
# The output is open circuit, as the data sheet's figures; a chain replaces RLOAD with the
# preamp's input.

title: "Shure SM57"
input: in
cv_inputs:
  p_rear: p_rear
probes: [out, cp, cm]
# 0 dBFS in = 20 Pa peak at the capsule (117 dB SPL for a sine, as the U47's); out = volts
# across the load.
full_scale:
  input_volts_peak: {value: 20.0, source: "provisional: MIC_ROOM_PLAN.md's proposed source convention (0 dBFS = 20 Pa peak; as neumann_u47.yaml)"}
  output_volts_peak: {value: 0.1, source: "provisional: model knowledge (s68 'H' 0.149 mV/ubar = 1.49 mV/Pa x 20 Pa = 30 mV peak, with headroom for the presence peak and proximity)"}

controls:
  impedance: {value: 0, choices: [0, 1], unit: position, source: "s68: 'Impedance: Dual. 30-50 ohms and 150-250 ohms. (Connected for 150-250 ohms when shipped)'", notes: "0 'H' 150-250 ohm (RED to pin 3), 1 'L' 30-50 ohm (ORANGE to pin 3)"}

values:
  cartridge_model: {value: R57@2, source: "s68 / g25: the Unidyne III cartridge (Shure's replacement R57); config/components/r57/2.yaml (its geometry provisional and fitted by scripts/fit_sm57.py on the mic's body, varimu/mics/bor.py: data/schematics/shure_sm57/README.md; R57@1 was fitted on a sphere)"}
  coil_leak_ohm: {value: 1.0e+9, source: "numerical: a DC path for the floating coil and primary"}

  # --- The output transformer (version 1: no original construction; README 'The electrical side')
  t_r_pri_ohm: {value: 1.50, source: "cj06: 'Pri- DCR - 1.50 ohms' (a 1990 SM57)"}
  t_turns: {value: 150, source: "provisional: model knowledge (a small mic transformer's primary; with the core below the gap gives cj06's 386 mH)", notes: "the primary (the reference winding)"}
  t_ratio_h: {value: 4.53, source: "cj06: 'Turns Ratio: 1:4.53' (the full secondary)"}
  t_ratio_l: {value: 2.22, source: "derived: s68's open-circuit voltages 'L' .067 mv / 'H' .149 mv = 0.450 of the full secondary's 4.53 turns ratio (the tap from the BLUE end: psw17's 10.8 of 25.7 ohms is the shorter, inner part)"}
  t_ratio_rest: {value: 2.31, source: "derived: 4.53 - 2.22 (cj06, s68)"}
  t_r_tap_ohm: {value: 10.8, source: "psw17: an old dual-impedance SM58, 'the 50 ohm side measured 10.8 ohms'"}
  t_r_rest_ohm: {value: 14.9, source: "derived: psw17's '150 ohm side measured 25.7 ohms' less the tap's 10.8"}
  t_leakage_h: {value: 150.0e-6, source: "cj06: 'Leakage - 150 uH' (primary side, secondary shorted)"}
  t_c_sec_f: {value: 50.0e-12, source: "provisional: model knowledge (a few hundred fine turns' self-capacitance; cj06: 'Starts to droop before 20 K')"}
  t_core_material: {value: mumetall, source: "provisional: model knowledge (a nickel-alloy core for a microphone transformer at tiny flux; cj06: 'ratio changes ... as the level goes up ... probably the core', the low-field permeability rising: the Rayleigh region)"}
  t_core_area_m2: {value: 4.0e-5, source: "provisional: model knowledge (a ~6.3 mm limb: the transformer sits in the SM57's ~23-32 mm handle, s68 Figure C)"}
  t_core_path_m: {value: 0.040, source: "provisional: model knowledge (a small EI core's mean path)"}
  t_gap_m: {value: 1.563e-6, source: "derived: cj06's 386 mH primary in the core's linear limit with 150 turns (parts.turns_for_inductance inverted)"}
  load_ohm: {value: 1.0e+6, source: "s68: the sensitivity is open-circuit voltage (a chain replaces the load with its preamp)"}
  min_ohm: {value: 1.0e-3, source: "numerical: the impedance switch's closed contact"}

# No tolerance block: the nominal mic only (docs/SM57_PLAN.md Decisions 5).

sections:
  - title: cartridge
    parts:
      MC:
        moving_coil: [in, p_rear, cp, cm]
        component: cartridge_model
      RCL: {R: [cm, "0"], r: coil_leak_ohm, tolerance: none}

  - title: transformer
    parts:
      T1:
        transformer:
          p: {nodes: [cp, cm], r: t_r_pri_ohm}
          s1: {nodes: [out, tap], ratio: t_ratio_l, r: t_r_tap_ohm, c: t_c_sec_f}
          s2: {nodes: [tap, red], ratio: t_ratio_rest, r: t_r_rest_ohm}
        core: {material: t_core_material, area_m2: t_core_area_m2, path_m: t_core_path_m, gap_m: t_gap_m}
        turns: t_turns
        leakage_h: t_leakage_h
      SIMP:
        switch: impedance
        parts:
          RH: {R: [red, "0"], r: min_ohm, tolerance: none, in: [0]}
          RL: {R: [tap, "0"], r: min_ohm, tolerance: none, in: [1]}
      RLOAD: {R: [out, "0"], r: load_ohm, tolerance: none}
