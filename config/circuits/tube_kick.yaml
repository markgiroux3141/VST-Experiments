# A tube kick drum (docs/TUBE_SYNTH_PLAN.md, S5's status, "A tube kick"): the tube synth's
# reactor-tuned oscillator, running all the time, with a pitch sweep and a decaying VCA
# keyed by the keyboard bus, on the synth's supply. A struck tank (an 808's way) lost its
# energy in the cores' bias while the pitch fell (a 20 ms thud); a sustained oscillator
# keeps its amplitude, so the sweep and the decay are separate controls.
#   O...  the oscillator, its pitch driver and its WAVE pot, as in tube_synth.yaml (its LOW
#        range's 224 nF fixed)
#   TUNE  a pot on a divider from a 5651 (VRT, ~-87 V off the -100 V rail): the 6V6GT's grid
#        at rest, ~50-130 Hz. On the -45 V rail the VCA's tail current sagged it and the
#        pitch rose ~2 semitones while a hit sounded
#   sweep a key's edge pumps SE through a 6X4 section (CSW, 10x SE's capacitor, from ground);
#        SWEEP TIME discharges it. The DEPTH pot's share of it adds to the 6V6GT's grid
#        through 2.2M: ~3x the pitch at the hit at DEPTH 0.4. A key up's negative edge is
#        blocked, so a short tap doesn't cut the sweep
#   decay a key's edge, differentiated (CPU), lifts the grid of a 12AU7 cathode follower (its
#        plate on a ~+55 V tap, so it idles only a few volts above its grid), which charges
#        the envelope CE through a 6X4 section toward the clamp at 0 V, then lets go;
#        DECAY discharges it toward the -100 V rail. The charge comes from b3, not the bias
#        supply (a pump from the bus dumped ~1 mC per hit into the -100 V rail: a thump),
#        and a key up's edge is blocked: the hit decays as an 808's does
#   VCA  a 12AU7 cathode-coupled pair (VA/VB, on their own RC supply), the oscillator into
#        VA's grid; its tail a third section (VT) whose grid is 0.8 of the envelope, closed
#        at rest (the oscillator ~-92 dB under a hit). The tail current's swing is common
#        mode at the plates; a 12AX7 differential stage (VDA/VDB, its own RC supply) on a
#        12AU7 current sink (VCS, its grid on TUNE's 5651 through an RC) takes their
#        difference, so the thump cancels
#   TONE  a low-pass after the VCA, for the waveform's harmonics and the hit's click: a 12AX7
#        cathode follower with two RC sections around it (Sallen-Key, unity gain, 12 dB per
#        octave), C1 / C2 ~5.5 for a slight bump at the cutoff (~1.5 dB). The legs are the
#        TONE pot's two gangs (reverse audio taper: clockwise brighter, evenly in log); the
#        first's fixed part is the differential stage's plate (~55k), the second's RF2M, so
#        the legs match. -3 dB from ~50 Hz (0) to ~1.2 kHz (1), ~390 Hz at the middle. The
#        follower's cathode is the output
# Invented circuit, not modelled hardware: round numbers, every value a design choice.

title: "Tube kick (oscillator, sweep, decaying VCA)"
input: in
cv_inputs:
  gate: bus
probes: [out, o_t, o_g4, se, e, kc, b1, b3]

full_scale:
  input_volts_peak: {value: 1.0, source: "provisional: model knowledge (the audio input is unused: the oscillator is the source)"}
  output_volts_peak: {value: 12.0, source: "provisional: model knowledge (design: the differential stage's plate through COUT: a hit peaks ~7 V at the defaults, ~17 V at full DEPTH; set from renders, 2026-10-30)"}

controls:
  tune: {value: 0.1, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the TUNE pot, the oscillator's pitch at rest)"}
  depth: {value: 0.4, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the DEPTH pot, the pitch sweep's height)"}
  sweep_time: {value: 0.3, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the SWEEP TIME rheostat)"}
  tone: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the TONE pot, a dual-gang reverse-audio-taper pot setting the low-pass's cutoff: -3 dB at ~50 Hz (0), ~155 Hz (0.25), ~390 Hz (0.5), ~800 Hz (0.75), ~1.2 kHz (1))"}
  decay: {value: 0.6, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the DECAY rheostat)"}
  wave: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the oscillator's WAVE pot, tank (0) to square (1))"}
  mains_v_rms: {value: 120.0, min: 105.0, max: 127.0, unit: V, source: "provisional: model knowledge (US line voltage)"}
  mains_hz: {value: 60.0, min: 50.0, max: 60.0, unit: Hz, source: "provisional: model knowledge (US mains)"}

values:
  # --- supply (tube_synth.yaml's)
  pt_hv_half_rms_v: {value: 250.0, source: "provisional: model knowledge (design: a small power transformer's HV half)"}
  pt_r_half_ohm: {value: 150.0, source: "provisional: model knowledge (a ~25 W transformer's HV half with the primary referred)"}
  pt_leakage_h: {value: 10.0e-3, source: "provisional: model knowledge (leakage per HV half of a small mains transformer)"}
  pt_c_half_f: {value: 300.0e-12, source: "provisional: model knowledge (self-capacitance per HV half; a capacitance on every rectifier node)"}
  rectifier_tube: {value: 6X4@1, source: "provisional: model knowledge (design: a 6X4 full-wave rectifier)"}
  c_reservoir_f: {value: 20.0e-6, source: "provisional: model knowledge (reservoir and filter electrolytics, 20 uF 450 V)"}
  r_b12_ohm: {value: 1.0e+3, source: "provisional: model knowledge (filter resistor b1 to b2)"}
  r_b23_ohm: {value: 2.2e+3, source: "provisional: model knowledge (filter resistor b2 to b3)"}
  c_decouple_f: {value: 47.0e-6, source: "provisional: model knowledge (b2 and b3 electrolytics)"}
  r_bleeder_ohm: {value: 220.0e+3, source: "provisional: model knowledge (a bleeder across the reservoir)"}
  bias_winding_rms_v: {value: 85.0, source: "provisional: model knowledge (design: a bias winding for ~-100 V)"}
  bias_winding_r_ohm: {value: 200.0, source: "provisional: model knowledge (a small bias winding's resistance)"}
  bias_rectifier: {value: SELENIUM@1, source: "provisional: model knowledge (design: a selenium bridge for the bias)"}
  c_bias_arm_f: {value: 1.0e-9, source: "provisional: model knowledge (each selenium arm's capacitance)"}
  bias_arm_area: {value: 1.0, source: "numerical: the arm capacitance is given per arm (the macro's per-area form)"}
  c_bias_winding_f: {value: 1.0e-9, source: "provisional: model knowledge (the floating bias winding's capacitance to the core)"}
  r_bias_winding_leak_ohm: {value: 1.0e+8, source: "numerical: a DC path for the floating bias winding"}
  c_bias_f: {value: 100.0e-6, source: "provisional: model knowledge (bias filter electrolytics)"}
  r_bias_drop_ohm: {value: 4.7e+3, source: "provisional: model knowledge (design: -100 V to the -45 V node)"}
  r_bias_ground_ohm: {value: 4.7e+3, source: "provisional: model knowledge (design: the -45 V node to ground: with this circuit's lighter loads, 8.2k (the synth's) left it at -57 V)"}
  r_grid_in_ohm: {value: 1.0e+6, source: "provisional: model knowledge (a load on the unused audio input)"}
  gate_off_v: {value: -110.0, source: "provisional: model knowledge (design: the keyboard bus with no key down, as tube_synth.yaml's)"}
  gate_on_v: {value: -1.0, source: "provisional: model knowledge (design: the keyboard bus with a key down)"}
  # --- tune and sweep
  r_tune_vr_feed_ohm: {value: 6.8e+3, source: "provisional: model knowledge (design: the -100 V rail into TUNE's 5651 (-87 V), ~2.6 mA: on the -45 V rail the VCA's tail current sagged TUNE 0.5 V, the pitch 58 -> 66 Hz while a hit sounded)"}
  r_tune_top_ohm: {value: 1.2e+6, source: "provisional: model knowledge (design: TUNE's reference (~-80 V) to the TUNE pot: its low end ~-24.4 V)"}
  r_tune_pot_ohm: {value: 100.0e+3, source: "provisional: model knowledge (the TUNE pot)"}
  r_tune_bottom_ohm: {value: 430.0e+3, source: "provisional: model knowledge (design: the TUNE pot to ground: its high end ~-19.8 V; the pitch ~32-108 Hz over TUNE (300k: 63-188 Hz))"}
  r_tune_sum_ohm: {value: 100.0e+3, source: "provisional: model knowledge (design: from the TUNE wiper to the 6V6GT's grid)"}
  r_sw_in_ohm: {value: 470.0, source: "provisional: model knowledge (design: the keyboard bus into the sweep's pump (10k with the pump's return made a divider: the sweep reached ~30 V, not ~100)"}
  c_sw_f: {value: 0.47e-6, source: "provisional: model knowledge (design: the sweep's capacitor: 5-230 ms with SWEEP TIME)"}
  c_sw_pump_f: {value: 4.7e-6, source: "provisional: model knowledge (design: the sweep's pump, 10x its capacitor: a key's edge lifts the sweep ~99 V through a 6X4 section, and the key up's negative edge is blocked (a clamp at ground cut the sweep short whenever the key came up before it ended))"}
  r_sw_pump_return_ohm: {value: 10.0e+3, source: "provisional: model knowledge (design: the pump's node back to ground, ~50 ms, from ground: no load on the supplies)"}
  r_sw_min_ohm: {value: 10.0e+3, source: "provisional: model knowledge (design: the sweep's shortest discharge)"}
  r_sw_ohm: {value: 470.0e+3, source: "provisional: model knowledge (the SWEEP TIME rheostat)"}
  r_depth_pot_ohm: {value: 250.0e+3, source: "provisional: model knowledge (the DEPTH pot)"}
  r_sweep_sum_ohm: {value: 2.2e+6, source: "provisional: model knowledge (design: from the DEPTH wiper to the 6V6GT's grid: ~+4 V at full depth)"}
  clamp_diode: {value: 6X4@1, source: "provisional: model knowledge (design: 6X4 sections as the sweep's clamp and the envelope's pump and clamp)"}
  # --- decay envelope
  r_env_in_ohm: {value: 1.0e+3, source: "provisional: model knowledge (design: the keyboard bus into the trigger's differentiator)"}
  c_pump_f: {value: 0.1e-6, source: "provisional: model knowledge (design: the trigger's differentiator: ~10 ms with r_pump_return_ohm, long enough to hold the follower's grid up while it charges the envelope (~2.5 ms). A 10 uF pump from the bus dumped ~1 mC per hit into the -100 V rail (a 6 V swing, the output's thump) and stayed connected while the key was held; 10 nF drained through the grid in microseconds)"}
  r_pump_return_ohm: {value: 100.0e+3, source: "provisional: model knowledge (design: the trigger follower's grid back to the -100 V rail between hits)"}
  r_trig_plate_ohm: {value: 100.0e+3, source: "provisional: model knowledge (design: b3 to the trigger follower's plate tap, ~+55 V with its foot: at b3 the follower idled ~30 V above its grid, the envelope rested at -74 V and a hit lifted it only to -40 V)"}
  r_trig_plate_foot_ohm: {value: 22.0e+3, source: "provisional: model knowledge (design: the plate tap's foot)"}
  c_trig_plate_f: {value: 10.0e-6, source: "provisional: model knowledge (design: the plate tap's bypass: a hit draws ~50 uC from it)"}
  r_trig_grid_stop_ohm: {value: 100.0e+3, source: "provisional: model knowledge (design: the trigger follower's grid stopper: limits its grid current while its cathode climbs with the envelope)"}
  r_trig_cathode_ohm: {value: 100.0e+3, source: "provisional: model knowledge (design: the trigger follower's cathode load to the -100 V rail, ~1 mA at the top)"}
  c_env_f: {value: 0.47e-6, source: "provisional: model knowledge (design: the envelope's capacitor, film: ~5 ms to ~1 s with DECAY)"}
  r_decay_min_ohm: {value: 10.0e+3, source: "provisional: model knowledge (design: the shortest decay, ~10 ms)"}
  r_decay_ohm: {value: 4.7e+6, source: "provisional: model knowledge (the DECAY rheostat: up to ~2 s into 0.47 uF)"}
  env_taper_mid: {value: 0.1, source: "provisional: model knowledge (audio-taper rheostats, 10% at half rotation)"}
  r_env_leak_ohm: {value: 1.0e+8, source: "numerical: the envelope node's DC path besides the diodes (the pre-flight checks)"}
  # --- VCA
  c_vca_in_f: {value: 0.1e-6, source: "provisional: model knowledge (design: the oscillator's buffer into the VCA)"}
  r_vca_atten_ohm: {value: 150.0e+3, source: "provisional: model knowledge (design: with the grid leak, ~2/5 of the buffer at the pair's grid: enough signal that the tail's common-mode step is small beside it)"}
  r_vca_grid_ohm: {value: 100.0e+3, source: "provisional: model knowledge (design: the pair's grid leak and the attenuator's foot)"}
  r_vca_plate_ohm: {value: 22.0e+3, source: "provisional: model knowledge (design: each of the pair's plate loads)"}
  r_tail_grid_top_ohm: {value: 5.6e+6, source: "provisional: model knowledge (design: the envelope into the tail tube's grid, 0.8 of it with r_tail_grid_bottom_ohm: at the envelope's ~-93 V rest the tail's grid is ~-74 V and it passes ~1.3 uA, less than the pair's leak supplies, so the pair is cut off: the oscillator ~-92 dB under a hit (at 0.6 the tail passed 4.6 uA, the pair the rest: -59 dB). It opens above ~-62 V of the envelope)"}
  r_tail_grid_bottom_ohm: {value: 22.0e+6, source: "provisional: model knowledge (design: the tail grid divider's foot)"}
  r_tail_cathode_ohm: {value: 10.0e+3, source: "provisional: model knowledge (design: the tail tube's cathode to the -45 V rail: ~4 mA with the envelope at 0 V, off below ~-50 V)"}
  r_kc_leak_ohm: {value: 1.0e+7, source: "numerical: a DC path for the pair's cathodes with the tail cut off (no standing current: no bleed)"}
  r_sink_filter_ohm: {value: 4.7e+3, source: "provisional: model knowledge (design: an RC of its own for the current sink's return: the -100 V rail's ripple moved its current, ~0.5 V of hum at the output)"}
  c_sink_filter_f: {value: 100.0e-6, source: "provisional: model knowledge (its electrolytic)"}
  r_sink_grid_filter_ohm: {value: 100.0e+3, source: "provisional: model knowledge (design: the current sink's grid from TUNE's 5651 through an RC (0.1 s): the reference passes ~12% of the -100 V rail's ripple)"}
  c_sink_grid_filter_f: {value: 1.0e-6, source: "provisional: model knowledge (its capacitor, film)"}
  c_kc_stray_f: {value: 100.0e-12, source: "provisional: model knowledge (the pair's cathodes, the tail's plate and their wiring: holds the node when the tail cuts off (without it the draft chattered there ~20 ms))"}
  r_pair_leak_ohm: {value: 1.0e+8, source: "numerical: a DC path for the pair's cathodes with the tail cut off (insulation), from the pair's supply: its ~3 uA then flows in the tail tube and lifts the cathodes until the pair is cut off (to ground, it flowed through the pair, which passed the oscillator at -50 dB)"}
  c_diff_in_f: {value: 0.22e-6, source: "provisional: model knowledge (design: each VCA plate into the differential stage)"}
  r_diff_series_ohm: {value: 1.0e+6, source: "provisional: model knowledge (design: with the grid leak, 1/11 of each VCA plate into the differential stage: unattenuated it swung its plate ~66 V and clipped)"}
  r_diff_grid_ohm: {value: 100.0e+3, source: "provisional: model knowledge (the differential stage's grid leaks, the dividers' feet)"}
  r_vca_supply_ohm: {value: 2.2e+3, source: "provisional: model knowledge (design: the VCA pair's own supply off b3 (100 uF): on b3 the oscillator's current draw put its own frequency on both plates (~75 mV), past the closed VCA)"}
  r_diff_supply_ohm: {value: 10.0e+3, source: "provisional: model knowledge (design: the differential stage's own supply off b3: on b3 the VCA's opening sagged its plate ~2 V, the thump)"}
  c_diff_supply_f: {value: 100.0e-6, source: "provisional: model knowledge (design: its electrolytic: 1 s)"}
  r_diff_plate_ohm: {value: 100.0e+3, source: "provisional: model knowledge (12AX7 plate load)"}
  r_diff_tail_ohm: {value: 12.0e+3, source: "provisional: model knowledge (design: the differential stage's current sink, a 12AU7 section, its grid on TUNE's regulated -80 V and 22k to the -100 V rail: ~1.2 mA (a 100k resistor tail let half the VCA's common-mode step through, a 4.7 V thump; its grid on the -45 V rail followed that rail's sag under the VCA's tail and moved the output ~2 V)"}
  r_tone_leg2_ohm: {value: 56.0e+3, source: "provisional: model knowledge (design: the second low-pass leg's fixed part, matching the first leg's source, the differential stage's plate (~55k: 100k with its tube's ~125k): equal legs keep Q up across the TONE range; with the source in one leg only the bump vanished at the bright end)"}
  r_tone_pot_ohm: {value: 1.0e+6, source: "provisional: model knowledge (the TONE pot, each gang)"}
  tone_taper_mid: {value: 0.1, source: "provisional: model knowledge (an audio taper, 10% at half rotation, wired reversed: a reverse-audio (C) pot)"}
  c_tone_feedback_f: {value: 8.2e-9, source: "provisional: model knowledge (design: the low-pass's capacitor from between the legs to the follower's cathode, ~5.5x the shunt's: with the 12AX7 follower's gain of ~0.98, a slight bump at the cutoff (5.6 nF / 820 pF: +2 dB and the range up to 2 kHz; a 12AU7 follower, gain ~0.9, left no bump))"}
  c_tone_shunt_f: {value: 1.5e-9, source: "provisional: model knowledge (design: the low-pass's capacitor from the follower's grid to ground)"}
  r_tone_cathode_ohm: {value: 47.0e+3, source: "provisional: model knowledge (design: the follower's cathode to the -45 V rail, ~1 mA)"}
  c_out_f: {value: 0.47e-6, source: "provisional: model knowledge (output coupling)"}
  r_out_load_ohm: {value: 1.0e+6, source: "provisional: model knowledge (the output's load)"}
  # --- the oscillator (tube_synth.yaml's, its LOW range)
  osc_c_tank_f: {value: 224.0e-9, source: "provisional: model knowledge (design: tube_synth.yaml's LOW range, 56 + 168 nF: ~39 Hz at -23 V, ~136 Hz at -18 V)"}
