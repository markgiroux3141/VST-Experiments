# See that script's docstring for how they join, docs/MINIMOOG_PLAN.md MM4.
title: 'Minimoog voice: the oscillator board, the mixer, the filter board (VCF, VCA), the contour generators and the keyboard'
input: in
cv_inputs: {key: b_pbar, gate: b_kg}
probes: [out, o7, vo, c16, c15, c14, c13, e1, c1, vt1, b15, vr, a4, b4, ctl, e26, tail, nb, b29, b30, p9, kbd, k_kg, k_env, k_envl, k_outn, k_tb, k_vtrig, b_s9, b_c6, b_n24, o1_wf, o2_wf, o3_wf, mix, o_pri,
