  osc1_level: {value: 0.8, min: 0.0, max: 1.0, unit: rotation, source: 'Fig 9-17: R6 OSC 1 LEVEL, 25K (Table 7-3; its taper not read: linear, provisional); 0 = the wiper at ground, 1 = at the waveform;
