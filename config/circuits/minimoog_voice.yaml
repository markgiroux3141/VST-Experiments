  bend: {value: 0.5, min: 0.3, max: 0.7, unit: rotation, source: 'Fig 9-2: PITCH WHEEL, a 25K linear pot from +10 V to ground (5 V +- 2 V: its travel 0.3-0.7); 0.5 = centred'}
  osc1_range:
