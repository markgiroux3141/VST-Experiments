      taper_mid: m_wheel_taper_mid
    RSWOM1_m:
      rheostat: [mw, om]
      r: p_r_switch_open_ohm
      at: osc_mod
      reverse: 1
    RSWOM0_m:
      rheostat: [om, '0']
      r: p_r_switch_open_ohm
      at: osc_mod
    RSWFM1_m:
      rheostat: [mw, fm]
      r: p_r_switch_open_ohm
      at: filter_mod
      reverse: 1
    RSWFM0_m:
      rheostat: [fm, '0']
      r: p_r_switch_open_ohm
      at: filter_mod
- title: 'modulation: grounds'
  when:
  - ['!osc_mod', '!filter_mod']
  parts:
    RSWOM0G_m:
      rheostat: [om, '0']
      r: p_r_switch_open_ohm
      at: osc_mod
    RSWFM0G_m:
      rheostat: [fm, '0']
      r: p_r_switch_open_ohm
      at: filter_mod
- title: 'panel: rails'
  when: [osc_mod, filter_mod]
  parts:
    VPP_m:
      V: [pvp, '0']
      v: supply_v
    VPN_m:
      V: [pvn, '0']
      v: supply_neg_v
