      past about half, as the Model D overdrives external signals)'}
  output_volts_peak: {value: 12.0, source: 'numerical: chosen so one oscillator at the panel''s defaults (LEVEL 8, the filter and contours at their defaults) peaks near -18 dBFS at the MAIN OUTPUT (1.5
      V there, measured by scripts/minimoog_gate_check.py --voice); all three at full level stay under -10 dBFS'}
