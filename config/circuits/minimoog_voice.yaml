  amount: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: 'the 204D manual''s Table 7-3: a 5K linear pot (AMOUNT OF CONTOUR TO FILTER, the filter contour into R74 / pin 16); 0 = the wiper at ground'}
