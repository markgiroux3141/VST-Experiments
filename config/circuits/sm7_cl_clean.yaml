sections:
- title: 'Shure SM7: cartridge'
  parts:
    MC_sm7:
      moving_coil:
      - in
      - p_rear
      - c_sm7
      - '0'
      component: cartridge_model_sm7
    SBASS_sm7:
      switch: bass_rolloff_sm7
      parts:
        LB_sm7:
          L:
          - c_sm7
          - lbm_sm7
          l: lb_h_sm7
          in:
          - 1
        RB_sm7:
          R:
          - lbm_sm7
          - '0'
          r: rb_ohm_sm7
          tolerance: none
          in:
          - 1
    SPRES_sm7:
      switch: presence_sm7
      parts:
        RS0_sm7:
          R:
          - c_sm7
          - ia_cl
          r: contact_ohm_sm7
          tolerance: none
          in:
          - 0
        RP_sm7:
          R:
          - c_sm7
          - ia_cl
          r: rp_ohm_sm7
          tolerance: none
          in:
          - 1
        LP_sm7:
