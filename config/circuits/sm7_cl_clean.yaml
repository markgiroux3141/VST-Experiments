          - 20
        RG30_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g30_ohm_clean
          in:
          - 30
        RG40_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g40_ohm_clean
          in:
          - 40
        RG50_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g50_ohm_clean
          in:
          - 50
        RG60_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g60_ohm_clean
          in:
          - 60
    RO_clean:
      R:
      - uo_clean
      - out
      r: r_out_ohm_clean
    RLOAD_clean:
      R:
      - out
      - '0'
      r: load_ohm_clean
      tolerance: none
