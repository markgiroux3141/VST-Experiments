    RGN_cl:
      R:
      - gn_cl
      - '0'
      r: r_ideal_ohm_cl
      tolerance: none
- title: 'Cloudlifter CL-1: amplifier'
  parts:
    J1_cl:
      jfet:
      - m1_cl
      - gp_cl
      - s1_cl
      model: FJ1_cl
    J4_cl:
      jfet:
      - dp_cl
      - s1_cl
      - m1_cl
      model: FJ4_cl
    R1_cl:
      R:
      - s1_cl
      - sc_cl
      r: r1_ohm_cl
    J3_cl:
      jfet:
      - m2_cl
      - gn_cl
      - s2_cl
      model: FJ3_cl
    J2_cl:
      jfet:
      - dn_cl
      - s2_cl
      - m2_cl
      model: FJ2_cl
    R2_cl:
      R:
      - s2_cl
      - sc_cl
      r: r2_ohm_cl
    R3_cl:
      R:
      - sc_cl
      - '0'
      r: r3_ohm_cl
- title: 'Cloudlifter CL-1: phantom and the preamp''s input'
  parts:
    VPH_cl:
