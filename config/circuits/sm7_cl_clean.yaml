      - dnb_cl
      - '0'
      r: r_pre_leg_ohm_cl
    GD_cl:
      G:
      - '0'
      - ia_clean
      - dpb_cl
      - dnb_cl
      gm: diff_gm_s_cl
    RGD_cl:
      R:
