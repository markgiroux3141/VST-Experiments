          - pm_sm7
          l: lp_h_sm7
          in:
          - 1
        CP_sm7:
          C:
          - pm_sm7
          - ia_cl
          c: cp_f_sm7
          tolerance: none
          in:
          - 1
        RSH_sm7:
          R:
          - ia_cl
          - '0'
          r: rsh_ohm_sm7
          tolerance: none
          in:
          - 1
