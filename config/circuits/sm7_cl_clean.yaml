      - ip_clean
      r: u_noise_ohm_clean
      tolerance: none
- title: 'Clean preamp (NE5534A): gain'
  parts:
    U1_clean:
      opamp:
      - ip_clean
      - fb_clean
      - uo_clean
      a0: u_a0_clean
      gbw_hz: u_gbw_hz_clean
      r_out_ohm: u_r_out_ohm_clean
      r_in_ohm: u_r_in_ohm_clean
      clamp: DCLAMP_clean
      swing_v: u_swing_v_clean
    RF_clean:
      R:
      - uo_clean
      - fb_clean
      r: r_f_ohm_clean
    CG_clean:
      C:
      - g_clean
      - '0'
      c: c_g_f_clean
    SGAIN_clean:
      switch: gain_db_clean
      parts:
        RG20_clean:
          R:
