sections:
- title: 'AKG C414 B-ULS: supply'
  parts:
    VPOL_c414:
      V:
      - p60_c414
      - '0'
      v: pol_v_c414
    VR_c414:
      V:
      - rail_c414
      - '0'
      v: rail_v_c414
- title: 'AKG C414 B-ULS: capsule'
  parts:
    R1_c414:
      R:
      - p60_c414
      - bp_c414
      r: r1_ohm_c414
    SREAR_c414:
      switch: pattern_c414
      parts:
        RW0_c414:
          R:
          - '0'
          - rd_c414
          r: contact_ohm_c414
          tolerance: none
          in:
          - 0
        RW1_c414:
          R:
          - p60_c414
          - rd_c414
          r: contact_ohm_c414
          tolerance: none
          in:
          - 1
        RW2_c414:
          R:
          - p90_c414
          - rd_c414
          r: contact_ohm_c414
          tolerance: none
          in:
          - 2
        VPH_c414:
          V:
          - p90_c414
          - '0'
          v: pol_hyper_v_c414
          in:
          - 2
        RW3_c414:
          R:
          - p120_c414
          - rd_c414
          r: contact_ohm_c414
          tolerance: none
          in:
          - 3
        VPE_c414:
          V:
          - p120_c414
          - '0'
          v: pol_eight_v_c414
          in:
          - 3
    SCAP_c414:
      switch: pattern_c414
      parts:
        KC0_c414:
          capsule_dual:
          - in
          - p_rear
          - bp_c414
          - '0'
          - rd_c414
          component: capsule_model_c414
          polarization_front_v: pol_front_v_c414
          polarization_rear_v: pol_rear_omni_v_c414
          in:
          - 0
        KC1_c414:
          capsule_dual:
          - in
          - p_rear
          - bp_c414
          - '0'
          - rd_c414
          component: capsule_model_c414
          polarization_front_v: pol_front_v_c414
          polarization_rear_v: pol_rear_card_v_c414
          in:
          - 1
        KC2_c414:
          capsule_dual:
          - in
          - p_rear
          - bp_c414
          - '0'
          - rd_c414
          component: capsule_model_c414
          polarization_front_v: pol_front_v_c414
          polarization_rear_v: pol_rear_hyper_v_c414
          in:
          - 2
        KC3_c414:
          capsule_dual:
          - in
          - p_rear
          - bp_c414
          - '0'
          - rd_c414
          component: capsule_model_c414
          polarization_front_v: pol_front_v_c414
          polarization_rear_v: pol_rear_eight_v_c414
          in:
          - 3
    SPAD_c414:
      switch: pad_c414
      parts:
        CPAD10_c414:
          C:
          - bp_c414
          - '0'
          c: c_pad10_f_c414
          in:
          - 10
        CPAD20_c414:
          C:
          - bp_c414
          - '0'
          c: c_pad20_f_c414
          in:
          - 20
- title: 'AKG C414 B-ULS: amplifier'
  parts:
    C1_c414:
      C:
      - bp_c414
      - g_c414
      c: c1_f_c414
    R2_c414:
      R:
      - g_c414
      - gb_c414
      r: r2_ohm_c414
    RG1_c414:
      R:
      - rail_c414
      - gb_c414
      r: rg1_ohm_c414
    RG2_c414:
      R:
      - gb_c414
      - '0'
      r: rg2_ohm_c414
    CG_c414:
      C:
      - gb_c414
      - '0'
      c: cg_f_c414
    J1_c414:
      jfet:
      - d_c414
      - g_c414
      - s_c414
      model: QJ_c414
    RS1_c414:
      R:
      - s_c414
      - s2_c414
      r: rs1_ohm_c414
    RS2_c414:
      R:
      - s2_c414
      - '0'
      r: rs2_ohm_c414
    C3_c414:
      C:
      - s2_c414
      - '0'
      c: c3_f_c414
    RD_c414:
      R:
      - rail_c414
      - d_c414
      r: rd_ohm_c414
    Q1_c414:
      bjt:
      - rail_c414
      - d_c414
      - e_c414
      model: QB_c414
    RE_c414:
      R:
      - e_c414
      - '0'
      r: re_ohm_c414
    C4_c414:
      C:
      - e_c414
      - tp_c414
      c: c4_f_c414
    TU_c414:
      transformer:
        p:
          nodes:
          - tp_c414
          - '0'
          r: t_r_p_ohm_c414
          c: t_c_p_f_c414
        s:
          nodes:
          - ia_clean
          - '0'
          ratio: t_ratio_c414
          r: t_r_s_ohm_c414
      core:
        material: t_core_material_c414
        area_m2: t_core_area_m2_c414
        path_m: t_core_path_m_c414
        gap_m: t_gap_m_c414
      turns: t_turns_c414
      leakage_h: t_leakage_h_c414
- title: cable
  parts:
    CCABLE:
      C:
      - ia_clean
      - '0'
      c: cable_c_f
      tolerance: none
- title: 'Clean preamp (NE5534A): input'
  parts:
    CIN_clean:
      C:
      - ia_clean
      - ib_clean
      c: c_in_f_clean
    RB_clean:
      R:
      - ib_clean
      - '0'
      r: r_bias_ohm_clean
    RN_clean:
      R:
      - ib_clean
      - ip_clean
      r: u_noise_ohm_clean
      tolerance: none
- title: 'Clean preamp (NE5534A): gain'
  parts:
    U1_clean:
      opamp:
      - ip_clean
      - fb_clean
      - uo_clean
      a0: u_a0_clean
      gbw_hz: u_gbw_hz_clean
      r_out_ohm: u_r_out_ohm_clean
      r_in_ohm: u_r_in_ohm_clean
      clamp: DCLAMP_clean
      swing_v: u_swing_v_clean
    RF_clean:
      R:
      - uo_clean
      - fb_clean
      r: r_f_ohm_clean
    CG_clean:
      C:
      - g_clean
      - '0'
      c: c_g_f_clean
    SGAIN_clean:
      switch: gain_db_clean
      parts:
        RG20_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g20_ohm_clean
          in:
          - 20
        RG30_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g30_ohm_clean
          in:
          - 30
        RG40_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g40_ohm_clean
          in:
          - 40
        RG50_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g50_ohm_clean
          in:
          - 50
        RG60_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g60_ohm_clean
          in:
          - 60
    RO_clean:
      R:
      - uo_clean
      - out
      r: r_out_ohm_clean
    RLOAD_clean:
      R:
      - out
      - '0'
      r: load_ohm_clean
      tolerance: none
