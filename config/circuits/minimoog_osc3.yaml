exceptions:
  XRESET:
    kind: reset
    tables: minimoog_osc_reset
    sense: ramp
    src: ref5
    dst: d
    replaces: [JQ4, IC8B, DCR1, C9, R32, R33, R34, R35, C12]
    renders: true
    parts:
      CQ4OFF:
        C: [d, '0']
        c: j_reset_cgd_f
    source: 'scripts/minimoog_event_tables.py: the reset unit (this circuit less its summers and expo, a constant current from Q7''s collector node) at 12.288 MHz with error control; the off Q4''s gate-to-drain capacitance kept (its gate held at ~-9.4 V between resets)'
  XRECT:
    kind: edge
    tables: minimoog_osc_edge
    plus: n11
    minus: n12
    src: rc
    dst: vn
    replaces: [IC8A]
    renders: true
    follows: XRESET
    follow_gain: rect_follow_gain
    source: 'scripts/minimoog_event_tables.py: the edge unit (IC8A, R39, R46, PW''s divider at 0 V, R48 / R49) driven through zero at each slope, both ways, at 12.288 MHz with error control'
devices:
  QX: {device: q_726, temp_c: r27_temp_c}
  QN: {device: q_n}
  QREF: {device: q_ref}
  QO: {device: q_cmp_out}
  JR: {device: j_reset}
  DCL: {device: clamp_diode}
  DCR: {device: cr1_diode}
  QE: {device: q_e101}
sections:
- title: rails and panel
  parts:
    VP:
      V: [vp, '0']
      v: vpos_v
    VN:
      V: [vn, '0']
      v: vneg_v
    RIN:
      R: [osc_in, '0']
      r: r_leak_ohm
    RBEND:
      pot: [vp, bendw, '0']
      r: r_bend_ohm
      at: bend
    RTUNE:
      pot: [vp, tunew, tunef]
      r: r_tune_ohm
      at: tune
    RTUNEF:
      R: [tunef, '0']
      r: r_tune_foot_ohm
    VPW:
      V: [pw, '0']
      v: pw_v
    RFREQ:
      pot: [vp, freqw, freqf]
      r: r_freq_ohm
      at: freq
    RFREQF:
      R: [freqf, '0']
      r: r_freq_foot_ohm
    RCTLA:
      rheostat: [freqw, n10]
      r: r_switch_open_ohm
      at: control
    RCTLB:
      rheostat: [m5, n16]
      r: r_switch_open_ohm
      at: control
    RCTLC:
      rheostat: [vn, n16]
      r: r_switch_open_ohm
      at: control
      reverse: 1
- title: -5 V reference
  parts:
    R9:
      R: ['0', rp2]
      r: r_ref_div_ohm
    R10:
      R: [rp2, vn]
      r: r_ref_div_ohm
    C3:
      C: [c3t, '0']
      c: c_ref_f
    RC3:
      R: [rp2, c3t]
      r: c_ref_esr_ohm
    R8:
      R: [m5, rn2]
      r: r_ref_sense_ohm
    IC2:
      opamp: [rp2, rn2, r11a]
      a0: u1458_a0
      gbw_hz: u1458_gbw_hz
      r_out_ohm: u1458_r_out_ohm
      r_in_ohm: u1458_r_in_ohm
    R11:
      R: [r11a, bq1]
      r: r_ref_base_ohm
    Q1:
      bjt: [vn, bq1, m5]
      model: QREF
- title: range ladder
  parts:
    R25P:
      R: [m5, t4]
      r: r_ladder_ohm
    R26P:
      R: [t4, t8]
      r: r_ladder_ohm
    R27P:
      R: [t8, t16]
      r: r_ladder_ohm
    R28P:
      R: [t16, t32]
      r: r_ladder_ohm
    R29P:
      R: [t32, '0']
      r: r_ladder_lo_ohm
- title: range
  parts:
    SRANGE:
      switch: osc_range
      parts:
        RR0:
          R: ['0', rw]
          r: r_contact_ohm
          in: [0]
        RR1:
          R: [t32, rw]
          r: r_contact_ohm
          in: [1]
        RR2:
          R: [t16, rw]
          r: r_contact_ohm
          in: [2]
        RR3:
          R: [t8, rw]
          r: r_contact_ohm
          in: [3]
        RR4:
          R: [t4, rw]
          r: r_contact_ohm
          in: [4]
        RR5:
          R: [m5, rw]
          r: r_contact_ohm
          in: [5]
    IC1B6:
      opamp: [rw, rng, rng]
      a0: u1458_a0
      gbw_hz: u1458_gbw_hz
      r_out_ohm: u1458_r_out_ohm
      r_in_ohm: u1458_r_in_ohm
- title: primary summer
  parts:
    R1:
      R: [bendw, p2]
      r: r1_ohm
    R3:
      R: [tunew, p2]
      r: r3_ohm
    R4:
      R: [kbd, p2]
      r: r4_ohm
    R5:
      R: ['0', p2]
      r: r5_ohm
    R6:
      R: ['0', p2]
      r: r6_ohm
    R2:
      R: [pri, p2]
      r: r2_ohm
    R7:
      R: [p3, '0']
      r: r7_ohm
    IC1A:
