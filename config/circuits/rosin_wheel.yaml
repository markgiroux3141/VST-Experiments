# The Rosin Wheel Organ as a device (docs/INVENTED_LIVE_PLAN.md IL1; docs/INVENTED_DEVICES.md
# I11): tuned steel bars (C2-C6, free-free, 8 x 25 mm) bowed by a rosined wheel that each key
# presses its bar onto; key velocity is the press force, aftertouch adds to it, the pedal
# holds released keys pressed, and a felt damper falls when a key lets go. The keys are
# circuitsim's invented-keys medium (the component ROSIN_WHEEL: crates/circuitsim/src/
# invented.rs, varimu/invented/keys/rosin.py the reference), each bar read by a magnetic
# pickup at its far end through its tuned tube; the pickups sum onto `out`.
#
# The panel (they play on): WHEEL (k0: the wheel's surface speed 0.1-0.5 m/s), RESONATOR (k1:
# the tubes' gain 0-4), TOUCH (k2: the press 0.5-2x the key's force), EVEN (k3, the control
# `limit`): 0 = the free bar, which swells over seconds to a loud, clean limit cycle (at the
# fastest WHEEL one bar alone to ~5 V). Up, every note at one even level from ~0.1 s on with the
# rosin's scratch kept: a check felt holds the bar quiet, where the rosin's grip drives all its
# modes (a bar clamped near its full swing locks into a clean tone), and each key's pickup has an
# automatic volume control (frozen when the key lets go); further up, rougher. ROSIN_WHEEL@5.

title: "Rosin Wheel Organ (bowed steel bars, keyed)"
input: in
probes: [out]

full_scale:
  input_volts_peak: {value: 1.0, source: "numerical: the audio input is unused (the keys drive the line)"}
  output_volts_peak: {value: 4.0, source: "measured: a bar's stick-slip limit cycle follows the wheel's speed (~0.25 m/s at the end: ~1 V at 2 V per m/s through its tube), reached ~3-4 s into a held note; four held bars peak ~2.2 V (scripts/invented_live_render.py, docs/INVENTED_LIVE_PLAN.md)"}

controls:
  wheel: {value: 0.375, min: 0.0, max: 1.0, unit: rotation, source: "design: WHEEL, the wheel's surface speed 0.1-0.5 m/s (0.25 m/s, the sketch's, at 0.375)"}
  resonator: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "design: RESONATOR, the tubes' gain 0-4 (2, the sketch's, at 0.5)"}
  touch: {value: 0.333, min: 0.0, max: 1.0, unit: rotation, source: "design: TOUCH, the press 0.5-2x the key's force (1x at 0.333)"}
  limit: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "design: EVEN (the panel's label), the check felt per bar and the pickups' AVC (varimu/invented/keys/rosin.py): 0 = off, the free swelling bar (the instrument as first played). Up: one level for every key, velocity and panel (~0.44 V rms, +-1-3 dB while held; peaks <= 2.9 V where the free bar reached 5.2 V), up within ~0.1 s (a +3 dB accent in its first ~50 ms), the scratch kept (off-harmonic -6 to -29 dB held; the free bar's limit cycle -44 to -60); toward 1 rougher (a hard press -7 to -19 dB)"}

values:
  keys_model: {value: ROSIN_WHEEL@5, source: "config/components/rosin_wheel/5.yaml (EVEN: the felt per bar and the pickups' AVC; @2-@4 the felt as a ceiling and a mallet, which locked the bar into a clean tone; varimu/invented/keys/rosin.py's model from varimu/invented/friction.py's values, compiled by scripts/compile_invented_keys.py)"}
  keys_rate_hz: {value: 96000.0, source: "numerical: each bar stepped at the project's 96 kHz (one trapezoidal step a sample)"}
  keys_max_keys: {value: 16, source: "numerical: bars sounding at once (a bar costs well under 1 % of a core; another struck silences a released one, else the one struck longest ago)"}
  r_in_ohm: {value: 1.0e+6, source: "numerical: a load on the unused audio input"}
  r_line_ohm: {value: 100.0e+3, source: "numerical: a DC path on the line (the pickups' load)"}

sections:
  - title: keys
    parts:
      RIN: {R: [in, "0"], r: r_in_ohm, tolerance: none}
      # the bars: their pickups' sum on out (to ground), played by note events
      KEYS: {invented_keys: [out], component: keys_model, rate_hz: keys_rate_hz, max_keys: keys_max_keys, k0: wheel, k1: resonator, k2: touch, k3: limit}
      RLINE: {R: [out, "0"], r: r_line_ohm, tolerance: none}
