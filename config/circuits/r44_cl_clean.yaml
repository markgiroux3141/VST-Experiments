# GENERATED by scripts/compose_chain.py from config/circuits/rca_44bx.yaml,
# cloudlifter.yaml and clean_pre.yaml: don't edit; edit those and rerun (`uv run python
# scripts/compose_chain.py --mic rca_44bx --booster cloudlifter --pre clean_pre`). The rca_44bx into
# the cloudlifter into the clean_pre as one netlist (MIC_ROOM_PLAN.md): every key, part and node
# of each carries its circuit's suffix; the mic's output is the booster's input node, the
# cable across it; the booster's output is the preamp's input node.

title: RCA 44-BX into the Cloudlifter CL-1 into the Clean preamp (NE5534A)
input: in
cv_inputs:
  p_rear: p_rear
probes:
- out
- ia_cl
- rp_r44
- rm_r44
- ia_clean
- dp_cl
- dn_cl
- m1_cl
- m2_cl
- s1_cl
- sc_cl
- ib_clean
- uo_clean
full_scale:
  input_volts_peak:
    value: 20.0
    source: 'provisional: MIC_ROOM_PLAN.md''s proposed source convention (0 dBFS = 20 Pa peak; as neumann_u47.yaml)'
  output_volts_peak:
    value: 17.36
    source: 'derived: +24 dBu peak, the same scale as telefunken_v76.yaml''s output so the two chains
      print comparably (this stage clips at ~+-13 V)'
controls:
  impedance_r44:
    value: 0
    choices:
    - 0
    - 1
    - 2
    unit: position
    source: 'ib: ''Output Impedance: 30, 150 or 250 ohms (connected for 250 ohms when shipped)''; the
      cable table at the terminal board (Fig. 5)'
    notes: '0: 250 ohm (A-C), 1: 150 ohm (B-C), 2: 30 ohm (A-B)'
  response_r44:
    value: 0
    choices:
    - 0
    - 1
    - 2
    unit: position
    source: 'ib Fig. 5''s jumper table: M ''D only'', V1 ''D and B'', V2 ''D and E''; the text: V1 to
      about 12 in, V2 to about 7 in ''without causing objectionable low-frequency boost'''
    notes: '0: M (music), 1: V1, 2: V2 (voice: the reactor''s low cut)'
  gain_db_clean:
    value: 40
    choices:
    - 20
    - 30
    - 40
    - 50
    - 60
    unit: dB
    source: 'provisional: model knowledge (a mic preamp''s gain switch, 20-60 dB in 10 dB steps)'
values:
  ribbon_model_r44:
    value: RIBBON_44BX@2
    source: config/components/ribbon_44bx/2.yaml (the 44-BX's ribbon after AEA's R44 sheet and Olson's
      circuit, its body and motor fitted to ib's curves by scripts/fit_44bx.py)
  ribbon_leak_ohm_r44:
    value: 1000000000.0
    source: 'numerical: a DC path for the floating ribbon and primary'
  transformer_model_r44:
    value: RCA44BX_OT@1
    source: 'config/components/rca44bx_ot/1.yaml (#58871''s windings and tap by construction: config/designs/rca_44bx_ot.yaml)'
  reactor_h_r44:
    value: 0.1139
    source: 'provisional: fitted (ib prints no value): scripts/fit_44bx.py --reactor to Fig. 4''s V2 and
      V1 on 50-600 Hz re 1 kHz, the whole circuit (reports/mics/rca44bx_reactor_fit.json: V1 0.46 dB rms,
      V2 0.42)'
  reactor_ohm_r44:
    value: 28.0
    source: 'provisional: fitted, the reactor''s winding with reactor_h (scripts/fit_44bx.py --reactor;
      the reactor''s core in its linear limit, a choke of a few millivolts)'
  contact_ohm_r44:
    value: 0.001
    source: 'numerical: a strap or jumper (screw terminals)'
  load_ohm_r44:
    value: 1000000.0
    source: 'ib: ''Recommended Load Impedance: Unloaded input transformer'' (a chain replaces the load
      with its preamp)'
  source_impedance_ohm_cl:
    value: 200.0
    source: 'provisional: model knowledge (a test generator at a dynamic or ribbon microphone''s 150-300
      ohm)'
  r_in_leg_ohm_cl:
    value: 33000.0
    source: 'tr: R4 / R5 33K'
  c_in_leg_f_cl:
    value: 3.3e-09
    source: 'tr: C1 / C2 3n3'
  r_in_pair_ohm_cl:
    value: 66000.0
    source: 'derived: tr: R4 + R5, the two legs in series across the floating source'
  c_in_pair_f_cl:
    value: 1.65e-09
    source: 'derived: tr: C1 and C2 in series across the floating source'
  half_gm_s_cl:
    value: 0.5
    source: 'numerical: the gate drive''s controlled source (v(ia) / 2 into 1 ohm: the floating source''s
      symmetric half, not a part)'
  diff_gm_s_cl:
    value: 1.0
    source: 'numerical: the preamp''s balanced input as a difference (into 1 ohm: not a part)'
  r_ideal_ohm_cl:
    value: 1.0
    source: 'numerical: the controlled sources'' load (not a part)'
  r1_ohm_cl:
    value: 22.0
    source: 'tr: R1 22R'
  r2_ohm_cl:
    value: 22.0
    source: 'tr: R2 22R'
  r3_ohm_cl:
    value: 39.0
    source: 'tr: R3 39R'
  phantom_v_cl:
    value: 48.0
    source: 'iec: IEC 61938 P48, 48 V (tr: V1 48V)'
  r_phantom_ohm_cl:
    value: 6810.0
    source: 'iec: IEC 61938 P48, 6.81 kOhm a leg (tr: R6 / R7 6K8)'
  c_block_f_cl:
    value: 4.7e-05
    source: 'provisional: model knowledge (a phantom-powered preamp''s DC-blocking capacitors)'
  r_pre_leg_ohm_cl:
    value: 5000.0
    source: 'derived: clean_pre.yaml''s 10 kOhm input as across the pair: 5 kOhm a leg to ground'
  passive_seed_cl:
    value: 0
    source: 'numerical: which set of parts a unit is built from'
  passive_spread_cl:
    value: 0.0
    source: 'provisional: fraction of each part''s tolerance band its deviation spans (0 = every part
      at its value)'
  tol_resistor_pct_cl:
    value: 1.0
    source: 'provisional: model knowledge (SMD thick film, 1%)'
  tol_cap_pct_cl:
    value: 10.0
    source: 'provisional: model knowledge (ceramic / electrolytic)'
  source_impedance_ohm_clean:
    value: 150.0
    source: 'provisional: model knowledge (a test generator at a mic''s 150 Ohm)'
  c_in_f_clean:
    value: 4.7e-05
    source: 'provisional: model knowledge (the input coupling capacitor of a transformerless preamp)'
  r_bias_ohm_clean:
    value: 10000.0
    source: 'provisional: model knowledge (a transformerless preamp''s input impedance, 1.5-10 kOhm; the
      high end: a mic loaded as designed)'
  u_a0_clean:
    value: 100000.0
    source: 'web: https://www.ti.com/lit/ds/symlink/ne5534.pdf (AVD 100 V/mV typ; data/datasheets/opamps/README.md)'
  u_gbw_hz_clean:
    value: 10000000.0
    source: 'web: https://www.ti.com/lit/ds/symlink/ne5534.pdf (B1 10 MHz typ)'
  u_r_in_ohm_clean:
    value: 100000.0
    source: 'web: https://www.ti.com/lit/ds/symlink/ne5534.pdf (ri 100 kOhm typ)'
  u_r_out_ohm_clean:
    value: 30.0
    source: 'provisional: model knowledge (a 5534''s open-loop output resistance, tens of ohms; closed
      loop the sheet''s zo is 0.3 Ohm at 30 dB of gain)'
  u_swing_v_clean:
    value: 12.4
    source: 'derived: the sheet''s 26 V peak to peak (RL >= 600 Ohm, +-15 V; data/datasheets/opamps/README.md)
      less the clamp diode''s ~0.6 V'
  u_noise_ohm_clean:
    value: 757.0
    source: 'derived: the NE5534A''s 3.5 nV/rtHz at 1 kHz (data/datasheets/opamps/README.md) as a resistor''s
      Johnson noise at 20 C, (3.5e-9)^2 / 4kT (heard only under a noise block)'
  r_f_ohm_clean:
    value: 10000.0
    source: 'provisional: model knowledge (the feedback resistor)'
  r_g20_ohm_clean:
    value: 1111.1
    source: 'derived: r_f / (10^(20/20) - 1)'
  r_g30_ohm_clean:
    value: 326.6
    source: 'derived: r_f / (10^(30/20) - 1)'
  r_g40_ohm_clean:
    value: 101.01
    source: 'derived: r_f / (10^(40/20) - 1)'
  r_g50_ohm_clean:
    value: 31.72
    source: 'derived: r_f / (10^(50/20) - 1)'
  r_g60_ohm_clean:
    value: 10.01
    source: 'derived: r_f / (10^(60/20) - 1)'
  c_g_f_clean:
    value: 0.0022
    source: 'provisional: model knowledge (the gain leg''s DC block; 7 Hz at 60 dB)'
  r_out_ohm_clean:
    value: 47.0
    source: 'provisional: model knowledge (an output build-out resistor)'
  load_ohm_clean:
    value: 10000.0
    source: 'provisional: model knowledge (a line input)'
  passive_seed_clean:
    value: 0
    source: 'numerical: which set of parts a unit is built from'
  passive_spread_clean:
    value: 0.0
    source: 'provisional: fraction of each part''s tolerance band its deviation spans (0 = every part
      at its value)'
  tol_resistor_pct_clean:
    value: 1.0
    source: 'provisional: model knowledge (metal film resistors)'
  tol_cap_pct_clean:
    value: 10.0
    source: 'provisional: model knowledge (film and electrolytic capacitors)'
  cable_c_f:
    value: 1.0e-09
    source: 'provisional: model knowledge (10 m of microphone cable, ~100 pF/m between the audio pair;
      the UC 4''s per-metre values weren''t found)'
tolerance:
  source: 'provisional: classes by part type (see the tol_* values)'
  seed: passive_seed_clean
  spread: passive_spread_clean
  bands:
    r1_clean: tol_resistor_pct_clean
    cap_clean: tol_cap_pct_clean
    r1_cl: tol_resistor_pct_cl
    cap_cl: tol_cap_pct_cl
  classes:
    r1_clean:
    - RB_clean
    - RF_clean
    - RO_clean
    - RG20_clean
    - RG30_clean
    - RG40_clean
    - RG50_clean
    - RG60_clean
    cap_clean:
    - CIN_clean
    - CG_clean
    r1_cl:
    - RINP_cl
    - R1_cl
    - R2_cl
    - R3_cl
    - R6_cl
    - R7_cl
    - RPLP_cl
    - RPLN_cl
    cap_cl:
    - CINP_cl
    - CBP_cl
    - CBN_cl
devices:
  FJ1_cl:
    device: LSK389A@1
  FJ2_cl:
    device: LSK389A@1
  FJ3_cl:
    device: LSK389A@1
  FJ4_cl:
    device: LSK389A@1
  DCLAMP_clean:
    device: SI_RECTIFIER@1
sections:
- title: 'RCA 44-BX: ribbon'
  parts:
    RB_r44:
      ribbon_motor:
      - in
      - p_rear
      - rp_r44
      - rm_r44
      component: ribbon_model_r44
    RRL_r44:
      R:
      - rm_r44
      - '0'
      r: ribbon_leak_ohm_r44
      tolerance: none
- title: 'RCA 44-BX: transformer'
  parts:
    T1_r44:
      transformer:
        p:
          nodes:
          - rm_r44
          - rp_r44
        s1:
          nodes:
          - ta_r44
          - tb_r44
        s2:
          nodes:
          - tb_r44
          - tc_r44
      component: transformer_model_r44
    SRESP_r44:
      switch: response_r44
      parts:
        LRX_r44:
          L:
          - tc_r44
          - rx_r44
          l: reactor_h_r44
          in:
          - 1
          - 2
        RRX1_r44:
          R:
          - rx_r44
          - tb_r44
          r: reactor_ohm_r44
          tolerance: none
          in:
          - 1
        RRX2_r44:
          R:
          - rx_r44
          - ta_r44
          r: reactor_ohm_r44
          tolerance: none
          in:
          - 2
    SIMP_r44:
      switch: impedance_r44
      parts:
        RO250_r44:
          R:
          - tc_r44
          - ia_cl
          r: contact_ohm_r44
          tolerance: none
          in:
          - 0
          - 1
        RG250_r44:
          R:
          - ta_r44
          - '0'
          r: contact_ohm_r44
          tolerance: none
          in:
          - 0
          - 2
        RG150_r44:
          R:
          - tb_r44
          - '0'
          r: contact_ohm_r44
          tolerance: none
          in:
          - 1
        RO30_r44:
          R:
          - tb_r44
          - ia_cl
          r: contact_ohm_r44
          tolerance: none
          in:
          - 2
- title: cable
  parts:
    CCABLE:
      C:
      - ia_cl
      - '0'
      c: cable_c_f
      tolerance: none
- title: 'Cloudlifter CL-1: input'
  parts:
    RINP_cl:
      R:
      - ia_cl
      - '0'
      r: r_in_pair_ohm_cl
    CINP_cl:
      C:
      - ia_cl
      - '0'
      c: c_in_pair_f_cl
    GP_cl:
      G:
      - '0'
      - gp_cl
      - ia_cl
      - '0'
      gm: half_gm_s_cl
    RGP_cl:
      R:
      - gp_cl
      - '0'
      r: r_ideal_ohm_cl
      tolerance: none
    GN_cl:
      G:
      - gn_cl
      - '0'
      - ia_cl
      - '0'
      gm: half_gm_s_cl
    RGN_cl:
      R:
      - gn_cl
      - '0'
      r: r_ideal_ohm_cl
      tolerance: none
- title: 'Cloudlifter CL-1: amplifier'
  parts:
    J1_cl:
      jfet:
      - m1_cl
      - gp_cl
      - s1_cl
      model: FJ1_cl
    J4_cl:
      jfet:
      - dp_cl
      - s1_cl
      - m1_cl
      model: FJ4_cl
    R1_cl:
      R:
      - s1_cl
      - sc_cl
      r: r1_ohm_cl
    J3_cl:
      jfet:
      - m2_cl
      - gn_cl
      - s2_cl
      model: FJ3_cl
    J2_cl:
      jfet:
      - dn_cl
      - s2_cl
      - m2_cl
      model: FJ2_cl
    R2_cl:
      R:
      - s2_cl
      - sc_cl
      r: r2_ohm_cl
    R3_cl:
      R:
      - sc_cl
      - '0'
      r: r3_ohm_cl
- title: 'Cloudlifter CL-1: phantom and the preamp''s input'
  parts:
    VPH_cl:
      V:
      - vph_cl
      - '0'
      v: phantom_v_cl
    R6_cl:
      R:
      - vph_cl
      - dp_cl
      r: r_phantom_ohm_cl
    R7_cl:
      R:
      - vph_cl
      - dn_cl
      r: r_phantom_ohm_cl
    CBP_cl:
      C:
      - dp_cl
      - dpb_cl
      c: c_block_f_cl
    CBN_cl:
      C:
      - dn_cl
      - dnb_cl
      c: c_block_f_cl
    RPLP_cl:
      R:
      - dpb_cl
      - '0'
      r: r_pre_leg_ohm_cl
    RPLN_cl:
      R:
      - dnb_cl
      - '0'
      r: r_pre_leg_ohm_cl
    GD_cl:
      G:
      - '0'
      - ia_clean
      - dpb_cl
      - dnb_cl
      gm: diff_gm_s_cl
    RGD_cl:
      R:
      - ia_clean
      - '0'
      r: r_ideal_ohm_cl
      tolerance: none
- title: 'Clean preamp (NE5534A): input'
  parts:
    CIN_clean:
      C:
      - ia_clean
      - ib_clean
      c: c_in_f_clean
    RB_clean:
      R:
      - ib_clean
      - '0'
      r: r_bias_ohm_clean
    RN_clean:
      R:
      - ib_clean
      - ip_clean
      r: u_noise_ohm_clean
      tolerance: none
- title: 'Clean preamp (NE5534A): gain'
  parts:
    U1_clean:
      opamp:
      - ip_clean
      - fb_clean
      - uo_clean
      a0: u_a0_clean
      gbw_hz: u_gbw_hz_clean
      r_out_ohm: u_r_out_ohm_clean
      r_in_ohm: u_r_in_ohm_clean
      clamp: DCLAMP_clean
      swing_v: u_swing_v_clean
    RF_clean:
      R:
      - uo_clean
      - fb_clean
      r: r_f_ohm_clean
    CG_clean:
      C:
      - g_clean
      - '0'
      c: c_g_f_clean
    SGAIN_clean:
      switch: gain_db_clean
      parts:
        RG20_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g20_ohm_clean
          in:
          - 20
        RG30_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g30_ohm_clean
          in:
          - 30
        RG40_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g40_ohm_clean
          in:
          - 40
        RG50_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g50_ohm_clean
          in:
          - 50
        RG60_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g60_ohm_clean
          in:
          - 60
    RO_clean:
      R:
      - uo_clean
      - out
      r: r_out_ohm_clean
    RLOAD_clean:
      R:
      - out
      - '0'
      r: load_ohm_clean
      tolerance: none
