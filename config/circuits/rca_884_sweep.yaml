# RCA's linear sweep-circuit oscillator for the 884 (HYBRID_PHYSICS_PLAN.md H1: the gas-tube
# sawtooth's reference circuit). From the 884's data sheet, DATA 2 (12-15-44, 92CM-4875R1;
# sources/rca_884_1944.pdf, values in data/datasheets/published_points.yaml "884"): the
# oscillator half (the 6J7 amplifier after it is only its load here).
#
# The timing capacitor (S1: C2..C8) sits between the anode node `out` and the cathode,
# charged from +450 V through R6 (a 1 Mohm rheostat: the fine frequency) and R5. When it
# reaches the strike voltage the 884 discharges it through R4 (the peak current's limit)
# down to about its drop, then deionizes and the ramp starts again. The cathode is held at
# ~+4.6 V by the R11-R14 divider from +450 V (bypassed by C11), and the grid returns to
# ground through R3 and R2: a -4.6 V bias, a ~36 V strike on the average control
# characteristic. R1 (the sync level) feeds the input to the grid's R2 / R3 junction through
# C1 (sync at 0: the wiper on ground, C1 bypassing the junction).
#
# The tube's plasma state w (its ion density's log) sits on a 1 F capacitor (numerical: the
# state's integrator, as the lamp's thermal node).

title: "RCA 884 linear sweep oscillator"
input: in
probes: [out, a, g, k, w]

full_scale:
  input_volts_peak: {value: 1.0, source: "provisional: model knowledge (the sync input: RCA gives no level)"}
  output_volts_peak: {value: 40.0, source: "provisional: model knowledge (the sweep's peak at the anode node: the strike, ~36 V at -4.6 V on the average control characteristic)"}

controls:
  range: {value: 6, choices: [2, 3, 4, 5, 6, 7, 8], unit: position, source: "sch: S1, the timing capacitor C2..C8 (RCA 884 DATA 2, 92CM-4875R1)"}
  fine: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "sch: R6, a 1 Mohm potentiometer as a rheostat in the charging path (0: no resistance, the range's highest frequency)"}
  sync: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "sch: R1, the synchronizing-voltage potentiometer (0: the wiper on ground)"}

values:
  b_plus_v: {value: 450.0, source: "sch: +450 V (RCA 884 DATA 2)"}
  r4_ohm: {value: 450.0, source: "sch: R4 = 350-500 ohms (the middle of the range)"}
  r5_ohm: {value: 0.48e+6, source: "sch: R5 = 0.3-0.5 Mohm; 0.48 Mohm: the frequency table's R6-max / R6-min ratio (~3.1) for C2-C5 (rca_884.provenance.yaml)"}
  r6_ohm: {value: 1.0e+6, source: "sch: R6 = 1 megohm potentiometer"}
  r3_ohm: {value: 2500.0, source: "sch: R3 = 2000-3000 ohms"}
  r2_ohm: {value: 47.0e+3, source: "sch: R2 = not greater than 50000 ohms (a standard value below it)"}
  r1_ohm: {value: 5000.0, source: "sch: R1 = 5000 ohm (max.) potentiometer"}
  c1_f: {value: 0.25e-6, source: "sch: C1 = 0.25 uF or greater"}
  r11_ohm: {value: 1500.0, source: "sch: R11 = 1500 ohms"}
  r12_ohm: {value: 25.0e+3, source: "sch: R12 = 25000 ohms"}
  r13_ohm: {value: 60.0e+3, source: "sch: R13 = 60000 ohms"}
  r14_ohm: {value: 60.0e+3, source: "sch: R14 = 60000 ohms"}
  c11_f: {value: 25.0e-6, source: "sch: C11 = 25 uF, 15 V"}
  c12_f: {value: 8.0e-6, source: "sch: C12 = 8 uF, 200 V"}
  c2_f: {value: 0.25e-6, source: "sch: C2 = 0.25 uF"}
  c3_f: {value: 0.1e-6, source: "sch: C3 = 0.1 uF"}
  c4_f: {value: 0.04e-6, source: "sch: C4 = 0.04 uF"}
  c5_f: {value: 0.015e-6, source: "sch: C5 = 0.015 uF"}
  c6_f: {value: 0.005e-6, source: "sch: C6 = 0.005 uF"}
  c7_f: {value: 0.002e-6, source: "sch: C7 = 0.002 uF"}
  c8_f: {value: 0.0008e-6, source: "sch: C8 = 0.0008 uF"}
  r7_ohm: {value: 1.0e+6, source: "sch: R7 = 1 megohm (to the 6J7 through S2 and C9)"}
  c9_f: {value: 0.5e-6, source: "sch: C9 = 0.5 uF"}
  r8_ohm: {value: 0.5e+6, source: "sch: R8 = 0.5 megohm potentiometer (the 6J7's grid return)"}
  c_state_f: {value: 1.0, source: "numerical: the thyratron's state node integrator (1 V = one e-fold of ion density)"}
  w_start_v: {value: -25.0, source: "numerical: the plasma state held off for the DC operating point (ln of the density the background ionization holds against the losses, ~1e-11; free, an off tube's state is flat in w and the DC Newton singular); released at t = 0, it settles within microseconds"}
  c_start_v: {value: 0.0, source: "numerical: the timing capacitor discharged for the DC operating point (a relaxation oscillator has no stable DC state: held at 0 V, the tube starts off)"}

devices:
  V1: {device: 884@1}

sections:
  - title: oscillator
    parts:
      VB: {V: [bp, "0"], v: b_plus_v}
      # the cathode's divider
      R11: {R: [k, "0"], r: r11_ohm}
      R12: {R: [k, n12], r: r12_ohm}
      R13: {R: [n12, n13], r: r13_ohm}
      R14: {R: [n13, bp], r: r14_ohm}
      C11: {C: [k, "0"], c: c11_f}
      C12: {C: [n12, "0"], c: c12_f}
      # charging
      R6: {rheostat: [bp, n6], r: r6_ohm, at: fine}
      R5: {R: [n6, out], r: r5_ohm}
      S1:
        switch: range
        parts:
          C2: {C: [out, k], c: c2_f, in: [2], v0: c_start_v}
          C3: {C: [out, k], c: c3_f, in: [3], v0: c_start_v}
          C4: {C: [out, k], c: c4_f, in: [4], v0: c_start_v}
          C5: {C: [out, k], c: c5_f, in: [5], v0: c_start_v}
          C6: {C: [out, k], c: c6_f, in: [6], v0: c_start_v}
          C7: {C: [out, k], c: c7_f, in: [7], v0: c_start_v}
          C8: {C: [out, k], c: c8_f, in: [8], v0: c_start_v}
      # the tube
      R4: {R: [out, a], r: r4_ohm}
      XV1: {device: [a, g, w, k], model: V1}
      CW: {C: [w, k], c: c_state_f, v0: w_start_v}
      # the grid and sync
      R3: {R: [g, gj], r: r3_ohm}
      R2: {R: [gj, "0"], r: r2_ohm}
      C1: {C: [gj, sw], c: c1_f}
      R1: {pot: [in, sw, "0"], r: r1_ohm, at: sync}
      # the 6J7's input as the load (S2 on internal)
      R7: {R: [out, n7], r: r7_ohm}
      C9: {C: [n7, n8], c: c9_f}
      R8: {R: [n8, "0"], r: r8_ohm}
