# The EMI REDD.47 line / microphone amplifier (docs/CHAINS_PLAN.md WP28), from EMI's drawing
# REDD.47/C1/1 (1.10.59) and its description REDD.M47 (August 1961); sources and the trace:
# data/schematics/emi_redd47/README.md. Values cite "sch: <part>" (the drawing), "txt:" (the
# description).
#
# in -> RSRC (a 200 ohm source: txt's test condition, dropped in a chain) -> ia; T1 REDD.A92
# (1:7) into V1 (EF86, a pentode, its cathode on R4 1k / C2 100u above the feedback node x: R5
# 120 shunted by the FINE GAIN rheostat VR1 5k + R6 240); V1's anode RC-coupled to V2 (E88CC,
# both halves in parallel) as an anode follower (R8 330k in, R9 1.6M from V2's anode: the local
# feedback); V2's anode through C5 1u into T2 REDD.A83 (7:1) and on T2's primary the overall
# feedback to x through R13 47k, R14 10k || C7 330p, R15A 6k8 || R15B 120k || C8 680p (S1 GAIN:
# 34 dB shorts R13 and R14, 40 dB R13, 46 dB the whole chain). RUMBLE (txt): C14 1.8u in series
# with T1's 18 H primary and R24 3k across it. The output 2/5 - 2/6 into RLOAD, txt's 200 ohm
# test load (dropped in a chain: the next stage's input loads it).
# Supply: the 290 V line ideal (the two neon stabilisers V3 / V4; the 380 V H.T. and its RC
# filter not modelled); V1's 205 V line through R7 51k with C1 8u (sch). Not modelled: the
# heaters (6.3 V a.c.), the metering points, R23's build-out, the alternative fine-gain circuit.

title: "EMI REDD.47"
input: in
probes: [out, ia, g1, k1, x, sg1, a1, n, g2, a2, k2, tp2, r205]
full_scale:
  input_volts_peak: {value: 1.096, source: "derived: 0.775 V rms x sqrt(2), 0 dBu (as api_312.yaml)"}
  output_volts_peak: {value: 17.36, source: "derived: +24 dBu peak, the same scale as api_312.yaml's and ssl_4000e.yaml's outputs so the chains print comparably"}

controls:
  gain: {value: 40, choices: [34, 40, 46], unit: switch, source: "sch: S1 'VOLTAGE GAIN dB' 34 / 40 / 46; txt: 34, 40 or 46 dB into 200 ohm", notes: "the panel's labels"}
  rumble: {value: 0, choices: [0, 1], unit: switch, source: "txt: the rumble filter, 'used only when essential'; sch: C14 / R24 ('to remove rumble filter disconnect 2-4 and connect 3-4')", notes: "0 out (shorted), 1 in"}
  fine_gain: {value: 0.1346, min: 0.0, max: 1.0, unit: fraction, source: "sch: VR1 5k (FINE GAIN SET, a screwdriver preset), the fraction of its resistance in circuit", notes: "trimmed by scripts/redd47_trim.py for 40 dB at the mid position (txt: 'the pre-set gain control ... re-adjusted to give the nominal ... insertion gain at the mid-position of the switch')"}

values:
  source_impedance_ohm: {value: 200.0, source: "txt: 'a 200 ohm source' (the input impedance and rumble filter paragraph)"}
  r_load_ohm: {value: 200.0, source: "txt: 'with a 200 ohm load connected between terminals 2/5 and 2/6'"}
  contact_ohm: {value: 0.01, source: "provisional: model knowledge (a switch's contact, ~10 mOhm)"}
  rail_v: {value: 290.0, source: "sch: 290 V (yellow) at V3, the neon stabilisers' line (V3 / V4 150C4 / OA2 in series)"}
  c14_f: {value: 1.8e-6, source: "sch: C14 0.75-1.8 ('T1 L 18 H: 1.8 uF'); txt: 'a condenser of 1.8 uF'"}
  r24_ohm: {value: 3.0e+3, source: "sch: R24 3K"}
  t1_ratio: {value: 7.0, source: "sch: T1 REDD.A92 1:7"}
  t1_primary_h: {value: 18.0, source: "sch: 'T1 L 18 H' (the later T1's 45 H takes C14 0.75 uF)"}
  t1_turns: {value: 1962, source: "derived: 18 H on the core below at mumetall's linear limit with the gap (sqrt(L l / (mu0 mu_eff A)))"}
  t1_r_p_ohm: {value: 40.0, source: "provisional: model knowledge (a 200 ohm line primary)"}
  t1_r_s_ohm: {value: 2000.0, source: "provisional: model knowledge (a 1:7 step-up's fine-wire secondary)"}
  t1_core_material: {value: mumetall, source: "provisional: model knowledge (txt: 'very generous hum screening': a nickel-iron core in mu-metal cans)"}
  t1_core_area_m2: {value: 2.0e-5, source: "provisional: model knowledge (a small input transformer's ~4.5 mm tongue)"}
  t1_core_path_m: {value: 0.04, source: "provisional: model knowledge (~9 x the tongue)"}
  t1_gap_m: {value: 2.0e-6, source: "provisional: model knowledge (an interleaved core's joint gap)"}
  t1_leakage_h: {value: 0.002, source: "provisional: model knowledge (referred to the 200 ohm primary; txt: the leakage and the secondary's capacitance resonate, damped by R1); with t1_c_s_f chosen so that resonance sits above the band, flat within 0.2 dB to 20 kHz at 40 dB (no response curve of the REDD.47 is among the sources: REDD.47/C25 is not; 5 mH / 100 pF rose +2.4 dB at 15 kHz)"}
  t1_c_s_f: {value: 2.0e-10, source: "provisional: model knowledge (the 1:7 secondary's self-capacitance; see t1_leakage_h)"}
  c13_f: {value: 100.0e-12, source: "sch: C13 100pF (adjust on test)"}
  r1_ohm: {value: 100.0e+3, source: "sch: R1 100K"}
  r4_ohm: {value: 1.0e+3, source: "sch: R4 1K"}
  c2_f: {value: 100.0e-6, source: "sch: C2 100 (uF)"}
  r5_ohm: {value: 120.0, source: "sch: R5 120; txt: 'R5 is kept to the low value of 120 ohms'"}
  vr1_ohm: {value: 5.0e+3, source: "sch: VR1 5K; txt: 'a 5k ohms variable resistance with a 240 ohms fixed resistor R6'"}
  r6_ohm: {value: 240.0, source: "sch: R6 240"}
  r2_ohm: {value: 100.0e+3, source: "sch: R2 100K"}
  r3_ohm: {value: 390.0e+3, source: "sch: R3 390K"}
  c3_f: {value: 0.47e-6, source: "sch: C3 .47"}
  r7_ohm: {value: 51.0e+3, source: "sch: R7 51K"}
  c1_f: {value: 8.0e-6, source: "sch: C1 8 (uF)"}
  r8_ohm: {value: 330.0e+3, source: "sch: R8 330K"}
  r9_ohm: {value: 1.6e+6, source: "sch: R9 1.6M"}
  c4_f: {value: 0.02e-6, source: "sch: C4 .02"}
  r10_ohm: {value: 1.0e+6, source: "sch: R10 1M"}
  r25_ohm: {value: 1.0e+3, source: "sch: R25 1K"}
  r26_ohm: {value: 1.0e+3, source: "sch: R26 1K"}
  r11_ohm: {value: 8.2e+3, source: "sch: R11 8.2K (the forum's 82K a misreading: 18 mA at 138 V needs 8.2K)"}
  r12_ohm: {value: 200.0, source: "sch: R12 200"}
  c6_f: {value: 100.0e-6, source: "sch: C6 100 (uF)"}
  c5_f: {value: 1.0e-6, source: "sch: C5 1 (uF)"}
  t2_ratio: {value: 0.142857, source: "sch: T2 REDD.A83 7:1 (the secondary over the primary)"}
  t2_turns: {value: 3000, source: "provisional: model knowledge (an output transformer's primary for a ~8k plate load)"}
  t2_r_p_ohm: {value: 300.0, source: "provisional: model knowledge"}
  t2_r_s_ohm: {value: 8.0, source: "provisional: model knowledge"}
  t2_core_material: {value: mumetall, source: "provisional: model knowledge (a nickel-iron output transformer)"}
  t2_core_area_m2: {value: 2.0e-4, source: "provisional: model knowledge (a ~14 mm tongue and stack, a line output transformer's; txt: '+14 dBm on overload peaks': a ~8 mm tongue saturated at 20 Hz there, 1.7 T on paper)"}
  t2_core_path_m: {value: 0.1, source: "provisional: model knowledge (~7 x the tongue)"}
  t2_gap_m: {value: 2.0e-6, source: "provisional: model knowledge (an interleaved core's joint gap)"}
  t2_leakage_h: {value: 0.02, source: "provisional: model knowledge (referred to the primary; txt: the leakage's phase shift needs C7 / C8)"}
  t2_c_p_f: {value: 2.0e-10, source: "provisional: model knowledge (the primary's self-capacitance)"}
  r13_ohm: {value: 47.0e+3, source: "sch: R13 47K"}
  r14_ohm: {value: 10.0e+3, source: "sch: R14 10K"}
  c7_f: {value: 330.0e-12, source: "sch: C7 330pF"}
  r15a_ohm: {value: 6.8e+3, source: "sch: R15A 6.8K"}
  r15b_ohm: {value: 120.0e+3, source: "sch: R15B 120K"}
  c8_f: {value: 680.0e-12, source: "sch: C8 680pF"}
  passive_seed: {value: 0, source: "numerical: which set of parts a unit is built from"}
  passive_spread: {value: 0.0, source: "provisional: fraction of each part's tolerance band its deviation spans (0 = every part at its value)"}
  tol_resistor_pct: {value: 2.0, source: "sch: the ratings table, resistors '2% H.S.' (high-stability)"}
  tol_cap_pct: {value: 20.0, source: "sch: the ratings table, capacitors +-20%"}

tolerance:
  source: "provisional: classes by part type (see the tol_* values)"
  seed: passive_seed
  spread: passive_spread
  bands:
    r2: tol_resistor_pct
    cap: tol_cap_pct
  classes:
    r2: [R1, R24, R4, R5, R6, R2, R3, R7, R8, R9, R10, R25, R26, R11, R12, R13, R14, R15A, R15B]
    cap: [C13, C2, C3, C1, C4, C6, C5, C7, C8]

devices:
  V1: {device: EF86@1, tolerance: tube}
  V2A: {device: E88CC@1, tolerance: tube}
  V2B: {device: E88CC@1, tolerance: tube}

sections:
  - title: input
    parts:
      RSRC: {R: [in, ia], r: source_impedance_ohm, tolerance: none}
      SRUM:
        switch: rumble
        parts:
          RW0: {R: [ia, ip], r: contact_ohm, tolerance: none, in: [0]}
          C14: {C: [ia, ip], c: c14_f, tolerance: none, in: [1]}
          R24: {R: [ip, "0"], r: r24_ohm, in: [1]}
      T1:
        transformer:
          p: {nodes: [ip, "0"], r: t1_r_p_ohm}
          s: {nodes: [g1, "0"], ratio: t1_ratio, r: t1_r_s_ohm, c: t1_c_s_f}
        core: {material: t1_core_material, area_m2: t1_core_area_m2, path_m: t1_core_path_m, gap_m: t1_gap_m}
        turns: t1_turns
        leakage_h: t1_leakage_h
      C13: {C: [g1, n13], c: c13_f}
      R1: {R: [n13, "0"], r: r1_ohm}
  - title: first stage
    parts:
      XV1: {device: [a1, sg1, g1, k1], model: V1}
      R4: {R: [k1, x], r: r4_ohm}
      C2: {C: [k1, x], c: c2_f}
      R5: {R: [x, "0"], r: r5_ohm}
      RVR1: {rheostat: [x, x6], r: vr1_ohm, at: fine_gain, tolerance: none}
      R6: {R: [x6, "0"], r: r6_ohm}
      R2: {R: [r205, a1], r: r2_ohm}
      R3: {R: [r205, sg1], r: r3_ohm}
      C3: {C: [sg1, "0"], c: c3_f}
  - title: output stage
    parts:
      R8: {R: [a1, n], r: r8_ohm}
      R9: {R: [a2, n], r: r9_ohm}
      C4: {C: [n, g2], c: c4_f}
      R10: {R: [g2, "0"], r: r10_ohm}
      R25: {R: [g2, g2a], r: r25_ohm}
      R26: {R: [g2, g2b], r: r26_ohm}
      XV2A: {device: [a2, g2a, k2], model: V2A}
      XV2B: {device: [a2, g2b, k2], model: V2B}
      R11: {R: [rail, a2], r: r11_ohm}
      R12: {R: [k2, "0"], r: r12_ohm}
      C6: {C: [k2, "0"], c: c6_f}
      C5: {C: [a2, tp2], c: c5_f}
      T2:
        transformer:
          p: {nodes: [tp2, "0"], r: t2_r_p_ohm, c: t2_c_p_f}
          s: {nodes: [out, "0"], ratio: t2_ratio, r: t2_r_s_ohm}
        core: {material: t2_core_material, area_m2: t2_core_area_m2, path_m: t2_core_path_m, gap_m: t2_gap_m}
        turns: t2_turns
        leakage_h: t2_leakage_h
      RLOAD: {R: [out, "0"], r: r_load_ohm, tolerance: none}
  - title: overall feedback
    parts:
      R13: {R: [tp2, fr], r: r13_ohm}
      R14: {R: [fr, fq], r: r14_ohm}
      C7: {C: [fr, fq], c: c7_f}
      R15A: {R: [fq, x], r: r15a_ohm}
      R15B: {R: [fq, x], r: r15b_ohm}
      C8: {C: [fq, x], c: c8_f}
      SGAIN:
        switch: gain
        parts:
          RG34: {R: [tp2, fq], r: contact_ohm, tolerance: none, in: [34]}
          RG40: {R: [tp2, fr], r: contact_ohm, tolerance: none, in: [40]}
  - title: supply
    parts:
      VR: {V: [rail, "0"], v: rail_v}
      R7: {R: [rail, r205], r: r7_ohm}
      C1: {C: [r205, "0"], c: c1_f}
