# The Neumann M 49 c (docs/CHAINS_PLAN.md WP29), from Neumann's circuit diagram M49c-930-00
# ("gültig ab Gerät-Nr. 2660", 4.12.64; supplied by the user), the M 49 b / M 50 b operating
# instructions (April 1960) and the M 49 c / M 50 c product description (M 49 - M 50 -910-02-01).
# Sources and the trace: data/schematics/neumann_m49/README.md. Values cite "sch: <part>" (the
# drawing), "man:" (the operating instructions), "pd:" (the product description).
#
# The capsule KK 49 (2 x 78...83 pF, a dual-diaphragm capsule) is driven at its front by `in` and
# at its rear by the control input `p_rear` (pascals as volts). Its front diaphragm is the grid,
# the backplate at +58 V (R8 / R9 halve the +116 V plate supply, R2 100M) and returned to the cal
# line through C2 / C3, where R3 5M feeds the output back (the bass roll-off; man D.12: removing
# R3 makes the response flat to 20 cps). The rear diaphragm is fed from St1 pin 6 (the supply's
# continuously variable pattern potential, 0...116 V: man C.11, 0 V omni, 58 V cardioid, 116 V
# figure-8) through R11 / C7 / R1, and joins the grid at AC through C1 1000p and the head's strap
# S2 (man D.13: opened, the microphone is a fixed cardioid). The pattern control's nine positions
# are 14.5 V steps on pin 6 (the potentiometer is continuous): the polarizations the capsule part
# takes are the drawing's voltages (front: the backplate's +58 V over the grid at 0 V; rear: +58 V
# less pin 6's). C4 ("ca. 8 pF, selected") from the grid to the anode. The AC 701 k on R10 100k
# from +116 V, its cathode on R7 2.2k / C9; C6 800p at the anode; C5 1u into Ü1 (BV 11), its
# output windings strapped for 200 ohm into RLOAD (pd: the sensitivities into 1000 ohm, dropped in
# a chain). The calibration input (St1 pin 8, the cal line) is a sine source in series with R4 to
# the ground line, off (0 V) unless a measurement sets cal_v.
# Supply ideal (the NN 48 b's stabilized 116 V; the 4 V heater not simulated: +H counts as AC
# ground for C8). Not modelled: S1's 50 ohm strap, the cable, the heater's hum.

title: "Neumann M 49 c"
input: in
cv_inputs:
  p_rear: p_rear
probes: [out, g, a, k, bp, rd, cal, tp, n3]
full_scale:
  input_volts_peak: {value: 20.0, source: "derived: 20 Pa peak (117 dB SPL) at the capsule, as neumann_u47.yaml"}
  output_volts_peak: {value: 1.0960, source: "derived: 0 dBu peak, as neumann_u67.yaml"}

controls:
  pattern: {value: 4, choices: [0, 1, 2, 3, 4, 5, 6, 7, 8], unit: position, source: "sch: St1 pin 6, 'adjustable capsule polarizing voltage 0...116 V'; man C.11: 0 V omni, 58 V cardioid, 116 V figure-8 (a continuous potentiometer in the supply: pd p. 2); nine positions, 14.5 V apart", notes: "0 omni, 4 cardioid, 8 figure-8; 1-3 between omni and cardioid, 5-7 toward figure-8"}
  strap: {value: 1, choices: [0, 1], unit: switch, source: "sch: S2 (the head's strap to C1); man D.13: opened, the pattern control has no effect (a fixed cardioid)", notes: "1 closed (the remote pattern control), 0 open"}

values:
  capsule_model: {value: KK49@1, source: "config/components/kk49/1.yaml (K47@3's geometry: the same 2 x 78...83 pF capsule; its network fitted to the M 49 c's curves through this circuit by scripts/fit_kk49.py: reports/mics/kk49_fit.json)"}
  pol_front_v: {value: 58.0, source: "derived: sch: the backplate's 'ca. +58 V' (R8 / R9 halve +116 V; no DC through R2) over the grid at 0 V (R5 to the ground line)"}
  pol_rear_0_v: {value: 58.0, source: "derived: sch / man C.11: pin 6 at 0 V (omni): +58 V - 0 V"}
  pol_rear_1_v: {value: 43.5, source: "derived: pin 6 at 14.5 V: +58 V - 14.5 V"}
  pol_rear_2_v: {value: 29.0, source: "derived: pin 6 at 29 V: +58 V - 29 V"}
  pol_rear_3_v: {value: 14.5, source: "derived: pin 6 at 43.5 V: +58 V - 43.5 V"}
  pol_rear_4_v: {value: 0.0, source: "derived: sch / man C.11: pin 6 at 58 V (cardioid): +58 V - 58 V"}
  pol_rear_5_v: {value: -14.5, source: "derived: pin 6 at 72.5 V: +58 V - 72.5 V"}
  pol_rear_6_v: {value: -29.0, source: "derived: pin 6 at 87 V: +58 V - 87 V"}
  pol_rear_7_v: {value: -43.5, source: "derived: pin 6 at 101.5 V: +58 V - 101.5 V"}
  pol_rear_8_v: {value: -58.0, source: "derived: sch / man C.11: pin 6 at 116 V (figure-8): +58 V - 116 V"}
  p6_0_v: {value: 0.0, source: "man C.11: 0 volt (omni)"}
  p6_1_v: {value: 14.5, source: "derived: a ninth of the potentiometer's 0...116 V travel past omni"}
  p6_2_v: {value: 29.0, source: "derived: as p6_1_v, two steps"}
  p6_3_v: {value: 43.5, source: "derived: as p6_1_v, three steps"}
  p6_4_v: {value: 58.0, source: "man C.11: 58 volts (cardioid)"}
  p6_5_v: {value: 72.5, source: "derived: as p6_1_v, five steps"}
  p6_6_v: {value: 87.0, source: "derived: as p6_1_v, six steps"}
  p6_7_v: {value: 101.5, source: "derived: as p6_1_v, seven steps"}
  p6_8_v: {value: 116.0, source: "man C.11: 116 volts (figure-8)"}
  contact_ohm: {value: 0.01, source: "provisional: model knowledge (a strap's contact, ~10 mOhm)"}
  strap_leak_ohm: {value: 1.0e+12, source: "numerical: C1's open end's DC path with the strap open (not physical)"}
  bplus_v: {value: 116.0, source: "sch: B+ / +A '116 V' at St1 pin 5; man A: 116 volts D.C. plate"}
  r1_ohm: {value: 150.0e+6, source: "sch: R1 150 MOhm"}
  r2_ohm: {value: 100.0e+6, source: "sch: R2 100 MOhm"}
  r3_ohm: {value: 5.0e+6, source: "sch: R3 5 MOhm"}
  r4_ohm: {value: 200.0, source: "sch: R4 200 Ohm"}
  r5_ohm: {value: 150.0e+6, source: "sch: R5 150 MOhm"}
  r7_ohm: {value: 2.2e+3, source: "derived: sch: R7 printed '22 kOhm' with the cathode at '+1,6 V' and 0.73 mA: 2.2 kOhm (1.6 V / 0.73 mA = 2.19 k; 22 k would put the cathode at +16 V, the tube cut off; the builder's Eagle redraw reads 2k2)"}
  r8_ohm: {value: 1.0e+6, source: "sch: R8 1 MOhm"}
  r9_ohm: {value: 1.0e+6, source: "sch: R9 1 MOhm"}
  r10_ohm: {value: 100.0e+3, source: "sch: R10 100 kOhm"}
  r11_ohm: {value: 100.0e+6, source: "sch: R11 100 MOhm"}
  r12_ohm: {value: 2.0e+6, source: "sch: R12 2 MOhm"}
  c1_f: {value: 1000.0e-12, source: "sch: C1 1000 pF"}
  c2_f: {value: 0.01e-6, source: "sch: C2 0,01 uF"}
  c3_f: {value: 0.01e-6, source: "sch: C3 0,01 uF"}
  c4_f: {value: 1.36e-11, source: "fit: scripts/m49_trim.py, sch: C4 'ca. 8 pF abgleichen / selected' for pd's 'gain of microphone amplifier at 1 kc/s: 0 dB' (the output into 1000 ohm over the calibrating voltage, cardioid)"}
  c5_f: {value: 1.0e-6, source: "sch: C5 1 uF"}
  c6_f: {value: 800.0e-12, source: "sch: C6 800 pF"}
  c7_f: {value: 0.01e-6, source: "sch: C7 0,01 uF"}
  c8_f: {value: 0.01e-6, source: "sch: C8 0,01 uF (to +H, the heater line: AC ground here)"}
  c9_f: {value: 25.0e-6, source: "sch: C9 25 uF / 6 V"}
  # Ü1, BV 11: no winding data found. BV 8's construction (the U 47's, the same Neumann UI 30
  # microphone transformer family) as a stand-in; the ratio fitted to the source impedance.
  t_turns: {value: 2600, source: "provisional: model knowledge (as neumann_u47.yaml's BV 8: 2600 primary turns; sch: the primary in two halves, bl to bl)"}
  t_ratio: {value: 0.19715, source: "fit: scripts/m49_trim.py, pd's source resistance 200 ohm at 1 kHz (BV 11's ratio unpublished)"}
  t_r_p_ohm: {value: 628.0, source: "provisional: model knowledge (as BV 8's primary, Haufe T-7853: 628 ohm)"}
  t_r_s_ohm: {value: 17.0, source: "provisional: model knowledge (as BV 8's secondaries in series, Haufe T-7853: 17 ohm)"}
  t_core_material: {value: mumetall, source: "provisional: model knowledge (Neumann's microphone transformers: mu-metal, as BV 8 / BV 12)"}
  t_core_area_m2: {value: 1.0e-4, source: "provisional: model knowledge (as BV 8: a UI 30 core's 10 mm limb, ~10 mm stack)"}
  t_core_path_m: {value: 0.09, source: "provisional: model knowledge (as BV 8: a UI 30 core's mean path)"}
  t_gap_m: {value: 6.26e-6, source: "provisional: model knowledge (as BV 8's derived joint gap: 91 H for 2600 turns)"}
  t_leakage_h: {value: 0.1, source: "provisional: model knowledge (as BV 8: ~0.1% of the primary inductance)"}
  t_c_p_f: {value: 150.0e-12, source: "provisional: model knowledge (as BV 8: a sectioned 2600-turn primary's self-capacitance)"}
  r_load_ohm: {value: 1000.0, source: "pd: output levels 'into 1000 ohm'; load >= 1000 ohm"}
  cal_v: {value: 0.0, source: "pd: the calibrating voltage (St1 pin 8) unused: 0 V (a measurement sets a peak volts)"}
  cal_hz: {value: 1000.0, source: "pd: 'gain of microphone amplifier at 1 kc/s'"}
  passive_seed: {value: 0, source: "numerical: which set of parts a unit is built from"}
  passive_spread: {value: 0.0, source: "provisional: fraction of each part's tolerance band its deviation spans (0 = every part at its value)"}
  tol_resistor_pct: {value: 5.0, source: "provisional: model knowledge (sch: 0.1 W / 0.25 W carbon resistors, DIN 41399 / MIL-R 10509)"}
  tol_cap_pct: {value: 10.0, source: "provisional: model knowledge (paper / film capacitors)"}

tolerance:
  source: "provisional: the drawing prints no tolerances; classes by part type (see the tol_* values)"
  seed: passive_seed
  spread: passive_spread
  bands:
    r5: tol_resistor_pct
    cap: tol_cap_pct
  classes:
    r5: [R1, R2, R3, R4, R5, R7, R8, R9, R10, R11, R12]
    cap: [C1, C2, C3, C5, C6, C7, C8, C9]

devices:
  V1: {device: AC701@1, tolerance: tube}

sections:
  - title: supply
    parts:
      VB: {V: [bplus, "0"], v: bplus_v}
      R9: {R: [bplus, dv], r: r9_ohm}
      R8: {R: [dv, "0"], r: r8_ohm}
      R12: {R: [p6, cal], r: r12_ohm}
      R11: {R: [p6, p7], r: r11_ohm}
      C7: {C: [p7, "0"], c: c7_f}
  - title: capsule
    parts:
      SPAT:
        switch: pattern
        parts:
          VP0: {V: [p6, "0"], v: p6_0_v, in: [0]}
          KC0: {capsule_dual: [in, p_rear, bp, g, rd], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_0_v, in: [0]}
          VP1: {V: [p6, "0"], v: p6_1_v, in: [1]}
          KC1: {capsule_dual: [in, p_rear, bp, g, rd], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_1_v, in: [1]}
          VP2: {V: [p6, "0"], v: p6_2_v, in: [2]}
          KC2: {capsule_dual: [in, p_rear, bp, g, rd], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_2_v, in: [2]}
          VP3: {V: [p6, "0"], v: p6_3_v, in: [3]}
          KC3: {capsule_dual: [in, p_rear, bp, g, rd], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_3_v, in: [3]}
          VP4: {V: [p6, "0"], v: p6_4_v, in: [4]}
          KC4: {capsule_dual: [in, p_rear, bp, g, rd], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_4_v, in: [4]}
          VP5: {V: [p6, "0"], v: p6_5_v, in: [5]}
          KC5: {capsule_dual: [in, p_rear, bp, g, rd], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_5_v, in: [5]}
          VP6: {V: [p6, "0"], v: p6_6_v, in: [6]}
          KC6: {capsule_dual: [in, p_rear, bp, g, rd], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_6_v, in: [6]}
          VP7: {V: [p6, "0"], v: p6_7_v, in: [7]}
          KC7: {capsule_dual: [in, p_rear, bp, g, rd], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_7_v, in: [7]}
          VP8: {V: [p6, "0"], v: p6_8_v, in: [8]}
          KC8: {capsule_dual: [in, p_rear, bp, g, rd], component: capsule_model, polarization_front_v: pol_front_v, polarization_rear_v: pol_rear_8_v, in: [8]}
      R1: {R: [rd, p7], r: r1_ohm}
      C1: {C: [rd, s2], c: c1_f}
      RS2L: {R: [s2, g], r: strap_leak_ohm, tolerance: none}
      SS2:
        switch: strap
        parts:
          RS2: {R: [s2, g], r: contact_ohm, tolerance: none, in: [1]}
      R2: {R: [dv, bp], r: r2_ohm}
      C2: {C: [bp, n3], c: c2_f}
      C3: {C: [n3, cal], c: c3_f}
      R4: {R: [cal, cg], r: r4_ohm}
      VCAL: {sine: [cg, "0"], amplitude_v: cal_v, freq_hz: cal_hz}
      C8: {C: [cal, "0"], c: c8_f}
      R5: {R: [g, "0"], r: r5_ohm}
  - title: amplifier
    parts:
      XV1: {device: [a, g, k], model: V1}
      C4: {C: [g, a], c: c4_f, tolerance: none}
      R7: {R: [k, "0"], r: r7_ohm}
      C9: {C: [k, "0"], c: c9_f}
      R10: {R: [bplus, a], r: r10_ohm}
      C6: {C: [a, "0"], c: c6_f}
      C5: {C: [a, tp], c: c5_f}
      R3: {R: [tp, n3], r: r3_ohm}
      TU:
        transformer:
          p: {nodes: [tp, "0"], r: t_r_p_ohm, c: t_c_p_f}
          s: {nodes: [out, "0"], ratio: t_ratio, r: t_r_s_ohm}
        core: {material: t_core_material, area_m2: t_core_area_m2, path_m: t_core_path_m, gap_m: t_gap_m}
        turns: t_turns
        leakage_h: t_leakage_h
      RLOAD: {R: [out, "0"], r: r_load_ohm, tolerance: none}
