# edit; edit that file (or the script's patches) and rerun. The 5E3 with a bench's mods as
# panel controls (VARIAC, RECTIFIER, V1, BIAS, RESERVOIR, jumpered inputs; the script's
# docstring); at its defaults the stock amp with its cathodes heated.
#
# Fender 5E3 Deluxe guitar amplifier, as a circuit file (device builder B9 step 3).
# Built by varimu/circuit/builder.py (the format: varimu/circuit/spec.py, builder.py).
#
# Sources (data/schematics/fender_5e3/README.md has their provenance):
#   "sch: ..."         printed on Fender's schematic F-EE (schematic_f-ee.png)
#   "lay: ..."         printed on Fender's layout F-EE only (layout_f-ee.png)
#   "web: <url> ..."   a published figure (reproduction transformers, the speaker's reissue)
#   "derived: ..."     arithmetic on sourced figures
#   "provisional: ..." model knowledge; a genome parameter or replaced later
#
# The drawing prints no designators: parts are named by function. "Bright" is the
# channel whose volume wiper also feeds the tone control's .0005 (the upper channel on
# the drawing), "normal" the other. As drawn, each channel's coupling capacitor drives
# its volume pot's wiper; the pot's ends go to ground and to V2A's grid, so the two
# volumes (and the tone control) load each other. Not modeled: the heaters, the pilot
# lamp, the AC switch's .05 ground capacitor and the speaker jacks' contacts (the
# speaker is always connected; the extra speaker jack is empty).
#
# The output (`out`) is the sound pressure 1 m in front of the speaker, on axis: the
# P12R as a component (P12R@1) in the tweed Deluxe's open-back cabinet (component editor
# C3, the user's decisions 2026-10-29). `spk` is the speaker's terminal voltage.

title: "Fender 5E3 Deluxe (with mods)"
input: in
probes: [out, spk, j1b, j1n, g1b, g1n, k1, p1b, p1n, vb, vn, g2, k2, p2, g3, p3, k3, kj, oa, ob, g6a, g6b, p6a, p6b, k6, b1, b2, b3, hva, hvb]
# Guitar audio drives the input jack as a voltage (a DI through a Hi-Z input carries the
# pickup's response); the output is the sound pressure at the listening point (the user's
# decisions, DEVICE_BUILDER_PLAN.md B9 and COMPONENT_EDITOR_PLAN.md C3).
full_scale:
  input_volts_peak: {value: 1.0, source: "web: https://www.sound-au.com/articles/guitar-voltage.htm (a hot pickup peaks just under 1 V)"}
  output_pascals_peak: {value: 50.0, source: "derived: the pressure's peak, 40.0 Pa (production render 2026-10-29: the guitar take's loudest 8 s at Play's -11.5 dBFS into bright input 1, volume 1.0), rounded up for headroom"}

# Heated cathodes (device builder B6): the VARIAC takes the heaters down with B+.
heaters: {}

controls:
  # The front panel. Knobs are rotations 0..1 (the panel's 1..12).
  input_jack: {value: 1, choices: [1, 2, 3, 4, 5], unit: position, source: "sch: two inputs per channel; 5: provisional: model knowledge (jumpering the channels, a common tweed practice)", notes: "the jack the guitar is plugged into: 1 bright input 1, 2 bright input 2, 3 normal input 1, 4 normal input 2, 5 jumpered (the guitar in bright input 1, a patch cable from bright input 2 to normal input 1: both volumes blend) (input 1: both 68K in parallel; input 2: the 68K / 68K divider)"}
  volume_bright: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "sch: the bright channel's 1 MEG volume"}
  volume_normal: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "sch: the normal channel's 1 MEG volume"}
  tone: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "sch: the 1 MEG tone control", notes: "0 = dark (wiper at the .005 end)"}
  # Operating conditions.
  mains_v_rms: {value: 120.0, min: 90.0, max: 130.0, unit: V, notes: "the VARIAC: B+ and the heaters together; below ~105 V out of a US line's range (the brown-sound trick), 130 V a hot line", source: "provisional: model knowledge (US line voltage; the drawing prints none); 120 V is the replacement power transformer's rated primary (web: https://www.amplifiedparts.com/sites/default/files/associated_files/p-tgp-002.pdf)"}
  # The mods (scripts/make_fender_5e3_mods.py).
  rectifier: {value: 1, choices: [1, 2, 3], unit: position, source: "sch: 5Y3GT (1); provisional: model knowledge (2 a GZ34 in its socket, 3 silicon diodes: common swaps)", notes: "1 5Y3GT, 2 GZ34, 3 silicon"}
  v1_tube: {value: 1, choices: [1, 2], unit: position, source: "sch: 12AY7 (1); provisional: model knowledge (2 a 12AX7 in its socket, the common swap for more gain)", notes: "1 12AY7, 2 12AX7"}
  r_cathode6_ohm: {value: 250, min: 150, max: 820, unit: ohm, source: "sch: 250-5W from the 6V6 cathodes to ground; the range: provisional: model knowledge (a bias mod: lower hotter, higher colder)", notes: "BIAS"}
  c_reservoir_f: {value: 16.0e-6, choices: [4.0e-6, 8.0e-6, 16.0e-6, 32.0e-6, 47.0e-6, 100.0e-6], unit: F, source: "sch: 16-450 (the stock first filter); the steps: provisional: model knowledge (smaller sags and hums more, larger stiffens)", notes: "RESERVOIR, the first filter capacitor (B+1) alone"}
  mains_hz: {value: 60.0, min: 50.0, max: 60.0, unit: Hz, source: "provisional: model knowledge (US mains)"}

values:
  # --- The mods (scripts/make_fender_5e3_mods.py) ---------------------------------------
  jumper_cable_ohm: {value: 0.1, source: "provisional: model knowledge (a short patch cable's conductor and its plugs' contacts)"}
  jumper_cable_c_f: {value: 60.0e-12, source: "provisional: model knowledge (a ~0.5 m patch cable at ~100 pF/m)"}
  # --- Inputs (sch) ------------------------------------------------------------------
  r_input_ohm: {value: 1.0e+6, source: "sch: 1 MEG from input 1's tip to ground, each channel"}
  r_grid_stop_ohm: {value: 68.0e+3, source: "sch: 68K from each input's tip to the 12AY7 grid"}
  jack_contact_ohm: {value: 0.01, source: "provisional: model knowledge (a phone jack's contact, ~10 mOhm)", notes: "input 1's contact grounds its tip when it's empty; input 2's ties its tip to input 1's when it's empty (sch)"}

  # --- V1, 12AY7 (sch) -----------------------------------------------------------------
  r_plate1_ohm: {value: 100.0e+3, source: "sch: 100K plate loads"}
  r_cathode1_ohm: {value: 820, source: "sch: 820 from the shared cathodes to ground"}
  c_cathode1_f: {value: 25.0e-6, source: "sch: 25-25 (25 uF 25 V) across the 820"}
  c_couple1_f: {value: 0.1e-6, source: "sch: .1-400 from each plate to its volume's wiper"}

  # --- Volumes and tone (sch) ----------------------------------------------------------
  volume_pot_ohm: {value: 1.0e+6, source: "sch: 1 MEG volumes"}
  tone_pot_ohm: {value: 1.0e+6, source: "sch: 1 MEG tone"}
  audio_taper_mid: {value: 0.1, genome: fender_5e3.pots.audio_taper_mid, source: "provisional: model knowledge (the drawing prints no tapers; Fender's volume and tone pots of the era are commonly given as audio taper, ~10% of the track at half rotation)", notes: "all three pots"}
  c_tone_treble_f: {value: 0.5e-9, source: "sch: .0005 from the bright volume's wiper to the tone pot's top (mica on the layout)"}
  c_tone_bass_f: {value: 5.0e-9, source: "sch: .005-600 from the tone pot's bottom to ground"}

  # --- V2A, 12AX7 (sch, lay) -----------------------------------------------------------
  r_plate2_ohm: {value: 100.0e+3, source: "sch: 100K plate load"}
  r_cathode2_ohm: {value: 1500, source: "sch: 1500 cathode resistor"}
  c_cathode2_f: {value: 25.0e-6, source: "sch: 25-25 across the 1500"}
  c_couple2_f: {value: 0.02e-6, source: "lay: .02 MFD 600 V from V2A's plate to the inverter's grid (the schematic prints no value)"}

  # --- V2B, 12AX7 cathodyne inverter (sch) ---------------------------------------------
  r_plate3_ohm: {value: 56.0e+3, source: "sch: 56K plate load"}
  r_cathode3_ohm: {value: 1500, source: "sch: 1500 from the cathode to the tail"}
  r_tail_ohm: {value: 56.0e+3, source: "sch: 56K tail to ground"}
  r_grid3_ohm: {value: 1.0e+6, source: "sch: 1 MEG grid leak to the 1500 / 56K junction"}
  c_couple3_plate_f: {value: 0.1e-6, source: "sch: .1-400 from the plate"}
  c_couple3_cathode_f: {value: 0.1e-6, source: "sch: .1-200 from the cathode"}
  r_grid6_ohm: {value: 220.0e+3, source: "sch: 220K grid leaks"}
  r_grid6_stop_ohm: {value: 1500, source: "sch: 1500 grid stoppers"}

  # --- 6V6GT pair (sch) ----------------------------------------------------------------
  # (r_cathode6_ohm, the BIAS dial, is a control.)
  c_cathode6_f: {value: 25.0e-6, source: "sch: 25-25 across the 250"}

  # --- Output transformer (Triad 50246 original; no original data) -------------------
  # A designed component since C2 (docs/COMPONENT_EDITOR_PLAN.md): its construction fitted
  # to Amplified Parts' reproduction P-TGO-002 (config/designs/ot_5e3.yaml,
  # scripts/fit_ot_5e3.py). The hand-specified version 1 (P-TGO-002's figures with an even
  # leakage split) is in git history before 2026-11-04 and in fender_5e3_drawn.
  ot_model: {value: OT_5E3@2, source: "config/components/ot_5e3/2.yaml (the 5E3 OT by construction, fitted to P-TGO-002: web: https://www.amplifiedparts.com/sites/default/files/associated_files/p-tgo-002.pdf)"}

  # --- Speaker, cabinet and listening point (component editor C3) ----------------------
  # The P12R reissue as a component (its sources and fit: config/components/p12r/1.yaml);
  # the original was a Jensen P12R or P12Q (README, "Speaker"). The tweed Deluxe's
  # open-back pine cabinet: a vintage 1956 5E3's outer dimensions.
  speaker_model: {value: P12R@1, source: "web: https://cdn.shopify.com/s/files/1/0543/2003/8061/files/Specification_Sheet_-_P12R___Jensen_Loudspeakers.pdf (the reissue's sheet; the component's fit)"}
  listen_distance_m: {value: 1.0, source: "the user's choice (2026-10-29): 1 m on axis, the sheet's measuring distance and in the far field"}
  cab_width_m: {value: 0.504825, source: "web: https://retrofret.com/products/fender-deluxe-5e3-tube-amplifier-1956-10761 (19 7/8 in wide, a 1956 5E3)"}
  cab_height_m: {value: 0.41275, source: "web: same listing (16 1/4 in tall)"}
  cab_depth_m: {value: 0.2413, source: "web: same listing (9 1/2 in deep); a 1960 example and a reproduction cabinet give 20 x 15 3/4..16 x 9 1/2 in (README)"}
  cab_offset_x_m: {value: 0.0, source: "provisional: model knowledge (the speaker centred left to right on the baffle)"}
  cab_offset_y_m: {value: 0.0, genome: fender_5e3.speaker.offset_y_m, source: "provisional: model knowledge (the speaker about centred top to bottom on the baffle)"}

  # --- Power supply ----------------------------------------------------------------------
  # Triad 6452 original, no data; Amplified Parts' reproduction P-TGP-002 (120 V
  # primary): 350.7 V per HV half unloaded, DCR primary 3.4, HV 174 ohm. Its kit's
  # measured voltages are the DC targets (README, "Published voltages").
  pt_hv_half_rms_v: {value: 350.7, genome: fender_5e3.psu.pt_hv_half_rms_v, source: "web: https://www.amplifiedparts.com/sites/default/files/associated_files/p-tgp-002.pdf (350.7 V per half unloaded at 120 V)", notes: "open-circuit rms per HV half behind pt_r_half_ohm, at mains_v_rms = 120 V"}
  pt_r_half_ohm: {value: 116.0, genome: fender_5e3.psu.pt_r_half_ohm, source: "derived: HV DCR 174 ohm end to end (half: 87) + the primary's 3.4 ohm referred to a half, 3.4 x (350.7 / 120)^2 = 29 (same sheet)", notes: "the heaters' load on the primary (~0.5% sag) isn't modeled"}
  pt_leakage_h: {value: 10.0e-3, genome: fender_5e3.psu.pt_leakage_h, source: "provisional: model knowledge (leakage per HV half of a ~50 W mains transformer)"}
  pt_c_half_f: {value: 300.0e-12, genome: fender_5e3.psu.pt_winding_capacitance_f, source: "provisional: model knowledge (self-capacitance per HV half; a capacitance on every rectifier node, CLAUDE.md)"}
  rectifier_tube: {value: 5Y3GT@1, source: "sch: 5Y3GT full-wave rectifier, B+ from its filament; config/components/5y3gt/1.yaml (per section)"}
  c_filter_f: {value: 16.0e-6, source: "sch: 16-450 at each of the three nodes"}
  r_b12_ohm: {value: 5000, source: "sch: 5000 from the rectifier's filament (B+1, the output transformer's centre tap) to the screens (B+2)"}
  r_b23_ohm: {value: 22.0e+3, source: "sch: 22K from B+2 to B+3 (V1, V2A, the inverter)"}
  numerical_leak_ohm: {value: 1.0e+9, source: "numerical: DC path for the B+ nodes (the 5E3 has no bleeder; not physical)"}

  # --- Per-instance tolerance (the drawing prints no tolerances) --------------------------
  passive_seed: {value: 0, genome: passives.seed, source: "numerical: which set of parts a unit is built from"}
  passive_spread: {value: 0.0, genome: passives.spread, source: "provisional: fraction of each part's tolerance band its deviation spans (0 = every part at its printed value)"}
  tol_resistor_pct: {value: 10.0, source: "provisional: model knowledge (carbon composition resistors of the era, 10%)"}
  tol_wirewound_pct: {value: 5.0, source: "provisional: model knowledge (the 250-5W wirewound cathode resistor)"}
  tol_pot_pct: {value: 20.0, genome: passives.pot_pct, source: "provisional: model knowledge (carbon potentiometers, +-10..20%)"}
  tol_paper_pct: {value: 20.0, genome: passives.paper_capacitor_pct, source: "provisional: model knowledge (paper capacitors of the 1950s, +-10..20%)"}
  tol_mica_pct: {value: 10.0, genome: passives.mica_capacitor_pct, source: "provisional: model knowledge (small mica capacitors, +-5..20%)"}
  tol_electrolytic_minus_pct: {value: 20.0, genome: passives.electrolytic_minus_pct, source: "provisional: model knowledge (1950s electrolytics, -10..-20%)"}
  tol_electrolytic_plus_pct: {value: 50.0, genome: passives.electrolytic_plus_pct, source: "provisional: model knowledge (1950s electrolytics, +50..+100%)"}
  tube_emission_pct: {value: 10.0, genome: tubes.instance.emission_pct, source: "provisional: model knowledge (plate current of new tubes of one type at fixed bias, +-10..20%)"}
  tube_mu_pct: {value: 3.0, genome: tubes.instance.mu_pct, source: "provisional: model knowledge (grid-pitch tolerance, a few %)"}

mains:
  v_rms: mains_v_rms
  hz: mains_hz
  rated_v_rms: {value: 120.0, source: "web: https://www.amplifiedparts.com/sites/default/files/associated_files/p-tgp-002.pdf (the reproduction power transformer's primary; its voltages are taken at it)"}

tolerance:
  source: "provisional: the drawing prints no tolerances; classes by part type (see the tol_* values)"
  seed: passive_seed
  spread: passive_spread
  tube: {emission_pct: tube_emission_pct, mu_pct: tube_mu_pct}
  bands:
    r10: tol_resistor_pct
    wirewound: tol_wirewound_pct
    pot: tol_pot_pct
    paper: tol_paper_pct
    mica: tol_mica_pct
    electrolytic: [tol_electrolytic_minus_pct, tol_electrolytic_plus_pct]
  classes:
    r10: [RIN1B, RIN1N, RGAB, RGBB, RGAN, RGBN, RPL1B, RPL1N, RK1, RPL2, RK2, RPL3, RK3, RTAIL, RG3, RGLA, RGLB, RGSA, RGSB, RB12, RB23]
    wirewound: [RK6]
    pot: [RVOLB, RVOLN, RTONE]
    paper: [CC1B, CC1N, CTB, CC2, CC3A, CC3B]
    mica: [CTT]
    electrolytic: [CK1, CK2, CK6, CB1, CB2, CB3]

devices:
  V1B: {device: 12AY7@1, tolerance: tube}
  V1N: {device: 12AY7@1, tolerance: tube}
  V1BX: {device: 12AX7@1, tolerance: tube}
  V1NX: {device: 12AX7@1, tolerance: tube}
  V2A: {device: 12AX7@1, tolerance: tube}
  V2B: {device: 12AX7@1, tolerance: tube}
  V6A: {device: 6V6GT@1, tolerance: tube}
  V6B: {device: 6V6GT@1, tolerance: tube}
  V5: {device: rectifier_tube, tolerance: tube}
  V5G: {device: GZ34@1, tolerance: tube}
  V5S: {device: SI_RECTIFIER@1}

sections:
  - title: power supply
    parts:
      # The HV halves from the mains at phase 90 / 270 (a run starts at the peak), the
      # 5Y3GT (its filament is B+1), then 5000 and 22K to the other filter nodes (sch).
      VHVA: {mains: [hv_a, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 90.0}
      VHVB: {mains: [hv_b, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 270.0}
      RPTA: {R: [hv_a, hv_ar], r: pt_r_half_ohm, tolerance: none}
      LPTA: {L: [hv_ar, hva], l: pt_leakage_h}
      RPTB: {R: [hv_b, hv_br], r: pt_r_half_ohm, tolerance: none}
      LPTB: {L: [hv_br, hvb], l: pt_leakage_h}
      CPTA: {C: [hva, "0"], c: pt_c_half_f, tolerance: none}
      CPTB: {C: [hvb, "0"], c: pt_c_half_f, tolerance: none}
      SRECT:
        switch: rectifier
        parts:
          XV5A: {device: [hva, b1], model: V5, in: [1]}
          XV5B: {device: [hvb, b1], model: V5, in: [1]}
          XV5GA: {device: [hva, b1], model: V5G, in: [2]}
          XV5GB: {device: [hvb, b1], model: V5G, in: [2]}
          D5SA: {device: [hva, b1], model: V5S, in: [3]}
          D5SB: {device: [hvb, b1], model: V5S, in: [3]}
      CB1: {C: [b1, "0"], c: c_reservoir_f}
      RB12: {R: [b1, b2], r: r_b12_ohm}
      CB2: {C: [b2, "0"], c: c_filter_f}
      RB23: {R: [b2, b3], r: r_b23_ohm}
      CB3: {C: [b3, "0"], c: c_filter_f}
      RLEAK: {R: [b1, "0"], r: numerical_leak_ohm, tolerance: none}

  - title: inputs
    parts:
      # Each channel (sch): 1 MEG from input 1's tip j1 to ground, 68K from j1 to the
      # grid, 68K from the grid to input 2's tip j2. Input 1's contact grounds j1 when
      # it's empty; input 2's ties j2 to j1 when it's empty.
      RIN1B: {R: [j1b, "0"], r: r_input_ohm}
      RGAB: {R: [j1b, g1b], r: r_grid_stop_ohm}
      RGBB: {R: [g1b, j2b], r: r_grid_stop_ohm}
      SINB:
        switch: input_jack
        parts:
          RJ1B_IN: {R: [in, j1b], r: jack_contact_ohm, tolerance: none, in: [1, 5]}
          RJ1B_GND: {R: [j1b, "0"], r: jack_contact_ohm, tolerance: none, in: [2, 3, 4]}
          RJ2B_IN: {R: [in, j2b], r: jack_contact_ohm, tolerance: none, in: [2]}
          RJ2B_J1: {R: [j2b, j1b], r: jack_contact_ohm, tolerance: none, in: [1, 3, 4]}
          # 5: the patch cable from bright input 2 to normal input 1.
          RJUMP: {R: [j2b, j1n], r: jumper_cable_ohm, tolerance: none, in: [5]}
          CJUMP: {C: [j2b, "0"], c: jumper_cable_c_f, tolerance: none, in: [5]}
      RIN1N: {R: [j1n, "0"], r: r_input_ohm}
      RGAN: {R: [j1n, g1n], r: r_grid_stop_ohm}
      RGBN: {R: [g1n, j2n], r: r_grid_stop_ohm}
      SINN:
        switch: input_jack
        parts:
          RJ1N_IN: {R: [in, j1n], r: jack_contact_ohm, tolerance: none, in: [3]}
          RJ1N_GND: {R: [j1n, "0"], r: jack_contact_ohm, tolerance: none, in: [1, 2, 4]}
          RJ2N_IN: {R: [in, j2n], r: jack_contact_ohm, tolerance: none, in: [4]}
          RJ2N_J1: {R: [j2n, j1n], r: jack_contact_ohm, tolerance: none, in: [1, 2, 3, 5]}

  - title: 12AY7 and controls
    parts:
      # Both triodes on one cathode resistor (sch).
      SV1:
        switch: v1_tube
        parts:
          XV1B: {device: [p1b, g1b, k1], model: V1B, in: [1]}
          XV1N: {device: [p1n, g1n, k1], model: V1N, in: [1]}
          XV1BX: {device: [p1b, g1b, k1], model: V1BX, in: [2]}
          XV1NX: {device: [p1n, g1n, k1], model: V1NX, in: [2]}
      RK1: {R: [k1, "0"], r: r_cathode1_ohm}
      CK1: {C: [k1, "0"], c: c_cathode1_f}
      RPL1B: {R: [b3, p1b], r: r_plate1_ohm}
      RPL1N: {R: [b3, p1n], r: r_plate1_ohm}
      # Each plate drives its volume's wiper; the volumes' ends: ground (rotation 0) and
      # V2A's grid g2 (sch).
      CC1B: {C: [p1b, vb], c: c_couple1_f}
      CC1N: {C: [p1n, vn], c: c_couple1_f}
      RVOLB: {pot: ["0", vb, g2], r: volume_pot_ohm, at: volume_bright, taper_mid: audio_taper_mid}
      RVOLN: {pot: ["0", vn, g2], r: volume_pot_ohm, at: volume_normal, taper_mid: audio_taper_mid}
      # Tone: the pot's wiper on g2, its top through .0005 to the bright wiper vb, its
      # bottom through .005 to ground (sch).
      CTT: {C: [vb, tt], c: c_tone_treble_f}
      RTONE: {pot: [tb, g2, tt], r: tone_pot_ohm, at: tone, taper_mid: audio_taper_mid}
      CTB: {C: [tb, "0"], c: c_tone_bass_f}

  - title: 12AX7 and inverter
    parts:
      XV2A: {device: [p2, g2, k2], model: V2A}
      RK2: {R: [k2, "0"], r: r_cathode2_ohm}
      CK2: {C: [k2, "0"], c: c_cathode2_f}
      RPL2: {R: [b3, p2], r: r_plate2_ohm}
      CC2: {C: [p2, g3], c: c_couple2_f}
      # Cathodyne (sch): 56K plate load, 1500 + 56K from the cathode, the grid leak to
      # their junction kj; outputs from the plate and the cathode.
      XV2B: {device: [p3, g3, k3], model: V2B}
      RPL3: {R: [b3, p3], r: r_plate3_ohm}
      RK3: {R: [k3, kj], r: r_cathode3_ohm}
      RTAIL: {R: [kj, "0"], r: r_tail_ohm}
      RG3: {R: [g3, kj], r: r_grid3_ohm}
      CC3A: {C: [p3, oa], c: c_couple3_plate_f}
      CC3B: {C: [k3, ob], c: c_couple3_cathode_f}
      RGLA: {R: [oa, "0"], r: r_grid6_ohm}
      RGLB: {R: [ob, "0"], r: r_grid6_ohm}
      RGSA: {R: [oa, g6a], r: r_grid6_stop_ohm}
      RGSB: {R: [ob, g6b], r: r_grid6_stop_ohm}

  - title: output
    parts:
      # The 6V6GT pair on one cathode resistor, screens on B+2, plates on the output
      # transformer's ends, its centre tap on B+1 (sch).
      XV6A: {device: [p6a, b2, g6a, k6], model: V6A}
      XV6B: {device: [p6b, b2, g6b, k6], model: V6B}
      RK6: {R: [k6, "0"], r: r_cathode6_ohm}
      CK6: {C: [k6, "0"], c: c_cathode6_f}
      # The halves from the plates to the centre tap (pa wound first, its start at V6A's
      # plate; pb from the tap out to V6B's), the secondary over them (OT_5E3's design).
      T1:
        transformer:
          pa: {nodes: [p6a, b1]}
          pb: {nodes: [b1, p6b]}
          s: {nodes: [spk, "0"]}
        component: ot_model
      # The speaker on the secondary; `out` is its sound pressure at the listening point
      # (pascals as volts: varimu.devices.speaker).
      SPK:
        speaker: [spk, "0", out]
        component: speaker_model
        distance_m: listen_distance_m
        width_m: cab_width_m
        height_m: cab_height_m
        depth_m: cab_depth_m
        offset_x_m: cab_offset_x_m
        offset_y_m: cab_offset_y_m
