sections:
- title: 'Shure SM57: cartridge'
  parts:
    MC_sm57:
      moving_coil:
      - in
      - p_rear
      - cp_sm57
      - cm_sm57
      component: cartridge_model_sm57
    RCL_sm57:
      R:
      - cm_sm57
      - '0'
      r: coil_leak_ohm_sm57
      tolerance: none
- title: 'Shure SM57: transformer'
  parts:
    T1_sm57:
      transformer:
        p:
          nodes:
          - cp_sm57
          - cm_sm57
        s1:
          nodes:
          - ia_helios
          - tap_sm57
        s2:
          nodes:
          - tap_sm57
          - red_sm57
      component: transformer_model_sm57
    SIMP_sm57:
      switch: impedance_sm57
      parts:
        RH_sm57:
          R:
          - red_sm57
          - '0'
          r: min_ohm_sm57
          tolerance: none
          in:
          - 0
        RL_sm57:
          R:
          - tap_sm57
          - '0'
          r: min_ohm_sm57
          tolerance: none
          in:
          - 1
- title: cable
  parts:
    CCABLE:
      C:
      - ia_helios
      - '0'
      c: cable_c_f
      tolerance: none
- title: 'Helios mic amplifier (IA-H9): rails'
  parts:
    VP_helios:
      V:
      - vp_helios
      - '0'
      v: supply_v_helios
    VN_helios:
      V:
      - vn_helios
      - '0'
      v: supply_neg_v_helios
    R23_helios:
      R:
      - vp_helios
      - vpm_helios
      r: r23_ohm_helios
    CP4_helios:
      C:
      - vpm_helios
      - '0'
      c: pc4_f_helios
    CP3_helios:
      C:
      - '0'
      - vn_helios
      c: pc3_f_helios
    R48_helios:
      R:
      - vp_helios
      - vpo_helios
      r: r48_ohm_helios
    CP6_helios:
      C:
      - vpo_helios
      - '0'
      c: pc6_f_helios
    CP7_helios:
      C:
      - '0'
      - vn_helios
      c: pc7_f_helios
- title: 'Helios mic amplifier (IA-H9): input'
  parts:
    T1_helios:
      transformer:
        p:
          nodes:
          - ia_helios
          - '0'
          r: t1_r_pri_ohm_helios
        s1:
          nodes:
          - tap_helios
          - '0'
          ratio: t1_ratio_tap_helios
          r: t1_r_tap_ohm_helios
        s2:
          nodes:
          - top_helios
          - tap_helios
          ratio: t1_ratio_rest_helios
          r: t1_r_rest_ohm_helios
          c: t1_c_sec_f_helios
      core:
        material: t1_core_material_helios
        area_m2: t1_core_area_m2_helios
        path_m: t1_core_path_m_helios
        gap_m: t1_gap_m_helios
      turns: t1_turns_helios
      leakage_h: t1_leakage_h_helios
    SPAD_helios:
      switch: pad_helios
      parts:
        RPAD0_helios:
          R:
          - top_helios
          - sw_helios
          r: contact_ohm_helios
          tolerance: none
          in:
          - 0
        RPAD1_helios:
          R:
          - tap_helios
          - sw_helios
          r: contact_ohm_helios
          tolerance: none
          in:
          - 1
- title: 'Helios mic amplifier (IA-H9): mic amp'
  parts:
    C1_helios:
      C:
      - sw_helios
      - b1_helios
      c: c1_f_helios
    C2_helios:
      C:
      - b1_helios
      - vn_helios
      c: c2_f_helios
    R10_helios:
      R:
      - vpm_helios
      - vb_helios
      r: r10_ohm_helios
    CP2_helios:
      C:
      - vb_helios
      - '0'
      c: pc2_f_helios
    R6_helios:
      R:
      - vb_helios
      - b1_helios
      r: r6_ohm_helios
    R7_helios:
      R:
      - b1_helios
      - vn_helios
      r: r7_ohm_helios
    Q1_helios:
