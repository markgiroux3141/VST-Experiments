    value: 0
    choices:
    - 0
    - 1
    unit: position
    source: 's68: ''Impedance: Dual. 30-50 ohms and 150-250 ohms. (Connected for 150-250 ohms when shipped)'''
    notes: 0 'H' 150-250 ohm (RED to pin 3), 1 'L' 30-50 ohm (ORANGE to pin 3)
  gain_helios:
    value: 50
    choices:
    - 20
    - 30
    - 40
    - 50
    - 60
    - 70
    unit: switch
    source: 'web: the IA-H9 schematic (SW2 GAIN, positions A1-A6 labelled 20-70: R1 56K, R2 22K, R3 5.1K,
      R4 1.5K, R5 460R, R8 110R from C4 to ground)'
