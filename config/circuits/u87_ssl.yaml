          - p_rear
          - bp_u87
          - fd_u87
          - fd_u87
          component: capsule_model_u87
          polarization_front_v: pol_front_v_u87
          polarization_rear_v: pol_rear_card_v_u87
          in:
          - 1
        KC2_u87:
          capsule_dual:
          - in
          - p_rear
          - bp_u87
          - fd_u87
          - fd_u87
          component: capsule_model_u87
          polarization_front_v: pol_front_v_u87
          polarization_rear_v: pol_rear_eight_v_u87
          in:
          - 2
    SPAD_u87:
      switch: pad_u87
      parts:
        C15_u87:
          C:
          - bp_u87
          - '0'
          c: c15_f_u87
          in:
          - 1
