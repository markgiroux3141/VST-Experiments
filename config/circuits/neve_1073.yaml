# GENERATED by scripts/make_neve_1073.py: edit it and rerun.
#
# The Neve 1073's mic path (docs/CHAINS_PLAN.md WP11, DEVICE_BUILDER_PLAN.md B13), from Neve's
# 1973-74 drawings (data/schematics/neve_1073/README.md: EH10023, EK20033, EX/10283 BA283 AV,
# EX/10284 BA284). Values cite "neve: <drawing> <part>".
#
# in -> RSRC (a 150 ohm generator, dropped in a chain) -> ia, the mic's hot pin (A), cold (B)
# grounded; T1 10468 with S1 HI / LO (its two primaries in series, 1200 ohm, or in parallel,
# 300 ohm); the secondary's pin 7 to S2a's wiper (n3), pin 10 to ground, C1 180p across it.
# SENSITIVITY (S2, the mic positions -80 to -20 dBm):
#   -80 to -55: n3 into the BA284's pre stage (U); its output (P) feeds the ladder R20 / R21 /
#   R22 / R11 to ground, S2b picks a tap of it onto n6, the BA283's pre stage input (U);
#   -50 to -20: the BA284 bypassed, n3 into n6 through an L-pad (series R3-R6, shunt R13-R18);
#   S2c puts R29 120 (-80, -50) or R30 330 (-75, -45) from the BA283's T to ground (5 dB
#   steps), open elsewhere. The BA284's T has R10 91 to ground (its gain fixed, ~30 dB).
# The BA283's pre stage output (P) -> its output stage input (L), the EQ and high-pass
# switched out and not modelled (EH10023's BA205 / BA211 / BA182 and the BA284's EQ
# amplifiers: B13's later step), the EXT LINK closed. The output stage (TR1-TR3, TR3 a
# class-A TO-3 into the LO1166's primary from M) with K's R44 1k5 + C5 100u; the LO1166's
# secondary with its Zobel (R64 1k5, C9 .01) into a 600 ohm load: `out`.
# Supply: an ideal +24 V (B+, the 1073's rack supply) through R56 12 to M (C7 / C8 470u), R51
# 270 to the BA283's N (C4 470u), R57 120 to the BA284's N (C10 470u).
#
# Stand-ins (provisional): the BC184C (no card) by the BC550C, TR3's BDY61 (parts list) /
# 2N3055 (drawing) by RCA's 2N6254 (the same hometaxial TO-3 class); both transformers'
# constructions (only their wiring is drawn).

