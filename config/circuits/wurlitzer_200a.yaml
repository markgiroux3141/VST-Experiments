sections:
  - title: plate
    parts:
      RIN: {R: [in, "0"], r: r_in_ohm, tolerance: none}
      CREEDS: {C: [in, pk], c: c_reeds_f, tolerance: none}
      CPLATE: {C: [pk, "0"], c: c_plate_stray_f, tolerance: none}
      R1: {R: [pk, pa], r: r1_ohm}
      R2: {R: [hv150, pa], r: r2_ohm}
      C1: {C: [pa, b1], c: c1_f}

  - title: preamp
    parts:
      DD1: {device: [x, b1], model: D1}
      C2: {C: [b1, x], c: c2_f}
      R3: {R: [b1, j2], r: r3_ohm}
      QTR1: {bjt: [c1, b1, e1], model: TR1}
      R4: {R: [v15, c1], r: r4_ohm}
      C3: {C: [c1, b1], c: c3_f}
      R5: {R: [e1, x], r: r5_ohm}
      C5: {C: [e1, x], c: c5_f}
      QTR2: {bjt: [c2, c1, e2], model: TR2}
      R6: {R: [v15, c2], r: r6_ohm}
      C4: {C: [c2, c1], c: c4_f}
      R7: {R: [e2, j2], r: r7_ohm}
      R8: {R: [j2, "0"], r: r8_ohm}
      C7: {C: [e2, "0"], c: c7_f}
      C6: {C: [c2, po], c: c6_f}
      R10: {R: [po, x], r: r10_ohm}
      R9: {R: [po, p3], r: r9_ohm}
