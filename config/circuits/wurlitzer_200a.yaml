  - title: vibrato oscillator
    parts:
      R18: {R: [v15, la], r: r18_ohm}
      R17: {rheostat: [lk, c34], r: r17_ohm, at: vib_trim}
      QTR3: {bjt: [c34, b3, e3], model: TR3}
      QTR4: {bjt: [c34, e3, "0"], model: TR4}
      R15: {R: [b3, "0"], r: r15_ohm}
      R16: {R: [e3, "0"], r: r16_ohm}
      C17: {C: [c34, tt], c: c17_f}
