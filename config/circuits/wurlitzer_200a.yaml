      RVIB: {pot: ["0", vw, x], r: r_vibrato_ohm, at: vibrato}
      R18K: {R: [x, vw], r: r_vib_series_ohm}
      XLG1: {device: [la, lk, lgs, vw, "0"], model: LG1}
