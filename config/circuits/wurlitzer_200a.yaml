  v15_v: {value: 15.0, source: "the drawing: '+15 V DC to preamp' (IC-1, 142349, regulating from +22.5 V; ideal here: its output impedance and ripple rejection aren't modelled)"}
  r49_ohm: {value: 56.0e+3, source: "the drawing: R49 56K"}
  r50_ohm: {value: 8.2e+6, source: "the drawing: R50 8.2 MEG"}
  r51_ohm: {value: 1.0e+6, source: "the drawing: R51 1 MEG"}
  r52_ohm: {value: 22.0e+6, source: "the drawing: R52 22 MEG"}
  r56_ohm: {value: 1.0e+6, source: "the drawing: R56 1 MEG"}
