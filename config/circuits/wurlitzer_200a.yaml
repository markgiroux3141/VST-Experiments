  c31_f: {value: 0.33e-6, source: "the drawing: C31 .33"}
  c34_f: {value: 0.33e-6, source: "the drawing: C34 .33"}
  hv30_v0: {value: 156.8, source: "numerical: C30's start voltage at its steady state (the megohm filter takes seconds to charge; held for the operating point only)"}
  hv31_v0: {value: 150.0, source: "numerical: C31's and C34's start voltage at their steady state (R51 / R52's divider of C30's)"}

