sections:
- title: 'Neumann U47: supply'
  parts:
    VNG_u47:
      V:
      - ng_u47
      - '0'
      v: ng_open_v_u47
    RNG_u47:
      R:
      - ng_u47
      - b105_u47
      r: ng_r_ohm_u47
      tolerance: none
    CNG_u47:
      C:
      - b105_u47
      - '0'
      c: ng_c_f_u47
      tolerance: none
- title: 'Neumann U47: capsule'
  parts:
    R7_u47:
      R:
      - b105_u47
      - pt_u47
      r: r7_ohm_u47
    R8_u47:
      R:
      - pt_u47
      - '0'
      r: r8_ohm_u47
    R1_u47:
      R:
      - pt_u47
      - bp_u47
      r: r1_ohm_u47
    C1_u47:
      C:
      - bp_u47
      - '0'
      c: c1_f_u47
    R2_u47:
      R:
      - g_u47
      - '0'
      r: r2_ohm_u47
    SPAT_u47:
      switch: pattern_u47
      parts:
        KK47C_u47:
          capsule_dual:
          - in
          - p_rear
          - bp_u47
          - g_u47
          - rear_e_u47
          component: capsule_model_u47
          polarization_front_v: polarization_v_u47
          in:
          - 0
        RREAR_u47:
          R:
          - rear_e_u47
          - bp_u47
          r: rear_leak_ohm_u47
          tolerance: none
          in:
          - 0
        KK47O_u47:
          capsule_dual:
          - in
          - p_rear
          - bp_u47
          - g_u47
          - g_u47
          component: capsule_model_u47
          polarization_front_v: polarization_v_u47
          polarization_rear_v: polarization_v_u47
          in:
          - 1
