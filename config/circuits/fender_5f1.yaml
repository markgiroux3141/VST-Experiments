# Fender 5F1 Champ (late 1950s tweed), as a circuit file: one 12AX7 (two cascaded stages, the
# volume between them), a single-ended 6V6GT in cathode bias with negative feedback to the
# second stage's cathode, a 5Y3GT, an 8 in speaker in an open-back pine cabinet. Built by
# varimu/circuit/builder.py.
#
# Sources (data/schematics/fender_5f1/README.md has their provenance and the choices):
#   "sch: ..."         printed on Fender's schematic K-EE
#   "lay: ..."         printed on Fender's layout K-EE only (its voltages too)
#   "web: <url> ..."   a reproduction part's or a datasheet's figure
#   "derived: ..."     arithmetic on sourced figures
#   "provisional: ..." model knowledge; a genome parameter or replaced later
#
# Not modeled: the heaters, the pilot lamp, the fuse, the .05-600 line capacitor, the AC
# switch on the volume pot. The output (`out`) is the sound pressure 1 m in front of the
# speaker on axis (pascals as volts), the P8R reissue standing in for the original's Jensen
# P8T / Oxford 8EV; `spk` is its terminal voltage.

title: "Fender 5F1 Champ"
input: in
probes: [out, spk, j1, g1a, k1a, p1a, vol, k1b, p1b, g6, k6, p6, b1, b2, b3, hva, hvb]
full_scale:
  input_volts_peak: {value: 1.0, source: "web: https://www.sound-au.com/articles/guitar-voltage.htm (a hot pickup peaks just under 1 V; as the 5E3)"}
  output_pascals_peak: {value: 30.0, source: "derived: the pressure's peak, 7.9 / 20.9 Pa at VOLUME 0.5 / 1.0 (production render 2026-11-12: 4 s of the dry guitar take at Play's -11.5 dBFS into input 1), rounded up for headroom"}

controls:
  input_jack: {value: 1, choices: [1, 2], unit: position, source: "sch: two inputs", notes: "1 the high input (both 68K in parallel), 2 the low one (the 68K / 68K divider)"}
  volume: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "sch: the 1 MEG volume"}
  mains_v_rms: {value: 120.0, min: 105.0, max: 127.0, unit: V, source: "provisional: model knowledge (US line voltage; the drawing prints none); 120 V is the reproduction power transformer's rated primary (web: https://www.amplifiedparts.com/sites/default/files/associated_files/p-tgp-001.pdf)"}
  mains_hz: {value: 60.0, min: 50.0, max: 60.0, unit: Hz, source: "provisional: model knowledge (US mains)"}

values:
  # --- Inputs (sch) ------------------------------------------------------------------------
  r_input_ohm: {value: 1.0e+6, source: "sch: 1 MEG from input 1's tip to ground"}
  r_grid_stop_ohm: {value: 68.0e+3, source: "sch: 68K from each input's tip to V1A's grid"}
  jack_contact_ohm: {value: 0.01, source: "provisional: model knowledge (a phone jack's contact, ~10 mOhm)", notes: "input 1's contact grounds its tip when it's empty; input 2's ties its tip to input 1's when it's empty (sch)"}

  # --- V1A, V1B: 12AX7 (sch, lay) -----------------------------------------------------------
  r_plate_ohm: {value: 100.0e+3, source: "sch, lay: 100K plate loads (both triodes)"}
  r_cathode_ohm: {value: 1500, source: "sch, lay: 1500 cathode resistors (both triodes), no bypass drawn on V1A (V1B's carries the feedback)"}
  c_couple_f: {value: 0.02e-6, source: "sch: .02-600 (both couplings)"}
  volume_pot_ohm: {value: 1.0e+6, source: "sch: 1 MEG volume"}
  audio_taper_mid: {value: 0.1, source: "provisional: model knowledge (Fender prints no taper; the kit drawings print 1M log; ~10% of the track at half rotation, as the 5E3's)"}
  r_feedback_ohm: {value: 22.0e+3, source: "sch: 22K from the speaker's hot terminal to V1B's cathode"}

  # --- 6V6GT (sch, lay) ----------------------------------------------------------------------
  r_grid6_ohm: {value: 220.0e+3, source: "sch, lay: 220K grid leak (no grid stopper drawn)"}
  r_cathode6_ohm: {value: 470, source: "sch: 470 from the cathode to ground"}
  c_cathode6_f: {value: 25.0e-6, source: "sch: 25-25 across it"}

  # --- Output transformer (Triad #106 original; no original data) ----------------------------
  # Amplified Parts' P-TGO-001 reproduction, red-blue (8k) into the 4 ohm tap (README "Output
  # transformer": the 5k tap is the documented alternative).
  ot_r_pri_ohm: {value: 496.8, source: "web: https://www.amplifiedparts.com/sites/default/files/associated_files/p-gto-001.pdf (red-brown 374.7 + brown-blue 122.1 ohm)"}
  ot_r_sec_ohm: {value: 0.299, source: "web: same sheet (black-yellow, the 4 ohm tap, 0.299 ohm)"}
  ot_sec_ratio: {value: 0.02236, source: "derived: 8 k : 4 ohm, secondary turns per primary turn sqrt(4 / 8000) (same sheet's taps)"}
  ot_core_material: {value: grain_oriented_si_steel, source: "provisional: model knowledge (silicon-steel EI laminations; the only silicon steel in config/magnetics.yaml)"}
  ot_core_area_m2: {value: 5.9e-4, source: "provisional: model knowledge (a 5 W single-ended OT: ~1 in tongue, ~1 in stack, 95% stacking)"}
  ot_core_path_m: {value: 0.15, source: "provisional: model knowledge (~5.6 x the tongue width for scrapless EI)"}
  ot_turns: {value: 1820, source: "provisional: model knowledge (a design rule: 0.6 T of AC flux at 5 W into 8 k at 70 Hz in the core's area, the gapped core's DC taking the rest)"}
  ot_gap_m: {value: 203.0e-6, source: "derived: gives 11.9 H (the same sheet's 8k primary at 1 kHz, 1 V, read red-blue: the README) in the core's linear limit with ot_turns; the single-ended core's gap"}
  ot_leakage_h: {value: 20.2e-3, source: "web: same sheet (red-blue leakage, secondary shorted, 20.2 mH)"}
  ot_c_pri_f: {value: 200.0e-12, source: "provisional: model knowledge (self-capacitance of a small single-ended primary, 100-500 pF)"}

  # --- Speaker, cabinet and listening point ----------------------------------------------------
  speaker_model: {value: P8R@1, source: "config/components/p8r/1.yaml (the Jensen P8R reissue, 4 ohm, fitted to Jensen's chart data; the original's P8T / Oxford 8EV unmodeled: README 'Speaker')"}
  listen_distance_m: {value: 1.0, source: "provisional: model knowledge (1 m on axis, as the 5E3's)"}
  cab_width_m: {value: 0.3366, source: "web: https://retrofret.com/products/fender-champ-5f1-tube-amplifier-1959-10014 (a 1959 5F1: 13.25 in wide)"}
  cab_height_m: {value: 0.3048, source: "provisional: 12 in, between the 1959 amp's 11.75 in (same listing) and kits' 12.5-13 in (README 'Cabinet')"}
  cab_depth_m: {value: 0.1778, source: "provisional: 7 in, between the 1959 amp's 6.5 in (same listing) and kits' 8-8.875 in (README 'Cabinet')"}
  cab_offset_x_m: {value: 0.0, source: "provisional: model knowledge (the speaker centred on the baffle)"}
  cab_offset_y_m: {value: 0.0, source: "provisional: model knowledge (the speaker centred on the baffle)"}

  # --- Power supply ------------------------------------------------------------------------------
  # Amplified Parts' P-TGP-001 reproduction (the only reproduction with both DCRs and no-load
  # voltages: README "Power transformer") on its 275 V taps.
  pt_hv_half_rms_v: {value: 297.7, source: "web: https://www.amplifiedparts.com/sites/default/files/associated_files/p-tgp-001.pdf (the 275 V taps, red/wht-red/yel: 297.7 V no load at 120 V); the 275 V taps, not the 325 V ones: on the 325 V taps B+1 idles at 397 V against Fender's layout 340 V (+17%; 2026-11-12), as kit builders report (an Amplified Parts customer review moved to the 275 V taps for it: README 'Published voltages')"}
  pt_r_half_ohm: {value: 144.4, source: "derived: the HV DCR 283.4 ohm end to end scaled to the 275 V taps by their no-load voltages, 283.4 x 297.7 / 351.25 = 240.2 (half: 120.1; provisional: the taps' resistance isn't printed) + the primary's 3.965 ohm referred to a half, 3.965 x (297.7 / 120)^2 = 24.4 (same sheet)"}
  pt_leakage_h: {value: 10.0e-3, source: "provisional: model knowledge (leakage per HV half of a small mains transformer; as the 5E3's)"}
  pt_c_half_f: {value: 300.0e-12, source: "provisional: model knowledge (self-capacitance per HV half; a capacitance on every rectifier node, CLAUDE.md)"}
  rectifier_tube: {value: 5Y3GT@1, source: "sch: 5Y3GT full-wave rectifier, B+ from its filament; config/components/5y3gt/1.yaml"}
  c_b1_f: {value: 16.0e-6, source: "sch: 16-450 at B+1"}
  c_b23_f: {value: 8.0e-6, source: "sch: 8-450 at B+2 and B+3"}
  r_b12_ohm: {value: 10.0e+3, source: "sch: 10K from B+1 to B+2 (the screen; no choke on the 5F1)"}
  r_b23_ohm: {value: 22.0e+3, source: "sch: 22K from B+2 to B+3 (both 12AX7 plates)"}
  numerical_leak_ohm: {value: 1.0e+9, source: "numerical: DC path for the B+ nodes (no bleeder; not physical)"}

mains:
  v_rms: mains_v_rms
  hz: mains_hz
  rated_v_rms: {value: 120.0, source: "web: https://www.amplifiedparts.com/sites/default/files/associated_files/p-tgp-001.pdf (the reproduction's 120 V primary)"}

devices:
  V1A: {device: 12AX7@1}
  V1B: {device: 12AX7@1}
  V6: {device: 6V6GT@1}
  V5: {device: rectifier_tube}

sections:
  - title: power supply
    parts:
      VHVA: {mains: [hv_a, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 90.0}
      VHVB: {mains: [hv_b, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 270.0}
      RPTA: {R: [hv_a, hv_ar], r: pt_r_half_ohm}
      LPTA: {L: [hv_ar, hva], l: pt_leakage_h}
      RPTB: {R: [hv_b, hv_br], r: pt_r_half_ohm}
      LPTB: {L: [hv_br, hvb], l: pt_leakage_h}
      CPTA: {C: [hva, "0"], c: pt_c_half_f}
      CPTB: {C: [hvb, "0"], c: pt_c_half_f}
      XV5A: {device: [hva, b1], model: V5}
      XV5B: {device: [hvb, b1], model: V5}
      CB1: {C: [b1, "0"], c: c_b1_f}
      RB12: {R: [b1, b2], r: r_b12_ohm}
      CB2: {C: [b2, "0"], c: c_b23_f}
      RB23: {R: [b2, b3], r: r_b23_ohm}
      CB3: {C: [b3, "0"], c: c_b23_f}
      RLEAK: {R: [b1, "0"], r: numerical_leak_ohm}

  - title: inputs
    parts:
      # 1 MEG from input 1's tip j1 to ground, 68K from j1 and from input 2's tip j2 to the
      # grid; input 1's contact grounds j1 when it's empty, input 2's ties j2 to j1 (sch).
      RIN1: {R: [j1, "0"], r: r_input_ohm}
      RGA: {R: [j1, g1a], r: r_grid_stop_ohm}
      RGB: {R: [g1a, j2], r: r_grid_stop_ohm}
      SIN:
        switch: input_jack
        parts:
          RJ1_IN: {R: [in, j1], r: jack_contact_ohm, in: [1]}
          RJ1_GND: {R: [j1, "0"], r: jack_contact_ohm, in: [2]}
          RJ2_IN: {R: [in, j2], r: jack_contact_ohm, in: [2]}
          RJ2_J1: {R: [j2, j1], r: jack_contact_ohm, in: [1]}

  - title: preamp
    parts:
      XV1A: {device: [p1a, g1a, k1a], model: V1A}
      RPLA: {R: [b3, p1a], r: r_plate_ohm}
      RKA: {R: [k1a, "0"], r: r_cathode_ohm}
      CCA: {C: [p1a, vt], c: c_couple_f}
      # The volume: its top from the coupling capacitor, its wiper straight to V1B's grid.
      RVOL: {pot: ["0", vol, vt], r: volume_pot_ohm, at: volume, taper_mid: audio_taper_mid}
      XV1B: {device: [p1b, vol, k1b], model: V1B}
      RPLB: {R: [b3, p1b], r: r_plate_ohm}
      RKB: {R: [k1b, "0"], r: r_cathode_ohm}
      RFB: {R: [spk, k1b], r: r_feedback_ohm}
      CCB: {C: [p1b, g6], c: c_couple_f}

  - title: output
    parts:
      RG6: {R: [g6, "0"], r: r_grid6_ohm}
      XV6: {device: [p6, b2, g6, k6], model: V6}
      RK6: {R: [k6, "0"], r: r_cathode6_ohm}
      CK6: {C: [k6, "0"], c: c_cathode6_f}
      T1:
        transformer:
          p: {nodes: [b1, p6], r: ot_r_pri_ohm, c: ot_c_pri_f}
          # Dotted at ground: the speaker terminal rises with the plate, so the 22K to V1B's
          # cathode is negative feedback (as Fender wires the speaker).
          s: {nodes: ["0", spk], ratio: ot_sec_ratio, r: ot_r_sec_ohm}
        core: {material: ot_core_material, area_m2: ot_core_area_m2, path_m: ot_core_path_m, gap_m: ot_gap_m}
        turns: ot_turns
        leakage_h: ot_leakage_h
      SPK:
        speaker: [spk, "0", out]
        component: speaker_model
        distance_m: listen_distance_m
        width_m: cab_width_m
        height_m: cab_height_m
        depth_m: cab_depth_m
        offset_x_m: cab_offset_x_m
        offset_y_m: cab_offset_y_m
