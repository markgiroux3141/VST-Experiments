sections:
- title: 'Neumann U47: supply'
  parts:
    VNG_u47:
      V:
      - ng_u47
      - '0'
      v: ng_open_v_u47
    RNG_u47:
      R:
      - ng_u47
      - b105_u47
      r: ng_r_ohm_u47
      tolerance: none
    CNG_u47:
      C:
      - b105_u47
      - '0'
      c: ng_c_f_u47
      tolerance: none
- title: 'Neumann U47: capsule'
  parts:
    R7_u47:
      R:
      - b105_u47
      - pt_u47
      r: r7_ohm_u47
    R8_u47:
      R:
      - pt_u47
      - '0'
      r: r8_ohm_u47
    R1_u47:
      R:
      - pt_u47
      - bp_u47
      r: r1_ohm_u47
    C1_u47:
      C:
      - bp_u47
      - '0'
      c: c1_f_u47
    R2_u47:
      R:
      - g_u47
      - '0'
      r: r2_ohm_u47
    SPAT_u47:
      switch: pattern_u47
      parts:
        KK47C_u47:
          capsule_dual:
          - in
          - p_rear
          - bp_u47
          - g_u47
          - rear_e_u47
          component: capsule_model_u47
          polarization_front_v: polarization_v_u47
          in:
          - 0
        RREAR_u47:
          R:
          - rear_e_u47
          - bp_u47
          r: rear_leak_ohm_u47
          tolerance: none
          in:
          - 0
        KK47O_u47:
          capsule_dual:
          - in
          - p_rear
          - bp_u47
          - g_u47
          - g_u47
          component: capsule_model_u47
          polarization_front_v: polarization_v_u47
          polarization_rear_v: polarization_v_u47
          in:
          - 1
- title: 'Neumann U47: amplifier'
  parts:
    VSC_u47:
      V:
      - gt_u47
      - g_u47
      v: space_charge_v_u47
    XV1_u47:
      device:
      - a_u47
      - gt_u47
      - k_u47
      model: V1_u47
    R4_u47:
      R:
      - b105_u47
      - f2_u47
      r: r4_ohm_u47
    RHEAT_u47:
      R:
      - f2_u47
      - k_u47
      r: heater_ohm_u47
      tolerance: none
    R3_u47:
      R:
      - k_u47
      - '0'
      r: r3_ohm_u47
    R6_u47:
      R:
      - b105_u47
      - bdec_u47
      r: r6_ohm_u47
    C3_u47:
      C:
      - bdec_u47
      - '0'
      c: c3_f_u47
    R5_u47:
      R:
      - bdec_u47
      - a_u47
      r: r5_ohm_u47
    C2_u47:
      C:
      - a_u47
      - op_u47
      c: c2_f_u47
    BV8_u47:
      transformer:
        p:
          nodes:
          - op_u47
          - '0'
          r: bv8_r_pri_ohm_u47
          c: bv8_c_pri_f_u47
        s:
          nodes:
          - ia_clean
          - '0'
          ratio: bv8_ratio_u47
          r: bv8_r_sec_ohm_u47
      core:
        material: bv8_core_material_u47
        area_m2: bv8_core_area_m2_u47
        path_m: bv8_core_path_m_u47
        gap_m: bv8_gap_m_u47
      turns: bv8_turns_u47
      leakage_h: bv8_leakage_h_u47
- title: cable
  parts:
    CCABLE:
      C:
      - ia_clean
      - '0'
      c: cable_c_f
      tolerance: none
- title: 'Clean preamp (NE5534A): input'
  parts:
    CIN_clean:
      C:
      - ia_clean
      - ib_clean
      c: c_in_f_clean
    RB_clean:
      R:
      - ib_clean
      - '0'
      r: r_bias_ohm_clean
    RN_clean:
      R:
      - ib_clean
      - ip_clean
      r: u_noise_ohm_clean
      tolerance: none
- title: 'Clean preamp (NE5534A): gain'
  parts:
    U1_clean:
      opamp:
      - ip_clean
      - fb_clean
      - uo_clean
      a0: u_a0_clean
      gbw_hz: u_gbw_hz_clean
      r_out_ohm: u_r_out_ohm_clean
      r_in_ohm: u_r_in_ohm_clean
      clamp: DCLAMP_clean
      swing_v: u_swing_v_clean
    RF_clean:
      R:
      - uo_clean
      - fb_clean
      r: r_f_ohm_clean
    CG_clean:
      C:
      - g_clean
      - '0'
      c: c_g_f_clean
    SGAIN_clean:
      switch: gain_db_clean
      parts:
        RG20_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g20_ohm_clean
          in:
          - 20
        RG30_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g30_ohm_clean
          in:
          - 30
        RG40_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g40_ohm_clean
          in:
          - 40
        RG50_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g50_ohm_clean
          in:
          - 50
        RG60_clean:
          R:
          - fb_clean
          - g_clean
          r: r_g60_ohm_clean
          in:
          - 60
    RO_clean:
      R:
      - uo_clean
      - out
      r: r_out_ohm_clean
    RLOAD_clean:
      R:
      - out
      - '0'
      r: load_ohm_clean
      tolerance: none
