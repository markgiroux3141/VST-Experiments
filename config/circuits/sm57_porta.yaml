  output_volts_peak:
    value: 3.081
    source: 'derived: a sine of +9 dBu (2.18 V rms), just past U101A''s clip (~+-3.0 V about the 424''s
      half rail): a print''s 0 dBFS is the machine''s ceiling, its -10 dBV nominal reads -16.8 dBFS (the
      chains of the V76 / clean scale, +24 dBu, would leave it 15 dB down)'
controls:
