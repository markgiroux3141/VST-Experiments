    value: 0
    choices:
    - 0
    - 1
    unit: position
    source: 's68: ''Impedance: Dual. 30-50 ohms and 150-250 ohms. (Connected for 150-250 ohms when shipped)'''
    notes: 0 'H' 150-250 ohm (RED to pin 3), 1 'L' 30-50 ohm (ORANGE to pin 3)
  trim_porta:
    value: 0.5
    min: 0.0
    max: 1.0
    unit: rotation
    source: 'sm: R103 10k (RD), TRIM'
    notes: 0 = 0 dB (the wiper at C104's end), 1 = +39.9 dB (at R104's); 0.5 = ~+19 dB with the provisional
      taper
values:
