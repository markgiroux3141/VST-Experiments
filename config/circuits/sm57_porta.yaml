sections:
- title: 'Shure SM57: cartridge'
  parts:
    MC_sm57:
      moving_coil:
      - in
      - p_rear
      - cp_sm57
      - cm_sm57
      component: cartridge_model_sm57
    RCL_sm57:
      R:
      - cm_sm57
      - '0'
      r: coil_leak_ohm_sm57
      tolerance: none
- title: 'Shure SM57: transformer'
  parts:
    T1_sm57:
      transformer:
        p:
          nodes:
          - cp_sm57
          - cm_sm57
        s1:
          nodes:
          - ia_porta
          - tap_sm57
        s2:
          nodes:
          - tap_sm57
          - red_sm57
      component: transformer_model_sm57
    SIMP_sm57:
      switch: impedance_sm57
      parts:
        RH_sm57:
          R:
          - red_sm57
          - '0'
          r: min_ohm_sm57
          tolerance: none
          in:
          - 0
        RL_sm57:
          R:
          - tap_sm57
          - '0'
          r: min_ohm_sm57
          tolerance: none
          in:
          - 1
- title: cable
  parts:
    CCABLE:
      C:
      - ia_porta
      - '0'
      c: cable_c_f
      tolerance: none
- title: 'Tascam Portastudio 424 mic input: input'
  parts:
    RI101_porta:
      R:
      - ia_porta
      - j_porta
      r: ri101_ohm_porta
    RI102_porta:
      R:
      - j_porta
      - '0'
      r: ri102_ohm_porta
    CI101_porta:
      C:
      - j_porta
      - '0'
      c: ci101_f_porta
    C101_porta:
      C:
      - j_porta
      - up_porta
      c: c101_f_porta
    R101_porta:
      R:
      - up_porta
      - '0'
      r: r101_ohm_porta
- title: 'Tascam Portastudio 424 mic input: trim'
  parts:
    RN_porta:
      R:
      - up_porta
      - unp_porta
      r: u_noise_ohm_porta
      tolerance: none
    U101_porta:
      opamp:
      - unp_porta
      - um_porta
      - uo_porta
      a0: u_a0_porta
      gbw_hz: u_gbw_hz_porta
      r_out_ohm: u_r_out_ohm_porta
      r_in_ohm: u_r_in_ohm_porta
      clamp: DCLAMP_porta
      swing_v: u_swing_v_porta
    R102_porta:
      R:
      - uo_porta
      - um_porta
      r: r102_ohm_porta
    C102_porta:
      C:
      - uo_porta
      - um_porta
      c: c102_f_porta
    C103_porta:
      C:
      - um_porta
      - w_porta
      c: c103_f_porta
    C104_porta:
      C:
      - uo_porta
      - t_porta
      c: c104_f_porta
    R103_porta:
      pot:
      - t_porta
      - w_porta
      - b_porta
      r: trim_ohm_porta
      at: trim_porta
      taper_mid: trim_taper_mid_porta
      reverse: 1
    R104_porta:
      R:
      - b_porta
      - '0'
      r: r104_ohm_porta
    RS101_porta:
      R:
      - t_porta
      - out
      r: contact_ohm_porta
      tolerance: none
    R114_porta:
      R:
      - out
      - '0'
      r: r114_ohm_porta
    R106_porta:
      R:
      - out
