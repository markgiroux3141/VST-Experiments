# Fairchild 670, one channel (left/right mode), as a circuit file (device builder, B1).
# Read by varimu/circuit/spec.py and built by varimu/circuit/builder.py (the format and
# its macro parts are in their docstrings); varimu/circuit/netlist.py is the 670's API.
#
# Main source [MAN]: Fairchild 670 instruction manual (Dec 1959) incl. drawing
# A-96039 "670 Dual Limiter Schematic":
#   http://thehistoryofrecording.com/Manuals/Fairchild/Fairchild_670_stereo_limiting_amplifier_instructions_Schematics.pdf
#   sha256 0ede9ed8d1294ada7b3e+05a6f8ef89e+7487a7530a2c7a36481c5c297bac7c535 (scanned, 24 MB, not committed)
# Crops of the drawing are in data/schematics/fairchild_670/ (see README there).
#
# Source tags:
#   "sch: ..."         value printed on A-96039
#   "sch-interp: ..."  wiring read off the scan; plausible but not certain
#   "web: <url> ..."   other published source
#   "provisional: ..." model knowledge; must be a genome parameter or replaced later
#
# Every entry is {value, source} (+ unit/notes). Entries with `genome:` are
# uncertain: their bounds live at that path in config/genome_bounds.yaml, and
# `value` is the nominal used for renders until the optimizer takes over.
# Any key can be overridden per render (`varimu render --set key=value`).
#
# Below the parameters: the device parameters, derived values, mains, tolerance
# classes, the device instances and the parts, section by section.

# The IR's title (kept from the hand-coded builder, so the IR stays byte-identical).
title: "Fairchild 670, one channel: generated by varimu.circuit.netlist"
input: in
# Node voltages every render saves (varimu.sim.io.run_transient). in_s is the unit's
# input terminals (behind the source impedance): input levels in dBm.
probes: [out, cv, tcb, bp, ga, gb, ka, kb, ur, sg, nb2, nb3, nb4, in_s]

controls:
  # Front panel and screwdriver trims. Not physical uncertainties, so not genome.
  # The defaults of input_atten_db, ac_threshold and dc_threshold are the factory
  # adjustment: [MAN] p.8's threshold procedure run to the manual's curve 3
  # ("Factory-adjusted condition", p.13; data/datasheets/fairchild_670_io_curve3.csv)
  # on the nominal unit by varimu.sim.setup.threshold (2026-10-23): unity gain with
  # AC THRESHOLD at 0 (pad 11 dB: +0.39 dB at -10 dBm, the nearest 1 dB step), then
  # 3 dB of limiting at +3.66 dBm out and 10 dB at +5.41 dBm out. The unit's 1 kHz
  # curve is then within 0.17 dB of curve 3 from +1 to +25 dBm in.
  input_atten_db:
    {value: 11.0, min: 0.0, max: 30.0, unit: dB, source: "sch: AT101 600 ohm T attenuator; [MAN] p.5 1 dB/step. Default: the factory adjustment's unity gain (above; [MAN] p.9 says ~10 dB). Range end (30 dB) is provisional: step count not legible"}
  ac_threshold:
    {value: 0.709, min: 0.0, max: 1.0, unit: rotation, source: "sch: R115A / R115B dual tapped pot (front-panel knob; values below). Default: the factory adjustment (above)", notes: "the wipers' fraction of the track from the centre line: 0 = no signal to the sidechain (the manual's 'fully CCW', curve 1), 1 = the whole T103 secondary = lowest threshold"}
  time_constant:
    {value: 2, min: 1, max: 6, unit: position, source: "sch: S102 positions 1-6"}
  dc_threshold:
    {value: 0.253, min: 0.0, max: 1.0, unit: rotation, source: "sch: R117 100k (screwdriver beneath front panel). Default: the factory adjustment (above)", notes: "0 = 12AX7 cathodes at ~3.6 V (lowest threshold; the manual's 'fully CW', curves 4 and 5), 1 = ~16 V"}
  balance:
    {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "sch: R105A/B dual 100 ohm (screwdriver, front panel)"}
  zero:
    {value: 0.3, min: 0.0, max: 1.0, unit: rotation, source: "sch: R142 2500 ohm 'ZERO' between the bias supply's C108 node and ground (data/schematics/fairchild_670/README.md, supply rails). [MAN] p.7 sets it for a meter zero in S101's ZERO position, where the meter reads 15 ohm x the stage's total plate current; 0.3 idles each bank at 24.9 mA (scripts/calibrate_psu.py, 2026-10-21), against ~26 mA measured (web: https://groupdiy.com/threads/fairchild-670-questions.32169/)", notes: "standing 6386 grid bias = zero * the C108 node's voltage"}
  b_plus_adj:
    {value: 0.725, min: 0.0, max: 1.0, unit: rotation, source: "sch: R313 250K 'B+ ADJ' (screwdriver, inside); [MAN] p.7: adjust only if pin 8 of V302 deviates from 240 V. Set so the settled rail is 240.0 V at the nominal genome (scripts/calibrate_psu.py, 2026-10-21)", notes: "0 = wiper at R312 (240 V side): the 6084 grid highest, the output lowest"}
  # Operating conditions (not physical uncertainty of the unit, so not genome).
  mains_v_rms:
    {value: 117.0, min: 100.0, max: 127.0, unit: V, source: "[MAN] p.4: power 117 volts; stable over line voltage 100 to 127 volts"}
  mains_hz:
    {value: 60.0, min: 50.0, max: 60.0, unit: Hz, source: "[MAN] p.4: 50-60 cycles"}

values:
  # --- Program source and load -------------------------------------------------
  source_impedance_ohm: {value: 600, source: "[MAN] p.4: 600 ohm input"}
  load_ohm: {value: 600, source: "[MAN] p.4: 600 ohm output"}

  # --- Transformers (all four) ----------------------------------------------------
  # Self-capacitance of the high-impedance windings. Without it the plate load
  # stays inductive at ultrasonic frequencies and the 6386 stage oscillates
  # (tuned-plate tuned-grid) in simulation.
  t101_c_half_f: {value: 100.0e-12, genome: transformers.input.winding_capacitance_f, source: "provisional: model knowledge (high-ratio input transformer secondaries, 50-200 pF)"}
  t102_c_half_f: {value: 200.0e-12, genome: transformers.output.winding_capacitance_f, source: "provisional: model knowledge (push-pull output primaries, 100-500 pF)"}
  t103_c_half_f: {value: 100.0e-12, genome: transformers.sidechain_input.winding_capacitance_f, source: "provisional: model knowledge (secondaries of a small step-up transformer, 50-200 pF)"}
  t104_c_half_f: {value: 200.0e-12, genome: transformers.sidechain_output.winding_capacitance_f, source: "provisional: model knowledge (push-pull primaries, 100-500 pF)"}
  t104_c_sec_f: {value: 100.0e-12, genome: transformers.sidechain_output.secondary_capacitance_f, source: "provisional: model knowledge (self-capacitance of a 600 ohm line winding, as the EQP-1A's HS-56)", notes: "across the secondary (the bridge's ay / bk): it takes the leakage's current when the bridge cuts off (the pre-flight rectifier check; added 2026-10-26, the user's choice)"}
  t104_c_sec_gnd_f: {value: 100.0e-12, genome: transformers.sidechain_output.secondary_ground_capacitance_f, source: "provisional: model knowledge (winding-to-core and screen capacitance of a line transformer's winding, tens to a few hundred pF)", notes: "each end of the secondary (ay, bk) to the grounded core: holds the floating secondary's common mode while the bridge is off, which the diodes' leakage alone barely does (added 2026-10-28, the user's choice: circuitsim's Newton wandered there on HF-rich input, NATIVE_APP_PLAN.md R2)"}
  # Phase 2: every transformer is windings on a Jiles-Atherton core
  # (varimu.devices.core; materials in config/magnetics.yaml), with the
  # core's joint gap and classical eddy-current loss on the core node. Per
  # transformer: material, core cross-section and magnetic path, gap, turns
  # of its reference winding (the others follow the turns ratios below),
  # leakage inductance referred to that winding (split half and half between
  # the two sides), interwinding capacitance. The turns are derived: at the
  # nominal geometry and gap they give the slice's former small-signal
  # inductances (T101 10 H primary, T102 30 H per primary half, T103 5 H
  # primary, T104 10 H per primary half), whose sources were model
  # knowledge, and the leakage keeps its former k = 0.999 (2 (1 - k) L_ref).
  # This replaces the slice's lumped loss resistors (t10x_rloss) and the one
  # coupling coefficient (transformer_k): the eddy loss now damps the
  # windings' ultrasonic resonances. "Small-signal" is the core's linear
  # limit (its susceptibility at the demagnetized origin). The turns are kept
  # as derived (the physical quantity); the inductances follow the material.
  # T101's and T103's were derived for a mumetall origin permeability of
  # 5,850 (an earlier fit); since the Rayleigh refit (2026-10-24, the plan's
  # Phase 2 "Low-level core physics", Option 1) it is ~29,300, and their
  # linear-limit primaries are 17.7 H (T101) and 7.9 H (T103), computed from
  # the build's own core and gap reluctances: the joint gap is 81% / 85% of
  # the reluctance, so the inductance hardly moves with the material at low
  # level. (The 2026-10-21 fit's origin permeability was 246: 0.75 H / 0.44 H.)
  # T102 and T104 (grain-oriented steel) are 1.48 H (secondary) and 10.0 H.
  #
  # Saturation check (scratch calculation, 2026-10-21): T102's secondary
  # reaches 1 T at +21.9 dBu and saturation (~1.9 T) at +27.5 dBu, 30 Hz;
  # +24.4 / +30.0 dBu at 40 Hz. Published 670 specs (reissue/dealer
  # listings, web: https://www.telefunken-elektroakustik.com/product/fairchild-670):
  # <1% THD up to +18 dBm output without limiting, clipping +27 dBm,
  # 40 Hz - 15 kHz +-1 dB.

  # --- Input: AT101 -> T101 ----------------------------------------------------
  attenuator_z_ohm: {value: 600, source: "sch: AT101 600 ohm T"}
  r101_r102_ohm: {value: 360, source: "sch: R101, R102 180 ohm 1% across each primary winding; primaries taken in series"}
  t101_turns_half: {value: 4.5, genome: transformers.input.turns_ratio, source: "web: https://www.don-audio.com/Sowter-8346E-Fairchild-Signal-amp-input-transformer-T101-201 (replacement: 600:50k, 1+1:9+9) -> each secondary half = 4.5x the series primary"}
  t101_r_pri_ohm: {value: 20.0, source: "provisional: model knowledge (series primary of a 600 ohm line transformer)"}
  t101_r_half_ohm: {value: 400.0, source: "provisional: model knowledge (each half of a 50k secondary)"}
  t101_core_material: {value: mumetall, genome: transformers.input.core_material, source: "web: https://www.don-audio.com/Sowter-8346E-Fairchild-Signal-amp-input-transformer-T101-201 (the replacement has a mumetal core); the original's is not documented"}
  t101_core_area_m2: {value: 1.0e-4, genome: transformers.input.core_area_m2, source: "provisional: model knowledge (line input transformer core, ~1 cm^2; the replacement's can is 45 x 72 x 63 mm, same page)"}
  t101_core_path_m: {value: 0.07, genome: transformers.input.core_path_m, source: "provisional: model knowledge (E-I core of that size)"}
  t101_gap_m: {value: 10.0e-6, genome: transformers.input.air_gap_m, source: "provisional: model knowledge (butt joints of a stacked, ungapped core; no DC in T101)"}
  t101_turns: {value: 1320, genome: transformers.input.turns, source: "provisional: derived (gave the former 10 H primary at nominal geometry and gap with mumetall's origin permeability then, 5,850; 17.7 H in the linear limit since the 2026-10-24 refit, see the transformer notes above)", notes: "series primary (the reference winding)"}
  t101_leakage_h: {value: 2.5e-3, genome: transformers.input.leakage_h, source: "provisional: chosen so the slice meets the published 40 Hz - 15 kHz +-1 dB (web: https://www.telefunken-elektroakustik.com/product/fairchild-670, reissue/dealer specs): measured 2026-10-21 with ngspice .ac on the linear-core build, -0.4 dB at 40 Hz, +0.2 dB at 15 kHz, the T101 secondary resonance at 35.5 kHz (+1.4 dB). The slice's former k = 0.999 (20 mH) gave +15 dB at 17.8 kHz once the lumped loss resistors were gone", notes: "referred to the primary (0.2 H referred to the 50k secondary)"}
  t101_c_interwinding_f: {value: 0.0, genome: transformers.input.interwinding_capacitance_f, source: "provisional: nominal 0 = electrostatically screened (unknown for the original; unscreened line transformers have tens of pF)", notes: "half from each grid end of the secondary to the primary hot end (balanced). 20 pF here plus 50 pF on T102 made the 6386 stage oscillate at ~31 kHz at idle (tuned-plate tuned-grid; measured 2026-10-21): the plausibility checks (Phase 4) must catch such units"}

  # --- 6386 push-pull gain stage ------------------------------------------------
  v6386_per_side: {value: 4, source: "sch: V101A/V102A + V103B/V104B on one side, V101B/V102B + V103A/V104A on the other"}
  r103_r104_ohm: {value: 680, source: "sch: R103, R104 680 1W, one per bank"}
  r105_ohm: {value: 100, source: "sch: R105A/B 100 dual; sch-interp: modeled as one pot between the cathode resistors, wiper to the cathode return: the bias supply's C303 node (traced 2026-10-21)"}
  c101_f: {value: 4.0e-6, source: "sch: C101/C102 4 uF 200 V; sch-interp: between the two bank cathode nodes"}
  # C114 (trimmer between the grid lines) is omitted: value not printed.

  # --- Output: T102 --------------------------------------------------------------
  r111_ohm: {value: 33, source: "sch: R111 33 1W, B+ feed to the T102 centre tap"}
  r107_r108_ohm: {value: 30, source: "sch: R107, R108 30 1% (meter shunts in the primary centre)"}
  t102_turns_half: {value: 4.5, genome: transformers.output.turns_ratio, source: "web: https://don-audio.com/Sowter-8344e-Fairchild-Signal-amp-output-transformer-T102-202 (replacement: 60k CT:600, 9+9:1+1) -> each primary half = 4.5x the series secondary"}
  t102_r_half_ohm: {value: 150.0, source: "provisional: model knowledge (each half of a 60k CT primary)"}
  t102_r_sec_ohm: {value: 10.0, source: "provisional: model knowledge (600 ohm secondary)"}
  t102_core_material: {value: grain_oriented_si_steel, genome: transformers.output.core_material, source: "web: https://don-audio.com/Sowter-8344e-Fairchild-Signal-amp-output-transformer-T102-202 (the replacement has an M6 core, grain-oriented steel); the original's is not documented"}
  t102_core_area_m2: {value: 2.0e-4, genome: transformers.output.core_area_m2, source: "provisional: model knowledge (the replacement's can is 48.5 mm dia x 57 mm, same page)"}
  t102_core_path_m: {value: 0.09, genome: transformers.output.core_path_m, source: "provisional: model knowledge (E-I core of that size)"}
  t102_gap_m: {value: 20.0e-6, genome: transformers.output.air_gap_m, source: "provisional: model knowledge (butt joints of a stacked core; push-pull, so no deliberate gap)"}
  t102_turns: {value: 360, genome: transformers.output.turns, source: "provisional: derived (gives the former 30 H per primary half at nominal geometry and gap, see the transformer notes above)", notes: "series secondary (the reference winding); each primary half has 4.5x"}
  t102_leakage_h: {value: 3.0e-3, genome: transformers.output.leakage_h, source: "provisional: model knowledge (keeps the slice's k = 0.999: 2 (1 - k) x 1.48 H)", notes: "referred to the secondary"}
  t102_c_interwinding_f: {value: 0.0, genome: transformers.output.interwinding_capacitance_f, source: "provisional: nominal 0 = electrostatically screened (unknown for the original; unscreened output transformers have tens to 100+ pF)", notes: "half from each plate end to the output (balanced); see t101_c_interwinding_f"}

  # --- Sidechain pick-off: T102 secondary -> pads -> T103 -------------------------
  r145_r148_ohm: {value: 150, source: "sch: R145-R148 150 5% series legs"}
  r149_r150_ohm: {value: 1360, source: "sch: R149, R150 680 5% shunts; the two pads are combined in series here (one output winding)"}
  t103_turns_half: {value: 8.5, genome: transformers.sidechain_input.turns_ratio, source: "web: https://www.sowter.co.uk/acatalog/VINTAGE-COMPRESSOR-TRANSFORMERS-A-to-K.html (replacement 8345E: 600 ohms/170k ohms, ratio 17+17:1+1) -> each secondary half = 8.5x the series primary (the two pads feed one primary here); the original's ratio isn't printed"}
  t103_core_material: {value: mumetall, genome: transformers.sidechain_input.core_material, source: "web: same page (the replacement has a mumetal core); the original's is not documented"}
  t103_core_area_m2: {value: 0.5e-4, genome: transformers.sidechain_input.core_area_m2, source: "provisional: model knowledge (small signal transformer core)"}
  t103_core_path_m: {value: 0.05, genome: transformers.sidechain_input.core_path_m, source: "provisional: model knowledge"}
  t103_gap_m: {value: 10.0e-6, genome: transformers.sidechain_input.air_gap_m, source: "provisional: model knowledge (butt joints; no DC)"}
  t103_turns: {value: 1215, genome: transformers.sidechain_input.turns, source: "provisional: derived (gave the former 5 H primary at nominal geometry and gap with mumetall's origin permeability then, 5,850; 7.9 H in the linear limit since the 2026-10-24 refit, see the transformer notes above)", notes: "series primary (the reference winding); each secondary half has t103_turns_half times as many (10,330 at 8.5). The primary inductance doesn't depend on the ratio, so the ratio change (2026-10-23) left this value"}
  t103_leakage_h: {value: 5.0e-3, genome: transformers.sidechain_input.leakage_h, source: "provisional: chosen so T103 standalone (its pads in front, the threshold pots' load behind) is within 0.5 dB from 40 Hz to 20 kHz, the era's rating for line-to-grid transformers (web: https://www.worldradiohistory.com/Archive-Electronics/40s/Electronics-1949-07.pdf, UTC's advertisement: +-1 dB 20-20,000 cycles; the replacement's response isn't published). Measured 2026-10-23: -0.20 / +0.08 / -0.45 dB at 40 Hz / 15 / 20 kHz. The former 10 mH (k = 0.999) gave -2.1 dB at 15 kHz once the ratio became 8.5 (it is 72x that referred to a secondary half)", notes: "referred to the primary"}

  # --- AC threshold and 12AX7 (V105) ----------------------------------------------
  # R115A/B are a dual-gang tapped pot: each section from its T103 secondary end to
  # the centre line, the wiper to a 12AX7 grid, and R113/R114 from the section's
  # fixed tap to the centre line (sch: drawn from a point on each track; web:
  # https://groupdiy.com/threads/whats-this-symbol-in-the-fairchild-670-diagram.35361/,
  # Walrus reading the original manual: "a dual 100k lin tapped pot with 24K
  # resistors hanging off the taps to ground"). Below the tap the 24K shunts the
  # track, so the knob's first part of travel is a gentler slope: two linear ranges
  # (JohnRoberts, same thread). AC THRESHOLD at 0 puts the wipers on the centre
  # line: no signal to the sidechain (the manual's curve 1, "straight amplifier").
  r115a_ohm: {value: 100.0e+3, source: "sch: R115A 100K LIN"}
  r115b_ohm: {value: 100.0e+3, genome: sidechain_threshold.r115b_ohm, source: "sch: R115B printed 180K LIN on this scan; web: https://groupdiy.com/threads/whats-this-symbol-in-the-fairchild-670-diagram.35361/ (Walrus: the original manual shows 'a dual 100k lin tapped pot'; CJ: 'the 100k looks like 180k on some prints'). Nominal 100K: two readers of other prints, and matched sections give both 12AX7 grids the same drive (180K with a 50% tap gives that grid 3 dB less below the tap)"}
  ac_threshold_tap: {value: 0.5, genome: sidechain_threshold.pot_tap, source: "web: same thread (CJ: 'i think it would have to be a 50% tap'); the drawing doesn't show where the tap is", notes: "fraction of each section's track from its centre-line end"}
  r113_r114_ohm: {value: 24.0e+3, source: "sch: R113, R114 24K 5%, from each pot section's tap to the centre line (web: same thread)"}
  r116_ohm: {value: 270.0e+3, source: "sch: R116 270K from B+ to the R117 wiper"}
  r117_ohm: {value: 100.0e+3, source: "sch: R117 100K DC THRESHOLD"}
  r118_ohm: {value: 1.0e+6, source: "sch: R118 1M"}
  r119_ohm: {value: 18.0e+3, source: "sch: R119 18K; check: with R117 at the ground end the cathodes sit at 3.6 V, matching web: https://groupdiy.com/threads/sharing-fairchild-data.34060/ '3.6V (cut-off)'"}
  r120_r121_ohm: {value: 100.0e+3, source: "sch: R120, R121 100K 1W 5% plate loads"}
  c103_c104_f: {value: 0.05e-6, source: "sch: C103, C104 .05 400V"}

  # --- 12BH7A (V106) -------------------------------------------------------------
  r122_r123_ohm: {value: 1.0e+6, source: "sch: R122, R123 1M grid leaks, returned to ground (traced 2026-10-21: README, open questions)"}
  r124_r125_ohm: {value: 1000, source: "sch: R124, R125 1000 1W 5%, returned to ground (traced 2026-10-21)"}
  r126_r127_ohm: {value: 100.0e+3, source: "sch: R126, R127 100K 2W plate loads, from the unregulated rail (traced 2026-10-21)"}
  c107_c108_f: {value: 0.1e-6, source: "sch: C107, C108 .1 600V"}
  r_fb_ohm: {value: 2700, source: "sch: R128 (printed 'R120', a repeat of the 12AX7 load's designator) and R129 2700 1W 5%, T104 feedback winding to the 12BH7 cathodes"}
  r134_ohm: {value: 860, source: "sch: R134 860 1W"}
  r135_ohm: {value: 560, source: "sch: R135 560 1W"}

  # --- 6973 push-pull (V107, V108) -------------------------------------------------
  r130_r131_ohm: {value: 150.0e+3, source: "sch: R130, R131 150K grid leaks, in series between the grids; their midpoint returns to the bias supply's R303 node (-13 to -14.5 V printed; README, supply rails)"}
  r132_r133_ohm: {value: 560, source: "sch: R132, R133 560 screen resistors, from the R315/R316 tap (C307B; traced 2026-10-21)"}
  r143_r144_ohm: {value: 47.0e+3, source: "sch: R143, R144 47K plate-to-grid"}
  c105_c106_f: {value: 20.0e-12, source: "sch: C105 '20 NMF', C107(V108) '20 MMF' 1.6 kV; read as 20 pF"}

  # --- T104 and rectifier ------------------------------------------------------------
  t104_sec_per_half: {value: 0.5, genome: transformers.sidechain_output.turns_ratio, source: "web: https://don-audio.com/9643S-Fairchild-Control-amp-output-T104-204 (replacement: 10k CT:600, 4:1) -> secondary = half a primary half"}
  t104_fb_per_half: {value: 0.2105, source: "web: same page, feedback winding 9.5:1 of the full primary"}
  t104_core_material: {value: grain_oriented_si_steel, genome: transformers.sidechain_output.core_material, source: "web: https://don-audio.com/9643S-Fairchild-Control-amp-output-T104-204 (the replacement is M6 cored); the original's is not documented"}
  t104_core_area_m2: {value: 4.0e-4, genome: transformers.sidechain_output.core_area_m2, source: "provisional: model knowledge (the replacement weighs 1.2 kg, same page: a 2 x 2 cm core cross-section is typical at that weight)"}
  t104_core_path_m: {value: 0.12, genome: transformers.sidechain_output.core_path_m, source: "provisional: model knowledge (E-I core of that size)"}
  t104_gap_m: {value: 20.0e-6, genome: transformers.sidechain_output.air_gap_m, source: "provisional: model knowledge (butt joints; push-pull, so no deliberate gap)"}
  t104_turns: {value: 670, genome: transformers.sidechain_output.turns, source: "provisional: derived (gives the former 10 H per primary half at nominal geometry and gap)", notes: "each primary half (the reference winding)"}
  t104_leakage_h: {value: 0.02, genome: transformers.sidechain_output.leakage_h, source: "provisional: model knowledge (keeps the slice's k = 0.999: 2 (1 - k) x 10 H)", notes: "referred to a primary half"}
  r136_ohm: {value: 3900, source: "sch: R136 ('A136') 3900 1W across the secondary"}
  bridge_diode: {value: SI_RECTIFIER@1, source: "sch: CR101-104 1N538 silicon; modeled with config/components/si_rectifier/1.yaml (provisional 1N4007-like)"}

  # --- Time constant network (S102) ----------------------------------------------
  r137_ohm: {value: 220.0e+3, source: "sch: R137 220K (always in)"}
  c109_f: {value: 2.0e-6, source: "sch: C109 2 200V (always in)"}
  r141_ohm: {value: 68.0e+3, source: "sch: R141 68K (position 1)"}
  r138_ohm: {value: 470.0e+3, source: "sch: R138 470K (position 2)"}
  c113_f: {value: 2.0e-6, source: "sch: C113 2 200V (positions 3-5)"}
  c111_f: {value: 4.0e-6, source: "sch: C111 4 150V (position 4)"}
  r139_ohm: {value: 100.0e+3, source: "sch: R139 100K in series with C110 (positions 5, 6)"}
  c110_f: {value: 8.0e-6, source: "sch: C110 8 150V"}
  r140_ohm: {value: 100.0e+3, source: "sch: R140 100K in series with C112 (position 6)"}
  c112_f: {value: 20.0e-6, source: "sch: C112 20 150V"}
  c115_f: {value: 0.1e-6, source: "sch: C115 .1 200V, ZERO wiper to ground"}
  r142_ohm: {value: 2500, source: "sch: R142 2500 ZERO"}

  # --- Power supply ----------------------------------------------------------------
  # Traced on A-96039 (data/schematics/fairchild_670/README.md, "Supply rails"):
  # T302 -> GZ34 -> C304 -> L301 -> C305 + C306: the unregulated rail (420-450 V
  # printed), feeding the 12BH7 plate loads, T104's centre tap (6973 plates) and the
  # regulator; EL34 series pass / 6084 error amp / 5651 reference -> 240 V
  # regulated (6386 plates, 12AX7 networks); R315/R316 -> C307B tap (6973 screens).
  # T301 -> GR301 selenium bridge -> the bias supply's three nodes (C303: the 6386
  # cathode return; C108: ZERO; R303 top: the 6973 grid-leak return). Channel 2 is
  # idle and draws on the same rails (the section "channel 2" below).
  t302_hv_half_rms_v: {value: 404.3, genome: psu.t302_hv_half_rms_v, source: "derived: puts the settled unregulated rail at 435 V, the middle of the printed '(420V TO 450V)' (scripts/calibrate_psu.py, 2026-10-21); open-circuit rms per HV half behind t302_r_half_ohm (the replacement is web: https://www.sowter.co.uk/specs/0526.htm, 375-0-375 V at 200 mA; the original's isn't published)", notes: "at mains_v_rms = 117 V; scales with the mains"}
  t302_r_half_ohm: {value: 60.0, genome: psu.t302_r_half_ohm, source: "provisional: model knowledge (HV winding resistance per half, secondary plus primary referred, of a ~100 VA mains transformer)"}
  t302_leakage_h: {value: 5.0e-3, genome: psu.t302_leakage_h, source: "provisional: model knowledge (leakage per HV half, referred to the secondary)"}
  t302_c_half_f: {value: 300.0e-12, genome: psu.t302_winding_capacitance_f, source: "provisional: model knowledge (self-capacitance of each HV half of a mains transformer, ~100 pF to 1 nF)", notes: "from each GZ34 anode to the centre tap; it takes the leakage's current when the rectifier turns off (without it, an inductive kick into a node with nothing on it: ngspice stopped there, 2026-10-21)"}
  rectifier_tube: {value: GZ34@1, source: "sch: V301 printed '6234', which is the GZ34: [MAN] p.5 tube complement '1-GZ34 (5V4)', p.2 chassis photo label 'GZ34 (5AR4)'; config/components/gz34/1.yaml (per anode)"}
  c304_f: {value: 4.0e-6, source: "sch: C304 4 440 VAC"}
  l301_h: {value: 10.0, genome: psu.l301_h, source: "web: https://www.sowter.co.uk/acatalog/VINTAGE-COMPRESSOR-TRANSFORMERS-A-to-K.html (replacement L301: 10 H, 200 mA, 71 ohms); not printed on A-96039"}
  l301_r_ohm: {value: 71.0, genome: psu.l301_r_ohm, source: "web: same page (71 ohms)"}
  c305_c306_f: {value: 140.0e-6, source: "sch: C305, C306 140 350V, in series"}
  r305_r306_ohm: {value: 100.0e+3, source: "sch: R305, R306 100 K 1W, across C305 and C306"}
  r309_ohm: {value: 470.0e+3, source: "sch: R309 470K 1W, EL34 anode to grid"}
  r310_ohm: {value: 100.0e+3, source: "sch: R310 100K, 240 V to the 6084 screen"}
  r311_ohm: {value: 270.0e+3, source: "sch: R311 270K, 6084 screen to the 5651 anode"}
  r312_ohm: {value: 150.0e+3, source: "sch: R312 150K 1W"}
  r313_ohm: {value: 250.0e+3, source: "sch: R313 250K (B+ ADJ), wiper to the 6084 grid"}
  r314_ohm: {value: 100.0e+3, source: "sch: R314 100K 1W"}
  c307a_f: {value: 80.0e-6, source: "sch: C307A 80 450V on the regulated rail"}
  r315_ohm: {value: 27.0e+3, source: "sch: R315 27K 1W (a builder's note reportedly reads 100K on a redraw; unverified, README open questions)"}
  r316_ohm: {value: 100.0e+3, source: "sch: R316 100K 1W"}
  c307b_f: {value: 60.0e-6, source: "sch: C307B 60 350V, on the R315/R316 tap"}
  r307_r308_ohm: {value: 100.0e+3, source: "sch: R307, R308 100K 1W, across 240 V; their tap is T304's centre tap (heater elevation of V302/V303)"}
  v5651_operating_v: {value: 87.0, genome: tubes.v5651.operating_v, source: "RCA 5651 (1948; data/datasheets/published_points.yaml): operating voltage av. 87 V (min 82, max 92) over 1.5-3.5 mA", notes: "the tube's drop at 2.5 mA (library.V5651_REF_A); the slope is Tung-Sol's (config/components/5651/1.yaml)"}
  # Bias supply.
  t301_rms_v: {value: 26.8, genome: psu.t301_rms_v, source: "web: https://www.sowter.co.uk/specs/0531.htm (replacement T301: 26.8 V, '26.8V should be used if the original Selenium bridge rectifier is used'); not printed on A-96039", notes: "at mains_v_rms = 117 V"}
  t301_r_ohm: {value: 1.0, genome: psu.t301_r_ohm, source: "provisional: model knowledge (secondary plus referred primary resistance of a small 0.5 A bias transformer)"}
  t301_leakage_h: {value: 1.0e-3, genome: psu.t301_leakage_h, source: "provisional: model knowledge (leakage referred to the secondary)"}
  selenium_c_f_per_in2: {value: 0.125e-6, source: "Sarkes Tarzian handbook (1950) p.54: 'the approximate capacity ranges from .1 to .15 microfarads per square inch of rectifying area' (the middle; data/datasheets/published_points.yaml)", notes: "across each GR301 arm"}
  gr301_cell_area_in2: {value: 1.0, genome: psu.gr301_cell_area_in2, source: "provisional: Sarkes Tarzian handbook (1950) p.61 ratings: a bridge of 1-inch-square cells (size 2) carries 0.225 A continuous, 80% into a capacitor, the smallest size above the ~0.14 A this bias supply draws; GR301's cells aren't documented", notes: "rectifying area per arm; one cell per arm (Tarzian's 26 V AC bridge, code 1B1)"}
  bias_rectifier: {value: SELENIUM@1, source: "sch: GR301 bridge (selenium: web: https://www.radiomuseum.org/r/fairchild_stereo_limiter_670.html; Sowter 0531 notes 'the original Selenium bridge rectifier'); config/components/selenium/1.yaml per arm"}
  c302_f: {value: 250.0e-6, source: "sch: C302 250 50V"}
  l302_h: {value: 5.0, genome: psu.l302_h, source: "web: https://www.sowter.co.uk/acatalog/VINTAGE-COMPRESSOR-TRANSFORMERS-A-to-K.html (replacement L302: 5 H at 200 mA); a Drip choke is reportedly 1.5 H; not printed on A-96039"}
  l302_r_ohm: {value: 284.0, genome: psu.l302_r_ohm, source: "derived: puts the settled C303 node at -6.2 V (measured, web: https://groupdiy.com/threads/fairchild-670-questions.32169/; also a Drip 670 check value) with both channels' 6386 current through L302 (scripts/calibrate_psu.py, 2026-10-21). Sowter's replacement is 85 ohms"}
  c303_f: {value: 1000.0e-6, source: "sch: C303 1000 15V"}
  r301_ohm: {value: 1000.0, source: "sch: R301 1K 1W"}
  c108_bias_f: {value: 250.0e-6, source: "sch: C108 250 50V in the bias supply (the designator repeats the sidechain's C108 .1 600V)"}
  r302_ohm: {value: 10.0e+3, source: "sch: R302 10K 5%"}
  c308_f: {value: 25.0e-6, source: "sch: C308 25 25V"}
  r303_ohm: {value: 27.0e+3, source: "sch: R303 27K 5%; its top is printed '-13V. TO -14.5V.'"}
  numerical_leak_ohm: {value: 1.0e+9, source: "numerical: DC path for the floating T104 and T301 secondaries (not physical)"}

  # --- Per-instance tolerance and mismatch (Phase 3) ----------------------------------
  # Every part of channel 1 and the power supply (`tolerance` below) and every tube
  # instance deviates from its nominal by its own draw: u uniform in [-1, 1] from
  # default_rng([passive_seed, crc32(designator)]), scaled by passive_spread and the
  # part's tolerance band (an electrolytic's band is asymmetric). The 6386 triodes
  # deviate around their bank's emission_scale / mu_spread genome values. Channel 2's
  # lumped parts stay nominal. The nominal genome has spread 0: every part at its
  # printed value (the PSU calibration, scripts/calibrate_psu.py, is for it).
  passive_seed: {value: 0, genome: passives.seed, source: "numerical: which set of parts a unit is built from"}
  passive_spread: {value: 0.0, genome: passives.spread, source: "provisional: fraction of each part's tolerance band its deviation spans (0 = every part at its printed value)"}
  tol_resistor_unmarked_pct: {value: 10.0, source: "sch: note 1, 'RESISTORS DESIGNATED IN OHMS, 10% & 1/2W UNLESS OTHERWISE SPECIFIED'"}
  tol_pot_pct: {value: 20.0, genome: passives.pot_pct, source: "provisional: model knowledge (carbon and wirewound potentiometers of the era, +-10..20% track resistance)"}
  tol_attenuator_pct: {value: 2.0, genome: passives.attenuator_pct, source: "provisional: model knowledge (a precision step attenuator, +-1..5% per resistor)"}
  tol_paper_pct: {value: 20.0, genome: passives.paper_capacitor_pct, source: "provisional: model knowledge (paper and oil capacitors of the 1950s, +-10..20%)"}
  tol_mica_pct: {value: 10.0, genome: passives.mica_capacitor_pct, source: "provisional: model knowledge (high-voltage mica or ceramic, +-5..20%)"}
  tol_electrolytic_minus_pct: {value: 20.0, genome: passives.electrolytic_minus_pct, source: "provisional: model knowledge (1950s electrolytics, -10..-20%)"}
  tol_electrolytic_plus_pct: {value: 50.0, genome: passives.electrolytic_plus_pct, source: "provisional: model knowledge (1950s electrolytics, +50..+100%)"}
  tube_emission_pct: {value: 10.0, genome: tubes.instance.emission_pct, source: "provisional: model knowledge (plate current of new tubes of one type at fixed bias, +-10..20%)"}
  tube_mu_pct: {value: 3.0, genome: tubes.instance.mu_pct, source: "provisional: model knowledge (grid-pitch tolerance, a few %)"}

device_params:
  # Genome parameters that act on device instances (the 6386 banks' entries under
  # `devices`) rather than on a value; bounds at the `genome` path. Null: the device
  # file's value.
  v6386_a.emission_scale: {value: 1.0, genome: tubes.v6386_a.emission_scale, source: "nominal 1: the device file's fit (config/components/6386/1.yaml); bank A (V101A, V102A, V103B, V104B)"}
  v6386_a.mu_spread: {value: 1.0, genome: tubes.v6386_a.mu_spread, source: "nominal 1: the device file's fit (config/components/6386/1.yaml); bank A"}
  v6386_a.grid_contact_v: {value: null, genome: tubes.v6386_a.grid_contact_v, source: "null: the device file's grid contact potential (config/components/6386/1.yaml); bank A"}
  v6386_b.emission_scale: {value: 1.0, genome: tubes.v6386_b.emission_scale, source: "nominal 1: the device file's fit (config/components/6386/1.yaml); bank B (V101B, V102B, V103A, V104A)"}
  v6386_b.mu_spread: {value: 1.0, genome: tubes.v6386_b.mu_spread, source: "nominal 1: the device file's fit (config/components/6386/1.yaml); bank B"}
  v6386_b.grid_contact_v: {value: null, genome: tubes.v6386_b.grid_contact_v, source: "null: the device file's grid contact potential (config/components/6386/1.yaml); bank B"}

derived:
  # Channel 2's pairs of parallel parts lumped into one (varimu/circuit/fairchild_670.py,
  # one function per value). Channel 2 has channel 1's printed values, its trims set
  # like channel 1's.
  module: varimu.circuit.fairchild_670
  values:
    ch2_6386_parallel: {source: "derived: 2 x v6386_per_side (channel 2's two banks as one device)"}
    ch2_6386_plate_ohm: {source: "derived: R211 (r111_ohm) plus both plate branches in parallel (R207 / R208 and a T202 primary half, r107_r108_ohm + t102_r_half_ohm)"}
    ch2_6386_cathode_ohm: {source: "derived: the two banks' cathode branches in parallel, each R203 / R204 (r103_r104_ohm) plus its part of R205 BALANCE (r105_ohm, balance)"}
    ch2_12bh7_cathode_ohm: {source: "derived: R224 || R225 (r124_r125_ohm) || both feedback resistors (r_fb_ohm / 2) to R234 || R235 (r134_ohm, r135_ohm)"}

mains:
  # Operating conditions that the `mains` parts (T302's HV halves, T301) scale with.
  v_rms: mains_v_rms
  hz: mains_hz
  rated_v_rms: {value: 117.0, source: "[MAN] p.4: power 117 volts; T302's and T301's voltages (t302_hv_half_rms_v, t301_rms_v) are given at it"}

tolerance:
  # Tolerance class of every part of channel 1 and the power supply, by designator (a
  # part's name in `sections`; a pot's or pad's elements share their part's draw).
  # Parts with `tolerance: none` aren't parts of the unit or are lumped: source and
  # load impedances, winding resistances and capacitances of the mains transformers
  # and chokes, numerical leaks, channel 2. The draw: see "Per-instance tolerance and
  # mismatch" above (seed, spread, bands in percent: a number, a parameter, or
  # [minus, plus]).
  source: "sch (A-96039): printed tolerances (1%, 5%; the rest 10%, note 1); capacitor types read off the symbols and ratings (the polarized symbol and large values at low voltage: electrolytic; C304 is rated 440 VAC: oil)"
  seed: passive_seed
  spread: passive_spread
  tube: {emission_pct: tube_emission_pct, mu_pct: tube_mu_pct}
  bands:
    r1: 1.0
    r5: 5.0
    r10: tol_resistor_unmarked_pct
    pot: tol_pot_pct
    attenuator: tol_attenuator_pct
    paper: tol_paper_pct
    mica: tol_mica_pct
    electrolytic: [tol_electrolytic_minus_pct, tol_electrolytic_plus_pct]
  classes:
    r1: [R101, R102, R107, R108]
    r5: [R113, R114, R120, R121, R124, R125, R128, R129, R145, R147, R149, R150, R302, R303]
    r10: [R103, R104, R111, R116, R118, R119, R122, R123, R126, R127, R130, R131, R132, R133, R134, R135, R136, R137, R138, R139, R140, R141, R143, R144, R301, R305, R306, R307, R308, R309, R310, R311, R312, R314, R315, R316]
    pot: [R105, R115A, R115B, R117, R142, R313]
    attenuator: [AT101]
    paper: [C101, C103, C104, C107, C108, C109, C113, C115, C304]
    mica: [C105, C106]
    electrolytic: [C110, C111, C112, C302, C303, C108B, C308, C305, C306, C307A, C307B]
  combined:
    R101: [R101, R102]
    R149: [R149, R150]

devices:
  # Every device model instance, in the IR's model order. `tolerance: tube` draws the
  # instance's emission and mu by its designator (the key); the 6386 triodes deviate
  # around their bank's genome values (device_params).
  V101A: {device: "6386@1", tolerance: tube, emission: v6386_a.emission_scale, mu: v6386_a.mu_spread, grid_contact_v: v6386_a.grid_contact_v}
  V102A: {device: "6386@1", tolerance: tube, emission: v6386_a.emission_scale, mu: v6386_a.mu_spread, grid_contact_v: v6386_a.grid_contact_v}
  V103B: {device: "6386@1", tolerance: tube, emission: v6386_a.emission_scale, mu: v6386_a.mu_spread, grid_contact_v: v6386_a.grid_contact_v}
  V104B: {device: "6386@1", tolerance: tube, emission: v6386_a.emission_scale, mu: v6386_a.mu_spread, grid_contact_v: v6386_a.grid_contact_v}
  V101B: {device: "6386@1", tolerance: tube, emission: v6386_b.emission_scale, mu: v6386_b.mu_spread, grid_contact_v: v6386_b.grid_contact_v}
  V102B: {device: "6386@1", tolerance: tube, emission: v6386_b.emission_scale, mu: v6386_b.mu_spread, grid_contact_v: v6386_b.grid_contact_v}
  V103A: {device: "6386@1", tolerance: tube, emission: v6386_b.emission_scale, mu: v6386_b.mu_spread, grid_contact_v: v6386_b.grid_contact_v}
  V104A: {device: "6386@1", tolerance: tube, emission: v6386_b.emission_scale, mu: v6386_b.mu_spread, grid_contact_v: v6386_b.grid_contact_v}
  V105A: {device: 12AX7@1, tolerance: tube}
  V105B: {device: 12AX7@1, tolerance: tube}
  V106A: {device: 12BH7@1, tolerance: tube}
  V106B: {device: 12BH7@1, tolerance: tube}
  V107: {device: "6973@1", tolerance: tube}
  V108: {device: "6973@1", tolerance: tube}
  CR101-104: {device: bridge_diode, instance: false}
  V301: {device: rectifier_tube, tolerance: tube}
  V302: {device: EL34T@1, tolerance: tube}
  V303: {device: "6084@1", tolerance: tube}
  V304: {device: "5651@1", instance: false}
  GR301: {device: bias_rectifier, area: gr301_cell_area_in2}
  # Channel 2 (idle, lumped): its two 6386 banks as one device, its 12BH7 and 6973 pairs
  # as one double device each, nominal.
  CH2_6386: {device: "6386@1", name: "6386_CH2", parallel: ch2_6386_parallel}
  CH2_12BH7: {device: 12BH7@1, name: "12BH7_CH2", parallel: 2}
  CH2_6973: {device: "6973@1", name: "6973_CH2", parallel: 2}

sections:
  # Each part: NAME: {<macro>: <nodes>, params} (varimu/circuit/builder.py lists the
  # macros). Nodes are the drawing's (data/schematics/fairchild_670/README.md, "Supply
  # rails"): bp 240 V regulated, ur unregulated, sg the screen tap, nb2 / nb3 / nb4 the
  # bias supply's C303 / C108 / R303 nodes, cv the control voltage.
  - title: power supply
    parts:
      # T302's HV halves from the mains at phase 90 / 270: a run starts at the peak,
      # from a DC point with the reservoirs charged.
      VHVA: {mains: [hva, "0"], v_rms: t302_hv_half_rms_v, phase_deg: 90.0}
      VHVB: {mains: [hvb, "0"], v_rms: t302_hv_half_rms_v, phase_deg: 270.0}
      RT302A: {R: [hva, hva_r], r: t302_r_half_ohm, tolerance: none}
      LT302A: {L: [hva_r, rka], l: t302_leakage_h}
      RT302B: {R: [hvb, hvb_r], r: t302_r_half_ohm, tolerance: none}
      LT302B: {L: [hvb_r, rkb], l: t302_leakage_h}
      CT302A: {C: [rka, "0"], c: t302_c_half_f, tolerance: none}
      CT302B: {C: [rkb, "0"], c: t302_c_half_f, tolerance: none}
      XV301A: {device: [rka, raw], model: V301}
      XV301B: {device: [rkb, raw], model: V301}
      C304: {C: [raw, "0"], c: c304_f}
      RL301: {R: [raw, l301], r: l301_r_ohm, tolerance: none}
      L301: {L: [l301, ur], l: l301_h}
      C305: {C: [ur, c305], c: c305_c306_f}
      R305: {R: [ur, c305], r: r305_r306_ohm}
      C306: {C: [c305, "0"], c: c305_c306_f}
      R306: {R: [c305, "0"], r: r305_r306_ohm}
      # The regulator: EL34 pass, 6084 error amplifier, 5651 reference, R313 B+ ADJ.
      XV302: {device: [ur, eg, bp], model: V302}
      R309: {R: [ur, eg], r: r309_ohm}
      XV303: {device: [eg, es, eadj, ref], model: V303}
      R310: {R: [bp, es], r: r310_ohm}
      R311: {R: [es, ref], r: r311_ohm}
      V304: {vr_tube: [ref, ref_v, "0"], model: V304, operating_v: v5651_operating_v, ref_current_a: {value: 2.5e-3, source: "RCA 5651 (1948; data/datasheets/published_points.yaml): operating voltage over 1.5-3.5 mA, at its middle (varimu.devices.library.V5651_REF_A, the slope fit's reference)"}}
      R312: {R: [bp, adj_t], r: r312_ohm}
      R313: {pot: [adj_t, eadj, adj_b], r: r313_ohm, at: b_plus_adj}
      R314: {R: [adj_b, "0"], r: r314_ohm}
      C307A: {C: [bp, "0"], c: c307a_f}
      R315: {R: [bp, sg], r: r315_ohm}
      R316: {R: [sg, "0"], r: r316_ohm}
      C307B: {C: [sg, "0"], c: c307b_f}
      R307: {R: [bp, hct], r: r307_r308_ohm}
      R308: {R: [hct, "0"], r: r307_r308_ohm}

  - title: bias supply
    parts:
      # T301 (floating; a numerical leak gives it DC) into GR301, "+" to ground. L302
      # from C302 to C303 (the 6386 cathode return); R301 from C302 to the C108 node
      # (ZERO), R302 / R303 on to the 6973 grid-leak return.
      VBS: {mains: [bs1, bsb], v_rms: t301_rms_v, phase_deg: 90.0}
      RT301: {R: [bs1, bs1_r], r: t301_r_ohm, tolerance: none}
      LT301: {L: [bs1_r, bsa], l: t301_leakage_h}
      Rbsleak: {R: [bsb, "0"], r: numerical_leak_ohm, tolerance: none}
      # The selenium cells' own capacitance across each arm.
      GR301: {bridge: [bsa, bsb, "0", nb1], model: GR301, arm_c_f_per_area: selenium_c_f_per_in2, area: gr301_cell_area_in2}
      C302: {C: [nb1, "0"], c: c302_f}
      RL302: {R: [nb1, l302], r: l302_r_ohm, tolerance: none}
      L302: {L: [l302, nb2], l: l302_h}
      C303: {C: [nb2, "0"], c: c303_f}
      R301: {R: [nb1, nb3], r: r301_ohm}
      C108B: {C: [nb3, "0"], c: c108_bias_f}
      R302: {R: [nb3, nb4], r: r302_ohm}
      C308: {C: [nb4, "0"], c: c308_f}
      R303: {R: [nb4, "0"], r: r303_ohm}

  - title: channel 2 (idle, lumped)
    # Channel 2 as its draw on the shared rails: its 6386 grids on its ZERO wiper (no
    # grid current at idle), its 12AX7 cut off (only the threshold networks draw),
    # transformer windings as their DC resistance. Nominal parts.
    tolerance: none
    parts:
      # 6386 banks: plates from 240 V through R211 and the T202 halves, cathodes to the
      # bias supply's C303 node, grids on ZERO.
      R211: {R: [bp, p6c2], r: ch2_6386_plate_ohm}
      XV2_6386: {device: [p6c2, g6c2, k6c2], model: CH2_6386}
      R203: {R: [k6c2, nb2], r: ch2_6386_cathode_ohm}
      R242: {pot: ["0", g6c2, nb3], r: r142_ohm, at: zero}
      # 12AX7 threshold networks (the tube is cut off at idle).
      R216: {R: [bp, dw2], r: r116_ohm}
      R217: {pot: ["0", dw2, k1c2], r: r117_ohm, at: dc_threshold}
      R218: {R: [bp, k1c2], r: r118_ohm}
      R219: {R: [k1c2, "0"], r: r119_ohm}
      # 12BH7 pair: grids grounded through R222 / R223, plates from the unregulated rail.
      R226: {R: [ur, p2c2], r: r126_r127_ohm, parallel: 2}
      XV2_12BH7: {device: [p2c2, "0", k2c2], model: CH2_12BH7}
      R224: {R: [k2c2, "0"], r: ch2_12bh7_cathode_ohm}
      # 6973 pair: plates on the unregulated rail (T204's centre tap), screens from the
      # C307B tap, grid leaks to the bias supply's R303 node.
      XV2_6973: {device: [ur, s3c2, g3c2, "0"], model: CH2_6973}
      R232: {R: [sg, s3c2], r: r132_r133_ohm, parallel: 2}
      R230: {R: [g3c2, nb4], r: r130_r131_ohm, parallel: 2}

  - title: input
    parts:
      # Source impedance, AT101, T101 (secondary centre tap = control voltage).
      Rsrc: {R: [in, in_s], r: source_impedance_ohm, tolerance: none}
      AT101: {t_pad: [in_s, pri, "0"], z: attenuator_z_ohm, atten_db: input_atten_db}
      R101: {R: [pri, "0"], r: r101_r102_ohm}
      T101:
        transformer:
          p: {nodes: [pri, "0"], r: t101_r_pri_ohm}
          sa: {nodes: [ga, cv], ratio: t101_turns_half, r: t101_r_half_ohm, c: t101_c_half_f}
          sb: {nodes: [cv, gb], ratio: t101_turns_half, r: t101_r_half_ohm, c: t101_c_half_f}
        core: {material: t101_core_material, area_m2: t101_core_area_m2, path_m: t101_core_path_m, gap_m: t101_gap_m}
        turns: t101_turns
        leakage_h: t101_leakage_h
        interwinding: {ends: [ga, gb], to: pri, c: t101_c_interwinding_f}

  - title: 6386 push-pull
    parts:
      # 6386 banks: plates to T102, cathodes through R103 / R104 and the balance pot.
      XV101A: {device: [pa, ga, ka], model: V101A}
      XV102A: {device: [pa, ga, ka], model: V102A}
      XV103B: {device: [pa, ga, ka], model: V103B}
      XV104B: {device: [pa, ga, ka], model: V104B}
      XV101B: {device: [pb, gb, kb], model: V101B}
      XV102B: {device: [pb, gb, kb], model: V102B}
      XV103A: {device: [pb, gb, kb], model: V103A}
      XV104A: {device: [pb, gb, kb], model: V104A}
      R103: {R: [ka, ta], r: r103_r104_ohm}
      R104: {R: [kb, tb], r: r103_r104_ohm}
      R105: {pot: [ta, nb2, tb], r: r105_ohm, at: balance}
      C101: {C: [ka, kb], c: c101_f}
      R111: {R: [bp, ctr], r: r111_ohm}
      R107: {R: [ctr, t3], r: r107_r108_ohm}
      R108: {R: [ctr, t2], r: r107_r108_ohm}
      T102:
        transformer:
          pa: {nodes: [pa, t3], ratio: t102_turns_half, r: t102_r_half_ohm, c: t102_c_half_f}
          pb: {nodes: [t2, pb], ratio: t102_turns_half, r: t102_r_half_ohm, c: t102_c_half_f}
          s: {nodes: [out, "0"], r: t102_r_sec_ohm}
        core: {material: t102_core_material, area_m2: t102_core_area_m2, path_m: t102_core_path_m, gap_m: t102_gap_m}
        turns: t102_turns
        leakage_h: t102_leakage_h
        interwinding: {ends: [pa, pb], to: out, c: t102_c_interwinding_f}
      Rload: {R: [out, "0"], r: load_ohm, tolerance: none}

  - title: sidechain input
    parts:
      # Pick-off from the output, T103, the AC THRESHOLD tapped pots with R113 / R114
      # from their taps to the centre line.
      R145: {R: [out, s1], r: r145_r148_ohm}
      R147: {R: ["0", s2], r: r145_r148_ohm}
      R149: {R: [s1, s2], r: r149_r150_ohm}
      T103:
        transformer:
          p: {nodes: [s1, s2]}
          sa: {nodes: [t5, "0"], ratio: t103_turns_half, c: t103_c_half_f}
          sb: {nodes: ["0", t8], ratio: t103_turns_half, c: t103_c_half_f}
        core: {material: t103_core_material, area_m2: t103_core_area_m2, path_m: t103_core_path_m, gap_m: t103_gap_m}
        turns: t103_turns
        leakage_h: t103_leakage_h
      R115A: {tapped_pot: ["0", x1a, w1a, t5], r: r115a_ohm, at: ac_threshold, tap: ac_threshold_tap}
      R115B: {tapped_pot: ["0", x1b, w1b, t8], r: r115b_ohm, at: ac_threshold, tap: ac_threshold_tap}
      R113: {R: [x1a, "0"], r: r113_r114_ohm}
      R114: {R: [x1b, "0"], r: r113_r114_ohm}

  - title: 12AX7
    parts:
      # Biased beyond cutoff by the DC threshold network.
      XV105A: {device: [p1a, w1a, k1], model: V105A}
      XV105B: {device: [p1b, w1b, k1], model: V105B}
      R120: {R: [bp, p1a], r: r120_r121_ohm}
      R121: {R: [bp, p1b], r: r120_r121_ohm}
      R118: {R: [bp, k1], r: r118_ohm}
      R119: {R: [k1, "0"], r: r119_ohm}
      R116: {R: [bp, dw], r: r116_ohm}
      R117: {pot: ["0", dw, k1], r: r117_ohm, at: dc_threshold}
      C103: {C: [p1a, g2a], c: c103_c104_f}
      C104: {C: [p1b, g2b], c: c103_c104_f}

  - title: 12BH7
    parts:
      # Feedback from T104's tertiary winding into the cathodes.
      R122: {R: [g2a, "0"], r: r122_r123_ohm}
      R123: {R: [g2b, "0"], r: r122_r123_ohm}
      XV106A: {device: [p2a, g2a, k2a], model: V106A}
      XV106B: {device: [p2b, g2b, k2b], model: V106B}
      R124: {R: [k2a, "0"], r: r124_r125_ohm}
      R125: {R: [k2b, "0"], r: r124_r125_ohm}
      R126: {R: [ur, p2a], r: r126_r127_ohm}
      R127: {R: [ur, p2b], r: r126_r127_ohm}
      R128: {R: [fy, k2a], r: r_fb_ohm}
      R129: {R: [fg, k2b], r: r_fb_ohm}
      R134: {R: [fy, "0"], r: r134_ohm}
      R135: {R: [fg, "0"], r: r135_ohm}
      C107: {C: [p2a, g3a], c: c107_c108_f}
      C108: {C: [p2b, g3b], c: c107_c108_f}

  - title: "6973"
    parts:
      # Push-pull into T104.
      R130: {R: [g3a, nb4], r: r130_r131_ohm}
      R131: {R: [g3b, nb4], r: r130_r131_ohm}
      XV107: {device: [pa3, sa3, g3a, "0"], model: V107}
      XV108: {device: [pb3, sb3, g3b, "0"], model: V108}
      R132: {R: [sg, sa3], r: r132_r133_ohm}
      R133: {R: [sg, sb3], r: r132_r133_ohm}
      R143: {R: [g3a, nfa], r: r143_r144_ohm}
      C105: {C: [nfa, pa3], c: c105_c106_f}
      R144: {R: [g3b, nfb], r: r143_r144_ohm}
      C106: {C: [nfb, pb3], c: c105_c106_f}
      T104:
        transformer:
          pa: {nodes: [pa3, ur], c: t104_c_half_f}
          pb: {nodes: [ur, pb3], c: t104_c_half_f}
          s: {nodes: [ay, bk], ratio: t104_sec_per_half, c: t104_c_sec_f}
          f: {nodes: [fy, fg], ratio: t104_fb_per_half}
        core: {material: t104_core_material, area_m2: t104_core_area_m2, path_m: t104_core_path_m, gap_m: t104_gap_m}
        turns: t104_turns
        leakage_h: t104_leakage_h

  - title: rectifier and time constant
    parts:
      # Bridge rectifier, time constant network (S102), ZERO.
      R136: {R: [ay, bk], r: r136_ohm}
      Rleak: {R: [bk, "0"], r: numerical_leak_ohm, tolerance: none}
      CT104A: {C: [ay, "0"], c: t104_c_sec_gnd_f, tolerance: none}
      CT104B: {C: [bk, "0"], c: t104_c_sec_gnd_f, tolerance: none}
      DCR101: {device: [ay, tcb], model: CR101-104}
      DCR102: {device: [bk, tcb], model: CR101-104}
      DCR103: {device: [cv, ay], model: CR101-104}
      DCR104: {device: [cv, bk], model: CR101-104}
      R137: {R: [cv, tcb], r: r137_ohm}
      C109: {C: [cv, tcb], c: c109_f}
      S102:
        switch: time_constant
        parts:
          R141: {R: [cv, tcb], r: r141_ohm, in: [1]}
          R138: {R: [cv, tcb], r: r138_ohm, in: [2]}
          C113: {C: [cv, tcb], c: c113_f, in: [3, 4, 5]}
          C111: {C: [cv, tcb], c: c111_f, in: [4]}
          R139: {R: [cv, tc139], r: r139_ohm, in: [5, 6]}
          C110: {C: [tc139, tcb], c: c110_f, in: [5, 6]}
          R140: {R: [cv, tc140], r: r140_ohm, in: [6]}
          C112: {C: [tc140, tcb], c: c112_f, in: [6]}
      C115: {C: [tcb, "0"], c: c115_f}
      R142: {pot: ["0", tcb, nb3], r: r142_ohm, at: zero}
