          RWOBG: {R: [lw_w, "0"], r: lfo_r_wiper_ground_ohm, in: [0]}
      RCUT: {pot: [c_lo, g4, kt], r: r_cutoff_pot_ohm, at: cutoff}
      CKEY: {C: [kb, "0"], c: c_key_f}
      RKT: {pot: [pt, kt, kb], r: r_key_track_pot_ohm, at: key_track}
      CPR: {C: [pb, "0"], c: c_pressure_f}
      RPR: {pot: ["0", pt, pb], r: r_pressure_pot_ohm, at: pressure}
      CCUT: {C: [g4, "0"], c: c_cutoff_f}
      XV4: {device: [p4, s4, g4, k4], model: V4}
      RCVR: {R: [b1, c_vr], r: r_cut_vr_feed_ohm}
      VRCA: {vr_tube: [c_vr, c_vra, c_vrm], model: VRO, operating_v: osc_v5651_operating_v, ref_current_a: osc_v5651_ref_current_a}
      VRCB: {vr_tube: [c_vrm, c_vrb, "0"], model: VRO, operating_v: osc_v5651_operating_v, ref_current_a: osc_v5651_ref_current_a}
      RCVRL: {R: [c_vrm, "0"], r: osc_r_vr_leak_ohm}
      RS4: {R: [c_vr, s4], r: r_screen4_ohm}
      RK4: {R: [k4, "0"], r: r_cathode4_ohm}
  - title: oscillator
    parts:
      OTA:
        transformer:
          sig: {nodes: [o_t, o_m], r: osc_r_signal_winding_ohm}
          ctl: {nodes: [b1, o_c2], ratio: osc_control_ratio, r: osc_r_control_winding_ohm}
        core: {material: mumetall, area_m2: osc_core_area_m2, path_m: osc_core_path_m, gap_m: osc_core_gap_m}
        turns: osc_signal_turns
        leakage_h: osc_leakage_h
      OTB:
        transformer:
          sig: {nodes: [o_m, "0"], r: osc_r_signal_winding_ohm}
          ctl: {nodes: [o_p4, o_c2], ratio: osc_control_ratio, r: osc_r_control_winding_ohm}
        core: {material: mumetall, area_m2: osc_core_area_m2, path_m: osc_core_path_m, gap_m: osc_core_gap_m}
        turns: osc_signal_turns
        leakage_h: osc_leakage_h
      COT: {C: [o_t, "0"], c: osc_c_tank_f}
      # The RANGE switch: its contact grounds the LOW capacitor (range 0) or leaves it
      # floating on the tank (1). Always in the circuit, so switching is a value change
      # (a live stream updates in place; a switch part's position would restart it).
      COTL: {C: [o_t, o_tl], c: osc_c_tank_low_f}
      RRANGE: {rheostat: [o_tl, "0"], r: osc_r_range_open_ohm, at: range}
      ROGS: {R: [o_t, o_g2], r: osc_r_grid_stop_ohm}
      XOV2: {device: [o_p2, o_g2, o_k2], model: OV2}
      ROP2: {R: [b3, o_p2], r: osc_r_plate2_ohm}
      ROK2: {R: [o_k2, "0"], r: osc_r_cathode2_ohm}
      COC2: {C: [o_p2, o_g1b], c: osc_c_couple2_f}
      ROG1B: {R: [o_g1b, "0"], r: osc_r_grid1b_ohm}
      XOV1B: {device: [o_p1b, o_g1b, o_k1], model: OV1B}
      XOV1A: {device: [o_p1a, "0", o_k1], model: OV1A}
      ROT: {R: [o_k1, neg], r: osc_r_tail_ohm}
      ROPA: {R: [b3, o_p1a], r: osc_r_plate_a_ohm}
      ROPB: {R: [b3, o_p1b], r: osc_r_plate_b_ohm}
      COD: {C: [o_p1b, o_t], c: osc_c_drive_f}
      COOT: {C: [o_t, o_wt], c: osc_c_out_f}
      ROWT: {R: [o_wt, o_wa], r: osc_r_wave_tank_ohm}
      COOS: {C: [o_p1a, o_ws], c: osc_c_out_f}
      ROWS: {R: [o_ws, o_wb], r: osc_r_wave_square_ohm}
      ROWTG: {R: [o_wa, "0"], r: osc_r_wave_end_ohm}
      ROWSG: {R: [o_wb, "0"], r: osc_r_wave_end_ohm}
      ROWAVE: {pot: [o_wa, o_out, o_wb], r: osc_r_wave_pot_ohm, at: wave}
      XOV3: {device: [b3, o_out, o_buf], model: OV3}
      ROK3: {R: [o_buf, neg], r: osc_r_buffer_cathode_ohm}
