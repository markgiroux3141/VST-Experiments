# The tube synth (docs/TUBE_SYNTH_PLAN.md, S4): tube_voice.yaml's voice with its own
# oscillator, S4's candidate (b) (vco_lc.yaml), on the voice's one supply: the oscillator's
# draw sags the rails the filter, the envelope and the VCA share, as one instrument's would.
#   O...  the oscillator, its pitch driver and its WAVE pot, as in vco_lc.yaml (parts O-,
#        tubes OV-, nodes o_-, values osc_-): the reactor-tuned LC tank, a 12AX7 gain
#        stage and a 12AU7 cathode-coupled pair, a 6V6GT through the control windings on
#        the `pitch` control input
#   XOV3 the 12AX7's other half, a cathode follower off the WAVE wiper: the oscillator's
#        output at ~600 ohm (the draft's partition couples the voice to it there: a stiff
#        node, as the supply rails are)
#   the mixer: the follower through 0.1 uF and 1M, and the external input (`in`, the audio
#        input: silent when the keys play) through 1M, into the filter's first grid: ~1.2 V
#        peak of the oscillator at the WAVE pot's middle, ~3 V at its square end (the first
#        stage overdriven a little)
#   VROA/VROB two 5651 voltage-reference tubes in series (~174 V) for the 6V6GT's screen:
#        on b3, the VCA opening sagged b3 43 V and the screen with it, and every held note
#        fell ~780 cents over ~2 s (950 -> 606 Hz at -15 V), rising again after the key.
#        Regulating an oscillator's screen is the period's practice, not tuning
#        compensation: the pitch still follows the 5651s' slope, the plate and the tank
#   keyboard: the pitch input's stopper into the 6V6GT's grid, which holds 0.1 uF (1 ms, as
#        the voice's cutoff driver has); the stopper stays with the voice in the draft's
#        partition (control inputs live in its first part)
#   GLIDE (SYNTH_IDEAS.md #1): an 82k audio-taper rheostat from the pitch input onto 4.7 uF
#        ahead of the stopper (portamento: the pitch voltage slides, ~0.39 s time constant
#        at full rotation, none at 0). The grid circuit stays under RCA's 0.1 MOhm for a
#        fixed-bias 6V6GT (82k + 10k), and the grid leak is a 1 GOhm numerical one: a
#        10M leak lost 0.1% of the pitch across the stopper, 0.9% with the glide (~90 cents)
#   KEY TRACK (SYNTH_IDEAS.md #2): the keyboard's second contact string (`key`: linear,
#        0.75 V per semitone, 0 V at C4; the pitch string is tuned to the oscillator per
#        RANGE, so it jumps ~4.5 V at AUTO's split) through 220 ohm onto 4.7 uF, across the
#        KEY TRACK pot (2k: the CUTOFF network's ~0.27 mA through a 10k pot moved C4's cutoff
#        up to ~170 cents as KEY TRACK turned; through 2k, <= ~35). Its wiper is the CUTOFF pot's ground end, so the cutoff follows
#        the key: at C4, or KEY TRACK 0, as before. The share of the wiper's volts on V4's
#        grid grows with CUTOFF (0.4 at 0, 1 at full: the CUTOFF pot and RCUTL divide it)
#   PRESSURE (SYNTH_IDEAS.md #3): the keyboard's aftertouch strip (`pressure`: 0 V at rest,
#        +15 V pressed hard) through 220 ohm onto 4.7 uF, across the PRESSURE pot (2k),
#        whose wiper is the KEY TRACK pot's ground end: pressing raises the CUTOFF pot's
#        foot, as a key above C4 does. Velocity needs no circuit: it is the keyboard bus's
#        key-down volts (the app's velocity table: a soft key a lower envelope)
#   The LFO (SYNTH_IDEAS.md #7): a Wien bridge held by a #327 pilot lamp (LAMP327@1,
#        varimu.devices.lamp: its filament's heat balance, ~0.3-10 s thermal lag where it
#        works, ~600 K), as Hewlett's HP200A held his. DC-coupled throughout (at 0.1 Hz no
#        coupling capacitor works and the lamp may carry no DC): a 12AX7 long-tailed pair
#        (LV1A the Wien's grid, LV1B the feedback's), a divider to its -174 V rail, a 12AU7
#        section with its cathode grounded, a second divider, the 12AU7's other section as
#        the follower (`lfo`, ~0 V DC, ~7.7 V peak). Its negative feedback is RLF onto LV1B's
#        grid, RLS and the lamp to ground: the lamp warms until the loop's gain is 3. RATE
#        is a dual reverse-audio rheostat in both Wien arms with 1 uF (~0.08-19 Hz); the
#        lamp's lag makes the amplitude bloom for seconds after a RATE change (slower at the
#        slow end). CW2 starts at 0.1 V (the kick: a balanced bridge never starts).
#        Its own supply (the user's choice of the options, 2026-11-01): on the main rails
#        its ~11 mA ran the 6X4 past its peak rating (260 mA, GE's 245) and its follower's
#        current at the LFO's rate reached the pitch through b1. A center-tapped winding of
#        its own (on the HV winding's ends it sagged b1 ~4 V: the pitch moved ~6.5 cents
#        between LFO on and off), silicon rectifiers: two into CLR for the reservoir (lf_br, ~310 V) and RLX for the
#        stages' rail (lf_bp, ~270 V, then their RC to lf_b, ~257 V, where their levels balance
#        the pair; the follower's plate on the reservoir itself, lf_br: through the filter
#        its current at the LFO's rate swung the stages' supply, a feedback path), one
#        reversed into CLNR and RLNX for the minus rail (lf_n, two 5651s' -174 V: the
#        follower's return, the dividers, the tail; through a dropping resistor alone the
#        follower's current moved it volts at the LFO's rate, which the slow end heard as a
#        wrong rate and a hunting swing, and from one 5651's -87 V the dividers passed too
#        little of the swing for the lamp to warm). LFO ON / OFF (`lfo_on`, the user's
#        call: CPU): OFF takes the oscillator and its supply out (a switch part; a flip
#        restarts a live stream), so the synth's rails don't move
#   VIBRATO (SYNTH_IDEAS.md #8): a pot on the LFO, summed into the pitch ahead of GLIDE
#        (the key string through RPSUM 1k, the pot's wiper through RVIB 47k: ~2% of the LFO,
#        up to ~+-1 semitone; the pitch scales by 0.979, the tuning tables are measured
#        with it). Into the 6V6GT's grid directly, the 10k stopper's low source would have
#        made the pitch follow GLIDE's setting, and a coupling capacitor would have slid
#        every key change for a second
#   WOBBLE (#8): a pot on the LFO into the CUTOFF pot's low end through RWOB (127k), RCUTL
#        now 143k from the -100 V rail: the low end's Thevenin source is as before (~-49.7 V
#        through ~67k, was 68k from the -45 V rail), so CUTOFF's law is unchanged; the
#        wobble reaches V4's grid as the low end's share does (all of it at CUTOFF 0, none
#        at 1). Into V4's grid itself, the same depth loaded the pot's wiper and bent
#        CUTOFF's law (~half an octave brighter at 0.3)
#   LFO AUDIO (SYNTH_IDEAS.md #14): a switch whose contacts (always in the circuit, so a flip
#        updates a live stream in place) take 0.99 uF from beside each 10 nF Wien capacitor
#        and 900 pF from the compensation: RATE then sweeps ~8 Hz-1.9 kHz, the ring's carrier
#   The ring modulator (#14; scripts/ring_study.py): oscillator x LFO, as Cowan's (1934) diode
#        ring between two transformers (1 : 1+1 mumetall), four selenium cells. Each input has
#        a 12AU7 follower of its own: the oscillator's buffer through 0.1 uF (no load across
#        the draft's partition: the ring's load current there, one sample late, stopped Newton
#        at the cells), the LFO DC-coupled through a divider to the ring's minus rail (the
#        carrier runs down to 0.08 Hz; at LFO rates the ring is a tremolo through zero). The
#        carrier goes into T1's centre tap, T2's output is terminated (2.4k) into the RING pot
#        and a 12AU7 make-up stage (~10x), into the mixer through 1M beside the oscillator's
#        new OSC level pot. Its supply is its own RC off the LFO's reservoirs, so it is in only
#        with the LFO (its carrier) on and RING ON (`ring_on`, the user's call: CPU; off, its
#        section is empty and gets no thread), and the synth's rails don't see it
#   ADSR (SYNTH_IDEAS.md #15; scripts/adsr_study.py): the envelope below with an attack
#        that ends at its peak: a 12AU7 follower charges it toward the keyboard bus, a 12AX7
#        comparator (envelope against the bus) fires near the top and a pair of 12AU7
#        inverters latch it, switching the follower off and a 12AU7 decay switch on
#        (through DECAY toward the SUSTAIN pot's level) until the next key down; RELEASE
#        as before. Two 6AL5s clamp to the bus and feed the latch back; a -340 V rail (a
#        silicon diode off the HV winding) sits under the switches so they turn fully off.
#        SUSTAIN at 1 is the AR envelope as before. The slowest attack and the fastest decay
#        are the fragile corners (the rails sagging moves the logic's thresholds)
# The rest is tube_voice.yaml's: its header follows.
#
# The tube synth's voice (docs/TUBE_SYNTH_PLAN.md, S3): tube_filter.yaml's filter, supply
# and cutoff driver, with notes in: the keyboard's gate drives an envelope that opens a
# push-pull variable-mu VCA. The tone itself still comes from the native app's test
# oscillator (S4 brings the synth's own).
#   V1A/V1B  12AU7 gain stage and follower into the reactor low-pass (TA/TB, CF, RL)
#   V5   12AX7 cathode-coupled pair: the RESONANCE Q multiplier
#   V2A  12AU7 follower off the filter node
#   V6   12AU7 driver, parallel-fed (no DC in the core) into the interstage
#        transformer TIN, whose center-tapped secondary drives the VCA's grids in
#        antiphase, as the 670's input transformer does: the envelope goes straight into
#        the center tap. (Through a phase splitter's coupling capacitors and 2.2M grid
#        leaks the grids followed the envelope with a 220 ms time constant: no attack
#        was faster than that, and a coupling network can't be fast for the bias and
#        pass the bass at once.)
#   V3A/V3B  6386 sections in push-pull into the output transformer TOUT: their grids'
#        common bias is the envelope, so the envelope's own movement (and the supply's
#        hum) is common mode and cancels in TOUT, where a single-ended VCA thumps
#   The envelope, keyed as the Hammond Novachord keyed its notes: a key switches the
#        keyboard bus (the `gate` control input) between -110 V (no key) and -1 V (a key
#        down). A 6X4's two sections steer it: with a key down the bus charges the
#        envelope node through the ATTACK rheostat and VDA; with the key up VDA blocks
#        and the node discharges into the bus through the RELEASE rheostat and VDR. CENV
#        holds it. The node is the VCA grids' common bias: -110 V shut, ~-2 V open (the
#        bus a volt past it, so the diode's creep near zero current doesn't slow the
#        last volt). The VCA's loudness comes in its last few volts of bias, so the
#        attack is heard as the RC's tail: CENV is small (0.47 uF, the grid leaks no DC
#        load on it) for a ~0.5 ms time constant at the fastest (4.7 uF gave 16 ms to
#        90%; a clamp at 0 V with the bus aimed past it dropped ~5 V in a vacuum diode
#        at its current and drove the grids positive).
#   V4   6V6GT drawing its plate current through the reactor's control windings (CUTOFF).
#        Its screen is on two 5651s of its own (VRCA/VRCB, ~177 V): on b1 a key's VCA sag
#        pulled the cutoff down 70-810 cents (most at low CUTOFF; 2026-10-30), now 20-140.
#        At 177 V the 6V6GT cuts off near -27 V, so the pot's low end is fed from the
#        -45 V rail through RCUTL (68k: -27 V; since WOBBLE, 143k from the -100 V rail with
#        RWOB beside it, the same source)
#   V7   ENV AMOUNT: a second 6V6GT beside V4 on the control windings (its plate on p4),
#        its grid on the envelope node (never positive: no load on it, where a pot summed
#        into V4's grid would hold the VCA shut at slow attacks), so the envelope adds
#        control current and opens the filter with the VCA. AMOUNT is its screen voltage,
#        a pot from b1 (0: the screen grounded, V7 off), bypassed by CS7 (it also takes
#        b1's ripple off the screen). 2.2k in its cathode: ~10 mA at full AMOUNT
# The supply is tube_filter.yaml's: a 6X4 full-wave rectifier, CRC filtering (b1 the
# 6V6GT, b4 the VCA's center tap, b3 the small stages; the reservoir on the RESERVOIR
# switch, SYNTH_IDEAS.md #6), a selenium bridge for the bias
# (-105 V, -46 V, and an RC stage of its own for the envelope's rail).
# Invented circuit, not modelled hardware: round numbers, every value a design choice.

title: "Tube synth (voice and oscillator)"
input: in
cv_inputs:
  gate: bus
  pitch: pv
  key: kv
  pressure: av
probes: [out, f, env, bus, mix, o_t, o_out, o_buf, p3a, p3b, b1, b3, neg, neg2, ta_core, tb_core, ota_core, otb_core]

full_scale:
  input_volts_peak: {value: 1.0, source: "provisional: model knowledge (line level into the external input, ~1 V peak)"}
  output_volts_peak: {value: 3.5, source: "provisional: model knowledge (the output transformer's secondary at a full envelope: the oscillator's square end overdriving the first stage peaks ~3 V; set from a render, 2026-10-30)"}

# Noise (device builder B5, varimu.devices.noise): Johnson noise on the resistors, shot,
# grid-current shot and flicker noise on the tubes, the mains wander; the defaults' values
# and sources are varimu.devices.noise's (RESISTOR_T_K, FLICKER_V2, MAINS_RMS).
noise:
  seed: 1

# Heated cathodes (device builder B6, varimu.devices.cathode; config/cathodes.yaml): every
# tube follows one cathode temperature, its heater at the MAINS setting's ratio to the rated
# 120 V times HEATER (`heater`, the heater winding's tap: SYNTH_IDEAS.md #4) and the mains
# wander; runs start warm (a cold start on demand: power on). Turning HEATER heats or cools
# the cathodes through their 7 s lag.
heaters: {tap: heater}

controls:
  cutoff: {value: 0.3, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the CUTOFF pot, V4's grid from ~-27 V (0; the bias rails through RCUTL and RWOB) to ground (1))"}
  resonance: {value: 0.3, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the RESONANCE pot, the share of V5B's output fed back to the filter node; linear)"}
  attack: {value: 0.2, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the ATTACK rheostat, 1.5M log in the attack follower's plate into 0.47 uF: ~5 ms to ~0.7 s (time constant); 2026-11-01, the ADSR: 2.2M stalled the slowest attack below the comparator when the rails sag, scripts/adsr_study.py)"}
  decay: {value: 0.3, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design, 2026-11-01: the ADSR, SYNTH_IDEAS.md #15; scripts/adsr_study.py: the DECAY rheostat, 39k + 4.7M log into the decay switch: ~18 ms to ~2 s toward SUSTAIN once the attack has peaked)"}
  sustain: {value: 1.0, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design, 2026-11-01: the ADSR, SYNTH_IDEAS.md #15; scripts/adsr_study.py: the SUSTAIN pot, the level the decay settles at while the key is held, from the -105 V rail (0: shut, ~-50 dB) to ~-2 V (1: as open as the attack's peak, the AR envelope as before); linear)"}
  release: {value: 0.4, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the RELEASE rheostat, 4.7k + 4.7M log from 0.47 uF: ~10 ms to ~2 s)"}
  env_amount: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design, 2026-10-30: the ENV AMOUNT pot, V7's screen from ground (0: off) to b1 (1); linear)"}
  key_track: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design, 2026-11-01: the KEY TRACK pot, the share of the key string under the CUTOFF pot; linear)"}
  pressure: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design, 2026-11-01: the PRESSURE pot, the share of the aftertouch strip under the KEY TRACK pot; linear)"}
  glide: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design, 2026-10-31: the GLIDE rheostat, 82k audio taper onto 4.7 uF: ~14 ms at 0.25, ~45 ms at 0.5, ~0.39 s at 1 (time constants); 0 none)"}
  wave: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the oscillator's WAVE pot, tank (0) to square (1); linear)"}
  range: {value: 1, choices: [0, 1], unit: position, source: "provisional: model knowledge (design, 2026-10-30: the oscillator's RANGE switch: 0 LOW, the tank's 56 nF with 168 nF beside it (224 nF: ~27-790 Hz), 1 HIGH, 56 nF alone (~58-1740 Hz); docs/SYNTH_LOW_END.md's tank sweep)"}
  reservoir: {value: 20.0e-6, choices: [1.0e-6, 2.0e-6, 4.0e-6, 6.0e-6, 8.0e-6, 12.0e-6, 20.0e-6, 40.0e-6], unit: F, source: "provisional: model knowledge (design, 2026-11-01: the RESERVOIR switch, a rotary switch choosing the reservoir electrolytic (450 V parts), 20 uF as before; SYNTH_IDEAS.md #6: smaller is more 120 Hz ripple, a hum-growl, and below ~6 uF the pitch warbles and goes flat, the user's broken end down to 1 uF; the 6X4 stays under its 245 mA steady-state peak at every step, scripts/supply_study.py)"}
  lfo_on: {value: 1, choices: [0, 1], unit: switch, source: "provisional: model knowledge (design, 2026-11-01: the LFO's ON / OFF switch, the user's call: OFF takes its tubes, lamp and own supply out of the circuit (no CPU for them, no thread), so the rails and the tuning stay put; VIBRATO and WOBBLE then hear 0 V)"}
  lfo_audio: {value: 0, choices: [0, 1], unit: switch, source: "provisional: model knowledge (design, 2026-11-01: the LFO's AUDIO range switch (SYNTH_IDEAS.md #14): its contacts take the Wien bridge's 990 nF capacitors (and 900 pF of the loop's compensation) out, leaving 10 nF (100 pF): RATE then runs ~8 Hz to ~1.9 kHz, the ring modulator's carrier. Contacts always in the circuit, so a flip updates a live stream in place)"}
  lfo_rate: {value: 0.7, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design, 2026-11-01: the LFO's RATE, a dual 2M reverse-audio rheostat in the Wien bridge's arms (8.2k each in series) with 1 uF: ~0.08 Hz at 0, ~0.35 at 0.25, ~1.5 at 0.5, ~4.5 at 0.7, ~19 at 1; at AUDIO, 10 nF: ~8 Hz to ~1.9 kHz)"}
  vibrato: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design, 2026-11-01: the VIBRATO pot, the share of the LFO summed into the pitch ahead of GLIDE; linear)"}
  wobble: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design, 2026-11-01: the WOBBLE pot, the share of the LFO into V4's grid (the cutoff); linear)"}
  ring_on: {value: 0, choices: [0, 1], unit: switch, source: "provisional: model knowledge (design, 2026-11-01: the ring modulator's ON / OFF switch (SYNTH_IDEAS.md #14; the user's call: CPU): its power switch on the LFO's supply, so the ring runs only with the LFO on (its carrier); off, the ring's section is empty and gets no thread)"}
  ring: {value: 1.0, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design, 2026-11-01: the RING level pot into the mixer, audio taper)"}
  osc_level: {value: 1.0, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design, 2026-11-01: the oscillator's level pot into the mixer, audio taper; full is the mix as before (the ring alone at 0))"}
  heater: {value: 1.0, min: 0.6, max: 1.1, unit: ratio, source: "provisional: model knowledge (design, 2026-11-01: the HEATER control, the heaters' volts over their rating (a heater winding's taps, as period gear set them); tubes are rated +-10%, so below 0.9 is out of rating (the panel says so): the user's choice, extended to 0.6 for the starved sound)"}
  mains_v_rms: {value: 120.0, min: 105.0, max: 127.0, unit: V, source: "provisional: model knowledge (US line voltage)"}
  mains_hz: {value: 60.0, min: 50.0, max: 60.0, unit: Hz, source: "provisional: model knowledge (US mains)"}

values:
  # --- supply
  pt_hv_half_rms_v: {value: 250.0, source: "provisional: model knowledge (design: a small power transformer's HV half, sized for ~250 V at b3)"}
  pt_r_half_ohm: {value: 150.0, source: "provisional: model knowledge (a ~25 W transformer's HV half with the primary referred, ~150 ohm)"}
  pt_leakage_h: {value: 10.0e-3, source: "provisional: model knowledge (leakage per HV half of a small mains transformer)"}
  pt_c_half_f: {value: 300.0e-12, source: "provisional: model knowledge (self-capacitance per HV half; a capacitance on every rectifier node, CLAUDE.md)"}
  rectifier_tube: {value: 6X4@1, source: "provisional: model knowledge (design: a 6X4 full-wave rectifier, as small studio gear of the era used; config/components/6x4/1.yaml, per section)"}
  r_b12_ohm: {value: 1.0e+3, source: "provisional: model knowledge (filter resistor b1 to b2)"}
  r_b23_ohm: {value: 2.2e+3, source: "provisional: model knowledge (filter resistor b2 to b3, the small stages' and the VCA's decoupling)"}
  r_b24_ohm: {value: 4.7e+3, source: "provisional: model knowledge (design: the VCA's own RC branch off b2: at b3, the input stages' signal currents leaked through its plate resistor with it cut off, -34 dB)"}
  c_decouple_f: {value: 47.0e-6, source: "provisional: model knowledge (b2 and b3 electrolytics: the VCA hums at b2's ripple otherwise)"}
  r_bleeder_ohm: {value: 220.0e+3, source: "provisional: model knowledge (a bleeder across the reservoir)"}
  bias_winding_rms_v: {value: 85.0, source: "provisional: model knowledge (design: a bias winding for ~-100 V)"}
  bias_winding_r_ohm: {value: 200.0, source: "provisional: model knowledge (a small bias winding's resistance)"}
  bias_rectifier: {value: SELENIUM@1, source: "provisional: model knowledge (design: a selenium bridge for the bias, as the 670 has; config/components/selenium/1.yaml; full-wave: a half-wave bias hummed at -26 dBFS through the VCA's grid)"}
  c_bias_arm_f: {value: 1.0e-9, source: "provisional: model knowledge (each selenium arm's capacitance; a capacitance on the rectifier nodes)"}
  bias_arm_area: {value: 1.0, source: "numerical: the arm capacitance is given per arm (the macro's per-area form)"}
  c_bias_winding_f: {value: 1.0e-9, source: "provisional: model knowledge (the floating bias winding's capacitance to the core: holds its common mode, as CT104A/B in the 670)"}
  r_bias_winding_leak_ohm: {value: 1.0e+8, source: "numerical: a DC path for the floating bias winding (its insulation's leakage; the pre-flight checks need one)"}
  c_bias_f: {value: 100.0e-6, source: "provisional: model knowledge (bias filter electrolytics)"}
  r_vca_bias_filter_ohm: {value: 2.2e+3, source: "provisional: model knowledge (design: an RC stage of its own for the envelope's rail: the VCA's grids hear every millivolt there)"}
  r_bias_drop_ohm: {value: 4.7e+3, source: "provisional: model knowledge (design: -100 V to the -45 V node)"}
  r_bias_ground_ohm: {value: 8.2e+3, source: "provisional: model knowledge (design: the -45 V node to ground, with its loads)"}
  # --- input
  r_grid_in_ohm: {value: 1.0e+6, source: "provisional: model knowledge (grid leak)"}
  r_stopper_ohm: {value: 10.0e+3, source: "provisional: model knowledge (grid stopper)"}
  r_plate1_ohm: {value: 47.0e+3, source: "provisional: model knowledge (12AU7 plate load)"}
  r_cathode1_ohm: {value: 1.5e+3, source: "provisional: model knowledge (12AU7 self bias, unbypassed: gain ~11)"}
  r_follower1_ohm: {value: 22.0e+3, source: "provisional: model knowledge (12AU7 follower to ground, ~5 mA)"}
  c_couple1_f: {value: 4.7e-6, source: "provisional: model knowledge (into the reactor: 17 Hz with its 18 H, below the passband)"}
  # --- filter
  c_filter_f: {value: 47.0e-9, source: "provisional: model knowledge (as reactor_filter.yaml: ~110 Hz unbiased, ~4 kHz at full cutoff)"}
  r_load_ohm: {value: 4.7e+3, source: "provisional: model knowledge (the filter's damping with the resonance off: Q ~0.25 at the bottom, ~6 at the top)"}
  r_tail_ohm: {value: 47.0e+3, source: "provisional: model knowledge (V5's tail to the -45 V rail, ~1 mA for the pair)"}
