          VLWA: {mains: [lf_wa, "0"], v_rms: lfo_winding_rms_v, phase_deg: 90.0, in: [1]}
          VLWB: {mains: [lf_wb, "0"], v_rms: lfo_winding_rms_v, phase_deg: 270.0, in: [1]}
