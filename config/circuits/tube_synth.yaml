          RLWB: {R: [lf_wb, lf_hb], r: pt_r_half_ohm, in: [1]}
          CLWA: {C: [lf_ha, "0"], c: pt_c_half_f, in: [1]}
          CLWB: {C: [lf_hb, "0"], c: pt_c_half_f, in: [1]}
          DLA: {device: [lf_ha, lf_br], model: DLR, in: [1]}
          DLB: {device: [lf_hb, lf_br], model: DLR, in: [1]}
          CLR: {C: [lf_br, "0"], c: lfo_c_reservoir_f, in: [1]}
          RLX: {R: [lf_br, lf_bp], r: lfo_r_plus_ohm, in: [1]}
          CLX: {C: [lf_bp, "0"], c: lfo_c_plus_f, in: [1]}
          RLBL: {R: [lf_bp, "0"], r: lfo_r_bleed_ohm, in: [1]}
