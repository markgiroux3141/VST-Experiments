  - title: lfo
    parts:
      # LFO ON / OFF (`lfo_on`): the oscillator and its pots in position 1; in 0 this
      # section is empty (the draft's partition gives it no thread), its supply is off,
      # VIBRATO's and WOBBLE's ends grounded
      SWLFO:
        switch: lfo_on
        parts:
          RLB: {R: [lf_bp, lf_b], r: lfo_r_supply_ohm, in: [1]}
          CLB: {C: [lf_b, "0"], c: lfo_c_supply_f, in: [1]}
          # The Wien bridge: the series arm from the output to LV1A's grid, the parallel arm
          # from the grid to ground; RATE's two gangs
          RW1S: {R: [lfo, lf_w1], r: lfo_r_rate_min_ohm, in: [1]}
          RW1: {rheostat: [lf_w1, lf_s], r: lfo_r_rate_ohm, at: lfo_rate, taper_mid: lfo_rate_taper_mid, reverse: 1, in: [1]}
          CW1: {C: [lf_s, lf_g], c: lfo_c_wien_f, in: [1]}
          RW2S: {R: [lf_g, lf_w2], r: lfo_r_rate_min_ohm, in: [1]}
          RW2: {rheostat: [lf_w2, "0"], r: lfo_r_rate_ohm, at: lfo_rate, taper_mid: lfo_rate_taper_mid, reverse: 1, in: [1]}
          CW2: {C: [lf_g, "0"], c: lfo_c_wien_f, v0: lfo_kick_v, in: [1]}
          # The AUDIO switch: its contacts (closed at LOW) put 0.99 uF beside each Wien
          # capacitor and 900 pF beside the compensation
          CW1L: {C: [lf_s, lf_s1], c: lfo_c_wien_low_f, in: [1]}
          RW1A: {rheostat: [lf_s1, lf_g], r: lfo_r_contact_open_ohm, at: lfo_audio, in: [1]}
          CW2L: {C: [lf_g, lf_g1], c: lfo_c_wien_low_f, v0: lfo_kick_v, in: [1]}
          RW2A: {rheostat: [lf_g1, "0"], r: lfo_r_contact_open_ohm, at: lfo_audio, in: [1]}
          CLCL: {C: [lf_pa, lf_pc], c: lfo_c_comp_low_f, in: [1]}
          RLCA: {rheostat: [lf_pc, "0"], r: lfo_r_contact_open_ohm, at: lfo_audio, in: [1]}
          XLV1A: {device: [lf_pa, lf_g, lf_k], model: LV1A, in: [1]}
          XLV1B: {device: [lf_pb, lf_fb, lf_k], model: LV1B, in: [1]}
          RLT: {R: [lf_k, lf_n], r: lfo_r_tail_ohm, in: [1]}
          RLPA: {R: [lf_b, lf_pa], r: lfo_r_plate_a_ohm, in: [1]}
          RLPB: {R: [lf_b, lf_pb], r: lfo_r_plate_b_ohm, in: [1]}
          CLC: {C: [lf_pa, "0"], c: lfo_c_comp_f, in: [1]}
          RLD1: {R: [lf_pa, lf_f1], r: lfo_r_div1_top_ohm, in: [1]}
          RLE1: {R: [lf_f1, lf_n], r: lfo_r_div1_bot_ohm, in: [1]}
          XLV2A: {device: [lf_p2, lf_f1, "0"], model: LV2A, in: [1]}
          RLP2: {R: [lf_b, lf_p2], r: lfo_r_plate2_ohm, in: [1]}
          RLD2: {R: [lf_p2, lf_f2], r: lfo_r_div2_top_ohm, in: [1]}
          RLE2: {R: [lf_f2, lf_n], r: lfo_r_div2_bot_ohm, in: [1]}
          RLFP: {R: [lf_br, lf_fp], r: lfo_r_follower_plate_ohm, in: [1]}
          CLFP: {C: [lf_fp, "0"], c: lfo_c_follower_plate_f, in: [1]}
          XLV2B: {device: [lf_fp, lf_f2, lfo], model: LV2B, in: [1]}
          RLK: {R: [lfo, lf_n], r: lfo_r_follower_ohm, in: [1]}
          # The negative feedback: the lamp warms until the loop's gain is 3
          RLF: {R: [lfo, lf_fb], r: lfo_r_feedback_ohm, in: [1]}
          RLS: {R: [lf_fb, lf_lp], r: lfo_r_lamp_series_ohm, in: [1]}
          XLP: {device: [lf_lp, lf_t, "0"], model: LP, in: [1]}
          CLT: {C: [lf_t, "0"], c: lfo_c_thermal_f, in: [1]}
          # VIBRATO and WOBBLE
          RVIBP: {pot: ["0", lv_w, lfo], r: lfo_r_pot_ohm, at: vibrato, in: [1]}
          CVIBW: {C: [lv_w, "0"], c: lfo_c_wiper_f, in: [1]}
          RWOBP: {pot: ["0", lw_w, lfo], r: lfo_r_pot_ohm, at: wobble, in: [1]}
          CWOBW: {C: [lw_w, "0"], c: lfo_c_wiper_f, in: [1]}
  - title: ring
    parts:
      # The ring modulator (SYNTH_IDEAS.md #14): on the LFO's supply and with the LFO as
      # its carrier, so it is in only with the LFO on and RING ON
      SWRING:
        switch: lfo_on
        parts:
          SWRINGO:
            switch: ring_on
            in: [1]
            parts:
              # Its own RC branches off the LFO's reservoirs
              RRGBP: {R: [lf_br, rg_b], r: ring_r_supply_plus_ohm, in: [1]}
              CRGBP: {C: [rg_b, "0"], c: ring_c_supply_f, in: [1]}
              RRGBN: {R: [lf_nr, rg_n], r: ring_r_supply_minus_ohm, in: [1]}
              CRGBN: {C: [rg_n, "0"], c: ring_c_supply_f, in: [1]}
              # The signal follower: the oscillator's buffer through 0.1 uF
              CRGIA: {C: [o_buf, rg_ga], c: ring_c_grid_f, in: [1]}
              RRGGA: {R: [rg_ga, "0"], r: ring_r_grid_ohm, in: [1]}
              XRGVA: {device: [rg_b, rg_ga, rg_ka], model: RGVA, in: [1]}
              RRGKA: {R: [rg_ka, rg_n], r: ring_r_follower_ohm, in: [1]}
              CRGS: {C: [rg_ka, rg_sc], c: ring_c_couple_f, in: [1]}
              RRGS: {R: [rg_sc, rg_sp], r: ring_r_source_ohm, in: [1]}
              # The carrier follower: the LFO, DC-coupled through a divider to the minus rail
              RRGIB: {R: [lfo, rg_gb], r: ring_r_carrier_top_ohm, in: [1]}
              RRGGB: {R: [rg_gb, rg_n], r: ring_r_carrier_bot_ohm, in: [1]}
              XRGVB: {device: [rg_b, rg_gb, rg_kb], model: RGVB, in: [1]}
              RRGKB: {R: [rg_kb, rg_n], r: ring_r_follower_ohm, in: [1]}
              RRGC: {R: [rg_kb, rg_ct1], r: ring_r_carrier_ohm, in: [1]}
              RRGCL: {R: [rg_ct1, "0"], r: ring_r_ct_return_ohm, in: [1]}
              # The ring: T1 (signal in, centre-tapped), four selenium cells, T2
              RGT1:
                in: [1]
                transformer:
                  pri: {nodes: [rg_sp, "0"], r: ring_r_winding_ohm, c: ring_c_winding_f}
                  sa: {nodes: [rg_r1, rg_ct1], ratio: ring_sec_ratio, r: ring_r_winding_ohm}
                  sb: {nodes: [rg_ct1, rg_r2], ratio: ring_sec_ratio, r: ring_r_winding_ohm}
                core: {material: mumetall, area_m2: ring_core_area_m2, path_m: ring_core_path_m, gap_m: ring_core_gap_m}
                turns: ring_turns
                leakage_h: ring_leakage_h
              CRGR1: {C: [rg_r1, "0"], c: ring_c_node_f, in: [1]}
              CRGR2: {C: [rg_r2, "0"], c: ring_c_node_f, in: [1]}
              CRGQ1: {C: [rg_q1, "0"], c: ring_c_node_f, in: [1]}
              CRGQ2: {C: [rg_q2, "0"], c: ring_c_node_f, in: [1]}
              DRG1: {device: [rg_r1, rg_q1], model: DRG, in: [1]}
              DRG2: {device: [rg_q1, rg_r2], model: DRG, in: [1]}
              DRG3: {device: [rg_r2, rg_q2], model: DRG, in: [1]}
              DRG4: {device: [rg_q2, rg_r1], model: DRG, in: [1]}
              RGT2:
                in: [1]
                transformer:
                  pri: {nodes: [rg_out, "0"], ratio: ring_out_ratio, r: ring_r_winding_ohm, c: ring_c_winding_f}
                  sa: {nodes: [rg_q1, "0"], ratio: ring_sec_ratio, r: ring_r_winding_ohm}
                  sb: {nodes: ["0", rg_q2], ratio: ring_sec_ratio, r: ring_r_winding_ohm}
                core: {material: mumetall, area_m2: ring_core_area_m2, path_m: ring_core_path_m, gap_m: ring_core_gap_m}
                turns: ring_turns
                leakage_h: ring_leakage_h
              RRGLD: {R: [rg_out, "0"], r: ring_r_termination_ohm, in: [1]}
              # RING, and the make-up stage
              RRGP: {pot: ["0", rg_w, rg_out], r: ring_r_level_pot_ohm, at: ring, taper_mid: mix_taper_mid, in: [1]}
              RRGST: {R: [rg_w, rg_gc], r: ring_r_stopper_ohm, in: [1]}
              XRGVC: {device: [rg_pc, rg_gc, rg_kc], model: RGVC, in: [1]}
              RRGKC: {R: [rg_kc, "0"], r: ring_r_cathode_ohm, in: [1]}
              RRGPC: {R: [rg_b, rg_pc], r: ring_r_plate_ohm, in: [1]}
              CRGO: {C: [rg_pc, rg_c], c: ring_c_out_f, in: [1]}
              RRGCX: {R: [rg_c, "0"], r: ring_r_out_leak_ohm, in: [1]}
              RRGX: {R: [rg_c, rg_x], r: ring_r_out_ohm, in: [1]}
              CRGX: {C: [rg_x, "0"], c: ring_c_out_node_f, in: [1]}
