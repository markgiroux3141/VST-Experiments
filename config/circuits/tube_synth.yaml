  - title: pitch
    parts:
      COG4: {C: [o_g4, "0"], c: osc_c_grid4_f}
      ROG4: {R: [o_g4, "0"], r: osc_r_grid4_leak_ohm}
      XOV4: {device: [o_p4, o_s4, o_g4, o_k4], model: OV4}
      ROVR: {R: [b1, o_vr], r: osc_r_vr_feed_ohm}
      VROA: {vr_tube: [o_vr, o_vra, o_vrm], model: VRO, operating_v: osc_v5651_operating_v, ref_current_a: osc_v5651_ref_current_a}
      VROB: {vr_tube: [o_vrm, o_vrb, "0"], model: VRO, operating_v: osc_v5651_operating_v, ref_current_a: osc_v5651_ref_current_a}
      ROVRL: {R: [o_vrm, "0"], r: osc_r_vr_leak_ohm}
