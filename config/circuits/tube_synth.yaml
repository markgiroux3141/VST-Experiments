  osc_control_ratio: {value: 1.0, source: "provisional: model knowledge (design: 1000 control turns per core, as tube_filter.yaml's)"}
  osc_r_signal_winding_ohm: {value: 160.0, source: "provisional: model knowledge (2000 turns of ~0.1 mm copper on a small toroid, ~160 Ohm)"}
  osc_r_control_winding_ohm: {value: 30.0, source: "provisional: model knowledge (1000 turns of ~0.15 mm copper)"}
  osc_leakage_h: {value: 0.0, source: "provisional: model knowledge (windings on a toroid couple closely; leakage neglected)"}
  osc_core_area_m2: {value: 1.0e-4, source: "provisional: model knowledge (a small tape-wound toroid, 1 cm^2)"}
  osc_core_path_m: {value: 0.1, source: "provisional: model knowledge (10 cm mean path)"}
  osc_core_gap_m: {value: 0.0, source: "provisional: model knowledge (a tape-wound toroid has no joint gap)"}

mains:
  v_rms: mains_v_rms
  hz: mains_hz
  rated_v_rms: {value: 120.0, source: "provisional: model knowledge (the power transformer's rated primary; its secondaries are given at it)"}

devices:
  V1A: {device: 12AU7@1}
  V1B: {device: 12AU7@1}
  V2A: {device: 12AU7@1}
  V5A: {device: 12AX7@1}
  V5B: {device: 12AX7@1}
  V3A: {device: 6386@1}
  V3B: {device: 6386@1}
  V6: {device: 12AU7@1}
  VDA: {device: envelope_diode}
  VDR: {device: envelope_diode}
  V4: {device: 6V6GT@1}
  VR: {device: rectifier_tube}
  DB: {device: bias_rectifier}
  OV1A: {device: 12AU7@1}
  OV1B: {device: 12AU7@1}
  OV2: {device: 12AX7@1}
  OV3: {device: 12AX7@1}
  OV4: {device: 6V6GT@1}
  VRO: {device: "5651@1", instance: false}

sections:
  - title: power supply
    parts:
      VHVA: {mains: [hv_a, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 90.0}
      VHVB: {mains: [hv_b, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 270.0}
      RPTA: {R: [hv_a, hv_ar], r: pt_r_half_ohm}
      LPTA: {L: [hv_ar, hva], l: pt_leakage_h}
      RPTB: {R: [hv_b, hv_br], r: pt_r_half_ohm}
      LPTB: {L: [hv_br, hvb], l: pt_leakage_h}
      CPTA: {C: [hva, "0"], c: pt_c_half_f}
      CPTB: {C: [hvb, "0"], c: pt_c_half_f}
      XVRA: {device: [hva, b1], model: VR}
      XVRB: {device: [hvb, b1], model: VR}
      CB1: {C: [b1, "0"], c: c_reservoir_f}
      RBLEED: {R: [b1, "0"], r: r_bleeder_ohm}
      RB12: {R: [b1, b2], r: r_b12_ohm}
      CB2: {C: [b2, "0"], c: c_decouple_f}
      RB23: {R: [b2, b3], r: r_b23_ohm}
      CB3: {C: [b3, "0"], c: c_decouple_f}
      RB24: {R: [b2, b4], r: r_b24_ohm}
      CB4: {C: [b4, "0"], c: c_decouple_f}
  - title: bias supply
    parts:
      # A floating bias winding (at its peak at the start) into a selenium bridge, its
      # positive side to ground: -100 V, then -45 V by RN / RNG, and an RC stage of its
      # own for the VCA's bias.
      VBW: {mains: [bwa, bwb], v_rms: bias_winding_rms_v, phase_deg: 90.0}
      RBW: {R: [bwa, bwar], r: bias_winding_r_ohm}
      CBW: {C: [bwb, "0"], c: c_bias_winding_f}
      RBWL: {R: [bwb, "0"], r: r_bias_winding_leak_ohm}
      GRB: {bridge: [bwar, bwb, "0", neg2], model: DB, arm_c_f_per_area: c_bias_arm_f, area: bias_arm_area}
      CN2: {C: [neg2, "0"], c: c_bias_f}
      RVF: {R: [neg2, nv], r: r_vca_bias_filter_ohm}
      CVF: {C: [nv, "0"], c: c_bias_f}
      RN: {R: [neg2, neg], r: r_bias_drop_ohm}
      CN: {C: [neg, "0"], c: c_bias_f}
      RNG: {R: [neg, "0"], r: r_bias_ground_ohm}
  - title: external input
    parts:
      RG1: {R: [in, "0"], r: r_grid_in_ohm}
      RMXE: {R: [in, mix], r: r_mix_ext_ohm}
  - title: input
    parts:
      CMXO: {C: [o_buf, o_bc], c: c_mix_osc_f}
      RMXO: {R: [o_bc, mix], r: r_mix_osc_ohm}
      CMIX: {C: [mix, "0"], c: c_mix_stray_f}
      RST1: {R: [mix, g1], r: r_stopper_ohm}
      XV1A: {device: [p1, g1, k1], model: V1A}
      RP1: {R: [b3, p1], r: r_plate1_ohm}
      RK1: {R: [k1, "0"], r: r_cathode1_ohm}
      XV1B: {device: [b3, p1, k1b], model: V1B}
      RK1B: {R: [k1b, "0"], r: r_follower1_ohm}
      CC1: {C: [k1b, s], c: c_couple1_f}
  - title: filter
    parts:
      TA:
        transformer:
          sig: {nodes: [s, m], r: r_signal_winding_ohm}
          ctl: {nodes: [b1, c2], ratio: 2.0, r: r_control_winding_ohm}
        core: {material: mumetall, area_m2: core_area_m2, path_m: core_path_m, gap_m: core_gap_m}
        turns: signal_turns
        leakage_h: leakage_h
      TB:
        transformer:
          sig: {nodes: [m, f], r: r_signal_winding_ohm}
          ctl: {nodes: [p4, c2], ratio: 2.0, r: r_control_winding_ohm}
        core: {material: mumetall, area_m2: core_area_m2, path_m: core_path_m, gap_m: core_gap_m}
        turns: signal_turns
        leakage_h: leakage_h
      CF: {C: [f, "0"], c: c_filter_f}
      RL: {R: [f, "0"], r: r_load_ohm}
      XV2A: {device: [b3, f, k2], model: V2A}
      RK2: {R: [k2, neg], r: r_follower2_ohm}
  - title: resonance
    parts:
      XV5A: {device: [b3, f, k5], model: V5A}
      XV5B: {device: [pb5, "0", k5], model: V5B}
      RT5: {R: [k5, neg], r: r_tail_ohm}
      RP5: {R: [b3, pb5], r: r_plate5_ohm}
      CR5: {C: [pb5, rt], c: c_res_f}
      RQ: {pot: ["0", rw, rt], r: r_res_pot_ohm, at: resonance}
      RFB: {R: [rw, f], r: r_feedback_ohm}
  - title: vca
    parts:
      CC2: {C: [k2, a6], c: c_couple2_f}
      RA6: {R: [a6, a6d], r: r_atten_series_ohm}
      RB6: {R: [a6d, "0"], r: r_atten_shunt_ohm}
      CC3: {C: [a6d, g6], c: c_couple3_f}
      RG6: {R: [g6, "0"], r: r_driver_grid_ohm}
      XV6: {device: [p6, g6, k6], model: V6}
      RK6: {R: [k6, "0"], r: r_driver_cathode_ohm}
      CK6: {C: [k6, "0"], c: c_driver_cathode_f}
      RB5: {R: [b3, b5], r: r_split_supply_ohm}
      CB5: {C: [b5, "0"], c: c_split_supply_f}
      RP6: {R: [b5, p6], r: r_driver_load_ohm}
      CP6: {C: [p6, tp], c: c_driver_feed_f}
      TIN:
        transformer:
          pri: {nodes: [tp, "0"], r: tin_r_pri_ohm}
          sa: {nodes: [g3a, env], ratio: tin_sec_ratio, r: tin_r_sec_ohm}
          sb: {nodes: [env, g3b], ratio: tin_sec_ratio, r: tin_r_sec_ohm}
        core: {material: mumetall, area_m2: tin_area_m2, path_m: tin_path_m, gap_m: tin_gap_m}
        turns: tin_turns
        leakage_h: tin_leakage_h
      XV3A: {device: [p3a, g3a, "0"], model: V3A}
      XV3B: {device: [p3b, g3b, "0"], model: V3B}
      TOUT:
        transformer:
          pa: {nodes: [p3a, b4], r: tout_r_half_ohm, c: tout_c_half_f}
          pb: {nodes: [b4, p3b], r: tout_r_half_ohm, c: tout_c_half_f}
          sec: {nodes: [out, "0"], ratio: tout_sec_ratio, r: tout_r_sec_ohm}
        core: {material: grain_oriented_si_steel, area_m2: tout_area_m2, path_m: tout_path_m, gap_m: tout_gap_m}
        turns: tout_turns_half
        leakage_h: tout_leakage_h
      RLO: {R: [out, "0"], r: r_out_load_ohm}
  - title: envelope
    parts:
      RBUS: {R: [bus, ba], r: r_bus_ohm}
      RATT: {rheostat: [ba, bd], r: r_attack_ohm, at: attack, taper_mid: env_taper_mid}
      XVDA: {device: [bd, env], model: VDA}
      CENV: {C: [env, "0"], c: c_env_f}
      RENVL: {R: [env, "0"], r: r_env_leak_ohm}
      XVDR: {device: [env, er], model: VDR}
      RRELMIN: {R: [er, er2], r: r_release_min_ohm}
      RREL: {rheostat: [er2, ba], r: r_release_ohm, at: release, taper_mid: env_taper_mid}
  - title: cutoff
    parts:
      RCUT: {pot: [neg, g4, "0"], r: r_cutoff_pot_ohm, at: cutoff}
      CCUT: {C: [g4, "0"], c: c_cutoff_f}
      XV4: {device: [p4, s4, g4, k4], model: V4}
      RS4: {R: [b1, s4], r: r_screen4_ohm}
      RK4: {R: [k4, "0"], r: r_cathode4_ohm}
  - title: oscillator
    parts:
      OTA:
        transformer:
          sig: {nodes: [o_t, o_m], r: osc_r_signal_winding_ohm}
          ctl: {nodes: [b1, o_c2], ratio: osc_control_ratio, r: osc_r_control_winding_ohm}
        core: {material: mumetall, area_m2: osc_core_area_m2, path_m: osc_core_path_m, gap_m: osc_core_gap_m}
        turns: osc_signal_turns
        leakage_h: osc_leakage_h
      OTB:
        transformer:
          sig: {nodes: [o_m, "0"], r: osc_r_signal_winding_ohm}
          ctl: {nodes: [o_p4, o_c2], ratio: osc_control_ratio, r: osc_r_control_winding_ohm}
        core: {material: mumetall, area_m2: osc_core_area_m2, path_m: osc_core_path_m, gap_m: osc_core_gap_m}
        turns: osc_signal_turns
        leakage_h: osc_leakage_h
      COT: {C: [o_t, "0"], c: osc_c_tank_f}
      ROGS: {R: [o_t, o_g2], r: osc_r_grid_stop_ohm}
      XOV2: {device: [o_p2, o_g2, o_k2], model: OV2}
      ROP2: {R: [b3, o_p2], r: osc_r_plate2_ohm}
      ROK2: {R: [o_k2, "0"], r: osc_r_cathode2_ohm}
      COC2: {C: [o_p2, o_g1b], c: osc_c_couple2_f}
      ROG1B: {R: [o_g1b, "0"], r: osc_r_grid1b_ohm}
      XOV1B: {device: [o_p1b, o_g1b, o_k1], model: OV1B}
      XOV1A: {device: [o_p1a, "0", o_k1], model: OV1A}
      ROT: {R: [o_k1, neg], r: osc_r_tail_ohm}
      ROPA: {R: [b3, o_p1a], r: osc_r_plate_a_ohm}
      ROPB: {R: [b3, o_p1b], r: osc_r_plate_b_ohm}
      COD: {C: [o_p1b, o_t], c: osc_c_drive_f}
      COOT: {C: [o_t, o_wt], c: osc_c_out_f}
      ROWT: {R: [o_wt, o_wa], r: osc_r_wave_tank_ohm}
      COOS: {C: [o_p1a, o_ws], c: osc_c_out_f}
      ROWS: {R: [o_ws, o_wb], r: osc_r_wave_square_ohm}
      ROWTG: {R: [o_wa, "0"], r: osc_r_wave_end_ohm}
      ROWSG: {R: [o_wb, "0"], r: osc_r_wave_end_ohm}
      ROWAVE: {pot: [o_wa, o_out, o_wb], r: osc_r_wave_pot_ohm, at: wave}
      XOV3: {device: [b3, o_out, o_buf], model: OV3}
      ROK3: {R: [o_buf, neg], r: osc_r_buffer_cathode_ohm}
  - title: keyboard
    parts:
      ROPS: {R: [pv, o_g4], r: osc_r_pitch_stop_ohm}
  - title: pitch
    parts:
      COG4: {C: [o_g4, "0"], c: osc_c_grid4_f}
      ROG4: {R: [o_g4, "0"], r: osc_r_grid4_leak_ohm}
      XOV4: {device: [o_p4, o_s4, o_g4, o_k4], model: OV4}
      ROVR: {R: [b1, o_vr], r: osc_r_vr_feed_ohm}
      VROA: {vr_tube: [o_vr, o_vra, o_vrm], model: VRO, operating_v: osc_v5651_operating_v, ref_current_a: osc_v5651_ref_current_a}
      VROB: {vr_tube: [o_vrm, o_vrb, "0"], model: VRO, operating_v: osc_v5651_operating_v, ref_current_a: osc_v5651_ref_current_a}
      ROVRL: {R: [o_vrm, "0"], r: osc_r_vr_leak_ohm}
      ROS4: {R: [o_vr, o_s4], r: osc_r_screen4_ohm}
      ROK4: {R: [o_k4, "0"], r: osc_r_cathode4_ohm}
