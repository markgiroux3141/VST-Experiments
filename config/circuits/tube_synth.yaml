      RAMT: {pot: ["0", s7w, b1], r: r_amount_pot_ohm, at: env_amount}
      CS7: {C: [s7w, "0"], c: c_screen7_f}
      RS7: {R: [s7w, s7], r: r_screen7_ohm}
      RCUTL: {R: [neg2, c_lo], r: r_cutoff_low_ohm}
      RWOB: {R: [lw_w, c_lo], r: r_wobble_ohm}
      SWWOBG:
        switch: lfo_on
