        core: {material: mumetall, area_m2: tin_area_m2, path_m: tin_path_m, gap_m: tin_gap_m}
        turns: tin_turns
        leakage_h: tin_leakage_h
      XV3A: {device: [p3a, g3a, "0"], model: V3A}
      XV3B: {device: [p3b, g3b, "0"], model: V3B}
      TOUT:
        transformer:
          pa: {nodes: [p3a, b4], r: tout_r_half_ohm, c: tout_c_half_f}
          pb: {nodes: [b4, p3b], r: tout_r_half_ohm, c: tout_c_half_f}
          sec: {nodes: [out, "0"], ratio: tout_sec_ratio, r: tout_r_sec_ohm}
        core: {material: grain_oriented_si_steel, area_m2: tout_area_m2, path_m: tout_path_m, gap_m: tout_gap_m}
        turns: tout_turns_half
        leakage_h: tout_leakage_h
      RLO: {R: [out, "0"], r: r_out_load_ohm}
  - title: envelope
    parts:
      CBA: {C: [ba, "0"], c: c_ba_f}
      RBAL: {R: [ba, "0"], r: r_ba_leak_ohm}
      # The ADSR (SYNTH_IDEAS.md #15): the attack follower ESA (its plate ~+43 V through
      # ATTACK, its grid clamped to the bus by EDA) charges the envelope toward the bus;
      # the comparator ECMP (grid the envelope, cathode the bus) fires near the top; the
      # inverters EINV / EINV2 latch it (the latch node back into its grid through EDD,
      # reset at the next key down) and turn the attack follower off and the decay switch
      # EDS on: the envelope through DECAY into the SUSTAIN wiper. RELEASE as before
      RSVT: {R: [b3, sv], r: env_r_sv_top_ohm}
      RSVB: {R: [sv, "0"], r: env_r_sv_bottom_ohm}
      CSV: {C: [sv, "0"], c: env_c_sv_f}
      RATT: {rheostat: [sv, sa_p], r: r_attack_ohm, at: attack, taper_mid: env_taper_mid}
      XESA: {device: [sa_p, sa_g, env], model: ESA}
      RESAG: {R: [ep, sa_g], r: env_r_sa_grid_ohm}
      XEDA: {device: [sa_g, ba], model: EDA}
      RECG: {R: [env, cmp_g], r: env_r_cmp_grid_ohm}
      XECMP: {device: [cmp_p, cmp_g, ba], model: ECMP}
      RECPL: {R: [b1, cmp_p], r: env_r_cmp_plate_ohm}
      RINVT: {R: [cmp_p, inv_g], r: env_r_inv_top_ohm}
      RINVB: {R: [inv_g, nn], r: env_r_inv_bottom_ohm}
      XEINV: {device: [inv_p, inv_g, "0"], model: EINV}
      RINVP: {R: [b1, inv_p], r: env_r_inv_plate_ohm}
      RINV2T: {R: [inv_p, inv2_g], r: env_r_inv2_top_ohm}
      RINV2B: {R: [inv2_g, nn], r: env_r_inv2_bottom_ohm}
      XEINV2: {device: [inv2_p, inv2_g, "0"], model: EINV2}
      RINV2P: {R: [b1, inv2_p], r: env_r_inv_plate_ohm}
      RECP: {R: [inv2_p, ep], r: env_r_sa_top_ohm}
      RECN: {R: [ep, nn], r: env_r_sa_bottom_ohm}
      RDST: {R: [inv_p, ds_d], r: env_r_latch_top_ohm}
      RDSB: {R: [ds_d, nn], r: env_r_latch_bottom_ohm}
      CDSD: {C: [ds_d, "0"], c: env_c_latch_f}
      XEDB: {device: [ds_d, ba], model: EDB}
      XEDD: {device: [ds_d, cmp_g], model: EDD}
      RDGT: {R: [inv_p, ds_e], r: env_r_latch_top_ohm}
      RDGB: {R: [ds_e, nn], r: env_r_ds_bottom_ohm}
      XEDE: {device: [ds_e, ba], model: EDE}
      RDSF: {R: [ds_e, ds_g], r: env_r_ds_delay_ohm}
      CDSF: {C: [ds_g, "0"], c: env_c_ds_delay_f}
      RDECMIN: {R: [env, ds_q], r: env_r_decay_min_ohm}
      RDEC: {rheostat: [ds_q, ds_p], r: env_r_decay_ohm, at: decay, taper_mid: env_taper_mid}
      XEDS: {device: [ds_p, ds_g, sw], model: EDS}
      RSUSL: {R: [neg2, s_lo], r: env_r_sustain_low_ohm}
      RSUS: {pot: [s_lo, sw, s_hi], r: env_r_sustain_pot_ohm, at: sustain}
      RSUSH: {R: [s_hi, "0"], r: env_r_sustain_high_ohm}
      CSW: {C: [sw, "0"], c: env_c_sustain_f}
      CENV: {C: [env, "0"], c: c_env_f}
      RENVL: {R: [env, "0"], r: r_env_leak_ohm}
      XVDR: {device: [env, er], model: VDR}
      RRELMIN: {R: [er, er2], r: r_release_min_ohm}
      RREL: {rheostat: [er2, ba], r: r_release_ohm, at: release, taper_mid: env_taper_mid}
  - title: keyboard bus
    parts:
      # The keyboard bus's source resistance (the control input stays on the draft
