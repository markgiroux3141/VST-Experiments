  osc_r_plate2_ohm: {value: 100.0e+3, source: "provisional: model knowledge (12AX7 plate load)"}
  osc_r_cathode2_ohm: {value: 1.5e+3, source: "provisional: model knowledge (12AX7 self bias, unbypassed: gain ~30)"}
  osc_c_couple2_f: {value: 0.1e-6, source: "provisional: model knowledge (V2's plate into V1B's grid: 1.6 Hz with its leak)"}
  osc_r_grid1b_ohm: {value: 1.0e+6, source: "provisional: model knowledge (V1B's grid leak)"}
  osc_c_out_f: {value: 0.1e-6, source: "provisional: model knowledge (output coupling, each side of the WAVE pot)"}
  osc_r_wave_tank_ohm: {value: 1.0e+6, source: "provisional: model knowledge (design: from the tank to the WAVE pot's end: ~1/11 of the tank, ~1 MOhm of load on it)"}
  osc_r_wave_square_ohm: {value: 470.0e+3, source: "provisional: model knowledge (design: from V1A's plate to the WAVE pot's other end: ~1/6 of the square)"}
  osc_r_wave_end_ohm: {value: 100.0e+3, source: "provisional: model knowledge (design: each end of the WAVE pot to ground, the dividers' feet)"}
  osc_r_wave_pot_ohm: {value: 1.0e+6, source: "provisional: model knowledge (the WAVE pot, ten times its ends' impedance)"}
  # --- pitch
  osc_r_pitch_stop_ohm: {value: 10.0e+3, source: "provisional: model knowledge (V4's grid stopper from the pitch input)"}
