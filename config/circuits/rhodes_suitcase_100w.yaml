  output_pascals_peak: {value: 25.0, source: "derived: the pressure 1 m on axis of a front speaker with its amp clipping a tone: 12.7 Pa at 100 Hz, 21.4 Pa at 1 kHz, 23.0 Pa at 3 kHz (a pre-clipping peak of 13 Pa at 3 kHz and 0.025 of the input scale); rounded up (scripts/rhodes_amp_study.py, docs/RHODES_PLAN.md The Suitcase)"}

controls:
