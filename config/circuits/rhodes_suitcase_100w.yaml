    cap: tol_cap_pct
    electrolytic: [tol_electrolytic_minus_pct, tol_electrolytic_plus_pct]
    pot: tol_pot_pct
  classes:
    r10: [R1, R2, R27, R9, R18, R14, R15, R24, R29, R30, R32, R33, R34, R35, R37, R38, R3, R5, R6, R8, R11, R12, R10, R17, R23, R25, R21, R19, RAPRE, RA22, RA1, RA2, RA3, RA5, RA7, RA4, RA6, RA9, RA10, RA11, RA13, RA14, RA15, RA16, RA17, RA18, RA21, RBPRE, RB22, RB1, RB2, RB3, RB5, RB7, RB4, RB6, RB9, RB10, RB11, RB13, RB14, RB15, RB16, RB17, RB18, RB21, RSA, RSB]
    cap: [C1, C2, C19, C9, C7, C10, C17, C18, C5, C11, CA7, CA3, CA4, CA5, CB7, CB3, CB4, CB5, CSA, CSB, CBP1, CBP2]
    electrolytic: [C4, C6, C16, C3, C8, C14, C12, CA1, CA2, CB1, CB2, CRES1, CRES2]
    pot: [R7, R13, R16, R4, R31, RA8, RA12, RB8, RB12]

devices:
  OPTO: {device: opto_model}
  DSI: {device: diode_model}
  D4148: {device: 1N4148@1, source: "fig11-3: CR1 1N4148 (064089 for CR2-CR8: 1 A 200 V, a generic silicon rectifier here)"}
  QN: {device: 2N5784@1, source: "fig11-3: Q1, Q2, Q3, Q5 2N5784 (RCA, fitted to its sheet: library.build_2n5784)"}
  QP: {device: 2N5781@1, tol_scale: 0.025, source: "fig11-3: Q4 2N5781 (library.build_2n5781). Its ports converge to 0.025 of the Newton tolerance (`tol_scale`, numerics only: at 40 mV, the live setting, Newton accepted a false state of the voltage amplifier on loud playing that latched the power amp output at +20 V, silent but for the rail ripple, until a restart; docs/RHODES_PLAN.md The Suitcase)"}
  QD: {device: RCA29B@1, tol_scale: 0.025, source: "fig11-3: Q6 RCA29B (provisional model: library.build_rca29b). Its ports converge to 0.025 of the Newton tolerance (`tol_scale`, numerics only: at 40 mV, the live setting, the output stage junctions accepted errors heard as crackle as the pan moved the level, docs/RHODES_PLAN.md The Suitcase)"}
  QPD: {device: RCA30B@1, tol_scale: 0.025, source: "fig11-3: Q7 RCA30B (provisional model: library.build_rca30b). Its ports converge to 0.025 of the Newton tolerance (`tol_scale`, numerics only: at 40 mV, the live setting, the output stage junctions accepted errors heard as crackle as the pan moved the level, docs/RHODES_PLAN.md The Suitcase)"}
  QO: {device: 2N6254@1, tol_scale: 0.025, source: "fig11-3: Q8, Q9 2N6254 (library.build_2n6254). Its ports converge to 0.025 of the Newton tolerance (`tol_scale`, numerics only: at 40 mV, the live setting, the output stage junctions accepted errors heard as crackle as the pan moved the level, docs/RHODES_PLAN.md The Suitcase)"}

sections:
  - title: supply
    parts:
      VPOS: {V: [p15, "0"], v: rail_v}
      VNEG: {V: ["0", n15], v: rail_v}
      R21: {R: [p15, vbp], r: r21_ohm}
      C14: {C: [vbp, "0"], c: c14_f}
      R19: {R: [n15, vbn], r: r19_ohm}
      C12: {C: [vbn, "0"], c: c12_f}

  - title: input
    parts:
      # The harp over its lead to P1; J1's normally closed contact to `inn` when ACCESSORY
      # IN is empty, its tip (the audio input) when a plug is in.
      HARP: {harp: [hl], component: harp_model, rate_hz: harp_rate_hz, contact_rate_hz: harp_contact_rate_hz}
      CCABLE: {C: [hl, "0"], c: harp_cable_c_f, tolerance: none}
      RIN_UNUSED: {R: [in, "0"], r: r_input_unused_ohm, tolerance: none}
      SJ1:
        switch: accessory_in
        parts:
          RJ1N: {R: [hl, inn], r: jack_contact_ohm, tolerance: none, in: [0]}
          RJ1T: {R: [in, inn], r: jack_contact_ohm, tolerance: none, in: [1]}
      C1: {C: [inn, n1], c: c1_f}
      R1: {R: [n1, a1m], r: r1_ohm}
      U1A: {opamp: ["0", a1m, a1o], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      R2: {R: [a1o, a1m], r: r2_ohm}
      C2: {C: [a1o, a1m], c: c2_f}
      C19: {C: [a1o, "0"], c: c19_f}
      R27: {R: [a1o, e8], r: r27_ohm}

  - title: volume and tone
    parts:
      C4: {C: [e8, e10], c: c4_f}
      R7: {pot: ["0", e2, e10], r: volume_pot_ohm, at: volume, taper_mid: audio_taper_mid}
      C6: {C: [e2, n5], c: c6_f}
      # The Baxandall in A1B's feedback: BASS between R9 and R18 (C9 across it), its wiper
      # through R14 to the inverting input; TREBLE between C7 and C10, its wiper through R15.
      R9: {R: [n5, n6], r: r9_ohm}
      R13: {pot: [n7, bw, n6], r: bass_pot_ohm, at: bass}
      C9: {C: [n6, n7], c: c9_f}
      R18: {R: [n7, n9], r: r18_ohm}
      R14: {R: [bw, n8], r: r14_ohm}
      C7: {C: [n5, t1], c: c7_f}
      R16: {pot: [t3, tw, t1], r: treble_pot_ohm, at: treble}
      C10: {C: [t3, n9], c: c10_f}
      R15: {R: [tw, n8], r: r15_ohm}
      U1B: {opamp: ["0", n8, n9], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      C16: {C: [n9, vs], c: c16_f}

  - title: vibrato
    parts:
      # The panning network: each LDR from `vs` to its channel's node, R29 / R30 from there
      # to `vm`, R24 from `vs` to `vm`, INTENSITY from `vm` to ground.
      XOPTO1: {device: [l1a, l1k, l1s, pa, vs], model: OPTO}
      CS1: {C: [l1s, vs], c: opto_state_c_f, tolerance: none}
      XOPTO2: {device: [l2a, l2k, l2s, pb, vs], model: OPTO}
      CS2: {C: [l2s, vs], c: opto_state_c_f, tolerance: none}
      R24: {R: [vs, vm], r: r24_ohm}
      R29: {R: [pa, vm], r: r29_ohm}
      R30: {R: [pb, vm], r: r30_ohm}
      R31: {rheostat: [vm, "0"], r: intensity_pot_ohm, at: intensity, reverse: 1, taper_mid: audio_taper_mid}
      R32: {R: [pa, a3am], r: r32_ohm}
      R33: {R: [pb, a3bm], r: r33_ohm}

  - title: oscillator
    parts:
      # A2A: SPEED + R3 charge C3 (to VB-) from the output; R5 to the inverting input (C5
      # to the output); R6 / R8 the hysteresis.
      R4: {rheostat: [a2ao, r4b], r: speed_pot_ohm, at: speed, reverse: 1, taper_mid: audio_taper_mid}
      R3: {R: [r4b, x], r: r3_ohm}
      C3: {C: [x, vbn], c: c3_f, v0: c3_start_v}
      R5: {R: [x, a2am], r: r5_ohm}
      C5: {C: [a2am, a2ao], c: c5_f}
      R6: {R: [a2ap, "0"], r: r6_ohm}
      R8: {R: [a2ap, a2ao], r: r8_ohm}
      U2A: {opamp: [a2ap, a2am, a2ao], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      # A2B: the timing node's triangle halved (C8, R11, R12), amplified 11x into the rails.
      C8: {C: [x, x8], c: c8_f}
      R11: {R: [x8, a2bp], r: r11_ohm}
      R12: {R: [a2bp, "0"], r: r12_ohm}
      R10: {R: [a2bm, "0"], r: r10_ohm}
      R17: {R: [a2bo, a2bm], r: r17_ohm}
      C11: {C: [a2bo, a2bm], c: c11_f}
      U2B: {opamp: [a2bp, a2bm, a2bo], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      SVIB:
        switch: vibrato
        parts:
          RS1: {R: [a2bo, v], r: switch_contact_ohm, tolerance: none, in: [1]}
      # The LED strings between VB+ and VB-, `v` between them.

  - title: "output amp A"
    parts:
      # A3A's feedback and output (fig11-1), apart from the pan network so a partitioned draft can cut at its input.
      U3A: {opamp: ["0", a3am, a3ao], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      R34: {R: [a3ao, a3am], r: r34_ohm}
      C17: {C: [a3ao, "0"], c: c17_f}
      R37: {R: [a3ao, pre_a], r: r37_ohm}

  - title: "output amp B"
    parts:
      # A3B's feedback and output (fig11-1), apart from the pan network so a partitioned draft can cut at its input.
      U3B: {opamp: ["0", a3bm, a3bo], a0: u_a0, gbw_hz: u_gbw_hz, r_out_ohm: u_r_out_ohm, r_in_ohm: u_r_in_ohm, clamp: DSI, swing_v: u_swing_v}
      R35: {R: [a3bo, a3bm], r: r35_ohm}
      C18: {C: [a3bo, "0"], c: c18_f}
      R38: {R: [a3bo, pre_b], r: r38_ohm}

  - title: "LED drive"
    parts:
      # The LED strings between VB+ and VB- with `v` between them (fig11-1), apart from
      # the oscillator so a partitioned draft can cut at `v`.
      DCR1: {device: [vbp, l1a], model: DSI}
      R23: {R: [l1k, v], r: r23_ohm}
      R25: {R: [v, l2a], r: r25_ohm}
      DCR2: {device: [l2k, cr23], model: DSI}
      DCR3: {device: [cr23, vbn], model: DSI}
      RNL1: {R: [l1a, "0"], r: numerical_leak_ohm, tolerance: none}
      RNL2: {R: [v, "0"], r: numerical_leak_ohm, tolerance: none}
      RNL3: {R: [l2k, "0"], r: numerical_leak_ohm, tolerance: none}
      RNL4: {R: [cr23, "0"], r: numerical_leak_ohm, tolerance: none}

  - title: mains supply
    parts:
      # T1's two halves from the mains at phase 90 / 270 (a run starts at the peak), each behind
      # its winding resistance and leakage; the bridge across the ends with the centre tap as
      # ground, the 11,000 uF reservoirs, the boards' HF bypasses (fig11-3).
      VMA: {mains: [sa, "0"], v_rms: pt_half_rms_v, phase_deg: 90.0}
      RSA: {R: [sa, sa2], r: pt_r_half_ohm}
      LSA: {L: [sa2, aca], l: pt_leakage_h}
      CSA: {C: [aca, "0"], c: pt_c_half_f}
      VMB: {mains: [sb, "0"], v_rms: pt_half_rms_v, phase_deg: 270.0}
      RSB: {R: [sb, sb2], r: pt_r_half_ohm}
      LSB: {L: [sb2, acb], l: pt_leakage_h}
      CSB: {C: [acb, "0"], c: pt_c_half_f}
      BRG1: {bridge: [aca, acb, vp, vn], model: DSI}
      CRES1: {C: [vp, "0"], c: reservoir_f}
      CRES2: {C: ["0", vn], c: reservoir_f}
      CBP1: {C: [vp, "0"], c: bp_c_f}
      CBP2: {C: [vn, "0"], c: bp_c_f}
      RNLP: {R: [vp, "0"], r: numerical_leak_ohm, tolerance: none}
      RNLN: {R: [vn, "0"], r: numerical_leak_ohm, tolerance: none}
  - title: "power amp A"
    parts:
      # Input: the preamp's output through fig11-3's 680 (R1 / R2 beside the jacks), then the
      # board's R22 and C1 into Q1's base; R1 100K and C7 feedback from the output (gain
      # about -21), R2 100K to ground, CR1 across Q1's base-emitter junction.
      RAPRE: {R: [pre_a, a_in], r: r_pre_ohm}
      RA22: {R: [a_in, a_c], r: r22_ohm}
      CA1: {C: [a_c, a_q1b], c: c1a_f}
      RA1: {R: [a_amp, a_q1b], r: r1a_ohm}
      CA7: {C: [a_amp, a_q1b], c: c7a_f}
      RA2: {R: [a_q1b, "0"], r: r2a_ohm}
      DACR1: {device: [a_e, a_q1b], model: D4148}
      # The long-tailed pair Q1 / Q3 (collector loads R3 / R5), the tail Q2 on R4 biased by
      # CR2 / CR3 from R6; Q3's base through R7 and OFFSET ADJUST R8 to ground, C2 across.
      QA1: {bjt: [a_c1, a_q1b, a_e], model: QN}
      QA3: {bjt: [a_c3, a_q3b, a_e], model: QN}
      RA3: {R: [vp, a_c1], r: r3a_ohm}
      RA5: {R: [vp, a_c3], r: r5a_ohm}
      RA7: {R: [a_q3b, a_q3m], r: r7a_ohm}
      RA8: {rheostat: [a_q3m, "0"], r: r8a_ohm, at: offset_a}
      CA2: {C: [a_q3b, "0"], c: c2a_f}
      QA2: {bjt: [a_e, a_n1, a_q2e], model: QN}
      RA4: {R: [a_q2e, vn], r: r4a_ohm}
      RA6: {R: [a_n1, "0"], r: r6a_ohm}
      DACR2: {device: [a_n1, a_d23], model: DSI}
      DACR3: {device: [a_d23, vn], model: DSI}
      # The voltage amplifier Q4 (PNP, R9 in its emitter) and its current-source load Q5
      # (R10), the bias string CR4-CR7 in parallel with R11 + BIAS ADJ R12 between them.
      QA4: {bjt: [a_t, a_c3, a_q4e], model: QP}
      RA9: {R: [vp, a_q4e], r: r9a_ohm}
      QA5: {bjt: [a_b, a_n1, a_q5e], model: QN}
      RA10: {R: [a_q5e, vn], r: r10a_ohm}
      DACR4: {device: [a_t, a_s1], model: DSI}
      DACR5: {device: [a_s1, a_s2], model: DSI}
      DACR6: {device: [a_s2, a_s3], model: DSI}
      DACR7: {device: [a_s3, a_b], model: DSI}
      RA11: {R: [a_t, a_r11b], r: r11a_ohm}
      RA12: {rheostat: [a_r11b, a_b], r: r12a_ohm, at: bias_a}
      CA3: {C: [vp, a_t], c: c3a_f}
      RANL1: {R: [a_s1, "0"], r: numerical_leak_ohm, tolerance: none}
      RANL2: {R: [a_s2, "0"], r: numerical_leak_ohm, tolerance: none}
      RANL3: {R: [a_s3, "0"], r: numerical_leak_ohm, tolerance: none}
      RANL4: {R: [a_e, "0"], r: numerical_leak_ohm, tolerance: none}
      RANL5: {R: [a_d23, "0"], r: numerical_leak_ohm, tolerance: none}
      RANL6: {R: [a_t, "0"], r: numerical_leak_ohm, tolerance: none}
      # The output stage: drivers Q6 (RCA29B) / Q7 (RCA30B), outputs Q8 / Q9 (2N6254, both
      # NPN). Q6 / Q8 follow; Q7 / Q9 are a complementary-feedback pair (Q7's emitter on the
      # output through R14 and CR8, its collector the base of Q9, whose collector is the output).
      QA6: {bjt: [vp, a_t, a_e6], model: QD}
      RA16: {R: [a_e6, a_b8], r: r16a_ohm}
      QA8: {bjt: [vp, a_b8, a_e8], model: QO}
      CA4: {C: [vp, a_b8], c: c4a_f}
      RA18: {R: [a_e8, a_amp], r: r_emitter_ohm}
      RA13: {R: [a_e6, a_amp], r: r13a_ohm}
      RA14: {R: [a_amp, a_x], r: r14a_ohm}
      DACR8: {device: [a_x, a_amp], model: DSI}
      QA7: {bjt: [a_y, a_b, a_x], model: QPD}
      RA15: {R: [a_y, vn], r: r15a_ohm}
      RA17: {R: [a_y, a_b9], r: r17a_ohm}
      QA9: {bjt: [a_amp, a_b9, a_e9], model: QO}
      CA5: {C: [a_amp, a_b9], c: c5a_f}
      RA21: {R: [a_e9, vn], r: r_emitter_ohm}
  - title: "speakers A"
    parts:
      # F1 / F2 (4 A) to the CH A SPEAKER jack, then the front and rear speakers in series,
      # as one part with `series: 2`: two identical drivers carry one current, so one force
      # and one velocity, and the pair is exactly one driver with every impedance doubled (the
      # speaker macro scales the elements; its readout and terminal voltage are one driver's).
      # Half the states of two parts. `out` is the front driver's pressure 1 m in front of it
      # (the rear one, behind it, isn't read out).
      RAF1: {R: [a_amp, a_spk], r: fuse_ohm, tolerance: none}
      ASPK:
        speaker: [a_spk, "0", out]
        component: speaker_model
        series: 2
        distance_m: listen_distance_m
        width_m: cab_width_m
        height_m: cab_height_m
        depth_m: cab_depth_m
        offset_x_m: spk_left_m
        offset_y_m: cab_offset_y_m
  - title: "power amp B"
    parts:
      # Input: the preamp's output through fig11-3's 680 (R1 / R2 beside the jacks), then the
      # board's R22 and C1 into Q1's base; R1 100K and C7 feedback from the output (gain
      # about -21), R2 100K to ground, CR1 across Q1's base-emitter junction.
      RBPRE: {R: [pre_b, b_in], r: r_pre_ohm}
      RB22: {R: [b_in, b_c], r: r22_ohm}
      CB1: {C: [b_c, b_q1b], c: c1a_f}
      RB1: {R: [b_amp, b_q1b], r: r1a_ohm}
      CB7: {C: [b_amp, b_q1b], c: c7a_f}
      RB2: {R: [b_q1b, "0"], r: r2a_ohm}
      DBCR1: {device: [b_e, b_q1b], model: D4148}
      # The long-tailed pair Q1 / Q3 (collector loads R3 / R5), the tail Q2 on R4 biased by
      # CR2 / CR3 from R6; Q3's base through R7 and OFFSET ADJUST R8 to ground, C2 across.
      QB1: {bjt: [b_c1, b_q1b, b_e], model: QN}
      QB3: {bjt: [b_c3, b_q3b, b_e], model: QN}
      RB3: {R: [vp, b_c1], r: r3a_ohm}
      RB5: {R: [vp, b_c3], r: r5a_ohm}
      RB7: {R: [b_q3b, b_q3m], r: r7a_ohm}
      RB8: {rheostat: [b_q3m, "0"], r: r8a_ohm, at: offset_b}
      CB2: {C: [b_q3b, "0"], c: c2a_f}
      QB2: {bjt: [b_e, b_n1, b_q2e], model: QN}
      RB4: {R: [b_q2e, vn], r: r4a_ohm}
      RB6: {R: [b_n1, "0"], r: r6a_ohm}
      DBCR2: {device: [b_n1, b_d23], model: DSI}
      DBCR3: {device: [b_d23, vn], model: DSI}
      # The voltage amplifier Q4 (PNP, R9 in its emitter) and its current-source load Q5
      # (R10), the bias string CR4-CR7 in parallel with R11 + BIAS ADJ R12 between them.
      QB4: {bjt: [b_t, b_c3, b_q4e], model: QP}
      RB9: {R: [vp, b_q4e], r: r9a_ohm}
      QB5: {bjt: [b_b, b_n1, b_q5e], model: QN}
      RB10: {R: [b_q5e, vn], r: r10a_ohm}
      DBCR4: {device: [b_t, b_s1], model: DSI}
      DBCR5: {device: [b_s1, b_s2], model: DSI}
      DBCR6: {device: [b_s2, b_s3], model: DSI}
      DBCR7: {device: [b_s3, b_b], model: DSI}
      RB11: {R: [b_t, b_r11b], r: r11a_ohm}
      RB12: {rheostat: [b_r11b, b_b], r: r12a_ohm, at: bias_b}
      CB3: {C: [vp, b_t], c: c3a_f}
      RBNL1: {R: [b_s1, "0"], r: numerical_leak_ohm, tolerance: none}
      RBNL2: {R: [b_s2, "0"], r: numerical_leak_ohm, tolerance: none}
      RBNL3: {R: [b_s3, "0"], r: numerical_leak_ohm, tolerance: none}
      RBNL4: {R: [b_e, "0"], r: numerical_leak_ohm, tolerance: none}
      RBNL5: {R: [b_d23, "0"], r: numerical_leak_ohm, tolerance: none}
      RBNL6: {R: [b_t, "0"], r: numerical_leak_ohm, tolerance: none}
      # The output stage: drivers Q6 (RCA29B) / Q7 (RCA30B), outputs Q8 / Q9 (2N6254, both
      # NPN). Q6 / Q8 follow; Q7 / Q9 are a complementary-feedback pair (Q7's emitter on the
      # output through R14 and CR8, its collector the base of Q9, whose collector is the output).
      QB6: {bjt: [vp, b_t, b_e6], model: QD}
      RB16: {R: [b_e6, b_b8], r: r16a_ohm}
      QB8: {bjt: [vp, b_b8, b_e8], model: QO}
      CB4: {C: [vp, b_b8], c: c4a_f}
      RB18: {R: [b_e8, b_amp], r: r_emitter_ohm}
      RB13: {R: [b_e6, b_amp], r: r13a_ohm}
      RB14: {R: [b_amp, b_x], r: r14a_ohm}
      DBCR8: {device: [b_x, b_amp], model: DSI}
      QB7: {bjt: [b_y, b_b, b_x], model: QPD}
      RB15: {R: [b_y, vn], r: r15a_ohm}
      RB17: {R: [b_y, b_b9], r: r17a_ohm}
      QB9: {bjt: [b_amp, b_b9, b_e9], model: QO}
      CB5: {C: [b_amp, b_b9], c: c5a_f}
      RB21: {R: [b_e9, vn], r: r_emitter_ohm}
  - title: "speakers B"
    parts:
      # F1 / F2 (4 A) to the CH B SPEAKER jack, then the front and rear speakers in series,
      # as one part with `series: 2`: two identical drivers carry one current, so one force
      # and one velocity, and the pair is exactly one driver with every impedance doubled (the
      # speaker macro scales the elements; its readout and terminal voltage are one driver's).
      # Half the states of two parts. `out_r` is the front driver's pressure 1 m in front of it
      # (the rear one, behind it, isn't read out).
      RBF1: {R: [b_amp, b_spk], r: fuse_ohm, tolerance: none}
      BSPK:
        speaker: [b_spk, "0", out_r]
        component: speaker_model
        series: 2
        distance_m: listen_distance_m
        width_m: cab_width_m
        height_m: cab_height_m
        depth_m: cab_depth_m
        offset_x_m: spk_right_m
        offset_y_m: cab_offset_y_m
