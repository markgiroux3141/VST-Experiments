# GENERATED by scripts/make_rhodes_suitcase_100w.py from config/circuits/rhodes_suitcase.yaml:
# don't edit; edit the script (or the preamp file) and rerun. A Rhodes Mark I Suitcase 73
# (1978) as one netlist: the harp, the 100 W preamp (fig11-1), the dual 50 W power amplifier
# (fig11-3) on its mains supply, and the four 12" speakers (docs/RHODES_PLAN.md "The Suitcase").
# `out` / `out_r` are the sound pressures (pascals as volts) 1 m on axis of each channel's
# front speaker; `pre_a` / `pre_b` the preamp's outputs; the amp's sources are cited "fig11-3:"
# (the schematic), "fig11-6: ..." (its parts list and board), "web:", "provisional:".
#
# A Rhodes Mark I Suitcase 73 (1978): the harp into the 100 W Suitcase's preamp (Haigler /
# "Janus" electronics), docs/RHODES_PLAN.md "The Suitcase". Hand-written.
#
# Sources (data/schematics/rhodes_suitcase/README.md has their provenance):
#   "fig11-1: ..."     printed on the service manual's Fig. 11-1 (the preamp's schematic,
#                      transcribed node by node in the README)
#   "fig11-2: ..."     its PCB / parts list (a later revision in places: the README's
#                      "Discrepancies"; the schematic's values are used)
#   "fig11-3: ..."     the dual 50 W power amp's schematic (here only the preamp's load)
#   "web: <url> ..."   a published figure (the MC1458's sheet: data/datasheets/opamps/README.md)
#   "derived: ..."     arithmetic on sourced figures
#   "provisional: ..." model knowledge; replaced later
#
# The signal: the harp (MK1_HARP, played by note events, behind its coils) over a short
# cable to the preamp's P1 KEYBOARD INPUT and J1's normally closed contact (ACCESSORY IN
# empty) to node `inn`; C1 / R1 into A1A (inverting, -22, C2 120 pF: -3 dB at ~6 kHz); R27
# and C4 into the 5K audio VOLUME; C6 into A1B's Baxandall (BASS, TREBLE 50K lin); C16 into
# the vibrato: from `vs` through each LDR to its channel's node (`pa`, `pb`), the two shunted
# to `vm` through 10K each, `vm` fed from `vs` by R24 3.3K and taken to ground by the 25K
# reverse-audio INTENSITY rheostat; A3A / A3B (inverting, -220K / 100K) onto the two outputs.
# `out` is A3A's (P2-4, CH 2), `out_r` A3B's (P2-3, CH 1), each into the power amp's input
# (fig11-3: 680 ohm, then the board's 4.7K and 5 uF to its inverting input).
#
# The vibrato's oscillator: A2A a relaxation oscillator (the 100K reverse-audio SPEED
# rheostat + R3 1K charging C3 10 uF, thresholds at R6 / (R6 + R8) = 0.68 of its swing),
# A2B (C8 / R11 / R12 halve the timing capacitor's triangle, gain 11 with R17 || C11) driven
# into its rails: a clipped triangle on node `v` through the VIBRATO switch S1. The LEDs sit
# between the decoupled rails VB+ / VB- with `v` between them (CR1, LED1, R23 above; R25,
# LED2, CR2, CR3 below), so as `v` rises LED2 brightens and LED1 dims: antiphase. With S1
# off, `v` rests where the two strings balance (both LEDs steady).
#
# The LED / LDR pairs (Rhodes P/N 013556, maker and type unknown) are the optocoupler device
# (varimu/devices/opto.py) as the VTL5C2 Vactrol (VTL5C2@1, provisional stand-in, chosen by
# the reference recording's pan: `opto_model`), each with its state node on a 1 F capacitor
# (the device's own convention).
#
# The op-amps are MC1458s (fig11-1: MC1458P1; fenderrhodes.com calls the part a 4558) as the
# `opamp` macro: TI's typical figures, the swing by clamp diodes; no slew limit (0.5 V/us:
# a 4 V peak at 20 kHz needs 0.5, so only the hottest top end would slew), no crossover
# distortion, no noise. The op-amps draw no supply current in the macro, so VA+ / VA- (A1's
# R22 / R20 and C15 / C13; A3's rails aren't drawn) aren't modelled; VB+ / VB- are (R21 /
# R19, C14 / C12), since the LEDs draw on them. Left out: Q1 / LED3 (the vibrato indicator:
# ~1 mA off A2B's stiff output through R26 10K), LED4 and R36 (the pilot), J2 ACCESSORY OUT
# (an open jack). The board revision's differences (R23 / R25 1K, R39, no CR3, C8 25 uF and
# a C20) stay open: the schematic's values are used.
#
# The audio input `in` is J1 ACCESSORY IN: with `accessory_in` 1 a plug's signal reaches
# `inn` and the harp is cut off (J1's switching contact; the README notes the jack's drawing
# is ambiguous beyond "nothing plugged in: the harp reaches IN"). It is how test signals reach
# the preamp (scripts/suitcase_study.py).

title: "Rhodes Mark I Suitcase 73 (100 W preamp, power amp and speakers)"
input: in
probes: [out, out_r, pre_a, pre_b, a_amp, b_amp, vp, vn, a_e, a_t, a_b, a_e8, a_e9, a_c1, a_c3, a_q1b, a_spk, b_spk, b_e, b_t, b_b, b_e8, b_e9, inn, a1o, e2, n9, vs, vm, pa, pb, v, x, a2ao, vbp, vbn, l1s, l2s]
full_scale:
