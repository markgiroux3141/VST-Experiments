# AKG D112 dynamic microphone (docs/CHAINS_PLAN.md WP9). Built by varimu/circuit/builder.py
# (the format: varimu/circuit/spec.py, builder.py).
#
# Sources (data/schematics/akg_d112/README.md has their provenance):
#   "akg: ..."   AKG's D112 data sheet (1.8 mV/Pa, 210 ohm, cardioid, 40 Hz-17 kHz +-3 dB)
#   "akg2: ..."  the D112 MKII's sheet (response and polars, digitized from its vector paths)
#   "provisional: ..." model knowledge
#
# The cartridge R_D112 (config/components/r_d112/): the pressure at its front entry on `in`,
# at its rear entries on the control input `p_rear` (pascals as volts; varimu/mics/). The
# D112 is transformerless: the coil's two ends are the XLR's pins 2 and 3 (`out`, and the
# measuring ground); the output is open circuit, as the sheet's 1.8 mV/Pa, and a chain
# replaces RLOAD with the preamp's input. The hum-compensation coil (a second winding in
# series opposition, picking up stray fields only) has no acoustic input and isn't modelled.

title: "AKG D112"
input: in
cv_inputs:
  p_rear: p_rear
probes: [out]
# 0 dBFS in = 20 Pa peak at the capsule (117 dB SPL for a sine, as the U47's); out = volts
# across the load.
full_scale:
  input_volts_peak: {value: 20.0, source: "provisional: MIC_ROOM_PLAN.md's proposed source convention (0 dBFS = 20 Pa peak; as neumann_u47.yaml)"}
  output_volts_peak: {value: 0.1, source: "provisional: model knowledge (akg: 1.8 mV/Pa x 20 Pa = 36 mV peak, with headroom for the presence peak and proximity)"}

values:
  cartridge_model: {value: R_D112@1, source: "config/components/r_d112/1.yaml (the D112's cartridge: no construction is published, the geometry bounded and fitted by scripts/fit_d112.py to akg and akg2's figures: data/schematics/akg_d112/README.md)"}
  load_ohm: {value: 1.0e+6, source: "akg: the sensitivity is open-circuit voltage (a chain replaces the load with its preamp)"}

# No tolerance block: the nominal mic only (docs/SM57_PLAN.md Decisions 5).

sections:
  - title: cartridge
    parts:
      MC:
        moving_coil: [in, p_rear, out, "0"]
        component: cartridge_model
      RLOAD: {R: [out, "0"], r: load_ohm, tolerance: none}
