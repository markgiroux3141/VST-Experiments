          - lb4_md421
          l: lb4_h_md421
          in:
          - 4
        RB4_md421:
          R:
          - lb4_md421
          - '0'
          r: rb4_ohm_md421
          tolerance: none
          in:
          - 4
- title: cable
  parts:
