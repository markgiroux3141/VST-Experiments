      - vn_api312
      - '0'
      v: supply_neg_v_api312
- title: 'API 312 mic preamp: input'
  parts:
    RPA_api312:
      R:
      - ia_api312
      - tp_api312
      r: r_pad_series_ohm_api312
    RPB_api312:
      R:
      - tb_api312
      - '0'
      r: r_pad_series_ohm_api312
    SPAD_api312:
      switch: pad_api312
      parts:
