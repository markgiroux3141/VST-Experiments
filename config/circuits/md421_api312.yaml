          R:
          - ia_api312
          - tp_api312
          r: contact_ohm_api312
          tolerance: none
          in:
          - 0
        RPAD0B_api312:
          R:
          - tb_api312
          - '0'
          r: contact_ohm_api312
          tolerance: none
          in:
          - 0
        RPSH_api312:
          R:
          - tp_api312
          - tb_api312
          r: r_pad_shunt_ohm_api312
          in:
          - 1
    T1_api312:
      transformer:
        p:
          nodes:
          - tp_api312
          - tb_api312
          r: t1_r_pri_ohm_api312
        s:
          nodes:
          - inp_api312
          - '0'
          ratio: t1_ratio_api312
          r: t1_r_sec_ohm_api312
          c: t1_c_sec_f_api312
      core:
        material: t1_core_material_api312
        area_m2: t1_core_area_m2_api312
        path_m: t1_core_path_m_api312
        gap_m: t1_gap_m_api312
      turns: t1_turns_api312
      leakage_h: t1_leakage_h_api312
    CZ_api312:
