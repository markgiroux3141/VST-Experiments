      - g1_api312
      - g2_api312
      r: gain_pot_ohm_api312
      at: gain_api312
      taper_mid: gain_taper_mid_api312
      reverse: 1
    CG_api312:
      C:
      - g2_api312
      - '0'
      c: c_gain_f_api312
