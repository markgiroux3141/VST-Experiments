      C:
      - ia_api312
      - '0'
      c: cable_c_f
      tolerance: none
- title: 'API 312 mic preamp: rails'
  parts:
    VP_api312:
      V:
      - vp_api312
      - '0'
      v: supply_v_api312
    VN_api312:
