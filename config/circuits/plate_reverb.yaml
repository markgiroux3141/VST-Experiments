# A plate reverb (docs/REVERB_PLAN.md, E7): an EMT 140's plate (the component EMT140@1:
# the literature's plate, the brochure's measured decay) between tube electronics of our
# own. EMT's own tube amplifier (the V54) has no public schematic, so the drive and pickup
# amplifiers are designed here from parts the project has, as a studio would build them:
#
#   in -> DRIVE -> 12AX7 gain stage -> 12AX7 cathodyne -> 6V6GT push-pull -> output
#   transformer -> the plate's exciter coil ... the plate ... its pickup (an accelerometer
#   behind its capacitance) -> 10 MOhm -> 12AU7 gain stage -> RETURN -> 12AU7 cathode
#   follower -> out
#
# Used as a send in the Session view (docs/SESSION_FX_PLAN.md): the output is the plate
# only (wet). DECAY is the damper, read as the decay at 500 Hz as on the EMT's remote.
#
# Sources:
#   "5e3: ..."         the same part as the Fender 5E3's (config/circuits/fender_5e3.yaml):
#                      the push-pull 6V6GT stage, its output transformer and its supply
#   "provisional: ..." design choices and model knowledge; genome parameters or
#                      replaced later

title: "Plate reverb (EMT 140 plate)"
input: in
probes: [out, ex, pu, g1, p1, g3, oa, ob, p6a, p6b, k6, p2, g2b, b1, b2, b3, b4]

controls:
  drive: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "provisional: the send's level into the drive amplifier (a 1 MEG audio-taper pot), as a plate's input level control"}
  decay_500hz_s: {value: 2.5, min: 1.0, max: 4.8, unit: s, source: "web: https://www.barryrudolph.com/recall/manuals/emt140ts.pdf (the damper: 1 to 4 s at 500 Hz in the technical data, p.8; the measured curves reach 4.8 s, data/datasheets/emt_140ts.provenance.yaml)", notes: "the damper's distance, set by the decay at 500 Hz it gives"}
  return_level: {value: 0.7, min: 0.0, max: 1.0, unit: rotation, source: "provisional: the pickup amplifier's output level (a 1 MEG audio-taper pot)"}
  mains_v_rms: {value: 120.0, min: 105.0, max: 127.0, unit: V, source: "5e3: the replacement power transformer's rated primary"}
  mains_hz: {value: 60.0, min: 50.0, max: 60.0, unit: Hz, source: "provisional: model knowledge (US mains)"}

values:
  # --- The plate ---------------------------------------------------------------------
  plate_model: {value: EMT140@1, source: "config/components/emt140/1.yaml (the plate, its decay curves, its provisional transducers)"}

  # --- Drive amplifier: input and 12AX7 gain stage ---------------------------------------
  r_input_ohm: {value: 1.0e+6, source: "provisional: model knowledge (a tube line input's 1 MEG, here the DRIVE pot itself)"}
  audio_taper_mid: {value: 0.1, source: "5e3: audio-taper pots, ~10% of the track at half rotation"}
  r_grid_stop1_ohm: {value: 10.0e+3, source: "provisional: model knowledge (a grid stopper)"}
  r_plate1_ohm: {value: 100.0e+3, source: "5e3: the 12AX7 stage's 100K plate load"}
  r_cathode1_ohm: {value: 1500, source: "5e3: the 12AX7 stage's 1500 cathode resistor"}
  c_cathode1_f: {value: 25.0e-6, source: "5e3: 25 uF across it"}
  c_couple1_f: {value: 0.02e-6, source: "5e3: .02 from the gain stage to the inverter"}

  # --- Cathodyne inverter and the 6V6GT pair (the 5E3's) ---------------------------------
  r_plate3_ohm: {value: 56.0e+3, source: "5e3: 56K plate load"}
  r_cathode3_ohm: {value: 1500, source: "5e3: 1500 from the cathode to the tail"}
  r_tail_ohm: {value: 56.0e+3, source: "5e3: 56K tail"}
  r_grid3_ohm: {value: 1.0e+6, source: "5e3: 1 MEG grid leak to the tail junction"}
  c_couple3_f: {value: 0.1e-6, source: "5e3: .1 from the plate and from the cathode"}
  r_grid6_ohm: {value: 220.0e+3, source: "5e3: 220K grid leaks"}
  r_grid6_stop_ohm: {value: 1500, source: "5e3: 1500 grid stoppers"}
  r_cathode6_ohm: {value: 250, source: "5e3: 250 ohm shared cathode resistor"}
  c_cathode6_f: {value: 25.0e-6, source: "5e3: 25 uF across it"}

  # --- Output transformer (the 5E3's, version 1) into the exciter --------------------------
  ot_r_half_a_ohm: {value: 147.2, source: "5e3: the reproduction's primary DCR, one half"}
  ot_r_half_b_ohm: {value: 195.3, source: "5e3: the other half"}
  ot_r_sec_ohm: {value: 0.493, source: "5e3: secondary DCR"}
  ot_sec_per_half: {value: 0.06325, source: "5e3: 8 k CT : 8 ohm, secondary turns per primary half; the plate's exciter is ~6 ohm (EMT140@1)"}
  ot_core_material: {value: grain_oriented_si_steel, source: "5e3: silicon-steel EI laminations"}
  ot_core_area_m2: {value: 5.0e-4, source: "5e3: provisional core area"}
  ot_core_path_m: {value: 0.12, source: "5e3: provisional magnetic path"}
  ot_turns_half: {value: 929, source: "5e3: provisional turns per primary half"}
  ot_gap_m: {value: 145.0e-6, source: "5e3: the joint gap giving 3.67 H per half"}
  ot_leakage_h: {value: 29.9e-3, source: "5e3: the reproduction's leakage per half"}
  ot_c_half_f: {value: 300.0e-12, source: "5e3: provisional winding capacitance per half"}

  # --- Pickup amplifier: 12AU7 gain stage and cathode follower -----------------------------
  r_pickup_grid_ohm: {value: 10.0e+6, source: "provisional: model knowledge (a piezo pickup wants a high input impedance: with the pickup's 1 nF, a 16 Hz corner)"}
  r_plate2_ohm: {value: 47.0e+3, source: "provisional: model knowledge (a 12AU7 voltage amplifier's plate load)"}
  r_cathode2_ohm: {value: 1200, source: "provisional: model knowledge (12AU7 self-bias at ~2 mA)"}
  c_cathode2_f: {value: 25.0e-6, source: "provisional: model knowledge (cathode bypass)"}
  c_couple2_f: {value: 0.1e-6, source: "provisional: model knowledge (coupling to the RETURN pot)"}
  return_pot_ohm: {value: 1.0e+6, source: "provisional: the RETURN pot (1 MEG audio taper)"}
  r_cathode_follower_ohm: {value: 22.0e+3, source: "provisional: model knowledge (a 12AU7 cathode follower's load, ~5 mA)"}
  r_cf_grid_ohm: {value: 1.0e+6, source: "provisional: model knowledge (the follower's grid returned to its cathode's bias point)"}
  r_cf_bias_ohm: {value: 1.0e+6, source: "provisional: model knowledge (a divider holding the follower's grid near a third of B+4)"}
  r_cf_bias_low_ohm: {value: 470.0e+3, source: "provisional: model knowledge (the divider's lower leg)"}
  c_cf_bias_f: {value: 1.0e-6, source: "provisional: model knowledge (the divider's bypass: 0.5 Hz)"}
  c_out_f: {value: 1.0e-6, source: "provisional: model knowledge (output coupling)"}
  r_load_ohm: {value: 100.0e+3, source: "provisional: model knowledge (the next input's load)"}

  # --- Power supply (the 5E3's) ------------------------------------------------------------
  pt_hv_half_rms_v: {value: 350.7, source: "5e3: the reproduction power transformer's HV half unloaded"}
  pt_r_half_ohm: {value: 116.0, source: "5e3: HV DCR and primary referred to a half"}
  pt_leakage_h: {value: 10.0e-3, source: "5e3: provisional leakage per HV half"}
  pt_c_half_f: {value: 300.0e-12, source: "5e3: provisional winding capacitance per HV half"}
  rectifier_tube: {value: 5Y3GT@1, source: "5e3: 5Y3GT full-wave rectifier"}
  c_filter_f: {value: 16.0e-6, source: "5e3: 16 uF at each filter node"}
  r_b12_ohm: {value: 5000, source: "5e3: 5000 from B+1 to B+2"}
  r_b23_ohm: {value: 22.0e+3, source: "5e3: 22K from B+2 to B+3"}
  r_b34_ohm: {value: 10.0e+3, source: "provisional: model knowledge (a decoupling stage for the pickup amplifier, whose gain follows a low-level pickup: B+3's 120 Hz ripple, ~95 mV, came through at -46 dBFS)"}
  c_b4_f: {value: 47.0e-6, source: "provisional: model knowledge (with r_b34_ohm, ~350x less ripple at 120 Hz)"}
  numerical_leak_ohm: {value: 1.0e+9, source: "numerical: DC path for the B+ nodes (not physical)"}

mains:
  v_rms: mains_v_rms
  hz: mains_hz
  rated_v_rms: {value: 120.0, source: "5e3: the reproduction power transformer's primary"}

devices:
  V1A: {device: 12AX7@1}
  V1B: {device: 12AX7@1}
  V6A: {device: 6V6GT@1}
  V6B: {device: 6V6GT@1}
  V2A: {device: 12AU7@1}
  V2B: {device: 12AU7@1}
  V5: {device: rectifier_tube}

sections:
  - title: power supply
    parts:
      VHVA: {mains: [hv_a, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 90.0}
      VHVB: {mains: [hv_b, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 270.0}
      RPTA: {R: [hv_a, hv_ar], r: pt_r_half_ohm}
      LPTA: {L: [hv_ar, hva], l: pt_leakage_h}
      RPTB: {R: [hv_b, hv_br], r: pt_r_half_ohm}
      LPTB: {L: [hv_br, hvb], l: pt_leakage_h}
      CPTA: {C: [hva, "0"], c: pt_c_half_f}
      CPTB: {C: [hvb, "0"], c: pt_c_half_f}
      XV5A: {device: [hva, b1], model: V5}
      XV5B: {device: [hvb, b1], model: V5}
      CB1: {C: [b1, "0"], c: c_filter_f}
      RB12: {R: [b1, b2], r: r_b12_ohm}
      CB2: {C: [b2, "0"], c: c_filter_f}
      RB23: {R: [b2, b3], r: r_b23_ohm}
      CB3: {C: [b3, "0"], c: c_filter_f}
      RB34: {R: [b3, b4], r: r_b34_ohm}
      CB4: {C: [b4, "0"], c: c_b4_f}
      RLEAK: {R: [b1, "0"], r: numerical_leak_ohm}

  - title: drive amplifier
    parts:
      # DRIVE: the input across the pot, its wiper to the 12AX7's grid.
      RDRIVE: {pot: ["0", g1i, in], r: r_input_ohm, at: drive, taper_mid: audio_taper_mid}
      RGS1: {R: [g1i, g1], r: r_grid_stop1_ohm}
      XV1A: {device: [p1, g1, k1], model: V1A}
      RK1: {R: [k1, "0"], r: r_cathode1_ohm}
      CK1: {C: [k1, "0"], c: c_cathode1_f}
      RPL1: {R: [b3, p1], r: r_plate1_ohm}
      CC1: {C: [p1, g3], c: c_couple1_f}
      # The 5E3's cathodyne and 6V6GT pair.
      XV1B: {device: [p3, g3, k3], model: V1B}
      RPL3: {R: [b3, p3], r: r_plate3_ohm}
      RK3: {R: [k3, kj], r: r_cathode3_ohm}
      RTAIL: {R: [kj, "0"], r: r_tail_ohm}
      RG3: {R: [g3, kj], r: r_grid3_ohm}
      CC3A: {C: [p3, oa], c: c_couple3_f}
      CC3B: {C: [k3, ob], c: c_couple3_f}
      RGLA: {R: [oa, "0"], r: r_grid6_ohm}
      RGLB: {R: [ob, "0"], r: r_grid6_ohm}
      RGSA: {R: [oa, g6a], r: r_grid6_stop_ohm}
      RGSB: {R: [ob, g6b], r: r_grid6_stop_ohm}
      XV6A: {device: [p6a, b2, g6a, k6], model: V6A}
      XV6B: {device: [p6b, b2, g6b, k6], model: V6B}
      RK6: {R: [k6, "0"], r: r_cathode6_ohm}
      CK6: {C: [k6, "0"], c: c_cathode6_f}
      T1:
        transformer:
          pa: {nodes: [p6a, b1], r: ot_r_half_a_ohm, c: ot_c_half_f}
          pb: {nodes: [b1, p6b], r: ot_r_half_b_ohm, c: ot_c_half_f}
          s: {nodes: [ex, "0"], ratio: ot_sec_per_half, r: ot_r_sec_ohm}
        core: {material: ot_core_material, area_m2: ot_core_area_m2, path_m: ot_core_path_m, gap_m: ot_gap_m}
        turns: ot_turns_half
        leakage_h: ot_leakage_h

  - title: plate
    parts:
      # The exciter on the transformer's secondary; the pickup (behind its capacitance)
      # into the pickup amplifier's grid.
      PL:
        plate: [ex, "0", pu]
        component: plate_model
        decay_500hz_s: decay_500hz_s

  - title: pickup amplifier
    parts:
      RPG: {R: [pu, "0"], r: r_pickup_grid_ohm}
      XV2A: {device: [p2, pu, k2], model: V2A}
      RK2: {R: [k2, "0"], r: r_cathode2_ohm}
      CK2: {C: [k2, "0"], c: c_cathode2_f}
      RPL2: {R: [b4, p2], r: r_plate2_ohm}
      CC2: {C: [p2, rv], c: c_couple2_f}
      # RETURN: the pot's wiper through a capacitor to the follower's grid, which sits on
      # a divider from B+3.
      RRET: {pot: ["0", rvw, rv], r: return_pot_ohm, at: return_level, taper_mid: audio_taper_mid}
      CRV: {C: [rvw, g2b], c: c_couple2_f}
      RBH: {R: [b4, gb], r: r_cf_bias_ohm}
      RBL: {R: [gb, "0"], r: r_cf_bias_low_ohm}
      CBB: {C: [gb, "0"], c: c_cf_bias_f}
      RCFG: {R: [g2b, gb], r: r_cf_grid_ohm}
      XV2B: {device: [b4, g2b, k2b], model: V2B}
      RCF: {R: [k2b, "0"], r: r_cathode_follower_ohm}
      COUT: {C: [k2b, out], c: c_out_f}
      RLOAD: {R: [out, "0"], r: r_load_ohm}
