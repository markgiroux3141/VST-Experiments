  osc_kick_v:
    value: 0.1
    source: 'numerical: 1C36''s voltage at the start, so the oscillator leaves its symmetric balance point
      (CLAUDE.md: a capacitor''s v0)'
  passive_seed:
    value: 0
    source: 'numerical: which set of parts a unit is built from'
  passive_spread:
    value: 0.0
    source: 'provisional: fraction of each part''s tolerance band its deviation spans (0 = every part
      at its printed value)'
  tol_resistor_pct:
    value: 10.0
    source: 'sch: note 1, resistors +-10% unless specified'
  tol_precise_pct:
    value: 1.0
    source: 'sch: the parts printed 1% (2R25, 2R28, 1R18)'
  tol_two_pct:
    value: 2.0
    source: 'sch: 2R27 printed 2%'
  tol_five_pct:
    value: 5.0
    source: 'sch: the parts printed 5%'
  tol_pot_pct:
    value: 20.0
    source: 'provisional: model knowledge (carbon potentiometers, +-10..20%)'
  tol_paper_pct:
    value: 20.0
    source: 'provisional: model knowledge (paper capacitors, +-10..20%)'
  tol_electrolytic_minus_pct:
    value: 20.0
    source: 'provisional: model knowledge (electrolytics, -10..-20%)'
  tol_electrolytic_plus_pct:
    value: 50.0
    source: 'provisional: model knowledge (electrolytics, +50..+100%)'
  tube_emission_pct:
    value: 10.0
    source: 'provisional: model knowledge (plate current of new tubes of one type at fixed bias, +-10..20%)'
  tube_mu_pct:
    value: 3.0
    source: 'provisional: model knowledge (grid-pitch tolerance, a few %)'
  track_pitch_m:
    value: 0.0033020000000000002
    source: 'data/schematics/ampex_300_4/README.md (the 354 manual p 44: 70 mil tracks 60 mil apart, 130
      mil centres)'
  xt_unshielded:
    value: 0.8393726634214026
    source: 'provisional: fitted to Ampex''s measured crosstalk (reports/multitrack/crosstalk/fit.json,
      scripts/multitrack_crosstalk_study.py: unshielded, the contour''s flux the interchannel shields
      leave)'
  xt_contour_width_m:
    value: 0.003285912770170631
    source: 'derived: the fit''s contour width ratio 1.8481 (reports/multitrack/crosstalk/fit.json, scripts/multitrack_crosstalk_study.py)
      times the 70 mil track'
  xt_core:
    value: -0.001953472759843403
    source: 'derived: the fit''s cores'' coupling (-59.2 dB, signed; reports/multitrack/crosstalk/fit.json,
      scripts/multitrack_crosstalk_study.py) +5 dB for four tracks on 1/2 in (Ampex AI-14 p 13: ~50 dB
      against three tracks'' ~55; varimu.multitrack.crosstalk.FOUR_VS_THREE_DB)'
  k_rec_heads:
    value: 0.02
    source: 'derived: scripts/ampex_300_4_trim.py (config/ampex_300_4_trims.yaml): the record heads''
      mutual inductance (Ampex 354 manual p 12)'
  c_rec_heads_f:
    value: 7.439764401624408e-11
    source: 'derived: scripts/ampex_300_4_trim.py (config/ampex_300_4_trims.yaml): the capacitance between
      neighbouring record heads'' hot ends (windings and leads; Ampex 354 manual p 12), sized with k_rec_heads
      to the fit''s record-side crosstalk at 10 kHz (reports/multitrack/crosstalk/fit.json, scripts/multitrack_crosstalk_study.py)'
  r_sync_load_ohm:
    value: 1000000.0
    source: 'provisional: model knowledge (Sel-Sync''s monitoring tap: a reproduce preamp''s grid leak,
      the readout barely loaded)'
  tape_cell_m:
    value: 2.5e-07
    source: 'numerical: the tape''s cells at 0.25 um, not 7.62 per nominal bias wavelength (0.5 um): with
      the literal bias the cells point-sample the pattern of the field''s peaks (two per bias cycle, ~2
      um apart on tape) and alias it to |8 f_b - v / ds|; the master oscillator runs at ~95.9 kHz, which
      put that at ~5.5 kHz on 0.5 um cells (the chirp on the bass, docs/PERIOD_GEAR_BACKLOG.md PG1; scripts/chirp_alias_map.py);
      0.25 um was within 0.3 dB of 0.5 um on No. 21 (docs/TAPE_PLAN.md TM2 step 7)'
