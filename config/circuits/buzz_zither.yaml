# The Buzz Zither as a device (docs/INVENTED_LIVE_PLAN.md IL2; docs/INVENTED_DEVICES.md I14):
# keyed steel strings (C2-C6, 0.31 mm; 1 m at C3, shorter up the scale like a harp's, the
# bass capped at 1.4 m) over bone jawari bridges, on a gourd-and-top soundboard. A key plucks
# its string (velocity is the finger's force) and its felt damper falls on release. Under
# the sustain pedal a cam plucks the tanpura's four strings in turn (Pa, Sa, Sa, low Sa), one
# every 0.95 s; the cam's felt damps them when the pedal lifts. The strings are circuitsim's
# invented-keys medium (the component BUZZ_ZITHER: crates/circuitsim/src/invented.rs,
# varimu/invented/keys/zither.py the reference), read by a piezo under the bridge through the
# body's resonances; the keys sum onto `out`.
#
# The panel (they play on): JAWARI (k0: 0 a sharp bridge, no contact; above 0 the bridge's
# drop over its 12 mm is 6 um / JAWARI, flatter and buzzier as it turns up), PLUCK POINT (k1:
# 0.1-0.5 of the string's length, at the next pluck), DRONE (k2: the cam's pluck, 0-0.45 N),
# DRONE TONIC (k3: the tanpura's Sa from C3 up to B3 in semitones, each string re-strung at
# its next pluck).

title: "Buzz Zither (plucked strings over jawari bridges, keyed)"
input: in
probes: [out]

full_scale:
  input_volts_peak: {value: 1.0, source: "numerical: the audio input is unused (the keys drive the line)"}
  output_volts_peak: {value: 6.0, source: "measured: a pluck at velocity 127 peaks 1.0-1.3 V at the bridge piezo on any string (the force law), a six-note chord struck at once at 127 5.7 V; the demo over the tanpura peaks 1.1 V, -14.5 dBFS (scripts/invented_live_render.py, docs/INVENTED_LIVE_PLAN.md)"}

controls:
  jawari: {value: 0.6, min: 0.0, max: 1.0, unit: rotation, source: "design: JAWARI, the bridge's drop 6 um / JAWARI over 12 mm (10 um, the sketch's best, at 0.6; 0 a sharp bridge)"}
  pluck: {value: 0.5, min: 0.0, max: 1.0, unit: rotation, source: "design: PLUCK POINT, 0.1-0.5 of the length (0.3, the sketch's, at 0.5)"}
  drone: {value: 0.67, min: 0.0, max: 1.0, unit: rotation, source: "design: DRONE, the cam's pluck force 0-0.45 N (0.30 N at 0.67: the sketch's tanpura, 1.5 mm at C3)"}
  drone_tonic: {value: 0.0, min: 0.0, max: 1.0, unit: rotation, source: "design: DRONE TONIC, Sa = C3 + round(11 x it) semitones"}

values:
  keys_model: {value: BUZZ_ZITHER@1, source: "config/components/buzz_zither/1.yaml (varimu/invented/keys/zither.py's model from varimu/invented/jawari.py's values, compiled by scripts/compile_invented_keys.py)"}
  keys_rate_hz: {value: 96000.0, source: "numerical: each string stepped at the project's 96 kHz (the sketch's grid: ~0.98 fs / (2 f0) points)"}
  keys_max_keys: {value: 16, source: "numerical: key strings sounding at once (another struck silences a released one, else the one struck longest ago; the tanpura's four run beside them)"}
  r_in_ohm: {value: 1.0e+6, source: "numerical: a load on the unused audio input"}
  r_line_ohm: {value: 100.0e+3, source: "numerical: a DC path on the line (the piezo's load)"}

sections:
  - title: keys
    parts:
      RIN: {R: [in, "0"], r: r_in_ohm, tolerance: none}
      # the strings: the bridge piezo's sum on out (to ground), played by note events
      KEYS: {invented_keys: [out], component: keys_model, rate_hz: keys_rate_hz, max_keys: keys_max_keys, k0: jawari, k1: pluck, k2: drone, k3: drone_tonic}
      RLINE: {R: [out, "0"], r: r_line_ohm, tolerance: none}
