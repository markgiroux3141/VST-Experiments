sections:
- title: microphone input
  parts:
    RSRC:
      R:
      - in
      - ia
      r: source_impedance_ohm
      tolerance: none
    RS1_MIC_IN:
      rheostat:
      - ia
      - t1p
      r: r_contact_open_ohm
      at: input_transfer
      tolerance: none
    T1:
      transformer:
        p:
          nodes:
          - t1p
          - '0'
          r: t1_r_pri_ohm
        s:
          nodes:
          - g1b
          - '0'
          ratio: t1_ratio
          r: t1_r_sec_ohm
          c: t1_c_sec_f
      core:
        material: t1_core_material
        area_m2: t1_core_area_m2
        path_m: t1_core_path_m
        gap_m: t1_gap_m
      turns: t1_turns
      leakage_h: t1_leakage_h
    XV1B:
      device:
      - p1b
      - g1b
      - k1b
      model: V1B
    RP1B:
      R:
      - b220
      - p1b
      r: r_p1b_ohm
    RK1B:
      R:
      - k1b
      - '0'
      r: r_k1b_ohm
    CC1B:
      C:
      - p1b
      - mo
      c: c_c1b_f
    RG1B_OUT:
      R:
      - mo
      - '0'
      r: r_g1b_out_ohm
    RS1_MIC_OUT:
      rheostat:
      - mo
      - ib
      r: r_contact_open_ohm
      at: input_transfer
      tolerance: none
    RS1_BR_IN:
      rheostat:
      - ia
      - bri
      r: r_contact_open_ohm
      at: input_transfer
      reverse: 1
      tolerance: none
    RIN_S:
      R:
      - bri
      - brj
      r: r_in_series_ohm
    RIN_SH:
      R:
      - brj
      - ibf
      r: r_in_shunt_ohm
    RIN_F:
      R:
      - ibf
      - '0'
      r: r_in_foot_ohm
      tolerance: none
    RS1_BR_OUT:
      rheostat:
      - brj
      - ib
      r: r_contact_open_ohm
      at: input_transfer
      reverse: 1
      tolerance: none
- title: power supply
  parts:
    VHVA:
      mains:
      - hv_a
      - '0'
      v_rms: pt_hv_half_rms_v
      phase_deg: 90.0
    VHVB:
      mains:
      - hv_b
      - '0'
      v_rms: pt_hv_half_rms_v
      phase_deg: 270.0
    RPTA:
      R:
      - hv_a
      - hv_ar
      r: pt_r_half_ohm
      tolerance: none
    LPTA:
      L:
      - hv_ar
      - hva
      l: pt_leakage_h
    RPTB:
      R:
      - hv_b
      - hv_br
