# The Victorian synth's reed keyboard on ideal batteries (docs/VICTORIAN_SYNTH_PLAN.md, V1):
# the reeds medium (circuitsim's reeds.rs) with its local circuits on a stiff 2.8 V source and
# its line on a stiff 6 V source, each drawing the keys' currents through a G part. With ideal
# sources the medium's outputs are the Python reference's currents (varimu/victorian/reed.py)
# a sample late: tests/test_victorian.py checks that. Not an instrument.

title: "Reed keyboard test (ideal batteries)"
input: in
probes: [ol, ok]

values:
  local_v: {value: 2.8, source: "design: as config/victorian/reeds.yaml's magnet.local_v (the tuning's nominal local battery)"}
  line_v: {value: 6.0, source: "design: as config/victorian/reeds.yaml's magnet.line_v"}
  reeds_model: {value: GRAY_REEDS@2, source: "the compiled keyboard (scripts/compile_victorian_reeds.py)"}
  reeds_step_hz: {value: 768000.0, source: "design: the keys' internal rate, 8 x 96 kHz (config/victorian/reeds.yaml numerics.oversample)"}
  reeds_v_per_a: {value: 1.0, source: "design: the outputs' scale, 1 V per A"}
  g_sense_s: {value: 1.0, source: "design: the G parts' gain, the outputs' inverse scale"}
  r_in_ohm: {value: 1.0e+3, source: "design: a load on the unused input"}

sections:
  - title: keys
    parts:
      RIN: {R: [in, "0"], r: r_in_ohm}
      VLOC: {V: [loc, "0"], v: local_v}
      VLINE: {V: [line, "0"], v: line_v}
      GLOC: {G: [loc, "0", ol, "0"], gm: g_sense_s}
      GLINE: {G: [line, "0", ok, "0"], gm: g_sense_s}
      REEDS:
        reed_keys: [loc, line, ol, ok]
        component: reeds_model
        step_hz: reeds_step_hz
        v_per_a: reeds_v_per_a
