  output_volts_peak:
    value: 17.36
    source: 'derived: +24 dBu peak, x sqrt(2): headroom over the 2-610''s +20 dBm maximum (data/schematics/ua_610/ua_2610_manual_p6.png),
      the V72''s and V76''s'
controls:
