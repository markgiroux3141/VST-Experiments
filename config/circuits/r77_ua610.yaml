sections:
- title: 'RCA 77-DX: ribbon'
  parts:
    RB_r77:
      ribbon_motor:
      - in
      - p_rear
      - rp_r77
      - rm_r77
      component: ribbon_model_r77
      stop: pattern_r77
    RRL_r77:
      R:
      - rm_r77
      - '0'
      r: ribbon_leak_ohm_r77
      tolerance: none
    RPR_r77:
      R:
      - p_rear
      - '0'
      r: rear_hold_ohm_r77
      tolerance: none
- title: 'RCA 77-DX: transformer'
  parts:
    T1_r77:
      transformer:
        p:
          nodes:
          - rm_r77
          - rp_r77
        s1:
          nodes:
          - ta_r77
          - tb_r77
        s2:
          nodes:
          - tb_r77
          - tc_r77
      component: transformer_model_r77
    SRESP_r77:
      switch: response_r77
      parts:
        LRX_r77:
          L:
          - tc_r77
          - rx_r77
          l: reactor_h_r77
          in:
          - 1
          - 2
        RRX1_r77:
          R:
          - rx_r77
          - tb_r77
          r: reactor_ohm_r77
          tolerance: none
          in:
          - 1
        RRX2_r77:
          R:
          - rx_r77
          - ta_r77
          r: reactor_ohm_r77
          tolerance: none
          in:
          - 2
    SIMP_r77:
      switch: impedance_r77
      parts:
        RO250_r77:
          R:
          - tc_r77
          - ia_ua610
          r: contact_ohm_r77
          tolerance: none
          in:
          - 0
          - 1
        RG250_r77:
          R:
          - ta_r77
          - '0'
          r: contact_ohm_r77
          tolerance: none
          in:
          - 0
          - 2
        RG150_r77:
          R:
          - tb_r77
          - '0'
          r: contact_ohm_r77
          tolerance: none
          in:
          - 1
        RO30_r77:
          R:
          - tb_r77
          - ia_ua610
          r: contact_ohm_r77
          tolerance: none
          in:
          - 2
- title: cable
  parts:
    CCABLE:
      C:
      - ia_ua610
      - '0'
