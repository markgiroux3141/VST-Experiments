    value: 2
    choices:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    unit: position
    source: 'ib: the pattern selector''s six marked stops (Fig. 3: UNI-, BI-, NON-DIRECTIONAL, L-1, L-2,
      L-3); the shutter''s order from closed to wide open (ib2 Fig. 4''s patterns: L-3 between N and U,
      L-2 and L-1 between U and B)'
    notes: '0: N (non-directional), 1: L-3, 2: U (uni-directional), 3: L-2, 4: L-1, 5: B (bi-directional)'
  impedance_r77:
    value: 0
    choices:
    - 0
    - 1
    - 2
    unit: position
    source: 'ib2: ''Output impedance 250 ohms, may be changed to 30 or 150 ohms''; ib Fig. 2''s cable
      connections'
    notes: '0: 250 ohm (A-C), 1: 150 ohm (B-C), 2: 30 ohm (A-B)'
  response_r77:
    value: 0
    choices:
    - 0
    - 1
    - 2
    unit: position
    source: 'ib Fig. 2: the music-voice switch M, V1, V2 (ib2: ''Switch, rotary, single circuit, 3 pos.
      screw driver slotted shaft, music-voice''); ib: V1 ''for distances down to 1 foot'', V2 ''for still
      shorter distances'''
    notes: '0: M (music), 1: V1, 2: V2 (voice: the reactor''s low cut)'
  level_ua610:
    value: 0.2
    min: 0.0
    max: 1.0
    unit: rotation
    source: 'sch: R13 250K, the LEVEL pot ahead of V2-A''s grid'
    notes: 0 = off (wiper at ground); 0.2 = 35 dB at the Hi link (reports/units/ua610_nominal/), the chain
      list's default, as the V72's and V76's 34 dB
  gain_link_ua610:
    value: 1
    choices:
    - 0
    - 1
    unit: position
    source: 'sch: ''Lo Gain'' / ''Hi Gain'', an internal link (web: https://groupdiy.com/threads/ua-2-610-troubleshooting.47543,
      Jean Clochet: ''an internal link, NOT a switch'')'
    notes: '0 Lo (C14 from the R11 / R9 tap), 1 Hi (from C4: the drawn position)'
  hf_eq_ua610:
    value: 0
    choices:
    - -6
    - 0
    - 3
    - 6
    unit: dB
    source: 'sch: S2 ''HF Switch'', positions -6, 0, +3, +6'
  lf_eq_ua610:
    value: 0
    choices:
    - -6
    - 0
    - 6
    unit: dB
    source: 'sch: S3 ''LF Switch'', two decks, positions -6, 0, +6'
  b_plus_v_ua610:
    value: 275.0
    min: 250.0
    max: 300.0
    unit: V
    source: 'web: https://groupdiy.com/threads/ua-610-microphone-preamplifier-help-thread.72736/ (Hinson:
      ''B+ was around the 275V range on the original desk'', ''the operating points don''t really change
      much from 250 to 300V'')'
    notes: the console's rail at the module's B+ terminal; the clone ran 298 V
values:
