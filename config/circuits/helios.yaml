  # --- HPF and the follower (sch) ------------------------------------------------------------
  c5_f: {value: 33.0e-6, source: "web: the IA-H9 schematic (C5 33 uF / 35V)"}
  c7_f: {value: 1.5e-7, source: "web: the IA-H9 schematic (C7 .15 uF)"}
  c8_f: {value: 1.5e-7, source: "web: the IA-H9 schematic (C8 .15 uF)"}
  r17_ohm: {value: 4700.0, source: "web: the IA-H9 schematic (R17 4.7K)"}
  r18_ohm: {value: 180.0e+3, source: "web: the IA-H9 schematic (R18 180k)"}
  c9_f: {value: 1.5e-6, source: "web: the IA-H9 schematic (C9 1.5uF)"}
