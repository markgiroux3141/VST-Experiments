# The Helios mic amplifier and output amplifier (docs/CHAINS_PLAN.md WP19; sources
# data/schematics/helios_ia_h9/README.md).
#
# Traced from Iron Age Audioworks' IA-H9 schematic (rev 1, 2020-04-05; the user's files, cleared
# for use 2026-11-10), a clone of the Helios Type 69 channel: the Sowter 7490 input transformer
# (Sowter's replacement for the Lustraphone M10: 1:10 with a 1:1 tap), the "Mic Amp 2128" (a
# 2N5087 input with the feedback into its emitter, a BC550C follower, a BC550C gain stage), an
# 80 Hz Sallen-Key high-pass behind a BC550C follower (H2 shorts it: HPF here), the EQUALIZER
# and its EQ CUT switch, and the "Output Amp 2128" (the same three-transistor amplifier at a
# fixed gain) into a capacitor-coupled output (HI out through 47 ohm and 33 uF).
#
# Built: the mic path with EQ CUT in (SW7 at 3: R25 240R -> R35 27K -> R36 5.1K || C43 68 pF,
# the EQ's own insertion loss matched by the board). **Not built:** the EQ (the 50 Hz cut, the
# bass boost on VTB9043, the mid on VTB9042, the 10k shelf), whose sections hang on R25's node
# through their switches (their loading there is left out); the line input (RL1 / RL3: R52 10K,
# R51 4.7K) and the +48 V phantom (RP1 / RP2 6.8k, H1 open for a dynamic mic); LO out (C50 /
# R50 47R to ground: the chain reads HI out against ground).
#
# Rails: the board's +V is a 7808 off the +16 VDC pin (rev 1's note: "Added 7808 to limit
# voltage to +24V", +8 V over -V), -V the -16 VDC pin through D2 1N4004: ideal +8.0 / -15.3 V
# here (the original Type 69 ran on a single 24 V rail: the same 23.3 V across the amplifiers).
#
# in -> RSRC (a 150 ohm test generator, dropped in a chain) -> ia, the mic's hot pin; the cold
# pin (LO) is ground.

title: Helios mic amplifier (IA-H9)
input: in
probes: [out, ia, b1, e1, c1, o1, e4, a, o7]
full_scale:
  input_volts_peak: {value: 1.096, source: "derived: 0.775 V rms x sqrt(2), 0 dBu (as api_312.yaml)"}
  output_volts_peak: {value: 17.36, source: "derived: +24 dBu peak, the same scale as api_312.yaml's and ssl_4000e.yaml's outputs so the chains print comparably"}
controls:
  gain:
    value: 50
    choices: [20, 30, 40, 50, 60, 70]
    unit: switch
    source: "web: the IA-H9 schematic (SW2 GAIN, positions A1-A6 labelled 20-70: R1 56K, R2 22K, R3 5.1K, R4 1.5K, R5 460R, R8 110R from C4 to ground)"
    notes: the labels are the panel's; the measured gains are the list's labels (reports/units/helios_nominal/)
  pad:
    value: 0
    choices: [0, 1]
    unit: switch
    source: "web: the IA-H9 schematic (SW1 Up - Mic, Mid - Pad: RL2 moves the amplifier's input from T1's whole secondary to its 1:1 tap)"
    notes: 0 mic (1:10), 1 pad (the 1:1 tap, -20 dB)
  hpf:
    value: 0
    choices: [0, 1]
    unit: switch
    source: "web: the IA-H9 schematic (H2 'HPF - 80' across C7 / C8)"
    notes: 0 H2 shorted (flat), 1 the 80 Hz high-pass in
values:
  supply_v: {value: 8.0, source: "web: the IA-H9 schematic (U1 MC7808CT on the +16VDC pin: +V)"}
  supply_neg_v: {value: -15.3, source: "derived: the -16VDC pin less D2 1N4004's ~0.7 V forward drop (the IA-H9 schematic)"}
  source_impedance_ohm: {value: 150.0, source: "derived: the 150 ohm test generator of the other preamps' profiles (api_312.yaml)"}
  contact_ohm: {value: 0.01, source: "provisional: model knowledge (a relay or switch contact, ~10 mOhm)"}
  # --- T1, the Sowter 7490 -------------------------------------------------------------------
  t1_ratio_tap: {value: 1.0, source: "web: https://www.sowter.co.uk/acatalog/VINTAGE-RECORDING-AMPLIFIER-TRANSFORMERS-A-to-K.html (7490 Lustraphone M10 input transformer: ratio 1:10 with tap for 1:1)"}
  t1_ratio_rest: {value: 9.0, source: "derived: 10 - t1_ratio_tap (Sowter's 1:10)"}
  t1_r_pri_ohm: {value: 19.7, source: "provisional: the JT-115K-E's primary (ssl_4000e.yaml; a 1:10 200 ohm mic transformer, Sowter's 200/20K; the 7490's DCR isn't published)"}
  t1_r_tap_ohm: {value: 150.0, source: "provisional: the first tenth of t1_r_sec's turns, wound innermost (shorter turns)"}
  t1_r_rest_ohm: {value: 2315.0, source: "derived: the JT-115K-E's 2465 ohm secondary (ssl_4000e.yaml) less t1_r_tap_ohm"}
  t1_core_material: {value: mumetall, source: "provisional: model knowledge (a 34 mm mumetal-canned mic input transformer: Sowter's page; an 80% nickel core)"}
  t1_core_area_m2: {value: 7.654e-6, source: "provisional: the JT-115K-E's fitted area (ssl_4000e.yaml; Sowter's 7490: max input level +9 dBu, the JT-115K-E's 20 Hz 1% level is -2.5 dBu, so this core is the smaller: kept, the stand-in's)"}
  t1_core_path_m: {value: 0.025, source: "provisional: the JT-115K-E's (ssl_4000e.yaml)"}
  t1_turns: {value: 1300, source: "provisional: the JT-115K-E's primary turns (ssl_4000e.yaml)"}
  t1_gap_m: {value: 1.309e-6, source: "provisional: the JT-115K-E's fitted joint gap (ssl_4000e.yaml)"}
  t1_leakage_h: {value: 1.657e-4, source: "provisional: the JT-115K-E's fitted leakage (ssl_4000e.yaml), referred to the primary"}
  t1_c_sec_f: {value: 1.345e-10, source: "provisional: the JT-115K-E's fitted secondary capacitance (ssl_4000e.yaml)"}
  # --- Mic Amp 2128 (sch) --------------------------------------------------------------------
  c1_f: {value: 1.5e-6, source: "web: the IA-H9 schematic (C1 1.5uF)"}
  c2_f: {value: 1.5e-10, source: "web: the IA-H9 schematic (C2 150 pF)"}
  r6_ohm: {value: 820.0e+3, source: "web: the IA-H9 schematic (R6 820K)"}
  r7_ohm: {value: 680.0e+3, source: "web: the IA-H9 schematic (R7 680K)"}
  r10_ohm: {value: 180.0e+3, source: "web: the IA-H9 schematic (R10 180k)"}
  pc2_f: {value: 33.0e-6, source: "web: the IA-H9 schematic (CP2 33 uF / 35V)"}
  r12_ohm: {value: 1000.0, source: "web: the IA-H9 schematic (R12 1K)"}
  r13_ohm: {value: 47.0e+3, source: "web: the IA-H9 schematic (R13 47K)"}
  c4_f: {value: 220.0e-6, source: "web: the IA-H9 schematic (C4 220 uF / 25V)"}
