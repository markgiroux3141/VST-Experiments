tolerance:
  source: "provisional: classes by part type (see the tol_* values)"
  seed: passive_seed
  spread: passive_spread
  bands: {r5: tol_resistor_pct, cap: tol_cap_pct}
  classes:
    r5: [RG20, RG30, RG40, RG50, RG60, RG70, R6, R7, R9, R10, R11, R12, R13, R14, R15, R16, R17,
         R18, R19, R20, R21, R22, R23, R24, R25, R35, R36, R37, R38, R39, R40, R41, R42, R43, R44,
         R45, R46, R47, R48, R49, RL]
    cap: [C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C43, C44, C45, C46, C47, C48, C49, CP2, CP3,
          CP4, CP5, CP6, CP7]
devices:
  QP: {device: 2N5087@1, source: "web: the IA-H9 schematic (Q1, Q5 2N5087)"}
  QN: {device: BC550C@1, source: "web: the IA-H9 schematic (Q2, Q3, Q4, Q6, Q7 BC550C)"}
sections:
- title: rails
  parts:
    VP: {V: [vp, '0'], v: supply_v}
    VN: {V: [vn, '0'], v: supply_neg_v}
    R23: {R: [vp, vpm], r: r23_ohm}
    CP4: {C: [vpm, '0'], c: pc4_f}
    CP3: {C: ['0', vn], c: pc3_f}
    R48: {R: [vp, vpo], r: r48_ohm}
    CP6: {C: [vpo, '0'], c: pc6_f}
    CP7: {C: ['0', vn], c: pc7_f}
- title: input
  parts:
    RSRC: {R: [in, ia], r: source_impedance_ohm, tolerance: none}
    T1:
      transformer:
        p: {nodes: [ia, '0'], r: t1_r_pri_ohm}
        s1: {nodes: [tap, '0'], ratio: t1_ratio_tap, r: t1_r_tap_ohm}
        s2: {nodes: [top, tap], ratio: t1_ratio_rest, r: t1_r_rest_ohm, c: t1_c_sec_f}
      core: {material: t1_core_material, area_m2: t1_core_area_m2, path_m: t1_core_path_m, gap_m: t1_gap_m}
      turns: t1_turns
      leakage_h: t1_leakage_h
    SPAD:
      switch: pad
      parts:
        RPAD0: {R: [top, sw], r: contact_ohm, tolerance: none, in: [0]}
        RPAD1: {R: [tap, sw], r: contact_ohm, tolerance: none, in: [1]}
- title: mic amp
  parts:
    C1: {C: [sw, b1], c: c1_f}
    C2: {C: [b1, vn], c: c2_f}
    R10: {R: [vpm, vb], r: r10_ohm}
    CP2: {C: [vb, '0'], c: pc2_f}
    R6: {R: [vb, b1], r: r6_ohm}
    R7: {R: [b1, vn], r: r7_ohm}
    Q1: {bjt: [c1, b1, e1], model: QP}
    R12: {R: [e1, fb], r: r12_ohm}
    R13: {R: [fb, o1], r: r13_ohm}
    C4: {C: [fb, g], c: c4_f}
    SGAIN:
      switch: gain
      parts:
        RG20: {R: [g, '0'], r: r1_ohm, in: [20]}
        RG30: {R: [g, '0'], r: r2_ohm, in: [30]}
        RG40: {R: [g, '0'], r: r3_ohm, in: [40]}
        RG50: {R: [g, '0'], r: r4_ohm, in: [50]}
        RG60: {R: [g, '0'], r: r5_ohm, in: [60]}
        RG70: {R: [g, '0'], r: r8_ohm, in: [70]}
    R9: {R: [c1, vn], r: r9_ohm}
    R11: {R: [c1, x11], r: r11_ohm}
    C3: {C: [x11, vn], c: c3_f}
    Q2: {bjt: [vpm, c1, e2], model: QN}
    R14: {R: [e2, vn], r: r14_ohm}
    Q3: {bjt: [o1, e2, e3], model: QN}
    R15: {R: [vpm, o1], r: r15_ohm}
    R16: {R: [e3, vn], r: r16_ohm}
    C6: {C: [e3, vn], c: c6_f}
- title: hpf
  parts:
    C5: {C: [o1, h1], c: c5_f}
    SHPF:
      switch: hpf
      parts:
        RH2: {R: [h1, h2], r: contact_ohm, tolerance: none, in: [0]}
    RH1L: {R: [h1, vn], r: r_leak_ohm, tolerance: none}
    C7: {C: [h1, h3], c: c7_f}
    C8: {C: [h3, h2], c: c8_f}
    R17: {R: [h3, o4], r: r17_ohm}
    R18: {R: [h2, vn], r: r18_ohm}
    C9: {C: [h2, b4], c: c9_f}
    R19: {R: [c4, b4], r: r19_ohm}
    R20: {R: [b4, vn], r: r20_ohm}
    R21: {R: [vpm, c4], r: r21_ohm}
    Q4: {bjt: [c4, b4, e4], model: QN}
    R22: {R: [e4, vn], r: r22_ohm}
    C10: {C: [e4, o4], c: c10_f}
    R24: {R: [o4, '0'], r: r24_ohm}
    R25: {R: [o4, eq], r: r25_ohm}
- title: eq cut
  parts:
    R35: {R: [eq, a], r: r35_ohm}
    R36: {R: [a, '0'], r: r36_ohm}
    C43: {C: [a, '0'], c: c43_f}
- title: output amp
  parts:
    C44: {C: [a, b5], c: c44_f}
    C45: {C: [b5, vn], c: c45_f}
    R40: {R: [vpo, vb5], r: r40_ohm}
