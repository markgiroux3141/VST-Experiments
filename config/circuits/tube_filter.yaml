# The tube synth's filter and VCA (docs/TUBE_SYNTH_PLAN.md, S2): the saturable-reactor
# low-pass (reactor_filter.yaml) between tube stages, with a tube setting its cutoff, a
# tube Q multiplier for its resonance, a variable-mu tube as the VCA, and one supply for
# all of them. An audio processor: a keyboard plays it through the native app's test
# oscillator until S3 brings notes into the circuit.
#   V1A  12AU7 gain stage (unbypassed cathode, ~x11)
#   V1B  12AU7 cathode follower: drives the reactor through CC1 (~400 ohm source)
#   TA/TB  the reactor's signal windings in series into CF, damped by RL
#   V5   12AX7 cathode-coupled pair off the filter node: V5B's plate is the node in phase,
#        amplified; the RESONANCE pot feeds a share of it back through RFB. Gain above 1
#        makes that a negative resistance across the tank (a Q multiplier): it cancels
#        RL's damping and, at the top of the pot, the filter oscillates (the tubes' and
#        cores' curvature limit it). The threshold is the same at every cutoff.
#   V2A  12AU7 cathode follower off the filter node
#   V3   6386 section, the VCA: its grid bias from the LEVEL pot (-100 V off to ~-2 V
#        full), the signal attenuated ~1/23 into its grid (variable-mu: it distorts and
#        compresses as the bias moves, its character)
#   V4   6V6GT pentode drawing its plate current through the reactor's control windings
#        (anti-series): a current source, the CUTOFF pot setting its grid; RK4 makes the
#        current follow the grid voltage
# The supply: the mains into a power transformer (two HV halves behind their resistance
# and leakage), a 6X4 full-wave rectifier, CRC filtering (b1 feeds the 6V6GT, b4 the VCA,
# b3 the small stages); a bias winding into a selenium rectifier, -100 V for the VCA's
# bias and -45 V by a divider. Every stage sags and hums on the same rails: the cutoff's
# current moves B+. Invented circuit, not modelled hardware: round numbers, every value a
# design choice.

title: "Tube reactor filter and VCA"
input: in
probes: [out, f, s, p4, g3, pb5, b1, b3, neg, neg2, ta_core, tb_core]

full_scale:
  input_volts_peak: {value: 1.0, source: "provisional: model knowledge (line level into the first stage, ~1 V peak)"}
  output_volts_peak: {value: 5.0, source: "provisional: model knowledge (the VCA's output at full level and full input, ~2.5 V of fundamental, ~5 V peak on a saw: set from a render, 2026-10-29)"}

controls:
  cutoff: {value: 0.3, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the CUTOFF pot, V4's grid from the -45 V rail (0) to ground (1))"}
  resonance: {value: 0.3, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the RESONANCE pot, the share of V5B's output fed back to the filter node; linear)"}
  level: {value: 1.0, min: 0.0, max: 1.0, unit: rotation, source: "provisional: model knowledge (design: the LEVEL pot, V3's grid bias from -100 V (0) to ~-2 V (1))"}
  mains_v_rms: {value: 120.0, min: 105.0, max: 127.0, unit: V, source: "provisional: model knowledge (US line voltage)"}
  mains_hz: {value: 60.0, min: 50.0, max: 60.0, unit: Hz, source: "provisional: model knowledge (US mains)"}

values:
  # --- supply
  pt_hv_half_rms_v: {value: 250.0, source: "provisional: model knowledge (design: a small power transformer's HV half, sized for ~250 V at b3)"}
  pt_r_half_ohm: {value: 150.0, source: "provisional: model knowledge (a ~25 W transformer's HV half with the primary referred, ~150 ohm)"}
  pt_leakage_h: {value: 10.0e-3, source: "provisional: model knowledge (leakage per HV half of a small mains transformer)"}
  pt_c_half_f: {value: 300.0e-12, source: "provisional: model knowledge (self-capacitance per HV half; a capacitance on every rectifier node, CLAUDE.md)"}
  rectifier_tube: {value: 6X4@1, source: "provisional: model knowledge (design: a 6X4 full-wave rectifier, as small studio gear of the era used; config/components/6x4/1.yaml, per section)"}
  c_reservoir_f: {value: 20.0e-6, source: "provisional: model knowledge (reservoir and filter electrolytics, 20 uF 450 V)"}
  r_b12_ohm: {value: 1.0e+3, source: "provisional: model knowledge (filter resistor b1 to b2)"}
  r_b23_ohm: {value: 2.2e+3, source: "provisional: model knowledge (filter resistor b2 to b3, the small stages' and the VCA's decoupling)"}
  r_b24_ohm: {value: 4.7e+3, source: "provisional: model knowledge (design: the VCA's own RC branch off b2: at b3, the input stages' signal currents leaked through its plate resistor with it cut off, -34 dB)"}
  c_decouple_f: {value: 47.0e-6, source: "provisional: model knowledge (b2 and b3 electrolytics: the VCA hums at b2's ripple otherwise)"}
  r_bleeder_ohm: {value: 220.0e+3, source: "provisional: model knowledge (a bleeder across the reservoir)"}
  bias_winding_rms_v: {value: 85.0, source: "provisional: model knowledge (design: a bias winding for ~-100 V)"}
  bias_winding_r_ohm: {value: 200.0, source: "provisional: model knowledge (a small bias winding's resistance)"}
  bias_rectifier: {value: SELENIUM@1, source: "provisional: model knowledge (design: a selenium bridge for the bias, as the 670 has; config/components/selenium/1.yaml; full-wave: a half-wave bias hummed at -26 dBFS through the VCA's grid)"}
  c_bias_arm_f: {value: 1.0e-9, source: "provisional: model knowledge (each selenium arm's capacitance; a capacitance on the rectifier nodes)"}
  bias_arm_area: {value: 1.0, source: "numerical: the arm capacitance is given per arm (the macro's per-area form)"}
  c_bias_winding_f: {value: 1.0e-9, source: "provisional: model knowledge (the floating bias winding's capacitance to the core: holds its common mode, as CT104A/B in the 670)"}
  r_bias_winding_leak_ohm: {value: 1.0e+8, source: "numerical: a DC path for the floating bias winding (its insulation's leakage; the pre-flight checks need one)"}
  c_bias_f: {value: 100.0e-6, source: "provisional: model knowledge (bias filter electrolytics)"}
  r_vca_bias_filter_ohm: {value: 2.2e+3, source: "provisional: model knowledge (design: an RC stage of its own for the VCA's bias: its grid hears every millivolt there)"}
  r_bias_drop_ohm: {value: 4.7e+3, source: "provisional: model knowledge (design: -100 V to the -45 V node)"}
  r_bias_ground_ohm: {value: 8.2e+3, source: "provisional: model knowledge (design: the -45 V node to ground, with its loads)"}
  # --- input
  r_grid_in_ohm: {value: 1.0e+6, source: "provisional: model knowledge (grid leak)"}
  r_stopper_ohm: {value: 10.0e+3, source: "provisional: model knowledge (grid stopper)"}
  r_plate1_ohm: {value: 47.0e+3, source: "provisional: model knowledge (12AU7 plate load)"}
  r_cathode1_ohm: {value: 1.5e+3, source: "provisional: model knowledge (12AU7 self bias, unbypassed: gain ~11)"}
  r_follower1_ohm: {value: 22.0e+3, source: "provisional: model knowledge (12AU7 follower to ground, ~5 mA)"}
  c_couple1_f: {value: 4.7e-6, source: "provisional: model knowledge (into the reactor: 17 Hz with its 18 H, below the passband)"}
  # --- filter
  c_filter_f: {value: 47.0e-9, source: "provisional: model knowledge (as reactor_filter.yaml: ~110 Hz unbiased, ~4 kHz at full cutoff)"}
  r_load_ohm: {value: 4.7e+3, source: "provisional: model knowledge (the filter's damping with the resonance off: Q ~0.25 at the bottom, ~6 at the top)"}
  r_tail_ohm: {value: 47.0e+3, source: "provisional: model knowledge (V5's tail to the -45 V rail, ~1 mA for the pair)"}
  r_plate5_ohm: {value: 100.0e+3, source: "provisional: model knowledge (V5B's plate load, a 12AX7's usual)"}
  c_res_f: {value: 0.22e-6, source: "provisional: model knowledge (V5B's output into the RESONANCE pot)"}
  r_res_pot_ohm: {value: 100.0e+3, source: "provisional: model knowledge (the RESONANCE pot)"}
  r_feedback_ohm: {value: 22.0e+3, source: "provisional: model knowledge (design: from the pot's wiper to the filter node; with V5's gain sets where the filter starts to oscillate)"}
  r_follower2_ohm: {value: 22.0e+3, source: "provisional: model knowledge (V2A's cathode to the -45 V rail, ~2.6 mA)"}
  # --- VCA
  c_couple2_f: {value: 0.1e-6, source: "provisional: model knowledge (into the VCA's divider: 7 Hz)"}
  r_vca_series_ohm: {value: 220.0e+3, source: "provisional: model knowledge (with the grid leak, ~1/23 into V3: ~0.5 V peak at full input)"}
  r_vca_grid_ohm: {value: 10.0e+3, source: "provisional: model knowledge (V3's grid leak to the LEVEL wiper)"}
  r_level_pot_ohm: {value: 100.0e+3, source: "provisional: model knowledge (the LEVEL pot)"}
  r_level_floor_ohm: {value: 2.0e+3, source: "provisional: model knowledge (below the LEVEL pot to ground: its top end ~-2 V)"}
  c_level_f: {value: 1.0e-6, source: "provisional: model knowledge (on the LEVEL wiper: a bias node for V3's grid leak)"}
  r_plate3_ohm: {value: 47.0e+3, source: "provisional: model knowledge (6386 plate load)"}
  c_out_f: {value: 0.47e-6, source: "provisional: model knowledge (output coupling)"}
  r_out_load_ohm: {value: 470.0e+3, source: "provisional: model knowledge (the next stage's grid leak)"}
  # --- cutoff
  r_cutoff_pot_ohm: {value: 100.0e+3, source: "provisional: model knowledge (the CUTOFF pot)"}
  c_cutoff_f: {value: 0.1e-6, source: "provisional: model knowledge (on V4's grid: smooths the cutoff, 10 ms with the pot)"}
  r_screen4_ohm: {value: 1.0e+3, source: "provisional: model knowledge (6V6GT screen feed)"}
  r_cathode4_ohm: {value: 1.0e+3, source: "provisional: model knowledge (6V6GT cathode: current feedback, ~0-15 mA over the pot)"}
  # --- the reactor
  signal_turns: {value: 500.0, source: "provisional: model knowledge (as saturable_reactor.yaml)"}
  r_signal_winding_ohm: {value: 10.0, source: "provisional: model knowledge (500 turns of ~0.2 mm copper on a small toroid)"}
  r_control_winding_ohm: {value: 30.0, source: "provisional: model knowledge (1000 turns of ~0.15 mm copper)"}
  leakage_h: {value: 0.0, source: "provisional: model knowledge (windings on a toroid couple closely; leakage neglected)"}
  core_area_m2: {value: 1.0e-4, source: "provisional: model knowledge (a small tape-wound toroid, 1 cm^2)"}
  core_path_m: {value: 0.1, source: "provisional: model knowledge (10 cm mean path)"}
  core_gap_m: {value: 0.0, source: "provisional: model knowledge (a tape-wound toroid has no joint gap)"}

mains:
  v_rms: mains_v_rms
  hz: mains_hz
  rated_v_rms: {value: 120.0, source: "provisional: model knowledge (the power transformer's rated primary; its secondaries are given at it)"}

devices:
  V1A: {device: 12AU7@1}
  V1B: {device: 12AU7@1}
  V2A: {device: 12AU7@1}
  V5A: {device: 12AX7@1}
  V5B: {device: 12AX7@1}
  V3: {device: 6386@1}
  V4: {device: 6V6GT@1}
  VR: {device: rectifier_tube}
  DB: {device: bias_rectifier}

sections:
  - title: power supply
    parts:
      VHVA: {mains: [hv_a, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 90.0}
      VHVB: {mains: [hv_b, "0"], v_rms: pt_hv_half_rms_v, phase_deg: 270.0}
      RPTA: {R: [hv_a, hv_ar], r: pt_r_half_ohm}
      LPTA: {L: [hv_ar, hva], l: pt_leakage_h}
      RPTB: {R: [hv_b, hv_br], r: pt_r_half_ohm}
      LPTB: {L: [hv_br, hvb], l: pt_leakage_h}
      CPTA: {C: [hva, "0"], c: pt_c_half_f}
      CPTB: {C: [hvb, "0"], c: pt_c_half_f}
      XVRA: {device: [hva, b1], model: VR}
      XVRB: {device: [hvb, b1], model: VR}
      CB1: {C: [b1, "0"], c: c_reservoir_f}
      RBLEED: {R: [b1, "0"], r: r_bleeder_ohm}
      RB12: {R: [b1, b2], r: r_b12_ohm}
      CB2: {C: [b2, "0"], c: c_decouple_f}
      RB23: {R: [b2, b3], r: r_b23_ohm}
      CB3: {C: [b3, "0"], c: c_decouple_f}
      RB24: {R: [b2, b4], r: r_b24_ohm}
      CB4: {C: [b4, "0"], c: c_decouple_f}
  - title: bias supply
    parts:
      # A floating bias winding (at its peak at the start) into a selenium bridge, its
      # positive side to ground: -100 V, then -45 V by RN / RNG, and an RC stage of its
      # own for the VCA's bias.
      VBW: {mains: [bwa, bwb], v_rms: bias_winding_rms_v, phase_deg: 90.0}
      RBW: {R: [bwa, bwar], r: bias_winding_r_ohm}
      CBW: {C: [bwb, "0"], c: c_bias_winding_f}
      RBWL: {R: [bwb, "0"], r: r_bias_winding_leak_ohm}
      GRB: {bridge: [bwar, bwb, "0", neg2], model: DB, arm_c_f_per_area: c_bias_arm_f, area: bias_arm_area}
      CN2: {C: [neg2, "0"], c: c_bias_f}
      RVF: {R: [neg2, nv], r: r_vca_bias_filter_ohm}
      CVF: {C: [nv, "0"], c: c_bias_f}
      RN: {R: [neg2, neg], r: r_bias_drop_ohm}
      CN: {C: [neg, "0"], c: c_bias_f}
      RNG: {R: [neg, "0"], r: r_bias_ground_ohm}
  - title: input
    parts:
      RG1: {R: [in, "0"], r: r_grid_in_ohm}
      RST1: {R: [in, g1], r: r_stopper_ohm}
      XV1A: {device: [p1, g1, k1], model: V1A}
      RP1: {R: [b3, p1], r: r_plate1_ohm}
      RK1: {R: [k1, "0"], r: r_cathode1_ohm}
      XV1B: {device: [b3, p1, k1b], model: V1B}
      RK1B: {R: [k1b, "0"], r: r_follower1_ohm}
      CC1: {C: [k1b, s], c: c_couple1_f}
  - title: filter
    parts:
      TA:
        transformer:
          sig: {nodes: [s, m], r: r_signal_winding_ohm}
          ctl: {nodes: [b1, c2], ratio: 2.0, r: r_control_winding_ohm}
        core: {material: mumetall, area_m2: core_area_m2, path_m: core_path_m, gap_m: core_gap_m}
        turns: signal_turns
        leakage_h: leakage_h
      TB:
        transformer:
          sig: {nodes: [m, f], r: r_signal_winding_ohm}
          ctl: {nodes: [p4, c2], ratio: 2.0, r: r_control_winding_ohm}
        core: {material: mumetall, area_m2: core_area_m2, path_m: core_path_m, gap_m: core_gap_m}
        turns: signal_turns
        leakage_h: leakage_h
      CF: {C: [f, "0"], c: c_filter_f}
      RL: {R: [f, "0"], r: r_load_ohm}
      XV2A: {device: [b3, f, k2], model: V2A}
      RK2: {R: [k2, neg], r: r_follower2_ohm}
  - title: resonance
    parts:
      XV5A: {device: [b3, f, k5], model: V5A}
      XV5B: {device: [pb5, "0", k5], model: V5B}
      RT5: {R: [k5, neg], r: r_tail_ohm}
      RP5: {R: [b3, pb5], r: r_plate5_ohm}
      CR5: {C: [pb5, rt], c: c_res_f}
      RQ: {pot: ["0", rw, rt], r: r_res_pot_ohm, at: resonance}
      RFB: {R: [rw, f], r: r_feedback_ohm}
  - title: vca
    parts:
      CC2: {C: [k2, a3], c: c_couple2_f}
      RA3: {R: [a3, g3], r: r_vca_series_ohm}
      RG3: {R: [g3, vbias], r: r_vca_grid_ohm}
      RLEV: {pot: [nv, vbias, vlo], r: r_level_pot_ohm, at: level}
      RLEVLO: {R: [vlo, "0"], r: r_level_floor_ohm}
      CLEV: {C: [vbias, "0"], c: c_level_f}
      XV3: {device: [p3, g3, "0"], model: V3}
      RP3: {R: [b4, p3], r: r_plate3_ohm}
      CO: {C: [p3, out], c: c_out_f}
      RLO: {R: [out, "0"], r: r_out_load_ohm}
  - title: cutoff
    parts:
      RCUT: {pot: [neg, g4, "0"], r: r_cutoff_pot_ohm, at: cutoff}
      CCUT: {C: [g4, "0"], c: c_cutoff_f}
      XV4: {device: [p4, s4, g4, k4], model: V4}
      RS4: {R: [b1, s4], r: r_screen4_ohm}
      RK4: {R: [k4, "0"], r: r_cathode4_ohm}
