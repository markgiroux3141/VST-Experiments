  runout_oval_m: {value: 6.0e-5, source: "provisional: model knowledge (an oval warp from shrinkage)"}

listening:
  distance_m: {value: 1.0, source: "provisional: a listening position 1 m from the horn's mouth, on axis (a control)"}

numerics:
  fs_hz: {value: 192000.0, source: "numerical: the simulation rate (2x the project's 96 kHz; the contact resonates near 8 kHz)"}
  dx_max_m: {value: 0.008, source: "numerical: the ducts' longest section (the ladder's cut-off c / (pi dx) ~ 13.6 kHz)"}
  lead_in_s: {value: 0.3, source: "numerical: unmodulated groove before the program while the reproducer settles (trimmed)"}
