    leakage_mH:             {min: TBD, max: TBD, unit: mH, source: TBD}
    winding_resistance_ohm: {min: TBD, max: TBD, unit: ohm, source: TBD}
    winding_capacitance_pF: {min: TBD, max: TBD, unit: pF, source: TBD}
