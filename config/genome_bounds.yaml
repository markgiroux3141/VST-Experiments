# Genome bounds: every physical parameter the optimizer may vary.
#
# Schema: a parameter is any mapping that has a `source` key. It takes one of:
#   {min, max, source, unit?, notes?}   continuous range
#   {choices, source, notes?}           discrete choice
# Groups are plain nested mappings, and a parameter's ID is its dotted path,
# e.g. `tubes.v6386_a.emission_scale`.
#
# Rules (see VARIMU_PROJECT_PLAN.md, "Never fabricate data"):
#   - Every parameter has a `source`: a datasheet, schematic or cited paper.
#   - "TBD" is allowed for min/max/choices/source while a phase is in progress.
#     An invented number with no source is not.
#   - `uv run varimu genome-status` lists everything still unresolved.
#
# This is the Phase 0 skeleton. Values are filled in during Phases 1-3.

tubes:
  # Push-pull 6386 variable-mu gain stage. Multipliers apply to the parameters
  # fitted to the RCA 6386 datasheet in Phase 1.
  v6386_a:
    emission_scale: {min: 0.75, max: 1.05, unit: ratio, source: "provisional: model knowledge (cathode aging lowers emission; new tubes vary roughly +-5%)", notes: "multiplies plate current of the whole bank (4 triodes)"}
    mu_spread:      {min: 0.95, max: 1.05, unit: ratio, source: "provisional: model knowledge (grid-pitch manufacturing tolerance)", notes: "multiplies every section's mu"}
    grid_contact_v: {min: -1.0, max: -0.5, unit: V, source: "provisional: model knowledge (oxide-cathode contact potential)", notes: "onset of grid current; loads the timing networks"}
  v6386_b:
    emission_scale: {min: 0.75, max: 1.05, unit: ratio, source: "provisional: model knowledge (cathode aging lowers emission; new tubes vary roughly +-5%)", notes: "multiplies plate current of the whole bank (4 triodes)"}
    mu_spread:      {min: 0.95, max: 1.05, unit: ratio, source: "provisional: model knowledge (grid-pitch manufacturing tolerance)", notes: "multiplies every section's mu"}
    grid_contact_v: {min: -1.0, max: -0.5, unit: V, source: "provisional: model knowledge (oxide-cathode contact potential)", notes: "onset of grid current; loads the timing networks"}
  v5651:
    operating_v: {min: 82.0, max: 92.0, unit: V, source: "RCA 5651 (1948) and Sylvania (1955): operating voltage min 82 / av. 87 / max 92 V (data/datasheets/published_points.yaml)", notes: "the reference of the 240 V regulator; B+ ADJ trims the rail back"}
  instance:
    # Every tube (each 6386 triode, each section of the 12AX7 and 12BH7, the 6973s,
    # the regulator's EL34 and 6084, the GZ34): its own deviation, u in [-1, 1] times
    # passives.spread times these (the 6386s around their bank's values above).
    emission_pct: {min: 5.0, max: 20.0, unit: pct, source: "provisional: model knowledge (plate current spread of new tubes of one type at fixed bias)"}
    mu_pct:       {min: 1.0, max: 5.0, unit: pct, source: "provisional: model knowledge (grid-pitch tolerance)"}
  # Sidechain chain is 12AX7 -> 12BH7 -> push-pull 6973 -> diode bridge
  # (web: gearspace.com/threads/fairchild-tubes.463974; historyofrecording.com).
  # Per-instance spreads get added in Phase 3.

sidechain_rectifier:
  diode_type: {choices: [silicon, selenium], source: "web: https://historyofrecording.com/Tube_Equipment_Corporation.html says 'diode bridge rectifier'; type unknown", notes: "only silicon is modeled so far (config/devices/si_rectifier.yaml)"}

transformers:
  # The 670 has four per channel: T101 input, T102 output, T103 sidechain input,
  # T104 sidechain output (drawing A-96039). Each is windings on a
  # Jiles-Atherton core (Phase 2; varimu.devices.core, materials in
  # config/magnetics.yaml). Original turns ratios and core data aren't
  # published; the ratios bracket Sowter's replacement designs, and the
  # geometry is provisional, bounded around a nominal that gives the slice's
  # former inductances (config/circuits/fairchild_670.yaml, transformer notes).
  # Ratios use that file's convention. `turns` is the reference winding's.
  input:
    core_material:          {choices: [mumetall, permalloy_fluxgate, grain_oriented_si_steel], source: "web: https://www.don-audio.com/Sowter-8346E-Fairchild-Signal-amp-input-transformer-T101-201 (replacement: mumetal); materials: config/magnetics.yaml"}
    core_area_m2:           {min: 0.5e-4, max: 2.0e-4, unit: m2, source: "provisional: model knowledge (line input transformer cores; the replacement's can is 45 x 72 x 63 mm)"}
    core_path_m:            {min: 0.05, max: 0.10, unit: m, source: "provisional: model knowledge (E-I cores of that size)"}
    air_gap_m:              {min: 2.0e-6, max: 50.0e-6, unit: m, source: "provisional: model knowledge (butt joints of a stacked core: a few to tens of micrometres)"}
    turns:                  {min: 800, max: 2600, unit: turns, source: "provisional: model knowledge (nominal 1320 derived from the former 10 H primary with mumetall; the range spans 5-30 H at nominal geometry)", notes: "series primary"}
    turns_ratio:            {min: 4.0, max: 5.0, unit: ratio, source: "web: https://www.don-audio.com/Sowter-8346E-Fairchild-Signal-amp-input-transformer-T101-201 (replacement 1+1:9+9 -> 4.5); +-11% is provisional", notes: "each secondary half / series primary"}
    leakage_h:              {min: 0.5e-3, max: 20.0e-3, unit: H, source: "provisional: model knowledge (0.005-0.2% of the primary inductance; the nominal 2.5 mH meets the published +-1 dB to 15 kHz, see the circuit file)", notes: "referred to the primary. Above ~5 mH the secondary resonance peaks in the audio band"}
    winding_resistance_ohm: {min: TBD, max: TBD, unit: ohm, source: TBD}
    winding_capacitance_f:  {min: 50.0e-12, max: 200.0e-12, unit: F, source: "provisional: model knowledge (high-ratio input transformer secondaries)", notes: "per secondary half"}
    interwinding_capacitance_f: {min: 0.0, max: 100.0e-12, unit: F, source: "provisional: model knowledge (primary-secondary capacitance without an electrostatic screen, tens of pF; 0 = screened)"}
  output:
    core_material:          {choices: [grain_oriented_si_steel, mumetall, permalloy_fluxgate], source: "web: https://don-audio.com/Sowter-8344e-Fairchild-Signal-amp-output-transformer-T102-202 (replacement: M6, grain-oriented steel); materials: config/magnetics.yaml"}
    core_area_m2:           {min: 1.0e-4, max: 4.0e-4, unit: m2, source: "provisional: model knowledge (the replacement's can is 48.5 mm dia x 57 mm)"}
    core_path_m:            {min: 0.06, max: 0.12, unit: m, source: "provisional: model knowledge (E-I cores of that size)"}
    air_gap_m:              {min: 5.0e-6, max: 100.0e-6, unit: m, source: "provisional: model knowledge (butt joints of a stacked core, up to a deliberate 0.1 mm gap)"}
    turns:                  {min: 200, max: 700, unit: turns, source: "provisional: model knowledge (nominal 360 derived from the former 30 H per primary half)", notes: "series secondary; each primary half has turns_ratio times as many"}
    turns_ratio:            {min: 4.0, max: 5.0, unit: ratio, source: "web: https://don-audio.com/Sowter-8344e-Fairchild-Signal-amp-output-transformer-T102-202 (replacement 9+9:1+1 -> 4.5); +-11% is provisional", notes: "each primary half / series secondary"}
    leakage_h:              {min: 0.5e-3, max: 10.0e-3, unit: H, source: "provisional: model knowledge (around the slice's k = 0.999)", notes: "referred to the secondary"}
    winding_resistance_ohm: {min: TBD, max: TBD, unit: ohm, source: TBD}
    winding_capacitance_f:  {min: 100.0e-12, max: 500.0e-12, unit: F, source: "provisional: model knowledge (push-pull output transformer primaries)", notes: "per primary half"}
    interwinding_capacitance_f: {min: 0.0, max: 200.0e-12, unit: F, source: "provisional: model knowledge (output transformers without screen, tens to 100+ pF)"}
  sidechain_input:
    core_material:          {choices: [mumetall, permalloy_fluxgate, grain_oriented_si_steel], source: "web: https://www.sowter.co.uk/acatalog/VINTAGE-COMPRESSOR-TRANSFORMERS-A-to-K.html (replacement 8345E: mumetal core); materials: config/magnetics.yaml"}
    core_area_m2:           {min: 0.2e-4, max: 1.0e-4, unit: m2, source: "provisional: model knowledge (small signal transformer cores)"}
    core_path_m:            {min: 0.03, max: 0.08, unit: m, source: "provisional: model knowledge"}
    air_gap_m:              {min: 2.0e-6, max: 50.0e-6, unit: m, source: "provisional: model knowledge (butt joints)"}
    turns:                  {min: 700, max: 2400, unit: turns, source: "provisional: model knowledge (nominal 1215 derived from the former 5 H primary with mumetall)", notes: "primary"}
    turns_ratio:            {min: 7.5, max: 9.5, unit: ratio, source: "web: https://www.sowter.co.uk/acatalog/VINTAGE-COMPRESSOR-TRANSFORMERS-A-to-K.html (replacement 8345E 600/170k, 17+17:1+1 -> 8.5); +-12% is provisional", notes: "each secondary half / series primary; sets the AC threshold range"}
    leakage_h:              {min: 2.0e-3, max: 30.0e-3, unit: H, source: "provisional: model knowledge (around the slice's k = 0.999; the nominal 5 mH keeps the 8.5 ratio flat to 20 kHz, see the circuit file)", notes: "referred to the primary. Above ~8 mH the sidechain loses HF in band (10 mH: -2 dB at 15 kHz)"}
    winding_resistance_ohm: {min: TBD, max: TBD, unit: ohm, source: TBD}
    winding_capacitance_f:  {min: 50.0e-12, max: 200.0e-12, unit: F, source: "provisional: model knowledge (secondaries of a small step-up transformer)", notes: "per secondary half"}
  sidechain_output:
    core_material:          {choices: [grain_oriented_si_steel, mumetall, permalloy_fluxgate], source: "web: https://don-audio.com/9643S-Fairchild-Control-amp-output-T104-204 (replacement: M6 cored); materials: config/magnetics.yaml"}
    core_area_m2:           {min: 2.0e-4, max: 8.0e-4, unit: m2, source: "provisional: model knowledge (the replacement weighs 1.2 kg)"}
    core_path_m:            {min: 0.08, max: 0.16, unit: m, source: "provisional: model knowledge (E-I cores of that size)"}
    air_gap_m:              {min: 5.0e-6, max: 100.0e-6, unit: m, source: "provisional: model knowledge (butt joints, up to a deliberate 0.1 mm gap)"}
    turns:                  {min: 350, max: 1300, unit: turns, source: "provisional: model knowledge (nominal 670 derived from the former 10 H per primary half)", notes: "each primary half"}
    turns_ratio:            {min: 0.4, max: 0.6, unit: ratio, source: "web: https://don-audio.com/9643S-Fairchild-Control-amp-output-T104-204 (replacement 10k CT:600, 4:1 -> 0.5); +-20% is provisional", notes: "secondary / one primary half"}
    leakage_h:              {min: 5.0e-3, max: 60.0e-3, unit: H, source: "provisional: model knowledge (around the slice's k = 0.999)", notes: "referred to a primary half"}
    winding_resistance_ohm: {min: TBD, max: TBD, unit: ohm, source: TBD}
    winding_capacitance_f:  {min: 100.0e-12, max: 500.0e-12, unit: F, source: "provisional: model knowledge (push-pull primaries)", notes: "per primary half"}

sidechain_threshold:
  # The AC THRESHOLD dual tapped pot (R115A/B) and R113/R114 off its taps
  # (config/circuits/fairchild_670.yaml, "AC threshold"). Neither the tap's
  # position nor R115B's value is settled by the drawing.
  pot_tap:   {min: 0.3, max: 0.7, unit: ratio, source: "web: https://groupdiy.com/threads/whats-this-symbol-in-the-fairchild-670-diagram.35361/ (CJ: 'i think it would have to be a 50% tap'); the range is provisional: model knowledge (taps of the era's tapped pots sat around mid-track)", notes: "fraction of each section's track from its centre-line end"}
  r115b_ohm: {choices: [100.0e+3, 180.0e+3], unit: ohm, source: "sch: R115B printed 180K on this scan of A-96039; web: same thread (the original manual reads 'a dual 100k lin tapped pot'; '180k on some prints')"}

psu:
  # Shared by the audio path and sidechain (plan: Coupling Checklist). The
  # topology and the printed values are traced on A-96039
  # (data/schematics/fairchild_670/README.md, "Supply rails"); these are what
  # the drawing doesn't print. Replacement-part specs (Sowter) are a reference
  # point, not the originals.
  t302_hv_half_rms_v: {min: 360.0, max: 420.0, unit: V, source: "provisional: model knowledge (open-circuit rms per HV half, around the replacement's 375-0-375 V at 200 mA: web: https://www.sowter.co.uk/specs/0526.htm)", notes: "the unregulated rail must stay near the printed 420-450 V"}
  t302_r_half_ohm:    {min: 20.0, max: 150.0, unit: ohm, source: "provisional: model knowledge (HV winding resistance per half of a ~100 VA mains transformer)"}
  t302_leakage_h:     {min: 1.0e-3, max: 20.0e-3, unit: H, source: "provisional: model knowledge (leakage per HV half)"}
  t302_winding_capacitance_f: {min: 100.0e-12, max: 1.0e-9, unit: F, source: "provisional: model knowledge (self-capacitance of a mains transformer's HV half)"}
  l301_h:             {min: 5.0, max: 15.0, unit: H, source: "web: https://www.sowter.co.uk/acatalog/VINTAGE-COMPRESSOR-TRANSFORMERS-A-to-K.html (replacement 10 H at 200 mA); +-50% is provisional"}
  l301_r_ohm:         {min: 40.0, max: 200.0, unit: ohm, source: "web: same page (replacement 71 ohms); the range is provisional (era chokes of that inductance ran to ~200 ohm)"}
  t301_rms_v:         {min: 24.0, max: 29.0, unit: V, source: "web: https://www.sowter.co.uk/specs/0531.htm (replacement 26.8 V for the selenium bridge, 24 V tap for silicon); range provisional", notes: "the R303 end must stay near the printed -13 to -14.5 V"}
  t301_r_ohm:         {min: 0.3, max: 3.0, unit: ohm, source: "provisional: model knowledge (small 0.5 A transformer)"}
  t301_leakage_h:     {min: 0.1e-3, max: 5.0e-3, unit: H, source: "provisional: model knowledge"}
  l302_h:             {min: 1.5, max: 5.0, unit: H, source: "web: Sowter replacement 5 H (same catalog page); a Drip 670 bias choke is reportedly 1.5 H (GroupDIY search snippet, 2026-10-21)"}
  l302_r_ohm:         {min: 85.0, max: 350.0, unit: ohm, source: "web: 85 ohm is Sowter's replacement (catalog page above); the measured -6.2 V at C303 (https://groupdiy.com/threads/fairchild-670-questions.32169/) needs ~284 ohm (scripts/calibrate_psu.py); 350 is provisional headroom", notes: "sets the 6386 cathode return: with the grid bias, the stage's standing current"}
  gr301_cell_area_in2: {min: 0.5, max: 1.6, unit: in2, source: "provisional: Sarkes Tarzian handbook (1950) cell sizes 1-inch (size 2) to 1.25-inch (size 3) square, and an unknown effective area per plate"}

passives:
  # Per-instance deviation from nominal, drawn independently for every part and tube
  # (config/circuits/fairchild_670.yaml, "Per-instance tolerance and mismatch"):
  # u in [-1, 1] from default_rng([seed, crc32(designator)]), times spread, times the
  # part's band. Resistor bands are printed (1%, 5%, 10% by note 1); these are the rest.
  seed:                   {min: 0, max: 2147483647, unit: seed, source: "numerical: which set of parts a unit is built from"}
  spread:                 {min: 0.0, max: 1.0, unit: ratio, source: "provisional: fraction of each band the draws span (1 = parts anywhere within tolerance)"}
  pot_pct:                {min: 10.0, max: 20.0, unit: pct, source: "provisional: model knowledge (track resistance tolerance of the era's pots)"}
  attenuator_pct:         {min: 1.0, max: 5.0, unit: pct, source: "provisional: model knowledge (precision step attenuator resistors)"}
  paper_capacitor_pct:    {min: 10.0, max: 20.0, unit: pct, source: "provisional: model knowledge (1950s paper and oil capacitors)"}
  mica_capacitor_pct:     {min: 5.0, max: 20.0, unit: pct, source: "provisional: model knowledge (high-voltage mica or ceramic)"}
  electrolytic_minus_pct: {min: 10.0, max: 20.0, unit: pct, source: "provisional: model knowledge (1950s electrolytics)"}
  electrolytic_plus_pct:  {min: 50.0, max: 100.0, unit: pct, source: "provisional: model knowledge (1950s electrolytics)"}
