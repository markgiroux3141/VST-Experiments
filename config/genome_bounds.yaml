    c_hb_5n6_f:   {min: 5.0e-9, max: 6.2e-9, unit: F, source: "provisional: redraw 5.6nF +-10%"}
    c_hb_3n3_f:   {min: 3.0e-9, max: 3.6e-9, unit: F, source: "provisional: redraw 3.3nF +-10%"}
    l_hb_150m_h:  {min: 0.140, max: 0.160, unit: H, source: "web: vendor's original tap 150.5 mH and recalculation 156 mH; redraw 150 mH"}
    l_hb_82m_h:   {min: 0.078, max: 0.092, unit: H, source: "web: vendor 84.3 / 87.9 mH; redraw 82 mH"}
    l_hb_68m_h:   {min: 0.064, max: 0.072, unit: H, source: "web: vendor 67.5 mH; redraw 68 mH"}
    l_hb_47m_h:   {min: 0.045, max: 0.053, unit: H, source: "web: vendor 48.2 / 51.1 mH; redraw 47 mH"}
    l_hb_33m_h:   {min: 0.030, max: 0.035, unit: H, source: "web: vendor 31.4 / 32.0 mH; redraw 33 mH"}
    l_hb_27m_h:   {min: 0.025, max: 0.031, unit: H, source: "web: vendor 29.9 mH; redraw 27 mH"}
