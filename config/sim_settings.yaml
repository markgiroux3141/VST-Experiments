# Simulation and signal settings.
#
# These are numerical / engineering choices, not physical data, so they carry no
# `source` field. Leave a comment saying why whenever you change one.

sample_rate: 96000   # Hz. Test signals, renders and simulation output all use this rate.
seed: 0              # Default seed for anything stochastic (test signals, genome sampling).

audio:
  # Circuit volts (peak) at the unit's input terminals that correspond to
  # 0 dBFS. Test signals are defined in dBFS; this calibration is applied by the
  # simulation layer. 13.80 V = +22 dBu peak-sine-equivalent, i.e. the common
  # studio alignment -18 dBFS = +4 dBu (0.775 V * 10^(22/20) * sqrt(2)). The
  # same scale converts the output back to dBFS. The front-panel input control
  # sets how hard that drives the unit, so this is a convention, not physics.
  full_scale_volts_peak: 13.80

simulator:
  primary: TBD       # xyce | ngspice. Decided after Phase 2 (see plan: Open Decisions).
  fallback: ngspice
  # Which engine renders (varimu render, the listen app, slice_report.py):
  # circuitsim, the fast Rust engine (docs/CIRCUIT_SIM_PLAN.md; default since
  # M6, 2026-10-21: 5-6x faster than ngspice, and closer to the converged
  # solution), or ngspice, the reference it is verified against
  # (`scripts/slice_report.py --verify`). circuitsim needs the `fast` extra;
  # without it renders stop with a message instead of falling back.
  engine: circuitsim

circuitsim:
  # Fixed-step engine settings; the `transient` block below is ngspice's.
  #
  # Chosen from the M4 method study (2026-10-15, CIRCUIT_SIM_PLAN.md, M4):
  # esdirk4 (4th order, L-stable) at 2x, the input interpolated to 5th order
  # at its stage times, and local error control: a step whose embedded error
  # estimate exceeds error_abstol + error_reltol * |v| on any node is redone
  # as halves (output stays on the sample grid).
  # - Smooth dynamics: the small-signal response matches ngspice .ac to
  #   -63 dB up to 20 kHz (0.00 dB / 0.04 deg; trapezoidal at 4x:
  #   0.18 dB / 2 deg). The slice's provisional ~17 kHz transformer resonance
  #   is what trapezoidal's frequency warping trips on.
  # - Switching (bridge diodes on HF, grid conduction): no method's order
  #   helps there; the error control subdivides just those steps.
  # vs the converged solution, 6 excerpts: -64 dB rms or better (CCIF 19+20
  # kHz at -10 dBFS -64, multitone -70, SMPTE 0 dBFS -71, burst -86, clip
  # -83), costing 1.0-1.1x the uncontrolled run on typical material, 1.4x on
  # the multitone, 2.6x on CCIF. Fixed 4x (no control) costs ~1.7x everywhere
  # and reaches -59 dB on CCIF; it's the fallback if real time needs a fixed
  # cost (M8).
  oversample: 2
  method: esdirk4        # trap | euler | trbdf2 | sdirk3 | esdirk4 | radau3 | radau5
  input_order: 5         # 1 | 3 | 5: input interpolation at stage times (not used by trap)
  error_abstol: 0.01     # V; 0 turns error control off (esdirk4 only)
  error_reltol: 0.001
  # Solver (circuit-sim plan, M5): nodal DK, Newton on the 22 device ports with
  # the linear part folded into a state-space system per step size, the
  # factored Newton matrix reused until convergence slows, and devices whose
  # ports barely moved not re-evaluated. `mna` is M3-M4's full-MNA Newton, the
  # reference DK is tested against (same results within the Newton tolerance).
  # Newton stops when no port voltage moves by more than newton_reltol * |v| +
  # newton_vntol: 10x tighter than the local error tolerance above (Hairer &
  # Wanner's kappa ~ 0.1). Measured 2026-10-17 on the M4 excerpts (burst,
  # sweep, CCIF, multitone, arpeggio clip) vs the converged solution: the
  # same error at 1e-6, 1e-4 and 1e-3 (to 0.3 dB); 1e-4 / 1e-3 V runs the
  # program clip and bursts ~1.5x faster than 1e-6.
  solver: dk             # dk | mna
  newton_reltol: 1.0e-4
  newton_vntol: 1.0e-3   # V
  newton_reuse: true

transient:
  # Input is band-limited upsampled by this factor before simulation, and the
  # output is decimated with an anti-alias filter (see varimu/sim/io.py). The
  # max timestep is 1 / (oversample * sample_rate).
  #
  # Chosen from scripts/tolerance_study.py (2026-10-13, reports/slice/
  # tolerance_study.json): against gear/reltol 1e-4/4x, trap/1e-3/2x is off by
  # -65 dB (0 dBFS burst attack) and -67 dB (program clip) re signal, CV within
  # 0.12 V, at ~31-37x real time. gear/1e-3/2x: -63/-59 dB at similar speed.
  # 1x oversampling: -53/-49 dB and barely faster. reltol 1e-5 fails to start
  # ("timestep too small" at a bridge diode). If trap ever collapses its step
  # (it did while the netlist had a parasitic oscillation), use gear.
  oversample: 2
  method: trap           # trap | gear
  reltol: 1.0e-3         # SPICE default
  abstol: 1.0e-12        # SPICE default
  vntol: 1.0e-6          # SPICE default

runner:
  # Keep the machine usable while renders run.
  threads_per_job: 1          # ngspice OpenMP threads; spinit's default (8) spins every core
  # normal | below_normal | idle: OS scheduling class of each ngspice process,
  # and of each thread running circuitsim (in-process, GIL released; Windows
  # only, where below_normal gives both the same base priority).
  priority: below_normal
  max_parallel_jobs: null     # null -> cpu_count - 2 (at least 1)

devices:
  # How triode plate currents reach SPICE. "table": an XSPICE table2D of the
  # Python model, regenerated per instance (the 6386 runs ~20x faster; bilinear
  # error 1e-4 of max current or better, see varimu/devices/table.py).
  # "exact": the analytic behavioral expressions (slow; for verification).
  triode_formulation: table
