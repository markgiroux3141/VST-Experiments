# A 13 in tom's batter head alone, struck by a stick (docs/DRUM_PLAN.md, D1's first test;
# varimu/drums/membrane.py). The head in vacuo: no shell, no resonant head, no air load
# (the next step), so f01 is the bare head's and sets its tension (the drummer's tuning).
# Its anchor: a 33 cm tom's fundamental ~8% above its final value after a hard blow,
# gliding down within ~0.2 s (Rossing, in the Springer Handbook of Systematic Musicology,
# 2018, ch. 9, citing its ref. 9.13; web: https://doi.org/10.1007/978-3-662-55004-5_9).

head:
  radius_m: {value: 0.1651, source: "provisional: model knowledge (a 13 in tom, the head's playing radius taken as the nominal 6.5 in)"}
  thickness_m: {value: 0.000254, source: "provisional: model knowledge (a single-ply 10 mil batter, e.g. Remo Ambassador)"}
  density_kg_m3: {value: 1390.0, source: "web: DuPont Teijin Films, Mylar bulletin H-37232-3, Table 1, 1.390 g/cm3 (ASTM D1505), https://people.physics.carleton.ca/~msd/tpc_archival_reports/results_2004/docs/mylar.pdf"}
  youngs_pa: {value: 3.7e9, source: "web: DuPont Teijin Films, Mylar A 50-125 um product information, 125 um: 3600 MPa MD, 3800 MPa TD (ASTM D882), their mean, https://media.easycomposites.co.uk/datasheets/Mylar_A_50_to_125mic.pdf"}
  poisson: {value: 0.38, source: "web: DuPont Teijin Films, Mylar bulletin H-37232-3, 'typically 0.38 before yield', https://people.physics.carleton.ca/~msd/tpc_archival_reports/results_2004/docs/mylar.pdf"}
  loss_factor: {value: 0.015, source: "provisional: model knowledge (PET film's tan delta at room temperature and audio frequencies, ~0.01-0.02)"}
  f01_hz: {value: 120.0, source: "provisional: model knowledge (a mid tuning for a 13 in tom; a control)"}

beater:
  mass_kg: {value: 0.011, source: "provisional: a 5A stick as a uniform rod (~45 g, 40 cm) pivoting at the fulcrum ~13 cm from the butt: I / L_tip^2"}
  face_radius_m: {value: 0.004, source: "provisional: model knowledge (a wood tip's contact patch on the head)"}
  stiffness: {value: 2.8e8, source: "provisional: Hertz, K = 4/3 E* sqrt(R): hickory (E ~15 GPa) on Mylar (3.7 GPa), a 4 mm tip radius"}
  exponent: {value: 1.5, source: "provisional: Hertz contact"}
  hysteresis_s_m: {value: 0.05, source: "provisional: model knowledge (Hunt-Crossley damping of a hard contact)"}

strike:
  strike_radius_m: {value: 0.03, source: "provisional: model knowledge (a stroke a little off centre; a control)"}

mic:
  mic_distance_m: {value: 1.0, source: "provisional: a listening position (a control)"}
  mic_angle_deg: {value: 30.0, source: "provisional: a listening position off the axis, where the m > 0 modes radiate (a control)"}

air:
  air_density_kg_m3: {value: 1.204, source: "provisional: model knowledge (dry air at 20 C, 1 atm)"}
  sound_speed_m_s: {value: 343.0, source: "provisional: model knowledge (dry air at 20 C)"}

# The drum around the head (varimu/drums/drum.py): a resonant head of the same film, the
# shell's depth, the mic's angle from the drum's axis out of the resonant head (180: out
# of the batter head).
resonant:
  thickness_m: {value: 0.000254, source: "provisional: model knowledge (a single-ply 10 mil resonant head, e.g. a clear Remo Ambassador)"}
  density_kg_m3: {value: 1390.0, source: "web: DuPont Teijin Films, Mylar bulletin H-37232-3, Table 1, 1.390 g/cm3 (ASTM D1505), https://people.physics.carleton.ca/~msd/tpc_archival_reports/results_2004/docs/mylar.pdf"}
  youngs_pa: {value: 3.7e9, source: "web: DuPont Teijin Films, Mylar A 50-125 um product information, 125 um: 3600 MPa MD, 3800 MPa TD (ASTM D882), their mean, https://media.easycomposites.co.uk/datasheets/Mylar_A_50_to_125mic.pdf"}
  poisson: {value: 0.38, source: "web: DuPont Teijin Films, Mylar bulletin H-37232-3, 'typically 0.38 before yield', https://people.physics.carleton.ca/~msd/tpc_archival_reports/results_2004/docs/mylar.pdf"}
  loss_factor: {value: 0.015, source: "provisional: model knowledge (PET film's tan delta at room temperature and audio frequencies, ~0.01-0.02)"}
  f01_hz: {value: 120.0, source: "provisional: model knowledge (the resonant head tuned like the batter, in vacuo; a control)"}

body:
  depth_m: {value: 0.2286, source: "provisional: model knowledge (a 13 x 9 in rack tom)"}
  mic_angle_deg: {value: 150.0, source: "provisional: a listening position 1 m out over the batter head, 30 deg off the axis (a control)"}
  f_coupled_hz: {value: 3000.0, source: "numerical: below it both heads and the air are one coupled system, above it each head's modes on their own with the air's mass (drum.py _blocks; the cut's effect is in reports/drums/)"}

numerics:
  f_max_hz: {value: 6000.0, source: "numerical: the highest mode simulated (above it the stick's patch and the losses leave little)"}
  full_scale_pa: {value: 100.0, source: "numerical: the WAVs' 0 dBFS, 100 Pa peak (134 dB SPL)"}
