# Rust workspace. crates/circuitsim is the fast circuit simulator
# (docs/CIRCUIT_SIM_PLAN.md); varimu-circuit and varimu-app are the native app
# (docs/NATIVE_APP_PLAN.md).
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
publish = false

# Tests run the full 670 through Newton (tests/dk.rs); unoptimized that takes
# minutes. Debug assertions stay on.
[profile.test]
opt-level = 3
