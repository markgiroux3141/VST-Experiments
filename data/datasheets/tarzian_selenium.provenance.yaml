notes: >-
  Text (printed p.55): threshold 0.25 V at +75 C to 0.55 V at -55 C. Ratings (printed
  p.61-62): 26 V rms per cell; the full-wave bridge for max 26 V AC input uses one cell
  per arm (code 1B1); 1-inch-square cells (size 2) 0.225 A continuous in a bridge, 80% of
  that into a capacitor. Reverse current (Fig. 6) about 1 mA/in^2 at 50-100 Hz, at an
  unstated voltage; not modeled.
