estimated_error: "+-0.4 dB, +-3% in frequency"
files:
  ampex_351_response_15ips.csv:
    figures: >-
      p94 (8-21 / 8-22), "Applicable response curves", 15 ips NAB: RECORD (one curve below
      2 kHz, then MAXIMUM / TYPICAL / MINIMUM to 15 kHz) and REPRODUCE
    columns: >-
      curve (record: all three below 2 kHz; record_maximum / _typical / _minimum: above it,
      where they part; reproduce), f_hz, db (as printed: the record curves are 0 dB over
      ~200 Hz-2 kHz, the reproduce curve's 0 dB falls near 500 Hz)
    notes: >-
      Note 1 on the page: "Record curves shown are approximate and will vary with tape to
      maintain flat overall response" (the HF trimmer 1C7's range). These are the
      electronics' responses (record: input to head current; reproduce: head to output),
      measured on Ampex's machines, not the tape's.
