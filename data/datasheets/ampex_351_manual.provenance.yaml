digitized_with: >-
  pdftoppm render of PDF page 95-index p94 (printed 8-21 / 8-22) at 300 dpi, the 15 ips NAB
  panels cropped; the curves read by eye against the printed grid (record: 0 dB at the
  +10 / +5 / 0 labels, ~13.7 px per dB; reproduce: +20..-30 dB, ~13.4 px per dB; ~400 px
  per decade, the 20 / 100 / 1000 / 10000 Hz lines)
digitized_by: Claude Code
