scan_source: "web: https://frank.pocnet.net/sheets/009/e/E83F.pdf"
other_copies: >-
  Philips Electronic Tube Handbook E83F, sheets 1958-06 / 1962-08, curves 1957-09
  (web: https://frank.pocnet.net/sheets/030/e/E83F.pdf, sha256
  dd640274201cc0fb23351af4f4c7c0402751c66cfe922d54d06cea858eaa1424): the same figures (7Z04011-14)
