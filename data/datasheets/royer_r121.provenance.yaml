digitized_with: >-
  the embedded image's pixels (pymupdf extract_image). The chart's vertical rules are not a uniform
  log scale, so the frequency axis is log-interpolated between its printed labels, each at its
  nearest rule (20 Hz x 61, 50 at 150.5, 100 at 289, 500 at 454.5, 1000 at 635.5, 5K at 828.5,
  10K at 1046, 20K at 1273; the labels' centres found as dark blobs under the chart); level axis:
  the rules every 5 dB, 31.5 px each, 0 dB at y 98.5. The thick trace read as the median centre of
  dark runs >= 4 px (the rules are 1-2 px) in 7 columns at each frequency; 20 Hz not readable
  (the trace's start), 25 Hz and 17-18 kHz coarse. Re the 1 kHz reading. Frequencies between
  labels may be off by up to ~10% (the rules' irregular spacing).
