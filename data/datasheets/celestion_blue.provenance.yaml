device: Celestion Blue (G12 T530 "Alnico Blue")
document: >-
  Two Celestion sheets of the current Blue (Celestion's recreation of the G12 T530 fitted to the
  Vox AC30), one curve each: (a) "Guitar Speakers Celestion Blue, 12-inch classic alnico guitar
  speaker", Celestion's current web sheet; (b) "Alnico Celestion Blue", a 2019 Celestion sheet.
  Both 15 W, 8 or 15 ohm; both plots are the 8 ohm unit's
publisher: Celestion International Ltd (Claydon Business Park, Great Blakenham, Ipswich)
date: >-
  No date printed on either sheet. PDF metadata: (a) generated on request by celestion.com (TCPDF
  6.4.4), downloaded copy dated 2026-11-12 in its metadata; (b) created 2019-04-30 (PDFlib Lite
  7.0.5p3), modified 2020-02-07
local_copy:
  current: ../schematics/vox_ac30/celestion_blue_current.pdf
  sheet_2019: ../schematics/vox_ac30/celestion_blue_2019.pdf
