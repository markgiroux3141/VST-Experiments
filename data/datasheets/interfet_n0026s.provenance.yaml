notes: >-
  A modern process (2019) standing for the Minimoog's 1970s 2N4303s (Fig 9-7's Q10 / Q13): the JEDEC
  type's limits are the anchor, the curves one typical unit inside them. The same sheet's typical
  IDSS - VGS(OFF) line puts the 2N4303's 4-10 mA at VGS(off) ~-2 to ~-3.4 V; the chart's -2.5 V is in it.
  Typical Ciss 4.3 pF, Crss 1.0 pF (VDS 15 V, VGS 0, 1 MHz), IGSS 10 pA (VGS -20 V).
