notes: >-
  The graph's conditions (strip thickness, frequency) aren't printed; its mu_a at 0.4 A/m
  (~90,000) is above the table's mu4 (60,000, static, 1.00 mm), so the graph is used for
  the shape of the low-field (Rayleigh) region, mu_a = mu_i (1 + r H): a straight-line fit
  over 0.1-0.6 A/m gives r ~ 2.8 per A/m (mu_i ~ 42,000, nu ~ 119,000 per A/m). An
  independent DC ring measurement of 1J85 permalloy (80Ni-5Mo, mumetal's class) gives
  B = 0.3001 H^2 + 0.0906 H (T, A/m): mu_i 72,097, r = 3.3 per A/m (web:
  https://pmc.ncbi.nlm.nih.gov/articles/PMC9608087, Materials 15 (2022) 7353).
