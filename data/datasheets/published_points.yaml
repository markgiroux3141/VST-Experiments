# Tabulated values transcribed from datasheets (not digitized curves).
# Units: V, A, S (siemens), ohm, F.

"6386":
  source: "GE ET-T1113 (8-54) p.1-2; local copy sources/ge_6386_ET-T1113.pdf"
  class_a1:   # each section
    vp_v: 100
    rk_ohm: 200
    mu: 17
    rp_ohm: 4250
    gm_s: 4.0e-3
    ip_a: 9.6e-3
  gm_100umho_at:   # "Grid voltage, approximate, Gm = 100 micromhos"
    vp_v: 100
    vg_v: -16
    gm_s: 1.0e-4
  capacitances_f:  # without external shield, each section
    gp: 1.2e-12
    input: 2.0e-12
    output: 1.1e-12
  max_ratings:
    vp_v: 300
    pd_w: 1.5
    ik_a: 18.0e-3
  heater: {v: 6.3, a: 0.35}

"6201":
  # The Ampex 351's record driver 1V2 (TAPE_PLAN.md TM5): "a 'premium' version of the 12AT7".
  source: "RCA 6201 TENTATIVE DATA 1 (10-56) p.1; local copy sources/rca_6201_1956.pdf (web: https://frank.pocnet.net/sheets/049/6/6201.pdf)"
