    - {vb_v: 250, ra_ohm: 0.1e+6, rg1_ohm: 1.0e+6, rg1_next_ohm: 1.0e+6, rk_ohm: 1200, ik_a: 1.5e-3, gain: 29, thd_pct: [0.6, 0.7, 1.0], derived_vak_v: 98.2, derived_vgk_v: -1.80}
    - {vb_v: 100, ra_ohm: 0.2e+6, rg1_ohm: 1.0e+6, rg1_next_ohm: 1.0e+6, rk_ohm: 4500, ik_a: 0.28e-3, gain: 27, thd_pct: [1.0, 1.5, 1.8], derived_vak_v: 42.7, derived_vgk_v: -1.26}
    - {vb_v: 100, ra_ohm: 0.1e+6, rg1_ohm: 1.0e+6, rg1_next_ohm: 1.0e+6, rk_ohm: 2500, ik_a: 0.48e-3, gain: 26, thd_pct: [1.0, 1.7, 2.2], derived_vak_v: 50.8, derived_vgk_v: -1.20}
  noise: "p.333: equivalent noise voltage at g1 ca. 2 uV, 25-10,000 Hz, Ub 250 V, Ra 100 kOhm, peak noise voltmeter with ear filter to CCIF 1949"
