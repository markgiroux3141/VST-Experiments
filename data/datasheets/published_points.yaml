"EF804S":
  source: "Telefunken EF 804 S data sheet, handbook p.331-334 (page codes 010163 / 020163); local copy sources/telefunken_ef804s.pdf (web: https://frank.pocnet.net/sheets/128/e/EF804S.pdf). AEG's EF 804 S sheet (März 1960, web: https://frank.pocnet.net/sheets/173/e/EF804S.pdf) prints the same values"
  class_a1:           # p.331 'Meßwerte': supply Uba 250 V, Ug3 0, supply Ubg2 140 V, Rk 500 ohm (cathode ~1.9 V)
    vp_v: 250
    vg3_v: 0
    vg2_v: 140
    rk_ohm: 500
    ip_a: 3.2e-3      # +-0.6 mA
    ig2_a: 0.6e-3     # +-0.15 mA
    gm_s: 2.0e-3      # +-0.4 mA/V
    rp_ohm: 2.0e+6
    mu_g2g1: 38
    ig1_neg_max_a: 0.1e-6
    vg1_grid_current_onset_v: -1.3   # Ug1e, at Ig1 <= +0.3 uA
  end_of_life: {ip_a: 2.0e-3, gm_s: 1.4e-3, ig1_neg_a: 1.0e-6}   # p.331: Ia fallen to 2 mA, S to 1.4 mA/V, -Ig risen to > 1 uA
  # p.332 'Betriebswerte', resistance-coupled amplifier (Rg2 from Ub, Rk bypassed 50 uF, g2 0.5 uF);
  # thd_pct at 4 / 8 / 12 V rms out. The derived_* electrode voltages are arithmetic on the printed
  # values (Va = Ub - Ia Ra, Vg2 = Ub - Ig2 Rg2, Vk = (Ia + Ig2) Rk, grid at 0 V), not printed.
  rc_amplifier:
