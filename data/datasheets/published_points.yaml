# --- Power supply devices (Phase 3, transcribed 2026-10-21) ---

"EL34":
  source: "Mullard EL34 sheets D1-D5 (1960-64); local copy sources/mullard_el34.pdf (web: frank.pocnet.net)"
  triode_connected:   # sheet D1: "Triode connection (g2 connected to a)"
    va_v: 250
    vg1_v: -15.5
    ia_a: 70.0e-3
    gm_s: 11.5e-3
    ra_ohm: 910
    mu: 10.5
  capacitances_f:     # pentode connection (sheet D1); none printed for triode connection
    input: 15.2e-12
    output: 8.4e-12
    ag1: 1.0e-12
  max_ratings: {va_v: 800, pa_w: 25, ik_a: 0.150, rg1k_ohm: 500.0e+3, vhk_v: 100}
  heater: {v: 6.3, a: 1.5}
  pins: "1 g3, 2 h, 3 a, 4 g2, 5 g1, 6 NC, 7 h, 8 k (octal)"

"6084":
  source: "Philips E80F / 6084 data handbook, Dec 1968, p.2-4; local copy sources/philips_e80f_1968.pdf (web: frank.pocnet.net)"
  class_a1:           # nominal: Va 250, Vg3 0, Vg2 100, Rk 550
    vp_v: 250
    vg2_v: 100
    ip_a: 3.0e-3
    ig2_a: 0.65e-3
    gm_s: 1.85e-3
    rp_ohm: 1.5e+6
    mu_g2g1: 25
  cutoff: {vp_v: 250, vg2_v: 100, vg1_v: -7.5, ip_a: 20.0e-6}   # Ia max at -Vg1 = 7.5 V
  capacitances_f:     # with external shield
    input: 5.0e-12
    output: 7.3e-12
    ag1: 0.025e-12
  max_ratings: {va_v: 300, pa_w: 1.3, vg2_v: 200, pg2_w: 0.4, ik_a: 9.0e-3}
  pins: "1 g2, 2 internal shield, 3 k, 4 f, 5 f, 6 a, 7 internal shield, 8 g3, 9 g1 (noval)"

"5651":
  source: "RCA 5651 Voltage-Reference Tube, tentative data, Mar. 15, 1948; local copy sources/rca_5651.pdf (web: frank.pocnet.net); Sylvania (Feb 1955) prints the same figures"
  starting_v: {av: 107, max: 115}
  operating_v: {min: 82, av: 87, max: 92}
  operating_current_a: {min: 1.5e-3, max: 3.5e-3}
  regulation_v_max: 3.0       # over 1.5-3.5 mA
  regulation_v_av: 1.5        # Tung-Sol 5651 (May 1958), local copy sources/tungsol_5651.pdf
  shunt_capacitor_max_f: 0.02e-6
  pins: "1, 5 anode; 2, 4, 7 cathode; 3, 6 internal (5BO). Pins 2 and 7 are interconnected cathode pins (RCA 5651A sheet: any interconnected pair can be used as a jumper)"

"SELENIUM":
  source: "Sarkes Tarzian Selenium Rectifier Handbook (1950), printed p.52-62; local copy sources/tarzian_selenium_1950.pdf (web: americanradiohistory.com)"
  rms_v_per_cell_max: 26
  bridge_26vac_cells_per_arm: 1     # stack code 1B1, max 26 V AC input
  cell_sizes_in: {"1": 0.48, "2": 1.0, "3": 1.25, "4": 1.6}   # square cells, side
  bridge_dc_a: {"2": 0.225, "3": 0.45}    # continuous, 45 C; 80% of this into a capacitor
  capacitance_f_per_in2: [0.10e-6, 0.15e-6]   # printed p.54

