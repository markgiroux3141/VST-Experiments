    - {vb_v: 100, ra_ohm: 0.3e+6, rg2_ohm: 1.2e+6, rg1_ohm: 1.0e+6, rg1_next_ohm: 1.0e+6, rk_ohm: 5000, ip_a: 0.21e-3, ig2_a: 0.045e-3, gain: 125, thd_pct: [1.1, 1.7, 2.6], derived_vak_v: 35.7, derived_vg2k_v: 44.7, derived_vgk_v: -1.28}
    - {vb_v: 100, ra_ohm: 0.2e+6, rg2_ohm: 1.0e+6, rg1_ohm: 1.0e+6, rg1_next_ohm: 1.0e+6, rk_ohm: 3000, ip_a: 0.29e-3, ig2_a: 0.055e-3, gain: 120, thd_pct: [1.1, 1.6, 2.5], derived_vak_v: 41.0, derived_vg2k_v: 44.0, derived_vgk_v: -1.03}
    - {vb_v: 100, ra_ohm: 0.2e+6, rg2_ohm: 1.2e+6, rg1_ohm: 10.0e+6, rg1_next_ohm: 0.7e+6, rk_ohm: 0, ip_a: 0.3e-3, ig2_a: 0.06e-3, gain: 120, thd_pct: [1.2, 1.8, 3.0], derived_vak_v: 40.0, derived_vg2k_v: 28.0}     # grid-leak bias
