    vg1_v: -15.5
    ia_a: 70.0e-3
    gm_s: 11.5e-3
    ra_ohm: 910
    mu: 10.5
  capacitances_f:     # pentode connection (sheet D1); none printed for triode connection
    input: 15.2e-12
    output: 8.4e-12
