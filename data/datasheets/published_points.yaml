    - {supply_v: 100, rk_ohm: 270, mu: 57, rp_ohm: 14300, gm_s: 4.0e-3, ip_a: 3.3e-3}
  cutoff: {supply_v: 250, vg_v: -12, ip_a: 10.0e-6}   # "grid voltage (approx.) for plate current of 10 uamp"
  capacitances_f: {gp: 1.6e-12, input: 2.5e-12, output: 0.45e-12}   # grid-drive, no shield; output: unit No. 1
  heater: {v: 12.6, a: 0.15}

"12BH7":
