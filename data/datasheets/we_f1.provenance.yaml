digitized_with: >-
  By eye from a 300 dpi render of the scan (PyMuPDF), on the figures' rules. Fig. 6: frequency
  linear, rules every 500 cycles (0 at the left edge), level rules every 10 dB (-20 to -60); the
  measured curve's circles read at their centres, plus one point on the steep rise between the
  first two circles (135 cycles, read on the line); about +-0.5 dB and +-10 cycles. Fig. 7: pressure
  log, 1-100 bars; the solid new-type traces read at their corners; about +-0.5 dB.
