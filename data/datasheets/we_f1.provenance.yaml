device: Western Electric F1 handset transmitter unit (carbon, "direct action"), new type of 1938
curve: >-
  Fig. 6 (upper): pressure response, decibels re 1 volt open circuit per bar (1 bar = 1 dyne/cm^2 =
  0.1 Pa), constant pressure at the grid, a unit aged the equivalent of two years; measured (circles)
  and calculated from the equivalent circuit (crosses). Fig. 7: the new type's sum and difference
  components (1500 + 1700 cycles) in decibels below the fundamental, against the pressure in bars.
publisher: W. C. Jones, "Instruments for the New Telephone Sets", Bell System Technical Journal 17
  (July 1938), pp. 338-357
