device: "EF86"
document: "Philips Electronic Tube Handbook, EF86 (A.F. pentode)"
publisher: Philips
date: 1956-04
local_copy: sources/philips_ef86_1956.pdf
local_copy_sha256: 592ad4ce9298e12412813114dc69aae1aff768c1a907ca38b310ed3afd07c705
scan_source: "web: https://frank.pocnet.net/sheets/030/e/EF86.pdf"
sheet_dates: >-
  text pages 1-5 dated 4.4.1956; sheet A (p.6) 11.11.1953, drawing 55713; sheet B (p.7) drawing
  55716; sheet E (p.10) 7.7.1955, 7R04734; sheet F (p.11) 7R04735. Sheets A and B carry the stamp
  "EF40 29-9-'48": Philips drew the EF86's pentode curves on the EF40's 1948 graphs (the EF40 is
  the EF86's Rimlock predecessor with the same characteristics); sheets E and F are EF86 graphs
  of 1955.
digitized_with: >-
  the PDF's native 1-bit ~150 dpi page images (PyMuPDF extract_image, 1248 x 1952), pp.7 and 11
  rotated upright; each grid line fitted along its length on clean grid-width runs (rms 0.2-0.8 px),
  values interpolated between the neighbouring fitted lines; strokes traced as run centres, by rows
  on the steep parts and by columns on the flat ones, with the grid-line bands masked (a stroke edge
  hidden under a grid line placed from the stroke's running width; labels touching a stroke
  stripped by its far edge); read at round values by local linear fits; every overlay checked by
  eye (Claude Code subagent, scratch scripts not kept)
digitized_by: Claude Code
digitized_on: 2026-11-11
files:
  philips_ef86_transfer.csv:
    figure: "PDF p.6 (sheet A): Ia vs Vg1 at Va = 250 V, Vg3 = 0 V, Vg2 = 180 / 140 / 100 / 60 V"
    columns: "va_v, vg2_v, vg1_v, ia_a"
    curves: "Vg2 = 180, 140, 100, 60 V (no Ig2 curve on this sheet: the screen current is tesla_ef86_screen.csv)"
    coverage: >-
      Vg1 in 0.25 V steps from the foot to 0 V: 180 V -5.5..0 (0.19-10.83 mA), 140 V -4.5..0
      (0.14-7.80 mA), 100 V -3.25..0 (0.14-5.21 mA), 60 V -2.0..0 (0.15-2.99 mA). Below ~0.13 mA the
      stroke lies on the zero axis: not read. The Vg1 = 0 V values are one-sided (a quadratic over
      the last 0.3 V before the frame).
  philips_ef86_plate.csv:
    figure: "PDF p.7 (sheet B): Ia vs Va, Vg2 = 140 V, Vg3 = 0 V, Vg1 = 0, -0.5, ..., -4.5 V"
    columns: "vg2_v, vg1_v, va_v, ia_a"
    curves: "Vg1 = 0, -0.5, -1, -1.5, -2, -2.5, -3, -3.5, -4, -4.5 V"
    coverage: >-
      Va 12.5-500 V (12.5, 15, 17.5, 20, 25, 30, then every 10-50 V); the sheet draws every curve
      from Va ~10 V and dashes it beyond the Wa = 1 W hyperbola: points with Ia Va > 1 W left out,
      so 0 V ends at 120 V, -0.5 at 140, -1 at 180, -1.5 at 200, -2 at 300, -2.5 at 450 V. On the
      knee's steep part (0 to -1.5 V below ~15 V) Ia is ill-conditioned at round Va, so the points
      there are Va read at round Ia (0.2 mA steps; Va carries one decimal). The 0 V stroke's drafted
      end below 5.4 mA (a hook at Va 9-10 V) and the -2 V curve below 20 V (an ink blot on the
      scan) were not read.
  philips_ef86_triode_plate.csv:
    figure: "PDF p.11 (sheet F, 'Triode'): Ia vs Va with g2 tied to the anode, g3 to the cathode (the drawn circuit), Vg1 = 0 ... -10 V"
    columns: "vg1_v, va_v, ia_a"
    curves: "Vg1 = 0, -1, -2, ..., -10 V"
    quantity: >-
      ia_a is the current the sheet plots, Ia in its triode circuit: with g2 strapped to the anode
      it is the anode plus screen current (the total current into the strapped anode).
    coverage: >-
      every curve from its foot (Ia >= ~0.08 mA) up to where the sheet dashes it, at Ia ~6 mA
      (Ik max 6 mA; the sheet's dashes do not follow a dissipation line: the solid -7 V curve
      reaches 2.2 W at 360 V, beyond Wa + Wg2 = 1.2 W, keep that in mind when weighting), or to
      the curves' end at 390 V (-8, -9, -10 V); Va every 5 V below 1.5 mA, every 10 V above.
      Va ranges: 0 V 5-90, -1 V 25-130, -2 V 60-170, -3 V 85-210, -4 V 115-250, -5 V 150-280,
      -6 V 180-320, -7 V 210-360, -8 V 250-390, -9 V 260-390, -10 V 290-390. The U 67's region
      (~0.9 mA, 75 V, -1.7 V) lies between the -1 V curve (1.76 / 2.31 mA at 70 / 80 V, 25-130 V
      covered) and the -2 V curve (0.40 / 0.53 / 0.68 mA at 70 / 75 / 80 V).
axis_calibration: >-
  labelled grid lines: p.6 -8..0 V every 0.2 V x 0-12 mA every 0.2 mA; p.7 0-600 V every 10 V x
  0-8 mA every 0.2 mA; p.11 0-600 V every 10 V x 0-8 mA every 0.2 mA
estimated_error: >-
  About +-0.02 V / +-0.03 mA on the transfer curves (1 px = 0.009 V, 0.009 mA; local-fit scatter
  <= 0.02 mA), +-0.02 mA on the plate curves (+-0.5 V in Va on the knee points), +-0.03 mA / +-0.5 V
  on the triode curves. Checks against p.1's typical characteristics (Va 250 V, Vg3 0, Vg2 140 V,
  Vg1 -2 V: Ia 3.0 mA, Ig2 0.6 mA, S 2 mA/V, mu_g2g1 38, Ri 2.5 MOhm): the transfer curve gives
  3.002 mA at -2.0 V and a slope of 2.09 mA/V there; the plate curve (-2 V) 2.983 mA at 250 V and
  Ri 2.3 MOhm (slope over 150-300 V); mu_g2g1 from the transfer curves at Ia = 3 mA is 39 (180 vs
  140 V screen) / 40 (140 vs 100 V), at 1 mA 37 / 37. Transfer against plate at Vg2 140 V, Va 250 V,
  Vg1 -2.5 V: 2.049 vs 2.070 mA. Ig2 at the same point from Tesla's curve (tesla_ef86_screen.csv):
  0.49 mA, Tesla prints 0.5 mA, Philips 0.6 mA.
notes: >-
  The triode curves (sheet F) and the operating tables disagree: Philips' own triode RC table (p.3)
  B (Vb 250, Ra 0.1 MOhm, Rk 2200) prints Ia 1.3 mA, i.e. Vg1 -2.86 V at Va-k ~117 V, where sheet F
  gives ~1.0 mA; C (Ra 0.22 MOhm, Rk 3900) prints 0.7 mA at -2.73 V / ~93 V, sheet F ~0.45 mA.
  Tesla's triode table (1959 p.4) runs the other way: Vb 250, Ra 200k, Rk 1.5k, Ug1 -1.275 V,
  Ia+g2 0.85 mA (Va-k ~79 V), where sheet F gives ~1.8 mA. The tables are measured stages, the
  curves an average tube; weight them accordingly. p.6's 140 V curve reaches 0.14 mA at -4.5 V;
  Tesla's sheet prints the cut-off Ia < 0.1 mA at -5 V (Va 250, Vg2 140).
