    curves: "Ec = +1, 0, -1, -2, -3, -4, -5, -6, -7 V"
    coverage: "Ip 0.05-9.9 mA, Vp up to 300 V; small gaps where the curve labels sit on the curves"
axis_calibration: "grid lines 0-425 V (5 V apart; 300 V is the last labelled), 0-10 mA (0.2 mA apart)"
estimated_error: >-
  About +-0.05 mA or +-2%, whichever is larger. Check: the -4 V curve gives 3.04 mA at
  250 V against the printed class-A point (250 V, -4 V: 3 mA, p.1); Tung-Sol's curves at
  the same point give 3.03 mA (tungsol_12ay7.provenance.yaml).
notes: >-
  Fit: varimu.devices.library.build_12ay7 (Koren triode, least squares, grid <= 0 V; the
  +1 V curve is plotted, not fitted). The sheet's printed mu 40 / rp 22.8 kOhm disagree
  with Tung-Sol's 44 / 25 kOhm at the same point.
