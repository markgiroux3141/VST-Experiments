notes: >-
  The sheet gives no ionization or deionization time. The sweep circuit (DATA 2) is read as:
  the cathode on the R11 / R12 tap (+5.0 V; 1500 / 146.5k of 450 V is 4.6 V) bypassed by C11,
  the grid returned to ground through R3 and R2 (a -4.6..-5 V bias), the timing capacitor from
  the anode node (through R4) to the cathode, charged from +450 V through R5 and the rheostat R6.
  Its frequency table's f x C is ~13.5e-6 (R6 at min) and ~4.3e-6 (R6 at max) for C2-C5, a ratio
  of ~3.1 (R5 ~0.48 Mohm), falling ~30% at C8 (11.4 kHz): the top of the range loses time per
  cycle to the discharge and the plasma's recovery. f x C = I / dV implies a ~69 V sweep, where
  the control characteristic at -4.6 V gives a ~36 V strike: the table is "approximate" and
  is used as a check of the dynamics' shape (the high end's loss), not fitted.
