device: "VTL5C2 (Vactec / PerkinElmer Vactrol: a red LED and a CdS photocell, axial; the sheet's slow type, material 0)"
document: "Low Cost Axial Vactrols VTL5C1, 5C2"
publisher: "PerkinElmer Optoelectronics, St. Louis (the Vactec line, now Excelitas)"
date: "undated (PerkinElmer era, ~2001-2010; the VTL5C series dates to Vactec in the 1970s)"
local_copy: vactrol/perkinelmer_vtl5c1_5c2.pdf
local_copy_sha256: 5a9c0f7009cfd87cabc0b7a7e33a9610a71573023682324eca537bb4c117098d
scan_source: "web: https://logosfoundation.org/instrum_gwr/teno/datasheets/Vactrol_VTL5C1.pdf"
digitized_with: >-
  scripts/digitize_vtl5c1.py --part VTL5C2 (PyMuPDF 2.1): the page-2 bitmaps. The resistance
  plot traced automatically as the VTL5C1's (white runs >= 4 px per pixel column, ordered top to
  bottom as conditions 3, 2, 1, 4; the axes calibrated on the plot's decade grid lines). The
  response plot: the thick strokes' centres per pixel column (the 1-2 px grid eroded away),
  each assigned to its curve by eye, skipping columns where curves cross or a dash's gap hides
  one (the script's RESPONSE_5C2)
digitized_by: Claude Code
digitized_on: 2026-11-07
files:
  vtl5c2_resistance.csv:
    figure: >-
      p.2, "Output Resistance vs. Input Current, VTL5C2": curve 1 (light adapt condition (1),
      25 C, 24 hours at no input: dark adapted) and curve 2 (condition (2), 25 C, 24 hours at
      40 mA: light adapted), 0.2-17 mA (above ~17 mA the four curves merge and aren't traced).
      Curves 3 (+50 C) and 4 (-20 C) not digitized
    columns: "curve (1 or 2), i_a (the LED's current), r_ohm (the cell's resistance)"
  vtl5c2_response.csv:
    figure: >-
      p.2, "Response Time, VTL5C2": the cell's resistance after the LED's current is applied
      (turn-on, 0-12 ms axis) or removed (turn-off, 0-240 ms axis), at 10 and 40 mA, "based
      upon test following adapt condition (2)" (note 3)
    columns: "curve (on_10mA, on_40mA, off_10mA, off_40mA), t_s, r_ohm"
estimated_error: >-
  resistance plot: ~1 px of trace (~1.3% in R, ~0.8% in I); its curve 1 meets the table's 5.5
  kOhm at 1 mA within 10% (5.0 k). Response points: ~3% in log R (a stroke's centre), 0.05 ms
  (turn-on) / 0.4 ms (turn-off) in time; the 10 mA turn-on's 2.5 ms point is a 4 px dash
  fragment (less sure)
notes: >-
  The sheet's plot and its table disagree at 10 mA: the table's "dark adapted (typ.)"
  on-resistance is 800 ohm, the plot's curve 1 reads ~430 (the VTL5C1's disagree the same way,
  less). The plot is used. The table: turn-on to 63% of final R_ON 3.5 ms typ., turn-off to 100
  kOhm 500 ms max. (the VTL5C1: 2.5 / 35 ms), OFF resistance 1 MOhm min. at 10 s. The LED is
  the VTL5C1's (one "Input Characteristics" plot for both). Standing in for the Rhodes Suitcase
  preamp's unidentified optocoupler (Rhodes P/N 013556), provisional: chosen over the VTL5C1
  because the reference recording's pan creeps for the whole half period after each flip, a
  cell that darkens over ~100 ms (docs/RHODES_PLAN.md "The Suitcase").
