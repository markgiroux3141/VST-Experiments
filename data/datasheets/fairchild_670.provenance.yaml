digitized_with: "PDF p.13 rendered at 200 dpi (pdftoppm); the eight vertical and six horizontal 5 dB grid lines located from pixel profiles; grid lines masked and curve 3 traced along pixel columns with a slope predictor; where the trace locked onto a grid line (+6.6 to +11 dBm in) the curve's own pixel runs were read column by column; the trace checked by overlaying it on the scan (scratch scripts not kept)"
