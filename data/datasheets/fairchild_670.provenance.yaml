  fairchild_670_io_curve3.csv:
    figure: "PDF p.13: 'INPUT VS. OUTPUT CURVES', curve 3, 'Factory-adjusted condition'"
    columns: "in_dbm, out_dbm"
    curves: "curve 3 from +2 dBm in, where it leaves curve 1 (straight amplifier, unity gain), to +25 dBm in"
axis_calibration: "the labelled 5 dB grid lines: x -10..+25 dBm at 188.4 px per 5 dB, y -5..+20 dBm at 193.4 px per 5 dB (200 dpi)"
estimated_error: "+-0.15 dB on out_dbm (line width 3 px = 0.08 dB; the scan's own registration unknown)"
notes: >-
  Curve 1 ('straight amplifier, AC THRESHOLD fully CCW') has unity gain within about
  0.3 dB over the plot; the unit is set up that way first (manual p.8, threshold
  adjustments, step 1). Read off curve 3: 3 dB of limiting at +6.7 dBm in (+3.7 out),
  10 dB at +15.4 in (+5.4 out). The specifications (p.4) give the knee as 'predetermined
  level factory-adjusted to +2 dbm'. Frequency and Time Constant position aren't stated.
  Page 10 of the same PDF has IM distortion (60 Hz + 7 kHz, 4:1) vs dB limiting at
  seven output levels, not digitized yet.
