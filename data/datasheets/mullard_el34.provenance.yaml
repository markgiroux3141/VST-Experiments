estimated_error: >-
  About +-2 mA or +-3%, up to +-5% above Va ~ 350 V. Check: the 30 W line reads 30-31 W
  up to Va 335 V. "Triode connected" here is g2 to the anode (D1) and g3 to the cathode
  (D3's push-pull data); the 670 ties g3 to the anode too, for which no data was found.
  At the printed point (Va 250 V, Ia 70 mA, Vg1 -15.5 V) the curve gives Vg1 ~ -15.9 V;
  its slopes give gm ~ 9.5 mA/V, ra ~ 1.0 kOhm, mu ~ 11 against the printed 11.5 mA/V,
  910 ohm, 10.5.
notes: "Fit: varimu.devices.library.build_el34t (Koren triode, least squares)."
