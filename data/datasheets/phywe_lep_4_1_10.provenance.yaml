notes: >-
  A teaching lab's measurement of one tube, not a manufacturer's figure. The slope-derived
  temperature at the highest heater current (1390 K) is above an oxide cathode's usual
  ~1050 K (Spangenberg); a retarding-field slope often reads hot (patchy work function,
  series resistance), and what a circuit sees is the slope itself, so the slope is used.
