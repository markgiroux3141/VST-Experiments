digitized_with: >-
  scripts/digitize_shure_520d.py from the scan's pixels: the chart's frame x 143-541 px (20 Hz -
  20 kHz), y 594.5-771.5 px (+20 / -20 dB, 5 dB rules every 22.1 px); the decade rules 100 / 1000 /
  10000 Hz at x 236 / 368 / 501 (x = 236 + 132.5 log10(f / 100)). Per pixel column the trace's dark
  run off the horizontal rules, its mean row; columns on a vertical rule skipped; the steep fall
  past 5.5 kHz read per row. Resampled to twelfth octaves, 85 Hz to 6.5 kHz (the trace's last
  ~0.6 kHz, -11.6 to -14.5 dB, isn't read: rules crowd it). About +-0.5 dB; up to ~0.7 dB low where
  the trace lies on a horizontal rule (the 0 dB rule at ~4 kHz, its rows excluded). The step at 200
  Hz is the chart's (a pen or paper joint), kept as drawn.
