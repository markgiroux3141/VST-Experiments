files:
  voicecoil_g12h55_impedance.csv:
    figure: "Figure 16, 'Celestion G12H(55) 1-V free-air impedance plot' (LMS, sample 1 by its 57 Hz peak)"
    columns: "f_hz, z_ohm (magnitude)"
    coverage: "10 Hz to 20 kHz, 341 points (Bezier control points included: they lie near the curve, not on it, in the fast-curving resonance)"
estimated_error: "below 1% in frequency and impedance on the smooth stretches (the path itself); checks: 245.7 ohm at 57 Hz (the plot's peak ~245), 14.1 ohm at 300 Hz, 20.1 at 1 kHz, 39.4 at 5 kHz, 55.9 at 10 kHz, 82.8 at 20 kHz, read by eye on a 400 dpi render"
notes: >-
  Used for the G12M (data/schematics/marshall_1987/README.md 'Speaker'): Celestion publishes no
  G12M impedance curve; the G12H shares its 44.5 mm round-copper 16 ohm voice coil family, frame
  and cone (provisional), so above its resonance (300 Hz up) its curve stands in for the G12M's
  coil (varimu.devices.library.build_g12m). Not its resonance: the G12H's magnet and suspension
  differ.
